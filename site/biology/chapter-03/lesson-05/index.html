<script>
'use strict';
// Biology, Chapter 3 (Water and Life), lesson 5: why cells and blood hold their pH, a buffer against pure water, what a
// buffer is made of (weak acid + conjugate base; acetic acid / acetate; ammonia / ammonium), the blood's bicarbonate
// buffer, check 1, Ka and pKa (13 of 1000 against a strong acid; direction; a pKa tells little for a strong acid), check 2,
// monoprotic and polyprotic acids, the working range pKa ± 1, acid precipitation, summary, practice.
// Plan, errata and storyboard: books/biology/chapters/chapter-03/lesson-05.md.
const CHAPTER = { number: 305, label: '3, lesson 5', title: 'Buffers, Ka and pKa, Acid Rain', minutes: 7, language: 'en', lead: false, next: '../../chapter-05/lesson-01/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
// Write an attribute only when it changes (Firefox repaints on every write).
const setA = (e, k, v) => { if (e['_' + k] !== v) { e.setAttribute(k, v); e['_' + k] = v; } };
const setText = (e, s) => { if (e.textContent !== s) e.textContent = s; };
// Circles as one path: list of [x, y, r].
const dots = list => list.map(([x, y, r]) => `M${(x - r).toFixed(1)} ${y.toFixed(1)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`).join('');
// A plain straight arrow (shaft and head) from a to b.
function wArrow(p, [x1, y1], [x2, y2], { color = COL.chalk, w = 6, head = 16, o = 1 } = {}) {
  const g = G(p, { o }), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  path(g, `M${x1} ${y1}L${x2 - ux * head * .8} ${y2 - uy * head * .8}`, { stroke: color, 'stroke-width': w });
  path(g, `M${x2 - ux * head - uy * head * .7} ${y2 - uy * head + ux * head * .7}L${x2} ${y2}L${x2 - ux * head + uy * head * .7} ${y2 - uy * head - ux * head * .7}Z`, { fill: color, stroke: color, 'stroke-width': 2 });
  return g;
}
// Chemistry pieces laid out left to right in one row (measured), centred on x; each text gets _x0 and _w.
function chemRow(p, pieces, { x, y, size = 40, gap = 16, fill = COL.chalk, weight = 600, fills = [] } = {}) {
  const els = pieces.map((s, i) => wChem(p, s, { y, size, fill: fills[i] || fill, weight, anchor: 'start', o: 0 }));
  const ws = els.map(e => e.getComputedTextLength()), total = ws.reduce((a, b) => a + b, 0) + gap * (els.length - 1);
  let cx = x - total / 2;
  els.forEach((e, i) => { put(e, { x: cx }); e._x0 = cx; e._w = ws[i]; cx += ws[i] + gap; });
  return els;
}
// Question cards: wChem markup as plain text with Unicode super- and subscripts.
const SUP = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹', '+': '⁺', '−': '⁻', '.': '·' };
const SUB = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉', a: 'ₐ' };
const uni = str => wChemParts(str).map(([s, k]) => k === 'n' ? s : [...s].map(c => (k === 'sup' ? SUP : SUB)[c] ?? c).join('')).join('');
// blanks rows are set as maths, which slants letters; chemical symbols (H, Ka, pH) stay upright.
const roman = build => (body, api) => { const r = build(body, api); body.querySelectorAll('svg.m tspan[font-style]').forEach(t => t.removeAttribute('font-style')); return r; };
const mn = v => String(v).replace('-', '−');

/* ---------- shared numbers (computed, never typed twice) ---------- */
const PKA = 4.76, KA = Math.pow(10, -PKA);                 // acetic acid (errata 10): Ka = 1.7 × 10^−5
const PKA_R = Math.round(PKA * 10) / 10;                   // "about 4.8", the slide's value for the working range
const KA_TXT = wSci(KA);                                   // '1.7 × 10^{−5}'
const C_BUF = .1, H_ADD = 1e-3;                            // 0.1 M acetic acid + 0.1 M acetate; 0.001 M H+ added
const phPure = x => wPH(x / 2 + Math.sqrt(x * x / 4 + 1e-14));          // pure water + x M of a strong acid
const phBuf = x => PKA + Math.log10((C_BUF - x) / (C_BUF + x));         // the buffer + x M H+ (x < 0: base)
const ph2 = v => v.toFixed(2);
const WATER_END = ph2(phPure(H_ADD)), BUF_END = ph2(phBuf(H_ADD));       // '3.00', '4.75'
const WATER_DROP = (7 - +WATER_END).toFixed(2), BUF_DROP = (PKA - +BUF_END).toFixed(2);   // '4.00', '0.01'
const SPLIT = Math.round(1000 * wSplitFrac(KA, C_BUF));                   // 13 of 1000 at 0.1 M (errata 13)
const PCT = d => Math.round(100 * wBaseFrac(PKA_R + d, PKA_R));           // 9, 50, 91 % acetate at pKa − 1, pKa, pKa + 1
const PHOS = [2.15, 7.20, 12.35], PHOS_TXT = PHOS.map(v => v.toFixed(2));   // phosphoric acid (errata 14)
const BLOOD = 7.4, CELL = 7, RAIN_CLEAN = 5.6, RAIN_ACID = 4.4;
const RAIN_CUT = RAIN_CLEAN;                                              // acid precipitation: below pH 5.6
// check 2: two acids by Ka
const Q2 = { kx: 1e-3, ky: 1e-6 }; Q2.px = Math.round(wPH(Q2.kx)); Q2.py = Math.round(wPH(Q2.ky)); Q2.ratio = Math.round(Q2.kx / Q2.ky);
Q2.sx = Math.round(100 * wSplitFrac(Q2.kx, C_BUF)); Q2.sy = Math.round(1000 * wSplitFrac(Q2.ky, C_BUF));   // 10 of 100, 3 of 1000
// practice
const PR = { pka: 6.8 }; PR.lo = (PR.pka - 1).toFixed(1); PR.hi = (PR.pka + 1).toFixed(1); PR.best = PR.pka.toFixed(1);
const PC = { ka: 1e-4, pk: 7, a: 3, b: 6 }; PC.pka = Math.round(wPH(PC.ka)); PC.kexp = PC.pk; PC.strong = Math.min(PC.a, PC.b);
const CELL_BEST = PHOS.reduce((b, v) => Math.abs(v - CELL) < Math.abs(b - CELL) ? v : b);   // 7.20
const TERMS_RAIN = [4.5, 5.8];

/* ---------- pieces ---------- */
const hold = (a, k) => a.hold(k);
// An OH− that will become water: a plain water built the same way with its first hydrogen hidden and the indigo ring and
// − badge shown. w.make(t0) adds the arriving hydrogen and drops the marks: water.
function hydroxide(p, s, x, y, r) {
  const w = wIonChar(p, 'H2O', { s, ring: WC.base, sign: '−', marked: true }).pose(x, y, r);
  put(w.balls[0], { o: 0 }); put(w.sticks[0], { o: 0 });
  w.make = t0 => { show(w.balls[0], t0, .2); show(w.sticks[0], t0, .2); hide(w.ring, t0 + .1, .4); hide(w.badge, t0 + .1, .3); };
  return w;
}
// The rotation that points a water's first hydrogen from (x, y) at a target point.
const aimAt = (x, y, [tx, ty]) => Math.atan2(ty - y, tx - x) * 180 / Math.PI - W_H1;
// A free H+ (pink ring and badge) at the size of the acid it leaves or joins.
const proton = (p, s, o = 1) => wIonChar(p, 'H+', { s, o });
// A tag under a character that swaps its wording when the character changes form: tag.swap(t0, i) shows wording i.
function tagSwap(p, x, y, lines, t0) {
  const g = G(p), sets = lines.map(([a, b, col]) => {
    const q = G(g, { o: 0 });
    wChem(q, a, { x, y, size: 30, fill: col, o: 1 }); if (b) wChem(q, b, { x, y: y + 38, size: 26, fill: COL.dim, weight: 500, o: 1 });
    return q;
  });
  show(sets[0], t0, .4);
  return Object.assign(g, { sets, swap(t, i, from) { hide(sets[from], t, .3); show(sets[i], t + .25, .4); } });
}
// A pipette, its tip at the origin.
function dropper(p, { x = 0, y = 0, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  path(g, 'M-14 -150V-40L-4 -6H4L14 -40V-150Z', { fill: '#1c3f63', stroke: WC.glass, 'stroke-width': 4 });
  mk('rect', { x: -10, y: -112, width: 20, height: 66, rx: 4, fill: WC.acid, 'fill-opacity': .75 }, g);
  mk('rect', { x: -22, y: -210, width: 44, height: 64, rx: 20, fill: '#8f5f7a', stroke: '#b98aa6', 'stroke-width': 3 }, g);
  return g;
}
// A cell cut open: membrane, nucleus. Origin at the centre.
function cellBody(p, { x = 0, y = 0, r = 250, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { r, fill: '#122b47', stroke: '#8fd6b0', 'stroke-width': 8 }, g);
  mk('ellipse', { cx: r * .42, cy: -r * .48, rx: r * .26, ry: r * .2, fill: '#24496e', stroke: '#6fa98c', 'stroke-width': 3 }, g);
  return g;
}
// A drop of blood with red cells in it. Origin at the centre.
function bloodDrop(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M0 -120C40 -64 92 -20 92 34A92 92 0 0 1 -92 34C-92 -20 -40 -64 0 -120Z', { fill: '#7d1f24', stroke: '#e0716a', 'stroke-width': 4 });
  for (const [cx, cy, r] of [[-34, 20, 24], [26, -6, 22], [18, 58, 24], [-30, 72, 18], [52, 40, 16]]) {
    mk('circle', { cx, cy, r, fill: '#c0392b', stroke: '#e0716a', 'stroke-width': 2 }, g);
    mk('circle', { cx, cy, r: r * .45, fill: '#a5302a' }, g);
  }
  mk('ellipse', { cx: -40, cy: -30, rx: 9, ry: 16, fill: '#fff', 'fill-opacity': .25 }, g);
  return g;
}
// Balls and sticks of a flat structure: atoms [kind, x, y, r], bonds [i, j, double?]. Returns the atom groups.
function structure(p, atoms, bonds) {
  for (const [i, j, dbl] of bonds) {
    const [, x1, y1] = atoms[i], [, x2, y2] = atoms[j];
    if (!dbl) { path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: WC.stick, 'stroke-width': 9 }); continue; }
    const L = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / L * 7, ny = (x2 - x1) / L * 7;
    path(p, `M${x1 + nx} ${y1 + ny}L${x2 + nx} ${y2 + ny}M${x1 - nx} ${y1 - ny}L${x2 - nx} ${y2 - ny}`, { stroke: WC.stick, 'stroke-width': 7 });
  }
  return atoms.map(([k, x, y, r]) => wAtom(p, k, { x, y, r, size: k === 'H' ? 20 : 26 }));
}
const ringAt = (p, x, y, r, col = WC.acid) => { const e = mk('circle', { cx: x, cy: y, r, fill: col, 'fill-opacity': .14, stroke: col, 'stroke-width': 4 }, p); put(e, { o: 0 }); return e; };

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const withPic = (key, build) => (body, api) => { S.pics?.(key); return build(body, api); };

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro: cells and blood hold their pH ---------- */
['intro', 'A steady pH', (m, D) => {
  const p = panel(0), tCell = m('cell'), tBlood = m('blood'), tSwing = m('swing'), tAsk = m('ask');
  const cam = camera(p, D), W = cam.world;
  cam.to({ x: 700, y: 430, z: 1.12 }, tSwing + .2, 2.2);
  const CX = 520, CY = 400;
  const cl = cellBody(W, { x: CX, y: CY, o: 0 }); show(cl, .15, .6);
  say(W, 'a living cell', CX, 118, .4, { size: 30, fill: COL.dim, weight: 500 });
  const pr = wProtein(W, { x: CX - 20, y: CY + 40, s: .5, o: 0 }); show(pr, .5, .6);
  // the title, top right, until blood arrives there
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOLOGY · CHAPTER 3: WATER AND LIFE · LESSON 5', { x: 1190, y: 220, size: 26, fill: COL.dim, o: 1 });
  ['Buffers, K_a and pK_a,', 'Acid Rain'].forEach((s, i) => wChem(ttl, s, { x: 1190, y: 310 + i * 78, size: 66, o: 1 }));
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); tw(ttl, { o: 0, y: -20 }, tBlood - .6, .6);
  const rec = say(p, 'last time: pH = −log[H^+]', 1190, 520, 4.9, { size: 36, font: MATH, weight: 500 }); hide(rec, tBlood - .6, .5);
  // the pH strip along the bottom; the cell's marker above, the blood's below
  const strip = pHStrip(p, { x: 170, y: 770, w: 1260, h: 30, size: 22, o: 0 }); show(strip, 4.9, .6);
  const mc = strip.marker({ color: '#8fd6b0', fmt: v => 'cell: pH ' + wDec(v), size: 26 }); show(mc, tCell + .3, .4);
  const mb = strip.marker({ color: '#ff9a8f', fmt: v => 'blood: pH ' + wDec(v), above: false, size: 26 }); mb.set(BLOOD); show(mb, tBlood + .4, .4);
  pulse(cl, tCell + .2, 1.05);
  // blood, at the right
  const bd = bloodDrop(W, { x: 1220, y: 400, o: 0 }); show(bd, tBlood + .1, .5);
  say(W, 'human blood', 1220, 560, tBlood + .4, { size: 30, fill: '#ff9a8f' });
  // swing: one pH unit is ten times the H+; the protein comes apart, then the cell is put right
  const sw = say(p, '1 pH unit = 10 × the H^+', 1000, 640, tSwing + 1.2, { size: 30, fill: WC.acid, anchor: 'start' });
  const lose = say(p, 'proteins stop working', 1000, 682, tSwing + 4.8, { size: 28, fill: COL.dim, weight: 500, anchor: 'start' });
  hide(sw, tAsk, .4); hide(lose, tAsk, .4);
  tw(pr.beads, { c_fill: '#8f9bb0' }, tSwing + 4, .8); tw(pr.beads, { c_fill: WC.prot }, tAsk + 1.4, .8);
  const pH = t => CELL - io(ramp(t, tSwing + .4, tSwing + 1.6)) + io(ramp(t, tAsk + .2, tAsk + 1.4));
  const fold = t => 1 - .9 * io(ramp(t, tSwing + 3.6, tSwing + 5.6)) + .9 * io(ramp(t, tAsk + .6, tAsk + 2.4));
  // ask: H+ from the left and OH− from above drift toward the cell
  const IN = [['H+', -80, 300, 240, 330, .8], ['H+', -80, 470, 262, 470, .8], ['H+', -80, 620, 300, 590, .8],
    ['OH-', 980, -90, 760, 200, .55], ['OH-', 1060, 40, 800, 330, .55]]
    .map(([k, x0, y0, x1, y1, s], i) => ({ q: wIonChar(W, k, { s, o: 0 }), x0, y0, x1, y1, i, t0: tAsk + .1 + .25 * i }));
  IN.forEach(d => show(d.q, d.t0, .4));
  const qm = say(W, '?', 850, 190, tAsk + 1.6, { size: 96, weight: 700 }); pulse(qm, tAsk + 2.4, 1.25);
  clockRun(t => {
    pr.set(fold(t), t, { apart: true });
    mc.set(Math.round(pH(t) * 10) / 10);
    IN.forEach(d => { const f = out(ramp(t, d.t0, d.t0 + 2.2)); d.q.pose(+(lerp(d.x0, d.x1, f) + 5 * Math.sin(1.6 * t + d.i)).toFixed(1), +(lerp(d.y0, d.y1, f) + 5 * Math.sin(1.2 * t + 2 * d.i)).toFixed(1)); });
  }, D);
}],

/* ---------- a buffer against pure water ---------- */
['buffer', 'A buffer', (m, D) => {
  const p = panel(0), tW = m('water'), tDrop = m('drop'), tBuf = m('buf'), tAdd = m('add'), tDef = m('def');
  const LX = 420, RX = 1180, BY = 680, BH = 340, SURF = BY - BH * .78;
  const tint = k => mix(WC.water, WC.acid, k);             // the water's tint from its pH: pinker as it gets more acid
  const tintOf = v => tint(.5 * clamp01((7 - v) / 4));

  show(L, .15, .5); show(Rb, tBuf, .6);

    AC.push({ a: wAcid(p, { x, y, s: .55, held, o: 0, aH: held ? -35 : -35 }), x, y, i });
  }
  AC.forEach(d => show(d.a, tBuf + .5 + .03 * d.i, .4));
  // the pH readouts under each glass
  const rl = wLabel(LG, 'pH 7.00', { x: LX, y: 838, size: 60, weight: 700, o: 0 }), rr = wLabel(p, 'pH ' + ph2(PKA), { x: RX, y: 838, size: 60, weight: 700, o: 0 });
  show(rl, 1.7, .4); show(rr, tBuf + 4, .4);
  const cl = say(LG, `change: ${WATER_DROP}`, LX, 880, tDrop + 1.9, { size: 28, fill: WC.acid });
  const cr = say(p, `change: ${BUF_DROP}`, RX, 880, tAdd + 3.6, { size: 28, fill: '#8fd6b0' });
  // the dropper: over the left glass, then over the right one
  const dp = dropper(p, { x: LX + 380, y: 290, o: 0 }); show(dp, tW + .6, .4);
  const dl = say(p, '+ 0.001 M H^+', LX + 420, 160, tW + 3.4, { size: 30, fill: WC.acid, anchor: 'start' });
  tw(dp, { x: RX }, tBuf - .2, 1.6); tw(dl, { x: RX + 40 }, tBuf - .2, 1.6); hide(dp, tAdd + 2.6, .4); hide(dl, tAdd + 2.6, .4);

  const T1 = tW + 3.6, T2 = tAdd + .4, FALL = .55;
  const drop = mk('circle', { r: 11, fill: WC.acid }, p); put(drop, { o: 0 });
  const hl = path(LG, '', { fill: WC.acid }), hr = path(p, '', { fill: WC.acid });
  const HN = 8, HSPOT = Array.from({ length: HN }, (_, i) => [LX - 150 + 300 * wHash(i, 61), SURF + 30 + 200 * wHash(i, 62), wHash(i, 63) * 6.28]);
  const takers = AC.filter(d => d.a.k === 0).slice(0, 4);
  const mixL = t => io(ramp(t, T1 + FALL, T1 + FALL + 3)), mixR = t => io(ramp(t, T2 + FALL, T2 + FALL + 2.4));
  takers.forEach((d, j) => { tw(d.a.ring, { o: 1 }, T2 + FALL + .9 + .3 * j, .2); tw(d.a.ring, { o: 0 }, T2 + FALL + 1.3 + .3 * j, .4); });

  say(p, 'when a little acid or base is added', 800, 116, tDef + 1.6, { size: 28, fill: COL.dim, weight: 500 });
  const box = mk('rect', { x: RX - 220, y: 300, width: 440, height: 600, rx: 26, fill: 'none', stroke: '#8fd6b0', 'stroke-width': 4 }, p); put(box, { o: 0 }); show(box, tDef + .5, .5);
  clockRun(t => {
    const k1 = mixL(t), k2 = mixR(t);
    // the falling drops
    const f1 = ramp(t, T1, T1 + FALL), f2 = ramp(t, T2, T2 + FALL), on1 = t >= T1 && t < T1 + FALL, on2 = t >= T2 && t < T2 + FALL;
    const dx = on1 ? LX + 380 : RX, dy = on1 ? lerp(296, SURF, f1 * f1) : lerp(296, SURF, f2 * f2), dO = on1 || on2 ? 1 : 0;
    if (st(drop).o !== dO || st(drop).x !== dx || st(drop).y !== +dy.toFixed(1)) put(drop, { x: dx, y: +dy.toFixed(1), o: dO });
    // left: the H+ spread and stay; right: each goes to an acetate and is taken up
    let d1 = '', d2 = '';
    if (t >= T1 + FALL) HSPOT.forEach(([x, y, ph]) => { d1 += dots([[lerp(LX, x, k1) + 5 * Math.sin(1.4 * t + ph), lerp(SURF + 6, y, k1) + 5 * Math.sin(1.1 * t + 2 * ph), 8]]); });
    if (t >= T2 + FALL) HSPOT.forEach(([, , ph], i) => {
      const d = takers[i % takers.length], j = i % takers.length, arr = T2 + FALL + .9 + .3 * j;
      if (t > arr) return;

    });
    setA(hl, 'd', d1); setA(hr, 'd', d2);

    // nutrients wash down but stop short of the caption (world y ≤ 930); H+ come in from above
    if (t > tSoil) NU.forEach(([x, y, ph], i) => { const u = ramp(tr, tSoil + 1 + ph * 2, tSoil + 4 + ph * 2); if (u < 1) nd += dots([[x + 6 * Math.sin(2 * tr + i), Math.min(930, y + 90 * u * u), 8 * (1 - .6 * u * u)]]); });
    if (t > tSoil) NU.forEach(([x, y, ph], i) => { const u = ramp(tr, tSoil + .4 + ph, tSoil + 1.6 + ph); hd += dots([[x + 10, lerp(700, y - 6, u), 6]]); });
    setA(nut, 'd', nd); setA(soilH, 'd', hd);
  }, D);
}],

['wrap', 'Summary', (m, D) => {
  const p = panel(0);
  const rows = [
    ['Cells need a steady pH near 7. A buffer, a weak acid', 'with its conjugate base, absorbs added H^+ or OH^−.', g => { wAcid(g, { x: 130, y: 0, s: .55 }); wAcid(g, { x: 225, y: 0, s: .55, held: 0 }); }],
    ['K_a: how far a weak acid dissociates; pK_a = −log K_a.', 'Smaller K_a, larger pK_a, weaker acid.', g => { wChem(g, 'K_a ↓', { x: 180, y: -8, size: 30, font: MATH, o: 1 }); wChem(g, 'pK_a ↑', { x: 180, y: 32, size: 30, font: MATH, fill: WC.acid, o: 1 }); }],
    ['A buffer works within pK_a ± 1,', 'and best at pH = pK_a.', g => {
      let d = ''; for (let k = 0; k <= 40; k++) { const v = -3 + 6 * k / 40, f = 1 / (1 + Math.pow(10, -v)); d += (k ? 'L' : 'M') + (180 + v * 30).toFixed(1) + ' ' + (36 - 240 * f * (1 - f)).toFixed(1); }
      mk('rect', { x: 150, y: -40, width: 60, height: 80, rx: 6, fill: '#8fd6b0', 'fill-opacity': .2 }, g); path(g, d, { stroke: '#8fd6b0', 'stroke-width': 4 }); }],
    ['Acid precipitation: rain, snow or fog', `below pH ${wDec(RAIN_CUT)}.`, g => {
      path(g, 'M120 0a26 26 0 0 1 34 -30a34 34 0 0 1 64 -4a26 26 0 0 1 22 34Z', { fill: '#a8909e' });
      path(g, 'M140 14l-5 16M175 14l-5 16M210 14l-5 16', { stroke: WC.acid, 'stroke-width': 4, 'stroke-linecap': 'round' }); }],
  ];
  const icons = [], gs = [];
  let wMax = 0;
  rows.forEach(([a, b, icon], i) => {
    // all four rows wait faintly from the start; each lights up as it is read (row 1 with "To sum up")
    const g = G(p, { y: 190 + i * 160, o: 0 });
    const ic = G(g); icon(ic); icons.push(ic);
    const ta = wChem(g, a, { x: 330, y: -6, size: 36, anchor: 'start', o: 1 }), tb = wChem(g, b, { x: 330, y: 40, size: 32, fill: COL.dim, weight: 500, anchor: 'start', o: 1 });
    wMax = Math.max(wMax, ta.getComputedTextLength(), tb.getComputedTextLength());
    tw(g, { o: .2 }, .1, .5); tw(g, { o: 1 }, i ? m('w' + (i + 1)) - .25 : m('w1') - .3, .6);
    gs.push(g);
  });
  const dx = Math.round(800 - (100 + 330 + wMax) / 2);   // the block (icons at 100, text to 330 + widest line) sits centred
  gs.forEach(g => put(g, { x: dx }));
  say(p, 'Now try the chapter practice.', 800, 850, m('end') - .2, { size: 32, fill: WC.bond });
  clockRun(t => icons.forEach((ic, i) => put(ic, { y: +(5 * Math.sin(1.6 * t + 1.3 * i)).toFixed(2) })), D);
}],

['final1', 'Chapter practice', (m, D) => {
  // A picture on the right for each practice question; the card's build shows the one it needs (pics.show(key)).
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  at('range', g => {
    const s = pHStrip(g, { x: 1010, y: 430, w: 540, min: 4, max: 10, h: 28, size: 22 });
    path(g, `M${s.at(PR.pka)} 380V480`, { stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '7 6' });
    wChem(g, `pK_a ${wDec(PR.pka)}`, { x: s.at(PR.pka), y: 360, size: 32, o: 1 });
    wLabel(g, '? ← → ?', { x: s.at(PR.pka), y: 560, size: 36, fill: '#8fd6b0', o: 1 });
  });
  at('conv', g => {
    wChem(g, 'pK_a = −log K_a', { x: 1280, y: 300, size: 44, font: MATH, weight: 500, o: 1 });
    wChem(g, 'K_a = 10^{−pK_a}', { x: 1280, y: 380, size: 40, font: MATH, weight: 500, o: 1 });
    wChem(g, 'larger K_a ⇔ smaller pK_a', { x: 1280, y: 500, size: 32, o: 1 }); wChem(g, '⇔ stronger acid', { x: 1280, y: 546, size: 32, fill: WC.acid, o: 1 });
  });
  at('cell', g => {
    const s = pHStrip(g, { x: 1000, y: 430, w: 560, h: 28, size: 18, step: 2 });
    PHOS.forEach(v => { mk('circle', { cx: s.at(v), cy: 430, r: 9, fill: COL.board, stroke: WC.acid, 'stroke-width': 4 }, g); });
    const mk1 = s.marker({ color: '#8fd6b0', fmt: v => 'cell: pH ' + wDec(v), o: 1 }); mk1.set(CELL);
    wLabel(g, 'three acids, three pKa values', { x: 1280, y: 560, size: 26, fill: COL.dim, weight: 500, o: 1 });
  });
  at('add', g => {
    wAcid(g, { x: 1130, y: 420, s: 1.1, aH: -145 }); wAcid(g, { x: 1430, y: 420, s: 1.1, held: 0 });
    wChem(g, 'acetic acid', { x: 1130, y: 530, size: 28, fill: WC.acid, o: 1 }); wChem(g, 'acetate', { x: 1430, y: 530, size: 28, fill: WC.base, o: 1 });
    hydroxide(g, .8, 1280, 250, 30); wChem(g, 'OH^−', { x: 1280, y: 170, size: 28, fill: WC.base, o: 1 });
  });
  at('terms', g => {
    path(g, 'M1110 300a60 60 0 0 1 80 -70a80 80 0 0 1 150 -10a60 60 0 0 1 100 40a50 50 0 0 1 -20 90H1150a50 50 0 0 1 -40 -50Z', { fill: '#a8909e' });
    path(g, 'M1170 380l-8 26M1230 400l-8 26M1290 380l-8 26M1350 400l-8 26M1410 380l-8 26', { stroke: WC.acid, 'stroke-width': 5, 'stroke-linecap': 'round' });
    const s = pHStrip(g, { x: 1040, y: 560, w: 480, min: 3, max: 8, h: 24, size: 20 });
    path(g, `M${s.at(RAIN_CUT)} 536V584`, { stroke: COL.chalk, 'stroke-width': 3 }); wLabel(g, wDec(RAIN_CUT), { x: s.at(RAIN_CUT), y: 524, size: 24, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('range');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-range', prompt: [uni(`A weak acid has pK_a ${wDec(PR.pka)}.`)],
    build: withPic('range', roman(blanks([
      { parts: ['it buffers from pH ', { box: PR.lo }, ' to pH ', { box: PR.hi }], why: `pKₐ ± 1: ${PR.lo} to ${PR.hi}.`, hint: 'The working range is pKₐ minus one to pKₐ plus one.' },
      { parts: ['and best at pH ', { box: PR.best }], why: 'Best where pH = pKₐ: half acid, half conjugate base.', hint: 'Capacity is greatest where both partners are equal.' },
    ]))) },
  { id: 'p-conv', prompt: [uni('Use pK_a = −log K_a.')],
    build: withPic('conv', roman(blanks([
      { parts: ['Kₐ = 1 × 10', E(mn(-PC.pka)), ' gives pKₐ = ', { box: String(PC.pka) }], why: `−log(10⁻${PC.pka}) = ${PC.pka}.`, hint: 'The pKₐ is the power of ten with its sign changed.' },
      { parts: [`pKₐ = ${PC.pk} gives Kₐ = 1 × 10`, E('−'), { box: String(PC.kexp) }], why: `Kₐ = 10^−pKₐ = 10⁻${PC.kexp}.`, hint: 'Run it backwards: Kₐ = 10 to the power −pKₐ.' },
      { parts: [`of pKₐ ${PC.a} and pKₐ ${PC.b}, the stronger acid has pKₐ `, { box: String(PC.strong) }], why: 'Smaller pKₐ, larger Kₐ, stronger acid.', hint: 'A stronger acid has a larger Kₐ, so a smaller pKₐ.' },
    ]))) },
  { id: 'p-cell', prompt: ['A cell stays near pH 7. Which weak acid, with its conjugate base, buffers best there?'],
    build: withPic('cell', choice(PHOS_TXT.map(v => [uni(`one with pK_a ${v}`)]).concat([['any of them']]), PHOS.indexOf(CELL_BEST),
      `Right. pH ${CELL} lies inside ${PHOS_TXT[1]} ± 1, close to the pKₐ, where both partners are plentiful.`,
      [`pH ${CELL} is far outside ${PHOS_TXT[0]} ± 1: one partner is nearly used up there.`, null, `pH ${CELL} is far outside ${PHOS_TXT[2]} ± 1.`, 'A buffer works only within about pKₐ ± 1.'])) },
  { id: 'p-add', prompt: [uni('An acetic acid / acetate buffer gets a little hydroxide, OH^−. What happens?')],
    build: withPic('add', choice([[uni('Acetate takes up the OH^−.')], ['The buffer is used up at once.'], [uni('Acetic acid gives up H^+, which joins the OH^− to make water.')], ['The pH jumps by several units.']], 2,
      uni('Right. The weak acid gives up H^+; with OH^− it makes water, and acetate is left.'),
      [uni('Acetate takes up H^+, not OH^−: it is the partner for added acid.'), 'A little base uses up only a little of the acetic acid.', null, 'Absorbing it is what the buffer does: the pH barely moves.'])) },
  { id: 'p-terms', prompt: ['True or false?'],
    build: withPic('terms', grid([
      { parts: ['A strong acid dissociates essentially completely, so a pKₐ tells us little about it.'], ans: ['t'], why: 'True: almost none of it is left whole.' },
      { parts: ['A buffer works equally well at any pH.'], ans: ['f'], why: 'False: only within about pKₐ ± 1.' },
      { parts: ['A polyprotic acid has one pKₐ for each proton it can give.'], ans: ['t'], why: `True: phosphoric acid has three, ${PHOS_TXT.join(', ')}.` },
      ...TERMS_RAIN.map(v => ({ parts: [`Rain at pH ${wDec(v)} is acid precipitation.`], ans: [v < RAIN_CUT ? 't' : 'f'], why: v < RAIN_CUT ? `True: ${wDec(v)} is below ${wDec(RAIN_CUT)}.` : `False: ${wDec(v)} is above ${wDec(RAIN_CUT)}, the pH of clean rain.` })),
    ], TF, { multi: false, text: true })) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
