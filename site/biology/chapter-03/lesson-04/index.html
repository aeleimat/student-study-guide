'use strict';
// Biology, Chapter 3 (Water and Life), lesson 4: water splits by proton transfer (hydronium, hydroxide), how rarely,
// equal [H+] and [OH−] in pure water (1e−7 M at 25 °C, Kw 1e−14), acids and bases as proton donors and acceptors, check 1,
// pH = −log[H+] both ways, the 0–14 scale (a factor of ten per step), familiar solutions, check 2, why cells stay near 7,
// summary, practice. Molecules and ions are the cast. Plan, errata and storyboard: books/biology/chapters/chapter-03/lesson-04.md.
const CHAPTER = { number: 304, label: '3, lesson 4', title: 'Water Splitting, Acids, Bases and pH', minutes: 6, language: 'en', lead: false, next: '../lesson-05/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
// A plain straight arrow (shaft and head) from a to b.
function wArrow(p, [x1, y1], [x2, y2], { color = COL.chalk, w = 6, head = 16, o = 1 } = {}) {
  const g = G(p, { o }), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  path(g, `M${x1} ${y1}L${x2 - ux * head * .8} ${y2 - uy * head * .8}`, { stroke: color, 'stroke-width': w });
  path(g, `M${x2 - ux * head - uy * head * .7} ${y2 - uy * head + ux * head * .7}L${x2} ${y2}L${x2 - ux * head + uy * head * .7} ${y2 - uy * head - ux * head * .7}Z`, { fill: color, stroke: color, 'stroke-width': 2 });
  return g;
}
// Write an attribute only when it changes (Firefox repaints on every write).
const setA = (e, k, v) => { if (e['_' + k] !== v) { e.setAttribute(k, v); e['_' + k] = v; } };
// Circles as one path: list of [x, y, r].
const dots = list => list.map(([x, y, r]) => `M${(x - r).toFixed(1)} ${y.toFixed(1)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`).join('');
// Chemistry pieces laid out left to right in one row (measured), centred on x; each text gets _x0 and _w.
function chemRow(p, pieces, { x, y, size = 40, gap = 16, fill = COL.chalk, weight = 600 } = {}) {
  const els = pieces.map(s => wChem(p, s, { y, size, fill, weight, anchor: 'start', o: 0 }));
  const ws = els.map(e => e.getComputedTextLength()), total = ws.reduce((a, b) => a + b, 0) + gap * (els.length - 1);
  let cx = x - total / 2;
  els.forEach((e, i) => { put(e, { x: cx }); e._x0 = cx; e._w = ws[i]; cx += ws[i] + gap; });
  return els;
}
// A small decimal written out in full, digits grouped in threes after the point: 1e-7 → '0.000 000 1'.
function longDec(v, sig = 1) {
  const e = Math.floor(Math.log10(v) + 1e-9), s = v.toFixed(-e + sig - 1), [a, b] = s.split('.');
  return a + '.' + b.replace(/(\d{3})(?=\d)/g, '$1 ');
}
// Question cards: wChem markup as plain text with Unicode super- and subscripts.
const SUP = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹', '+': '⁺', '−': '⁻', '.': '·' };
const SUB = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉' };
const uni = str => wChemParts(str).map(([s, k]) => k === 'n' ? s : [...s].map(c => (k === 'sup' ? SUP : SUB)[c] ?? c).join('')).join('');
// blanks rows are set as maths, which slants letters; chemical symbols (H, OH, pH, M) stay upright.
const roman = build => (body, api) => { const r = build(body, api); body.querySelectorAll('svg.m tspan[font-style]').forEach(t => t.removeAttribute('font-style')); return r; };

/* ---------- shared numbers (computed, never typed twice) ---------- */
const KW = 1e-14, KW_EXP = Math.round(Math.log10(KW));            // ion product of water at 25 °C (errata 8): −14
const H_PURE = Math.pow(10, KW_EXP / 2);                           // [H+] = [OH−] = 1e−7 M in pure water
const H_EXP = Math.round(Math.log10(H_PURE));                      // −7
const ohOf = h => KW / h;
const pexp = v => Math.round(Math.log10(v));                       // the power of an exact power of ten
const mn = v => String(v).replace('-', '−');                       // a typographic minus
const WATER_MOL_L = 1000 / 18.015;                                 // 55.5 mol of water in a liter
const SPLIT_MILLION = Math.round(WATER_MOL_L / H_PURE / 1e6);      // one split molecule in about 555 million (errata 6)
const ACID_LOG = -4, BASE_LOG = -10;                               // [H+] after the acid, after the base (log10)
const BACK_PH = 8.5;                                               // the "backwards" example
const PH_CLASS = v => Math.abs(v - 7) < 1e-9 ? 'n' : v < 7 ? 'a' : 'b';
const EXAMPLES = [['lemon', 2, 'lemon juice, about'], ['coffee', 5, 'black coffee, about'], ['water', 7, 'pure water,'], ['blood', 7.4, 'human blood, about'],
  ['sea', 8, 'seawater, about'], ['ammonia', 12, 'household ammonia,'], ['bleach', 13, 'bleach,']];   // errata 9
const exPH = k => EXAMPLES.find(e => e[0] === k)[1];
const timesMore = (a, b) => Math.round(wHof(a) / wHof(b));          // how many times more H+ at pH a than at pH b
const Q2 = { a: 4, b: 6 }; Q2.x = timesMore(Q2.a, Q2.b);            // 100
const PC = { h: 1e-3, p9: 9, p3: 3 };
PC.pH = Math.round(wPH(PC.h)); PC.e9 = -pexp(wHof(PC.p9)); PC.oh3 = -pexp(ohOf(wHof(PC.p3)));   // 3, 9, 11
const HALF = 6.5, HALF_H = wSci(wHof(HALF));                       // 3.2 × 10^−7
const LEMON_COFFEE = timesMore(exPH('lemon'), exPH('coffee'));      // 1000
const BLOOD_DROP = timesMore(exPH('blood') - 1, exPH('blood'));     // 10

/* ---------- pieces ---------- */
// The kitchen counter of the intro: a half lemon, a beaker of water, a bar of soap.
function kitchen(p) {
  const g = G(p);
  mk('rect', { x: 0, y: 0, width: 1600, height: 700, fill: '#132a45' }, g);
  mk('rect', { x: 0, y: 700, width: 1600, height: 200, fill: '#3a2a1f' }, g);

  const lemon = G(g, { x: 190, y: 640 });
  mk('ellipse', { rx: 96, ry: 62, fill: '#f2d14b', stroke: '#c9a227', 'stroke-width': 6 }, lemon);
  mk('ellipse', { rx: 80, ry: 50, fill: '#fbe68a' }, lemon);
  path(lemon, Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return `M0 0L${(76 * Math.cos(a)).toFixed(1)} ${(47 * Math.sin(a)).toFixed(1)}`; }).join(''), { stroke: '#f2d14b', 'stroke-width': 5 });
  mk('ellipse', { rx: 10, ry: 7, fill: '#f6dc6a' }, lemon);
  const bk = beaker(g, { x: 480, y: 700, w: 260, h: 300 });
  const crowd = moleculeCrowd(g, { x: 480, y: 575, w: 200, h: 200, n: 6, s: .42, temp: 20, seed: 7 });
  const soap = G(g, { x: 770, y: 652 });
  mk('rect', { x: -96, y: -46, width: 192, height: 92, rx: 30, fill: '#bfe3f0', stroke: '#8fc3d8', 'stroke-width': 4 }, soap);
  mk('rect', { x: -70, y: -28, width: 140, height: 30, rx: 14, fill: '#d8f0f8' }, soap);
  path(soap, 'M-40 -70a14 14 0 1 0 0.1 0M10 -92a10 10 0 1 0 0.1 0M52 -66a8 8 0 1 0 0.1 0', { stroke: '#e6f3fb', 'stroke-width': 3 });
  return { g, lemon, soap, bk, crowd };
}

// [H+] and [OH−] as two bars on a log scale: each bar's height counts the powers of ten above 10^−14, so the two always
// add to 14 and the beam between their tops pivots on a fixed fulcrum (the see-saw). b.set(logH, grow) poses both from
// the one value [H+] = 10^logH; [OH−] = Kw / [H+].
const BX0 = 1090, BX1 = 1310, BBASE = 650, BK = 30, BW = 100, BMID = (BX0 + BX1) / 2;
function ionBars(p, { beam = false } = {}) {
  const g = G(p);
  const base = path(g, `M${BX0 - 80} ${BBASE}H${BX1 + 80}`, { stroke: COL.dim, 'stroke-width': 3 });
  const hb = mk('rect', { x: BX0 - BW / 2, width: BW, rx: 8, fill: WC.acid }, g), ob = mk('rect', { x: BX1 - BW / 2, width: BW, rx: 8, fill: WC.base }, g);
  const labels = G(g, { o: 0 });
  wChem(labels, '[H^+]', { x: BX0, y: BBASE + 44, size: 32, fill: WC.acid, o: 1 }); wChem(labels, '[OH^−]', { x: BX1, y: BBASE + 44, size: 32, fill: WC.base, o: 1 });
  wLabel(labels, 'log scale', { x: BMID, y: BBASE + 80, size: 20, fill: COL.dim, weight: 500, o: 1 });
  const reads = G(g, { o: 0 });
  const rH = wChem(reads, '', { x: BX0 - BW / 2 - 12, size: 28, fill: WC.acid, anchor: 'end', o: 1 }), rO = wChem(reads, '', { x: BX1 + BW / 2 + 12, size: 28, fill: WC.base, anchor: 'start', o: 1 });
  const bm = G(g, { o: beam ? 1 : 0 }), fy = BBASE - BK * (H_EXP - KW_EXP);
  const beamL = path(bm, '', { stroke: COL.chalk, 'stroke-width': 5 });
  const fulcrum = G(bm, { x: BMID, y: fy }); path(fulcrum, 'M-18 30L18 30L0 0Z', { fill: COL.dim });
  const b = { g, base, labels, reads, beam: bm, fulcrum, logH: null,
    set(logH, grow = 1) {
      const key = logH.toFixed(4) + '/' + grow.toFixed(4); if (key === b._k) return b; b._k = key; b.logH = logH;
      const logOH = Math.log10(ohOf(Math.pow(10, logH)));
      const h1 = BK * (logH - KW_EXP) * grow, h2 = BK * (logOH - KW_EXP) * grow;
      setA(hb, 'y', (BBASE - h1).toFixed(1)); setA(hb, 'height', Math.max(0, h1).toFixed(1));
      setA(ob, 'y', (BBASE - h2).toFixed(1)); setA(ob, 'height', Math.max(0, h2).toFixed(1));
      wChemSet(rH, wSci(Math.pow(10, logH)) + ' M'); put(rH, { y: +(BBASE - h1 + 10).toFixed(1) });
      wChemSet(rO, wSci(Math.pow(10, logOH)) + ' M'); put(rO, { y: +(BBASE - h2 + 10).toFixed(1) });
      setA(beamL, 'd', `M${BX0} ${(BBASE - h1).toFixed(1)}L${BX1} ${(BBASE - h2).toFixed(1)}`);
      return b;
    },
  };
  return b.set(H_EXP, 1);
}

// The acid–base beaker: glass and six background waters (dy moves it up for the quick check).
function abBeaker(p, dy = 0) {
  const bk = beaker(p, { x: 500, y: 820 + dy, w: 600, h: 500, level: .82 });
  const waters = [[270, 700, 30], [400, 770, -60], [560, 740, 100], [700, 650, 200], [720, 770, 150], [265, 560, -20]]
    .map(([x, y, r]) => waterMolecule(p, { x, y: y + dy, r, s: .75, o: .8 }));
  return { bk, waters, base: waters.map(q => ({ ...st(q) })) };
}
// Ammonia: N with three H (local angles 30, 90, 150) and a fourth place "up" (−90) that a taken proton fills (NH4+).
function nh3(p, { x = 0, y = 0, r = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, r, s, o }), sticks = [], balls = [];
  for (const a of [30, 90, 150, -90]) {
    const hx = W_OH * Math.cos(a * Math.PI / 180), hy = W_OH * Math.sin(a * Math.PI / 180);
    sticks.push(path(g, `M0 0L${hx.toFixed(1)} ${hy.toFixed(1)}`, { stroke: WC.stick, 'stroke-width': 9 }));
    const b = G(g, { x: hx, y: hy }); mk('circle', { r: W_RH, fill: WC.H, stroke: WC.Hedge, 'stroke-width': 2 }, b); mk('circle', { cx: -5, cy: -6, r: 5, fill: '#fff' }, b); balls.push(b);
  }
  mk('circle', { r: 32, fill: '#7f90bd', stroke: '#56658f', 'stroke-width': 3 }, g);
  mk('ellipse', { cx: -11, cy: -13, rx: 9, ry: 5.5, fill: '#fff', 'fill-opacity': .35 }, g);
  const up = G(g, { r: -r });
  wLabel(up, 'N', { y: 10, size: 28, weight: 700, fill: '#fff', o: 1 });
  const badge = G(up, { x: 40, y: -40, o: 0 }); mk('circle', { r: 13, fill: '#0f1e33', stroke: COL.chalk, 'stroke-width': 2.5 }, badge); wLabel(badge, '+', { y: 8, size: 24, weight: 700, o: 1 });
  return Object.assign(g, { sticks, balls, badge, up });
}
// One proton handed from a donor's hydrogen place to a receiver's free place, along a line: positions only.
const handOver = (from, to, t, t0, dur) => { const q = io(ramp(t, t0, t0 + dur)); return [lerp(from[0], to[0], q), lerp(from[1], to[1], q)]; };

// Familiar solutions as small flat icons (origin at the centre, about 70 px).
function phIcon(p, kind, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  if (kind === 'lemon') {
    mk('circle', { r: 32, fill: '#f2d14b', stroke: '#c9a227', 'stroke-width': 4 }, g); mk('circle', { r: 25, fill: '#fbe68a' }, g);
    path(g, Array.from({ length: 6 }, (_, i) => { const a = i * Math.PI / 3; return `M0 0L${(24 * Math.cos(a)).toFixed(1)} ${(24 * Math.sin(a)).toFixed(1)}`; }).join(''), { stroke: '#f2d14b', 'stroke-width': 3.5 });
  } else if (kind === 'coffee') {
    path(g, 'M-28 -18H28L22 26Q21 32 15 32H-15Q-21 32 -22 26Z', { fill: '#e9e2d0', stroke: '#b9ad92', 'stroke-width': 3 });
    mk('ellipse', { cx: 0, cy: -18, rx: 28, ry: 7, fill: '#5a3a24' }, g);
    path(g, 'M27 -6q16 0 16 12t-18 12', { stroke: '#e9e2d0', 'stroke-width': 5 });
    path(g, 'M-8 -32q-6 -8 0 -16M8 -32q-6 -8 0 -16', { stroke: COL.dim, 'stroke-width': 3 });
  } else if (kind === 'water' || kind === 'blood') {
    const [f, e] = kind === 'water' ? [WC.waterHi, '#7fb6e6'] : ['#c0392b', '#e0716a'];
    path(g, 'M0 -36C12 -20 26 -6 26 10A26 26 0 0 1 -26 10C-26 -6 -12 -20 0 -36Z', { fill: f, stroke: e, 'stroke-width': 3 });
    mk('ellipse', { cx: -9, cy: 6, rx: 5, ry: 8, fill: '#fff', 'fill-opacity': .35 }, g);
  } else if (kind === 'sea') {
    path(g, 'M-34 -12q8.5 -10 17 0t17 0t17 0t17 0M-34 4q8.5 -10 17 0t17 0t17 0t17 0M-34 20q8.5 -10 17 0t17 0t17 0t17 0', { stroke: '#4a8fe7', 'stroke-width': 5 });
  } else if (kind === 'ammonia') {
    mk('rect', { x: -18, y: -14, width: 36, height: 48, rx: 8, fill: '#9fb7d6', stroke: '#6f88aa', 'stroke-width': 3 }, g);
    path(g, 'M-8 -14V-26H14V-20H24', { stroke: '#d8dee8', 'stroke-width': 6 });
    mk('rect', { x: -12, y: 0, width: 24, height: 16, rx: 3, fill: '#e6f3fb' }, g);
  } else if (kind === 'bleach') {
    path(g, 'M-22 34V-6Q-22 -18 -8 -22H6V-32H16V-22Q24 -18 24 -6V34Z', { fill: '#f4f4f0', stroke: '#b9b9b0', 'stroke-width': 3 });
    mk('rect', { x: 4, y: -38, width: 14, height: 8, rx: 2, fill: '#4a8fe7' }, g);
    path(g, 'M-14 -2q-10 10 0 20', { stroke: '#b9b9b0', 'stroke-width': 4 });
  }
  return g;
}

// A box of dots that drift a little: pink H+ and indigo OH− in schematic proportion. box.set(t) poses them from t.
// frame: false leaves the box's outline to the caller (drawn earlier, empty).
function ionBox(p, cx, cy, nH, nOH, { w = 240, h = 180, seed = 3, o = 0, frame = true } = {}) {
  const g = G(p, { o });
  if (frame) mk('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 16, fill: '#14375c', stroke: COL.faint, 'stroke-width': 2 }, g);
  const ph = path(g, '', { fill: WC.acid }), po = path(g, '', { fill: WC.base });
  const base = (n, k) => Array.from({ length: n }, (_, i) => [cx + (wHash(i, seed + k) - .5) * (w - 40), cy + (wHash(i, seed + k + 1) - .5) * (h - 40), wHash(i, seed + k + 2) * 6.28]);
  const bh = base(nH, 0), bo = base(nOH, 5);
  const at = (list, t) => dots(list.map(([x, y, a]) => [x + 6 * Math.sin(1.3 * t + a), y + 6 * Math.sin(1.1 * t + 2 * a), 9]));
  return Object.assign(g, { set(t) { setA(ph, 'd', at(bh, t)); setA(po, 'd', at(bo, t)); return g; } }).set(0);
}

// A box holding n pink dots on a 10 × 10 grid (pH comparisons): box.n(k) shows the first k.
function hundredBox(p, cx, cy, { o = 0, size = 160 } = {}) {
  const g = G(p, { o }), sp = (size - 20) / 10;
  mk('rect', { x: cx - size / 2, y: cy - size / 2, width: size, height: size, rx: 14, fill: '#14375c', stroke: COL.faint, 'stroke-width': 2 }, g);
  const all = Array.from({ length: 100 }, (_, i) => [cx - size / 2 + 10 + sp * (i % 10 + .5), cy - size / 2 + 10 + sp * (Math.floor(i / 10) + .5), sp * .34]);
  const d = path(g, '', { fill: WC.acid });
  return Object.assign(g, { n(k) { setA(d, 'd', dots(all.slice(0, k))); return g; } }).n(0);
}

/* ---------- beats ---------- */
const BEATS = [

  path(lad, 'M150 380H1450M150 580H1450', { stroke: COL.chalk, 'stroke-width': 3 });
  path(lad, tk, { stroke: COL.chalk, 'stroke-width': 3 }); path(lad, jn, { stroke: COL.faint, 'stroke-width': 1.5 });

  const mg = G(p, { o: 0 }); show(mg, tSeven + .3, .4);

  const lowR = wChem(low, '', { y: 676, size: 32, fill: WC.acid, o: 1 });
  const up = G(mg, { o: 0 }); path(up, 'M-12 412L0 396L12 412', { stroke: WC.acid, 'stroke-width': 4 }); show(up, tBack + 4.5, .3); hide(up, tDown, .3);
  // the worked lines
  const c7 = say(p, `−log(10^{${mn(H_EXP)}}) = ${wDec(wPH(H_PURE))}`, 800, 770, tSeven + 3, { size: 44, font: MATH, weight: 500 }); hide(c7, tFour + .2, .3);
  const c4 = say(p, `−log(10^{${mn(-4)}}) = ${wDec(wPH(1e-4))}`, 800, 770, tFour + .6, { size: 44, font: MATH, weight: 500 }); hide(c4, tBack, .3);
  const cb = say(p, '[H^+] = 10^{−pH}', 800, 770, tBack + .4, { size: 44, font: MATH, weight: 500 }); hide(cb, tDown, .3);
  const cb2 = say(p, `10^{−${wDec(BACK_PH)}} = ${wSci(wHof(BACK_PH))} M`, 800, 836, tBack + 5.9, { size: 40, font: MATH, weight: 500, fill: WC.acid }); hide(cb2, tDown, .3);

/* ---------- the scale ---------- */
['scale', 'The pH scale', (m, D) => {
  const p = panel(0), tBar = m('bar'), tN = m('neutral'), tAc = m('acidic'), tBa = m('basic'), tTen = m('ten'), tHund = m('hund');
  // the pH ladder becomes the strip and rises into place
  const SG = G(p, { y: 280 }), strip = pHStrip(SG, { x: 170, y: 300, w: 1260, h: 40, size: 26 });
  tw(SG, { y: 0 }, tBar + .1, 1.1);
  const at = strip.at;
  // neutral, acidic, basic: labels above the strip, schematic ion boxes below it
  const top = G(p);
  const nm = strip.marker({ fmt: () => '' }); nm.set(7); show(nm, tN + .2, .3);
  say(top, 'neutral', at(7), 196, tN + .3, { size: 34 });
  say(top, '[H^+] = [OH^−]', at(7), 238, tN + .7, { size: 28, fill: COL.dim, weight: 500 });
  const brace = (a, b, col, t0) => { const e = path(top, `M${at(a) + 6} 272V258H${at(b) - 6}V272`, { stroke: col, 'stroke-width': 4 }, { d: 0 }); draw(e, t0, .6); return e; };
  brace(0, 6.8, WC.acid, tAc + .2); say(top, 'acidic: [H^+] > [OH^−]', at(3.4), 222, tAc + .4, { size: 32, fill: WC.acid });
  brace(7.2, 14, WC.base, tBa + .2); say(top, 'basic: [H^+] < [OH^−]', at(10.6), 222, tBa + .4, { size: 32, fill: WC.base });
  hide(top, tTen, .4); hide(nm, tTen, .4);
  // the three boxes stand empty across the stage from the start; each fills with ions as its kind is named
  const frames = G(p, { o: 0 }); show(frames, .3, .6); hide(frames, tHund, .4);
  const bx = [[3, 12, 1, tAc], [7, 4, 4, tN], [11, 1, 12, tBa]].map(([v, a, b, t0], i) => {
    mk('rect', { x: at(v) - 120, y: 430, width: 240, height: 180, rx: 16, fill: '#14375c', stroke: COL.faint, 'stroke-width': 2 }, frames);
    wLabel(frames, 'pH ' + v, { x: at(v), y: 652, size: 28, fill: COL.dim, weight: 500, o: 1 });
    const g = ionBox(p, at(v), 520, a, b, { seed: 3 + 7 * i, frame: false }); show(g, t0 + .6, .5);
    return g;
  });
  hide(say(p, 'schematic: more or fewer, not to scale', 800, 712, tAc + 1.2, { size: 22, fill: COL.dim, weight: 500 }), tHund, .4);
  // ten: every step is a factor of ten
  const arcs = [];
  for (let v = 14; v >= 1; v--) {
    const x1 = at(v), x2 = at(v - 1), g = G(p, { o: 0 }), t0 = tTen + .2 + (14 - v) * .09;
    path(g, `M${x1 - 4} 272Q${(x1 + x2) / 2} 214 ${x2 + 8} 268M${x2 + 8} 268l2 -14M${x2 + 8} 268l13 -5`, { stroke: COL.chalk, 'stroke-width': 3 });
    wLabel(g, '×10', { x: (x1 + x2) / 2, y: 226, size: 18, fill: COL.dim, weight: 600, o: 1 });
    show(g, t0, .25); arcs[v] = g;
  }
  // hund: pH 5 to pH 3 is two steps: × 10 × 10 = 100
  bx.forEach(g => hide(g, tHund, .4));
  for (const v of [5, 4]) { const x1 = at(v), x2 = at(v - 1), e = path(p, `M${x1 - 4} 272Q${(x1 + x2) / 2} 214 ${x2 + 8} 268`, { stroke: WC.acid, 'stroke-width': 7 }, { d: 0 }); draw(e, tHund + (v === 5 ? .5 : 1.7), .5); }
  say(p, `× 10 × 10 = ${timesMore(3, 5)}`, at(4), 180, tHund + 2.4, { size: 34, fill: WC.acid });
  const b5 = hundredBox(p, at(5) + 10, 520), b3 = hundredBox(p, at(3) - 10, 520);
  b5.n(1); show(b5, tHund + .3, .4); show(b3, tHund + .3, .4);
  prog(q => b3.n(q < .5 ? 1 : q < 1 ? timesMore(4, 5) : timesMore(3, 5)), tHund + .3, 1.9, lin);
  say(p, 'pH 5: 1', at(5) + 10, 640, tHund + .5, { size: 28 });
  const l3 = say(p, `pH 3: ${timesMore(3, 5)}`, at(3) - 10, 640, tHund + 2.3, { size: 28, fill: WC.acid });
  say(p, `pH 3 has ${timesMore(3, 5)} times`, 1130, 500, tHund + 2.8, { size: 34 });
  say(p, 'the H^+ of pH 5', 1130, 546, tHund + 3.1, { size: 34 });
  say(p, `10^{5 − 3} = ${timesMore(3, 5)}`, 1130, 616, tHund + 3.6, { size: 40, font: MATH, weight: 500, fill: WC.acid });
  clockRun(t => bx.forEach(g => g.set(t)), D);
}],

/* ---------- why cells care ---------- */
['cells', 'Why it matters', (m, D) => {
  const p = panel(0), tProt = m('prot'), tFlood = m('flood'), tLoose = m('loose'), tRange = m('range'), tNext = m('next');
  const cam = camera(p, D), W = cam.world;
  cam.to({ x: 760, y: 400, z: 1.22 }, tProt + .1, 1.8);   // the whole cell, outline and nucleus, stays in frame
  mk('ellipse', { cx: 760, cy: 400, rx: 640, ry: 330, fill: '#163d5e', stroke: '#8fd6b0', 'stroke-width': 10 }, W);
  mk('ellipse', { cx: 1230, cy: 250, rx: 90, ry: 70, fill: '#24496e', stroke: '#6fa98c', 'stroke-width': 4 }, W);
  const wash = mk('ellipse', { cx: 760, cy: 400, rx: 630, ry: 320, fill: '#8f9bb0' }, W); put(wash, { o: 0 });
  const PS = 1.25, pr = wProtein(W, { x: 760, y: 420, s: PS, o: 0 }); show(pr, .3, .6);
  // the H+ flood: 22 ions stream in from the left; four land on − charges and cancel them
  const HIT = [7, 2, 10, 6], NI = 22;
  const ins = Array.from({ length: NI }, (_, i) => ({ t0: tFlood + .2 + .09 * i, out: tRange + .2 + .05 * i, from: [-120, 150 + 500 * wHash(i, 41)],
    to: i < HIT.length ? null : [420 + 680 * wHash(i, 42), 200 + 420 * wHash(i, 43)], ph: wHash(i, 44) * 6.28, bead: HIT[i] }));
  const hp = path(W, '', { fill: WC.acid, stroke: '#ffd0e0', 'stroke-width': 2 });
  const fold = t => 1 - .9 * io(ramp(t, tLoose - .2, tLoose + 2.2)) + .9 * io(ramp(t, tRange + .5, tRange + 2.5));
  tw(pr.beads, { c_fill: '#8f9bb0' }, tLoose + .5, .8); tw(pr.beads, { c_fill: WC.prot }, tRange + 1, .8);
  tw(wash, { o: .18 }, tLoose + .5, .8); tw(wash, { o: 0 }, tRange + 1, .8);
  // the words, in screen space along the top
  const l1 = say(p, 'a protein: a chain folded by + and − charges', 800, 120, tProt + .6, { size: 34 }); hide(l1, tFlood, .4);
  const l2 = say(p, 'extra H^+ cancels − charges', 800, 120, tFlood + .4, { size: 34, fill: WC.acid }); hide(l2, tRange, .4);
  const l3 = say(p, 'the fold comes apart: the protein stops working', 800, 165, tLoose + .8, { size: 32 }); hide(l3, tRange, .4);
  say(p, 'cells keep their inside near pH 7', 800, 120, tRange + .4, { size: 34 });
  say(p, '1 pH unit = 10 × more or less H^+', 800, 165, tRange + 4.2, { size: 30, fill: COL.dim, weight: 500 });
  const nx = G(p, { o: 0, x: 40 }); tw(nx, { o: 1, x: 0 }, tNext + .3, .6, out);
  mk('rect', { x: 1080, y: 630, width: 310, height: 60, rx: 30, fill: '#0f1e33', stroke: WC.bond, 'stroke-width': 3 }, nx);
  wLabel(nx, 'next lesson: buffers', { x: 1235, y: 670, size: 28, fill: WC.bond, o: 1 });
  // the pH inside, along the bottom
  const strip = pHStrip(p, { x: 370, y: 760, w: 860, h: 28, size: 22, label: 'pH' });   // inside the cell's outline
  const mkr = strip.marker({ color: WC.acid, size: 28, o: 1 });
  show(strip.band(6, 8), tRange + 3, .5);
  const pH = t => 7 - 3 * io(ramp(t, tFlood + .3, tFlood + 2.5)) + 3 * io(ramp(t, tRange + .3, tRange + 1.8));
  clockRun(t => {
    const f = fold(t), arrived = ins.filter(d => d.bead !== undefined && t > d.t0 + 1.4 && t < d.out + .3).map(d => d.bead);
    pr.set(f, t, { off: arrived, apart: true });
    HIT.forEach(b => { const s = pr.signs[b], o = arrived.includes(b) ? 0 : 1; if (st(s).o !== o) put(s, { o }); });
    let d = '';
    ins.forEach((q, i) => {
      if (t < q.t0 || t > q.out + 1.4) return;
      const [bx, by] = q.bead !== undefined ? pr.bead(q.bead) : q.to;
      const tx = bx + (q.bead !== undefined ? 0 : 8 * Math.sin(1.5 * t + q.ph)), ty = by + (q.bead !== undefined ? -24 * PS : 8 * Math.sin(1.2 * t + q.ph));
      const a = io(ramp(t, q.t0, q.t0 + 1.4)), b = io(ramp(t, q.out, q.out + 1.4));
      const x = lerp(lerp(q.from[0], tx, a), q.from[0], b), y = lerp(lerp(q.from[1], ty, a), q.from[1], b);
      d += `M${(x - 10).toFixed(1)} ${y.toFixed(1)}a10 10 0 1 0 20 0a10 10 0 1 0 -20 0`;
    });
    setA(hp, 'd', d);
    mkr.set(Math.round(pH(t) * 10) / 10);
  }, D);
}],

['final1', 'Chapter practice', (m, D) => {

  const ladder = (g, from, to, y0, step) => {   // vertical joined ladders: [H+] on the left, pH on the right
    let d = '';
    for (let v = from; v <= to; v++) {
      const y = y0 + (v - from) * step; d += `M1176 ${y}H1196M1196 ${y}H1324M1324 ${y}H1344`;
      wChem(g, `10^{${mn(-v)}}`, { x: 1164, y: y + 8, size: 24, fill: COL.dim, weight: 500, anchor: 'end', o: 1 });
      wLabel(g, String(v), { x: 1360, y: y + 9, size: 26, fill: COL.dim, weight: 500, anchor: 'start', o: 1 });
    }
    path(g, d, { stroke: COL.faint, 'stroke-width': 2 });
    path(g, `M1186 ${y0}V${y0 + (to - from) * step}M1334 ${y0}V${y0 + (to - from) * step}`, { stroke: COL.chalk, 'stroke-width': 3 });
    wChem(g, '[H^+]', { x: 1150, y: y0 - 30, size: 30, fill: WC.acid, o: 1 }); wLabel(g, 'pH', { x: 1360, y: y0 - 30, size: 30, o: 1 });
  };
  at('conv', g => {
    ladder(g, 0, 14, 120, 40);
    wChem(g, 'pH = −log[H^+]', { x: 1270, y: 760, size: 38, font: MATH, weight: 500, o: 1 });
    wChem(g, `[H^+] × [OH^−] = 10^{${mn(KW_EXP)}}`, { x: 1270, y: 820, size: 34, font: MATH, weight: 500, o: 1 });
  });
  at('half', g => {
    ladder(g, 6, 7, 260, 300);
    const y = 260 + 150; mk('circle', { cx: 1334, cy: y, r: 10, fill: WC.acid }, g);
    wLabel(g, 'pH ' + wDec(HALF), { x: 1360, y: y + 9, size: 30, fill: WC.acid, anchor: 'start', o: 1 });
    wLabel(g, '?', { x: 1150, y: y + 16, size: 52, weight: 700, fill: WC.acid, o: 1 });
    wChem(g, '[H^+] = 10^{−pH}', { x: 1270, y: 720, size: 40, font: MATH, weight: 500, o: 1 });
  });
  at('times', g => {
    const s = pHStrip(g, { x: 1000, y: 420, w: 560, h: 30, size: 20 });
    [['lemon', 1], ['coffee', 0], ['blood', 1]].forEach(([k, above]) => {
      const v = exPH(k), x = s.at(v); phIcon(g, k, { x, y: above ? 310 : 560 });
      wLabel(g, 'pH ' + wDec(v), { x, y: above ? 250 : 640, size: 28, o: 1 });
    });
  });
  at('class', g => {
    const s = pHStrip(g, { x: 1000, y: 400, w: 560, h: 30, size: 20 });
    wLabel(g, 'acidic', { x: s.at(3.5), y: 340, size: 30, fill: WC.acid, o: 1 }); wLabel(g, 'basic', { x: s.at(10.5), y: 340, size: 30, fill: WC.base, o: 1 });
    wLabel(g, 'neutral: 7', { x: s.at(7), y: 520, size: 28, o: 1 });
    wChem(g, `[H^+] × [OH^−] = 10^{${mn(KW_EXP)}}`, { x: 1280, y: 640, size: 34, font: MATH, weight: 500, o: 1 });
  });
  at('terms', g => {
    wProtein(g, { x: 1280, y: 330, s: .9 });
    wIonChar(g, 'H+', { x: 1140, y: 640, s: 1 }); wIonChar(g, 'OH-', { x: 1400, y: 650, s: .7 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('conv');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-conv', prompt: [uni(`Use pH = −log[H^+] and [H^+] × [OH^−] = 10^{${mn(KW_EXP)}}.`)],
    build: withPic('conv', roman(blanks([
      { parts: ['[H', E('+'), '] = 1 × 10', E(mn(-3)), ' M, so pH = ', { box: String(PC.pH) }], why: uni(`−log(10^{−3}) = ${PC.pH}.`), hint: 'The pH is the power of ten with its sign changed.' },
      { parts: [`pH ${PC.p9} means [H`, E('+'), '] = 10', E('−'), { box: String(PC.e9) }, ' M'], why: uni(`[H^+] = 10^{−pH} = 10^{−${PC.e9}} M.`), hint: 'Run it backwards: [H⁺] = 10 to the power −pH.' },
      { parts: [`at pH ${PC.p3}, [OH`, E('−'), '] = 10', E('−'), { box: String(PC.oh3) }, ' M'], why: uni(`[H^+] = 10^{−${PC.p3}}, so [OH^−] = 10^{−14} ÷ 10^{−${PC.p3}} = 10^{−${PC.oh3}} M.`), hint: 'The two exponents add to −14.' },
    ]))) },
  { id: 'p-half', prompt: [uni(`A solution has pH ${wDec(HALF)}. Its [H^+] is closest to`)],
    build: withPic('half', choice([[uni(`${wDec(HALF)} × 10^{−7} M`)], [uni(HALF_H + ' M')], [uni(wSci(wHof(HALF - 1)) + ' M')], [uni(`${wDec(HALF)} × 10^{−1} M`)]], 1,
      uni(`Right. [H^+] = 10^{−${wDec(HALF)}} = ${HALF_H} M, between 10^{−7} and 10^{−6}.`),
      ['The pH is the power of ten, not a number to multiply by.', null, uni(`That is pH ${wDec(HALF - 1)}: ten times too much H^+.`), 'The power must be −6.5: the pH, with its sign changed.'])) },
  { id: 'p-times', prompt: [`Lemon juice is pH ${exPH('lemon')} and black coffee pH ${exPH('coffee')}. Blood can fall from pH ${wDec(exPH('blood'))} to ${wDec(exPH('blood') - 1)}.`],
    build: withPic('times', roman(blanks([
      { parts: ['lemon juice has ', { box: String(LEMON_COFFEE) }, ' times as much H', E('+')], why: `Three pH steps: 10 × 10 × 10 = ${LEMON_COFFEE}.`, hint: 'Count the pH steps from 5 down to 2; each is a factor of 10.' },
      { parts: ['the blood’s H', E('+'), ' is multiplied by ', { box: String(BLOOD_DROP) }], why: `One pH step down is ${BLOOD_DROP} times more H⁺.`, hint: 'How many pH steps is 7.4 to 6.4?' },
    ]))) },
  { id: 'p-class', prompt: ['Acidic, neutral or basic? (at 25 °C)'],
    build: withPic('class', grid([
      ['pH 3', 3], [uni('[H^+] = 1 × 10^{−7} M'), wPH(1e-7)], [uni('[H^+] = 1 × 10^{−10} M'), wPH(1e-10)], [uni('[OH^−] = 1 × 10^{−5} M'), wPH(ohOf(1e-5))], ['pH 6.9', 6.9],
    ].map(([s, v]) => ({ parts: [s], ans: [PH_CLASS(v)], why: uni(PH_CLASS(v) === 'n' ? 'Neutral: pH 7, [H^+] = [OH^−].' : `pH ${wDec(v)}: ${PH_CLASS(v) === 'a' ? 'below 7, acidic' : 'above 7, basic'}.`) })),
    [['a', 'acidic', WC.acid], ['n', 'neutral'], ['b', 'basic', WC.base]], { multi: false, text: true })) },
  { id: 'p-terms', prompt: ['True or false?'],
    build: withPic('terms', grid([
      { parts: ['An acid is a proton donor.'], ans: ['t'], why: uni('True: it hands H^+ to water and raises [H^+].') },
      { parts: [uni('In pure water at 25 °C, [OH^−] is larger than [H^+].')], ans: ['f'], why: uni('False: they are equal, 10^{−7} M each.') },
      { parts: [uni('A solution of pH 9 has more H^+ than one of pH 8.')], ans: ['f'], why: uni('False: a higher pH means less H^+, ten times less here.') },
      { parts: [uni('Changing the pH by 1 changes [H^+] by a factor of 10.')], ans: ['t'], why: 'True: each step on the scale is a power of ten.' },
      { parts: ['Cells stay near pH 7 partly because protein shape depends on charge.'], ans: ['t'], why: uni('True: extra H^+ changes the charges that hold a protein’s fold.') },
    ], TF, { multi: false, text: true })) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
