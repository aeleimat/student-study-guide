<script>
'use strict';
// Biology, Chapter 3 (Water and Life), lesson 3: part A floating ice (the open lattice, density, lakes in winter, check 1),
// part B water the solvent (solution, solvent, solute; hydration shells; hydrophilic and hydrophobic), part C concentration
// (collisions, molecular mass, the mole, molar mass, molarity, check 2), summary, practice. Molecules and ions are the cast.
// Plan, errata and storyboard: books/biology/chapters/chapter-03/lesson-03.md.
const CHAPTER = { number: 303, label: '3, lesson 3', title: 'Floating Ice and Water the Solvent', minutes: 7, language: 'en', lead: false, next: '../lesson-04/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const angLerp = (a, b, k) => a + ((((b - a) % 360) + 540) % 360 - 180) * k;
const notToScale = (p, x, y, t0) => say(p, 'not to scale', x, y, t0, { size: 22, fill: COL.dim, anchor: 'end', weight: 500 });
// A plain straight arrow (shaft and head) from a to b.
function wArrow(p, [x1, y1], [x2, y2], { color = COL.chalk, w = 6, head = 16, o = 1 } = {}) {
  const g = G(p, { o }), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  path(g, `M${x1} ${y1}L${x2 - ux * head * .8} ${y2 - uy * head * .8}`, { stroke: color, 'stroke-width': w });
  path(g, `M${x2 - ux * head - uy * head * .7} ${y2 - uy * head + ux * head * .7}L${x2} ${y2}L${x2 - ux * head + uy * head * .7} ${y2 - uy * head - ux * head * .7}Z`, { fill: color, stroke: color, 'stroke-width': 2 });
  return g;
}
// A leader line from a label to the thing it names.
const leader = (p, a, b, t0, color = COL.dim) => { const e = path(p, `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`, { stroke: color, 'stroke-width': 2.5 }, { d: 0 }); draw(e, t0, .5); return e; };
// Write an attribute only when it changes (Firefox repaints on every write).
const setA = (e, k, v) => { if (e['_' + k] !== v) { e.setAttribute(k, v); e['_' + k] = v; } };
const setText = (e, s) => { if (e.textContent !== s) e.textContent = s; };
// Stop drawing world pieces the camera's view has left (a pure function of t through cam.at): items [el, x0, y0, x1, y1].
const cull = (cam, items, t) => { const v = cam.at(t), hw = 800 / v.z, hh = 450 / v.z;
  items.forEach(([el, x0, y0, x1, y1]) => { const d = x1 > v.x - hw && x0 < v.x + hw && y1 > v.y - hh && y0 < v.y + hh ? '' : 'none'; if (el.style.display !== d) el.style.display = d; }); };
// Circles as one path: list of [x, y, r].
const dots = list => list.map(([x, y, r]) => `M${(x - r).toFixed(1)} ${y.toFixed(1)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`).join('');
// A heap of salt crystals (white squares) on a base line at y = 0, centred on x = 0, of half-width w; grows with s.
function saltHeap(p, { w = 90, h = 50, n = 70, seed = 4, o = 1 } = {}) {
  const g = G(p, { o }); let d = '';
  for (let i = 0; i < n; i++) {
    const u = wHash(i, seed) * 2 - 1, top = h * (1 - u * u), y = -wHash(i, seed + 1) * top, x = u * w, c = 7 + 4 * wHash(i, seed + 2);
    d += `M${(x - c / 2).toFixed(1)} ${(y - c).toFixed(1)}h${c.toFixed(1)}v${c.toFixed(1)}h${(-c).toFixed(1)}Z`;
  }
  path(g, `M${-w - 8} 0Q0 ${-h * 2.1} ${w + 8} 0Z`, { fill: '#cfd6df' });
  path(g, d, { fill: '#ffffff', stroke: '#9aa6b4', 'stroke-width': 1.5 });
  return g;
}
// A weighing scale with a pan at its origin and a readout window below. sc.set(str) writes the readout.
function scalePan(p, { x = 0, y = 0, w = 300, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  path(g, `M${-w / 2} 0H${w / 2}`, { stroke: WC.glass, 'stroke-width': 10 });
  mk('rect', { x: -22, y: 4, width: 44, height: 50, fill: '#33475f' }, g);
  mk('rect', { x: -w * .45, y: 52, width: w * .9, height: 110, rx: 14, fill: '#22344b', stroke: WC.glass, 'stroke-width': 3 }, g);
  mk('rect', { x: -w * .3, y: 72, width: w * .6, height: 64, rx: 8, fill: '#0b1626' }, g);
  const read = wLabel(g, '', { y: 118, size: 40, fill: '#9ff0b8', weight: 700, o: 1 });
  return Object.assign(g, { read, set(str) { setText(read, str); return g; } });
}
// A water drop icon (origin at its round bottom's centre).
const dropIcon = (p, x, y, s = 1, o = 1) => { const g = G(p, { x, y, s, o }); path(g, 'M0 -60C16 -40 34 -22 34 0A34 34 0 0 1 -34 0C-34 -22 -16 -40 0 -60Z', { fill: WC.waterHi, stroke: '#7fb6e6', 'stroke-width': 3 }); return g; };

/* ---------- shared numbers (computed, never typed twice) ---------- */
const r6 = v => Math.round(v * 1e6) / 1e6;
const fmt = v => String(r6(v));
const MASS = { H: 1, O: 16, Na: 23, Cl: 35.5 };            // rounded atomic masses (errata 12)
const M_H2O = r6(2 * MASS.H + MASS.O);                      // 18 g/mol
const M_NACL = r6(MASS.Na + MASS.Cl);                       // 58.5 g/mol
const AVO = '6.02 × 10²³';                                  // one value (errata 10)
const moles = (g, mm) => r6(g / mm), molarity = (n, L) => r6(n / L);
const D_LIQ = 1.00, D_ICE = .92;                            // g/mL; ice "about 0.92"
const UNDER = Math.round(D_ICE / D_LIQ * 100);              // per cent of floating ice under water
const SOLUBILITY = 36;                                      // about 36 g NaCl per 100 mL of water, room temperature (errata 1)
const EX = { g: 11.7, L: .25 }; EX.n = moles(EX.g, M_NACL); EX.M = molarity(EX.n, EX.L);        // 0.2 mol, 0.8 M
const ONE = { g: M_NACL, L: 1 }; ONE.n = moles(ONE.g, M_NACL); ONE.M = molarity(ONE.n, ONE.L);  // 1 mol, 1 M
const Q2 = { g: 29.25, L: .5 }; Q2.n = moles(Q2.g, M_NACL); Q2.M = molarity(Q2.n, Q2.L);        // 0.5 mol, 1 M
const PW = { g: 36 }; PW.n = moles(PW.g, M_H2O);                                                // 2 mol
const PS = { g: 117, L: 2 }; PS.n = moles(PS.g, M_NACL); PS.M = molarity(PS.n, PS.L);           // 2 mol, 1 M
const PMAKE = { L: .5, M: .2 }; PMAKE.g = r6(PMAKE.M * PMAKE.L * M_NACL);                        // 5.85 g

/* ---------- backdrops and pieces ---------- */
// A table at dusk under a window onto a frozen lake (intro, ice): a glass with a floating ice cube (A), a glass of water
// for salt (B) and a volumetric flask (F). Group origins are their bottom centres on the table (y 760).
const CUBE_Y = -196;   // the cube's centre in glass A, just under the surface at -200 (it floats mostly under)
function tableScene(p) {
  const g = G(p);
  mk('rect', { x: -400, y: -400, width: 2400, height: 1700, fill: '#122640' }, g);
  const win = G(g, { x: 80, y: 70 });
  mk('rect', { x: 0, y: 0, width: 520, height: 350, fill: '#24406a' }, win);
  path(win, dots(Array.from({ length: 26 }, (_, i) => [10 + wHash(i, 2) * 500, 10 + wHash(i, 3) * 160, 1 + 1.5 * wHash(i, 4)])), { fill: '#e8eefa', 'fill-opacity': .7 });
  path(win, 'M0 210Q130 160 260 200T520 185V350H0Z', { fill: '#1a3150' });
  path(win, 'M0 262Q260 246 520 262V350H0Z', { fill: WC.ice });
  path(win, 'M60 300l60 14l40 -10M300 290l50 22l70 -8M210 330l40 -12', { stroke: '#9fbfd8', 'stroke-width': 3 });
  mk('rect', { x: 0, y: 0, width: 520, height: 350, fill: 'none', stroke: '#5c412b', 'stroke-width': 16 }, win);
  path(win, 'M260 0V350M0 175H520', { stroke: '#5c412b', 'stroke-width': 10 });
  mk('rect', { x: -400, y: 760, width: 2400, height: 600, fill: '#3a2a1f' }, g);
  mk('rect', { x: -400, y: 756, width: 2400, height: 12, fill: '#5c412b' }, g);
  const glass = (x) => {
    const q = G(g, { x, y: 760 });
    mk('ellipse', { cx: 0, cy: 6, rx: 118, ry: 10, fill: '#2a1e16' }, q);
    path(q, 'M-98 -200L-84 -6Q-83 0 -76 0H76Q83 0 84 -6L98 -200Z', { fill: WC.water });
    return q;
  };
  const A = glass(330), B = glass(700);
  const cube = G(A, { y: CUBE_Y });
  mk('rect', { x: -44, y: -44, width: 88, height: 88, rx: 10, fill: '#a8d2ee', 'fill-opacity': .78, stroke: '#e6f3fb', 'stroke-width': 3 }, cube);
  mk('rect', { x: -44, y: -44, width: 88, height: 10, rx: 4, fill: WC.ice }, cube);   // the bit above the surface
  path(cube, 'M-30 -24l18 0M-26 -10l10 0', { stroke: '#ffffff', 'stroke-width': 4, 'stroke-opacity': .6 });
  for (const q of [A, B]) {
    path(q, 'M-98 -200Q0 -192 98 -200', { stroke: WC.waterHi, 'stroke-width': 5 });
    path(q, 'M-110 -260L-86 -6Q-85 6 -74 6H74Q85 6 86 -6L110 -260', { stroke: WC.glass, 'stroke-width': 6 });
    path(q, 'M-86 -236L-70 -40', { stroke: '#fff', 'stroke-width': 7, 'stroke-opacity': .16 });
  }
  const F = volFlask(g, { x: 1080, y: 760, R: 92, neck: 40, neckH: 150, markAt: 96, o: 0 }); F.set(1);
  return { g, A, B, cube, F, win };
}

// The ice lattice used in ice and q1: 20 molecules on a diamond grid. Molecule (u, v) (u + v even) has its hydrogens
// pointing down-left and down-right at (u ± 1, v + 1), and receives two bonds from (u ± 1, v − 1): four bonds each.
const LAT = []; for (let v = 0; v < 5; v++) for (let u = v % 2; u < 8; u += 2) LAT.push([u, v]);
const latIndex = (u, v) => LAT.findIndex(([a, b]) => a === u && b === v);
const LAT_BONDS = []; LAT.forEach(([u, v], i) => { const r = latIndex(u + 1, v + 1), l = latIndex(u - 1, v + 1); if (r >= 0) LAT_BONDS.push([i, 1, r]); if (l >= 0) LAT_BONDS.push([i, 2, l]); });
const LAT_HOLES = []; for (let b = 1; b <= 3; b++) for (let a = 1; a <= 6; a++) if ((a + b) % 2) LAT_HOLES.push([a, b]);
const latXY = (cx, cy, h, u, v) => [cx + h * (u - 3.5), cy + h * (v - 2)];
// Draw a still lattice (q1, wrap, practice): returns { mols, bonds }.
function stillLattice(p, cx, cy, h, s, o = {}) {
  const bl = G(p), ml = G(p);
  const mols = LAT.map(([u, v]) => { const [x, y] = latXY(cx, cy, h, u, v); return waterMolecule(ml, { x, y, s, face: o.face ?? true }); });
  const bonds = LAT_BONDS.map(([i, hi, j]) => hBond(bl, { w: 3 }).link(mols[i], hi, mols[j]));
  return { mols, bonds };
}

// Density as two horizontal bars (ice, dense).
function densityBars(p, x, y, len) {
  const g = G(p);
  wLabel(g, 'density', { x, y: y - 64, size: 30, anchor: 'start', weight: 700, o: 1 });
  const rows = [['liquid water', D_LIQ.toFixed(2) + ' g/mL', WC.waterHi, D_LIQ], ['ice', 'about ' + D_ICE.toFixed(2) + ' g/mL', '#a8d2ee', D_ICE]];
  const bars = rows.map(([a, b, c, d], i) => {
    const yy = y + i * 104;
    wLabel(g, a, { x, y: yy - 12, size: 26, anchor: 'start', fill: COL.dim, weight: 500, o: 1 });
    wLabel(g, b, { x: x + len, y: yy - 12, size: 26, anchor: 'end', o: 1 });
    const r = mk('rect', { x, y: yy, width: len * d, height: 34, rx: 8, fill: c }, g); return r;
  });
  return { g, bars };
}

// The fish of the lake beat (origin at its middle, facing +x).
function fish(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M-40 0Q-10 -24 30 -6Q40 0 30 6Q-10 24 -40 0ZM-40 0L-62 -16L-58 0L-62 16Z', { fill: '#7fa7c9' });
  mk('circle', { cx: 22, cy: -3, r: 3, fill: '#0f1e33' }, g);
  return g;
}

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const withPic = (key, build) => (body, api) => { S.pics?.(key); return build(body, api); };

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'Water and life', (m, D) => {
  const p = panel(0), sc = tableScene(p), tIce = m('ice'), tSalt = m('salt'), tCount = m('count');
  say(p, 'BIOLOGY · CHAPTER 3: WATER AND LIFE · LESSON 3', 1190, 220, .05, { size: 26, fill: COL.dim });
  const ttl = G(p, { o: 0, y: 24 });
  ['Floating ice and', 'water the solvent'].forEach((s, i) => wLabel(ttl, s, { x: 1190, y: 310 + i * 78, size: 66, o: 1 }));
  tw(ttl, { o: 1, y: 0 }, 1.5, 1.1, out);
  // ice: the cube bobs in its glass; it floats
  pulse(sc.cube, tIce + .2, 1.18);
  say(p, 'ice floats', 330, 830, tIce + .4, { size: 32 });
  // salt: a shaker tips over glass B; the crystals fall in, sink a little and vanish (dissolve)
  const shaker = G(p, { x: 760, y: 330, o: 0 });
  mk('rect', { x: -30, y: -40, width: 60, height: 90, rx: 12, fill: '#d6dde6' }, shaker);
  mk('rect', { x: -32, y: -62, width: 64, height: 26, rx: 8, fill: '#9aa6b4' }, shaker);
  path(shaker, dots([[-12, -54, 3], [0, -54, 3], [12, -54, 3]]), { fill: '#33475f' });
  show(shaker, tSalt, .4); tw(shaker, { r: -140, x: 740, y: 360 }, tSalt + .2, .6); tw(shaker, { r: 0, x: 790, y: 330, o: 0 }, tSalt + 3.4, .6);
  const grains = path(p, '', { fill: '#ffffff' });
  const G0 = Array.from({ length: 14 }, (_, i) => ({ t0: tSalt + .8 + .14 * i, x: 690 + 40 * (wHash(i, 31) - .5), dx: 30 * (wHash(i, 32) - .5) }));
  clockRun(t => {
    put(sc.cube, { y: CUBE_Y + 3 * Math.sin(1.4 * t), r: 2 * Math.sin(.9 * t) });
    let d = '';
    G0.forEach(({ t0, x, dx }) => {
      const e = t - t0; if (e < 0 || e > 2.4) return;
      const y = e < .45 ? 400 + 150 * (e / .45) ** 2 : 550 + 60 * (e - .45);   // falls to the surface (y 560), then sinks slowly
      const c = e < .45 ? 8 : 8 * (1 - (e - .45) / 1.95);                     // and shrinks away as it dissolves
      if (c > .5) d += `M${(x + dx * e - c / 2).toFixed(1)} ${(y - c / 2).toFixed(1)}h${c.toFixed(1)}v${c.toFixed(1)}h${(-c).toFixed(1)}Z`;
    });
    setA(grains, 'd', d);
  }, D);
  say(p, 'water dissolves', 700, 830, tSalt + 1.2, { size: 32 });
  // count: the flask and "mol / L"
  show(sc.F, tCount + .1, .7);
  say(p, 'how much? mol / L', 1080, 830, tCount + .8, { size: 32, fill: WC.bond });
}],

/* ---------- part A: floating ice ---------- */
['ice', 'Why ice floats', (m, D) => {
  // The camera pushes from the intro's ice cube into its water, where the molecules are drawn at scale K around the cube,
  // so at zoom 1/K their own coordinates are the stage's. Left box: liquid, bonds blinking; right box: the same 20
  // molecules freeze into the open lattice.
  const p = panel(0), cam = camera(p, D), W = cam.world, sc = tableScene(W);
  const tLiq = m('liquid'), tFr = m('freeze'), tLock = m('lock'), tSp = m('space'), tDen = m('dense');
  const K = .04, CX = 330, CY = 760 + CUBE_Y + 10;
  put(sc.F, { o: 1 });
  cam.to({ x: CX, y: CY, z: 1 / K }, .15, 1.5);
  const ins = G(W, { x: CX - K * 800, y: CY - K * 450, s: K });
  mk('rect', { x: -30000, y: -20000, width: 60000, height: 40000, fill: '#14375c' }, ins);
  // the room gives way to the molecules under one solid cover (a single rect's fill-opacity: in Firefox far cheaper than
  // fading a group of 40 molecules under a 25x zoom); the room stops drawing once covered, the molecules start then
  const cover = mk('rect', { x: CX - 1600, y: CY - 1000, width: 3200, height: 2000, fill: '#14375c', 'fill-opacity': 0 }, W);
  put(cover, { 'a_fill-opacity': 0 }); tw(cover, { 'a_fill-opacity': 1 }, .5, .35, lin); tw(cover, { 'a_fill-opacity': 0 }, .95, .5, lin);
  const T_IN = .86; ins.style.display = 'none';
  prog(q => { ins.style.display = q >= 1 ? '' : 'none'; sc.g.style.display = q >= 1 ? 'none' : ''; }, T_IN, .01, lin);
  const parts = [[sc.win, 80, 70, 600, 420], [sc.B, 585, 490, 815, 775], [sc.F, 985, 330, 1175, 770]];
  clockRun(t => cull(cam, parts, t), D);   // every frame, so seeking and stepping hide the same pieces
  // the pair of boxes sits centred until the density panel needs the right third
  const SHIFT = 185, pair = G(ins, { x: SHIFT }), pl = G(p, { x: SHIFT });
  tw(pair, { x: 0 }, tDen - .3, 1); tw(pl, { x: 0 }, tDen - .3, 1);
  const S1 = .5, LX = 300, LY = 480, IX = 865, IY = 480, H = 70;
  const boxL = mk('rect', { x: LX - 220, y: LY - 165, width: 440, height: 330, rx: 16, fill: '#173f66' }, pair);
  const boxI = mk('rect', { x: IX - 285, y: IY - 180, width: 570, height: 360, rx: 16, fill: '#173f66' }, pair);
  put(boxI, { c_fill: '#173f66' }); tw(boxI, { c_fill: '#25507a' }, tFr + .2, 2);
  // liquid positions: a jittered 5 × 4 grid that tumbles; the ice box starts with the same kind of motion
  const liqBase = (cx, cy, seed) => Array.from({ length: 20 }, (_, i) => [cx + ((i % 5) - 2) * 84 + (wHash(i, seed) - .5) * 30, cy + (Math.floor(i / 5) - 1.5) * 76 + (wHash(i, seed + 1) - .5) * 26, wHash(i, seed + 2) * 360]);
  const liq = (b, i, t, seed) => { const ph = wHash(i, seed + 4) * 6.28, f = .8 + .6 * wHash(i, seed + 3);
    return [b[0] + 16 * Math.sin(1.9 * f * t + ph), b[1] + 14 * Math.sin(1.6 * f * t + 2 * ph), b[2] + 50 * Math.sin(.9 * f * t + ph)]; };
  const bL = liqBase(LX, LY, 11), bI = liqBase(IX, IY, 23);
  const blL = G(pair), mlL = G(pair), blI = G(pair), mlI = G(pair);
  const molL = bL.map(([x, y, r]) => waterMolecule(mlL, { x, y, r, s: S1 })), molI = bI.map(([x, y, r]) => waterMolecule(mlI, { x, y, r, s: S1 }));
  // liquid bonds: each molecule to its nearest neighbour, blinking off and on (wOnOff)
  const nearL = bL.map((a, i) => bL.reduce((best, b, j) => j !== i && Math.hypot(a[0] - b[0], a[1] - b[1]) < Math.hypot(a[0] - bL[best][0], a[1] - bL[best][1]) ? j : best, i ? 0 : 1));
  const bondL = bL.map(() => hBond(blL, { w: 3.2 }));
  const bondI = LAT_BONDS.map(() => hBond(blI, { w: 3.2 }));
  const latP = LAT.map(([u, v]) => latXY(IX, IY, H, u, v));
  const fq = t => io(ramp(t, tFr + .3, tFr + 2.6));   // how far the right box has frozen
  clockRun(t => {
    if (t < T_IN) return;   // hidden under the cover until then
    molL.forEach((q, i) => q.pose(...liq(bL[i], i, t, 11)));
    bondL.forEach((b, i) => { const on = wOnOff(i, t, 0, { period: 1.4, off: .5 }); b.link(molL[i], 1 + (i % 2), molL[nearL[i]]); const o = on.on ? 1 : .06; if (st(b).o !== o) put(b, { o }); });
    const k = fq(t);
    molI.forEach((q, i) => {
      const [x, y, r] = liq(bI[i], i, t, 23), [lx, ly] = latP[i];
      q.pose(lerp(x, lx + 2 * Math.sin(9 * t + i), k), lerp(y, ly + 2 * Math.sin(8 * t + 2 * i), k), angLerp(r, 3 * Math.sin(7 * t + i), k));
    });
    const bo = ramp(k, .75, 1);
    bondI.forEach((b, q) => { const [i, hi, j] = LAT_BONDS[q]; b.link(molI[i], hi, molI[j]); if (st(b).o !== bo) put(b, { o: bo }); });
  }, D);
  // labels in screen space
  say(pl, 'liquid water', LX, 220, tLiq + .2, { size: 34, weight: 700 });
  say(pl, 'bonds break and re-form', LX, 262, tLiq + .8, { size: 28, fill: WC.bond, weight: 500 });
  const pre = say(pl, 'the same water…', IX, 220, tLiq + 2, { size: 34, weight: 700, fill: COL.dim }); hide(pre, tFr, .3);
  say(pl, 'ice', IX, 220, tFr + .3, { size: 34, weight: 700 });
  say(pl, 'bonds stay put', IX, 262, tFr + 2.4, { size: 28, fill: WC.bond, weight: 500 });
  // lock: one molecule and its four bonds; the gaps of the open lattice

  const rows = [
    ['Hydrogen bonds lock ice into an open lattice:', 'less dense, it floats, and lakes stay liquid below.', g => {
      const ms = [[150, -20], [200, 30], [250, -20], [200, -70]].map(([x, y]) => waterMolecule(g, { x, y, s: .32 }));
      hBond(g, { w: 2.5 }).link(ms[3], 1, ms[2]); hBond(g, { w: 2.5 }).link(ms[3], 2, ms[0]); hBond(g, { w: 2.5 }).link(ms[0], 1, ms[1]); hBond(g, { w: 2.5 }).link(ms[2], 2, ms[1]); }],
    ['Water is the solvent: ions dissolve in hydration shells,', 'polar and charged molecules too; oil is hydrophobic.', g => {
      const ion = wIon(g, 'Na', { x: 200, y: 0, s: .7 });
      for (let k = 0; k < 6; k++) { const [x, y, r] = wShellSlot(ion, 200, 0, k, 6, { s: .32 }); waterMolecule(g, { x, y, r, s: .32 }); } }],
    [`Moles count units: 1 mol = ${AVO};`, 'molar mass links grams to moles (n = m ÷ M).', g => { const h = saltHeap(g, { w: 60, h: 24, n: 40 }); put(h, { x: 200, y: 20 }); wLabel(g, '1 mol', { x: 200, y: -36, size: 22, o: 1 }); }],
    ['Molarity is moles of solute', 'per liter of solution (M, mol/L).', g => { volFlask(g, { x: 200, y: 60, R: 42, neck: 16, neckH: 46, markAt: 28 }).set(1); }],
  ];
  const groups = [];
  rows.forEach(([a, b, icon], i) => {
    const g = G(p, { x: 100, y: 215 + i * 150, o: 0 });   // the block sits centred
    const ic = G(g); icon(ic);
    T(g, a, { x: 330, y: -6, size: 36, weight: 600 }); T(g, b, { x: 330, y: 40, size: 32, fill: COL.dim });
    tw(g, { o: .2 }, .05, .3); tw(g, { o: 1 }, i ? m('w' + (i + 1)) - .3 : .3, .5); groups.push([g, ic]);
  });
  say(p, 'Now try the chapter practice.', 800, 840, m('end'), { size: 32, fill: WC.bond });
  clockRun(t => groups.forEach(([, ic], i) => put(ic, { y: 5 * Math.sin(1.6 * t + 1.3 * i), r: 3 * Math.sin(1.1 * t + i) })), D);
}],

['final1', 'Chapter practice', (m, D) => {
  // A picture on the right for each practice question; the card's build shows the one it needs (S.pics(key)).
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  at('moles', g => {
    const q = waterMolecule(g, { x: 1260, y: 330, s: 2.2 });
    wLabel(g, `O ${MASS.O}`, { x: 1260, y: 230, size: 38, weight: 700, o: 1 });
    wLabel(g, `H ${MASS.H}`, { x: 1390, y: 470, size: 34, weight: 700, o: 1 }); wLabel(g, `H ${MASS.H}`, { x: 1130, y: 470, size: 34, weight: 700, o: 1 });
    dropIcon(g, 1260, 700, 1.6); wLabel(g, `${PW.g} g of water`, { x: 1260, y: 800, size: 34, o: 1 });
  });
  at('molarity', g => {
    volFlask(g, { x: 1180, y: 760, R: 150, neck: 56, neckH: 200, markAt: 130, label: `${PS.L} L` }).set(1);
    const h = saltHeap(g, { w: 70, h: 30, n: 50, seed: 19 }); put(h, { x: 1460, y: 700 });
    wLabel(g, `${PS.g} g NaCl`, { x: 1460, y: 750, size: 30, o: 1 });
    wLabel(g, `NaCl: ${M_NACL} g/mol`, { x: 1260, y: 120, size: 32, o: 1 });
  });
  at('shell', g => {
    const ion = wIon(g, 'Cl', { x: 1260, y: 440, s: 1.5 });
    wLabel(g, 'Cl⁻', { x: 1260, y: 330, size: 40, weight: 700, fill: '#a8e8b4', o: 1 });
    for (let k = 0; k < 6; k++) { const a = k * 60 * Math.PI / 180; mk('circle', { cx: 1260 + 170 * Math.cos(a), cy: 440 + 170 * Math.sin(a), r: 44, fill: 'none', stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '7 6' }, g); wLabel(g, '?', { x: 1260 + 170 * Math.cos(a), y: 452 + 170 * Math.sin(a), size: 34, fill: COL.dim, o: 1 }); }
    wLabel(g, 'which end faces the ion?', { x: 1260, y: 720, size: 30, o: 1 });
  });
  at('terms', g => {
    stillLattice(g, 1250, 230, 44, .28, { face: false });
    const dr = G(g); mk('ellipse', { cx: 1130, cy: 560, rx: 70, ry: 70, fill: WC.oil, 'fill-opacity': .5, stroke: WC.oil, 'stroke-width': 3 }, dr);
    wLabel(g, 'oil', { x: 1130, y: 670, size: 28, o: 1 });
    volFlask(g, { x: 1400, y: 680, R: 80, neck: 30, neckH: 90, markAt: 56 }).set(1);
    wLabel(g, 'mol/L', { x: 1400, y: 720, size: 28, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => { put(g, { o: k === key ? 1 : 0 }); g.style.display = k === key ? '' : 'none'; });
  S.pics('moles');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-moles', prompt: [`Water is H₂O. Use H = ${MASS.H} and O = ${MASS.O}.`],
    build: withPic('moles', blanks([
      { parts: ['molar mass of water = ', { box: fmt(M_H2O) }, ' grams per mole'], why: `${MASS.H} + ${MASS.H} + ${MASS.O} = ${M_H2O} g/mol.`, hint: 'Add the masses of all three atoms.' },
      { parts: [`${PW.g} g of water = `, { box: fmt(PW.n) }, ' moles'], why: `${PW.g} ÷ ${M_H2O} = ${fmt(PW.n)} mol.`, hint: 'Moles = mass ÷ molar mass.' },
    ])) },
  { id: 'p-molarity', prompt: [`Sodium chloride, NaCl: ${M_NACL} g/mol.`],
    build: withPic('molarity', blanks([
      { parts: [`${PS.g} g of NaCl = `, { box: fmt(PS.n) }, ' moles'], why: `${PS.g} ÷ ${M_NACL} = ${fmt(PS.n)} mol.`, hint: 'Moles = mass ÷ molar mass.' },
      { parts: [`made up to ${PS.L} L of solution, it is `, { box: fmt(PS.M) }, ' moles per liter'], why: `${fmt(PS.n)} mol ÷ ${PS.L} L = ${fmt(PS.M)} M.`, hint: 'Divide the moles by the liters of solution.' },
      { parts: [`to make ${PMAKE.L} L of ${PMAKE.M} M solution you need `, { box: fmt(PMAKE.g) }, ' grams'], why: `${PMAKE.M} mol/L × ${PMAKE.L} L = ${fmt(PMAKE.M * PMAKE.L)} mol, and ${fmt(PMAKE.M * PMAKE.L)} × ${M_NACL} = ${fmt(PMAKE.g)} g.`, hint: 'Moles = molarity × liters; grams = moles × molar mass.' },
    ])) },
  { id: 'p-shell', prompt: ['In a hydration shell, which end of a water molecule faces a chloride ion (Cl⁻)?'],
    build: withPic('shell', choice([
      ['The oxygen end.'],
      ['The hydrogen end.'],
      ['Both ends equally.'],
      ['Neither: water does not touch ions.'],
    ], 1, 'Right. Chloride is negative, so the slightly positive (δ+) hydrogen ends point in.',
    ['The δ− oxygen end faces a positive ion, such as sodium. Chloride is negative.', null,
     'The molecule is polar: one end is attracted, the other is turned away.',
     'Water crowds round each ion: that is the hydration shell.'])) },
  { id: 'p-terms', prompt: ['True or false?'],
    build: withPic('terms', grid([
      { parts: ['Ice is less dense than liquid water because its hydrogen bonds lock an open lattice.'], ans: ['t'], why: 'True: the same molecules take up more room.' },
      { parts: ['The solvent is the substance that is dissolved.'], ans: ['f'], why: 'False: that is the solute. The solvent does the dissolving.' },
      { parts: ['Oil is hydrophobic.'], ans: ['t'], why: 'True: it has no charged or polar regions for water to hold.' },
      { parts: ['Molarity is moles of solute per liter of water added.'], ans: ['f'], why: 'False: per liter of solution, made up to the mark.' },
      { parts: [`One mole contains ${AVO} units.`], ans: ['t'], why: 'True: that is Avogadro’s number.' },
    ], TF, { multi: false, text: true })) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
