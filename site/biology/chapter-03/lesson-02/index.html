/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const notToScale = (p, x, y, t0) => say(p, 'not to scale', x, y, t0, { size: 22, fill: COL.dim, anchor: 'end', weight: 500 });
// A plain straight arrow (shaft and head) from a to b.
function wArrow(p, [x1, y1], [x2, y2], { color = COL.chalk, w = 6, head = 16, o = 1 } = {}) {
  const g = G(p, { o }), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  path(g, `M${x1} ${y1}L${x2 - ux * head * .8} ${y2 - uy * head * .8}`, { stroke: color, 'stroke-width': w });
  path(g, `M${x2 - ux * head - uy * head * .7} ${y2 - uy * head + ux * head * .7}L${x2} ${y2}L${x2 - ux * head + uy * head * .7} ${y2 - uy * head - ux * head * .7}Z`, { fill: color, stroke: color, 'stroke-width': 2 });
  return g;
}
// A leader line from a label to the thing it names.
const leader = (p, a, b, t0, color = COL.dim) => { const e = path(p, `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`, { stroke: color, 'stroke-width': 2.5 }, { d: 0 }); draw(e, t0, .5); return e; };

/* ---------- backdrops ---------- */
// The tree beside a lake at dusk (intro, tree). Returns { g, tree, lake, crown }.
function treeLake(p) {
  const g = G(p);
  let sd = ''; for (let i = 0; i < 70; i++) { const x = wHash(i, 9) * 1600, y = wHash(i, 10) * 420, r = .8 + 1.6 * wHash(i, 11); sd += `M${(x - r).toFixed(1)} ${y.toFixed(1)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`; }
  path(g, sd, { fill: '#cfd8ea', 'fill-opacity': .45 });
  const moon = mk('circle', { cx: 760, cy: 120, r: 36, fill: COL.chalk, 'fill-opacity': .8 }, g);
  path(g, 'M0 650Q260 570 600 630T1200 600T1600 630V900H0Z', { fill: '#14304e' });
  path(g, 'M0 730Q400 706 800 722T1600 716V900H0Z', { fill: '#1d3b2c' });
  const lake = G(g);
  path(lake, 'M700 760Q740 712 1010 712Q1390 708 1550 740Q1590 780 1500 812Q1210 846 900 836Q700 826 700 760Z', { fill: WC.water });
  path(lake, 'M820 760h120M1060 748h160M960 790h200M1280 782h120', { stroke: WC.waterHi, 'stroke-width': 4 });
  const tree = G(g, { x: 330, y: 734 });
  path(tree, 'M-36 0L-22 -340H22L36 0Z', { fill: WC.bark });
  path(tree, 'M-4 -250L-90 -350M6 -300L80 -390M0 -200L70 -270', { stroke: WC.bark, 'stroke-width': 16 });
  path(tree, 'M-36 0q-30 10 -70 6M36 0q30 10 70 6M0 0v26', { stroke: WC.barkDk, 'stroke-width': 10 });
  const crown = G(tree);
  [[-130, -400, 118, WC.leafDk], [130, -405, 118, WC.leafDk], [0, -500, 150, WC.leaf], [-120, -440, 110, WC.leaf], [120, -440, 110, WC.leaf], [-50, -360, 96, WC.leaf], [70, -355, 96, WC.leaf]]
    .forEach(([cx, cy, r, f]) => mk('circle', { cx, cy, r, fill: f }, crown));
  mk('circle', { cx: -40, cy: -540, r: 46, fill: '#63b06f' }, crown);
  return { g, tree, lake, crown, moon };
}

// Three molecules held by two hydrogen bonds, centred on (x, y): B in the middle, A bonds to B's O, B bonds to C's O.
function cluster3(p, x, y, s, o = {}) {
  const bl = G(p), ml = G(p), d = 150 * s, a = 37.75 * Math.PI / 180;
  const B = waterMolecule(ml, { x, y, s, r: 0 });
  const C = waterMolecule(ml, { x: x + d * Math.cos(a), y: y + d * Math.sin(a), s, r: -70 });
  const A = waterMolecule(ml, { x: x - d * .94, y: y - d * .34, s });
  wAim(A, 1, x, y);
  const b1 = hBond(bl).link(A, 1, B), b2 = hBond(bl).link(B, 1, C);
  return { A, B, C, bonds: [b1, b2], g: [bl, ml] };
}

// A column of water molecules in a xylem tube between two walls. Molecule j (−1 .. n) alternates: even j points H1 up and
// H2 at the right wall, odd j H2 up and H1 at the left wall. tube.pose(y(j), x(j)) places them and relinks every bond.
function xylem(p, { cx = 1000, top = 150, bot = 860, half = 78, s = .68, n = 8 } = {}) {
  const g = G(p);
  mk('rect', { x: cx - half, y: top, width: 2 * half, height: bot - top, fill: '#16324f' }, g);
  for (const sx of [-1, 1]) mk('rect', { x: sx < 0 ? cx - half - 26 : cx + half, y: top - 10, width: 26, height: bot - top + 10, rx: 6, fill: '#355f43', stroke: '#4f8a5a', 'stroke-width': 2 }, g);
  let dd = ''; for (let y = top + 30; y < bot; y += 50) dd += `M${cx - half - 4} ${y}h8M${cx + half - 4} ${y}h8`;
  path(g, dd, { stroke: '#9fd0a8', 'stroke-width': 5 });
  const bondL = G(g), adhL = G(g, { o: 0 }), molL = G(g);
  const par = j => ((j % 2) + 2) % 2;
  const mols = [], bonds = [], adh = [];
  for (let j = -1; j <= n; j++) mols.push(waterMolecule(molL, { s, r: par(j) ? -232.25 : -127.75 }));
  for (let j = 0; j <= n; j++) bonds.push(hBond(bondL));
  for (let j = -1; j <= n; j++) adh.push(hBond(adhL, { w: 3.5 }));
  const tube = { g, mols, bonds, adh, adhL, bondL, cx, half, top, bot,
    mol: j => mols[j + 1],
    pose(yf, xf = j => cx + (par(j) ? -9 : 9)) {
      for (let j = -1; j <= n; j++) tube.mol(j).pose(xf(j), yf(j));
      for (let j = 0; j <= n; j++) bonds[j].link(tube.mol(j), par(j) ? 2 : 1, tube.mol(j - 1));
      for (let j = -1; j <= n; j++) {
        const m = tube.mol(j), side = par(j) ? -1 : 1, [hx, hy] = m.atom(par(j) ? 1 : 2);
        adh[j + 1].set([hx + side * W_RH * s, hy], [cx + side * half, hy]);
      }
    },
  };
  return tube;
}

// Water strider standing on the surface at its origin; its feet at g.feet (x offsets).
function strider(p, o = {}) {
  const g = G(p, o), c = '#c8b27e', dk = '#8f7a4f';
  path(g, 'M-40 -52Q-150 -90 -230 0M-20 -50Q-90 -100 -120 0M30 -52Q140 -95 230 0M50 -50Q110 -80 120 0M70 -56Q120 -80 150 -64', { stroke: dk, 'stroke-width': 5 });
  mk('ellipse', { cx: 0, cy: -56, rx: 82, ry: 15, fill: c }, g);
  mk('circle', { cx: 92, cy: -60, r: 14, fill: c }, g);
  mk('circle', { cx: 98, cy: -64, r: 4, fill: '#2b2412' }, g);
  return Object.assign(g, { feet: [-230, -120, 120, 230] });
}

// Bars of kinetic energy (∝ k²) for a set of speeds, sorted, with a dashed average line. Baseline at y.
function speedBars(p, ks, { x, y, w, h, color = WC.heat }) {
  const g = G(p), idx = ks.map((k, i) => i).sort((a, b) => ks[a] - ks[b]), kmax = Math.max(...ks), bw = w / ks.length;
  const bars = idx.map((i, q) => { const hh = h * (ks[i] / kmax) ** 2; const r = mk('rect', { x: x + q * bw + bw * .15, y: y - hh, width: bw * .7, height: hh, rx: 4, fill: color }, g); r._i = i; return r; });
  path(g, `M${x - 10} ${y}H${x + w + 10}`, { stroke: COL.dim, 'stroke-width': 3 });
  const avgOf = list => list.reduce((a, i) => a + (ks[i] / kmax) ** 2, 0) / list.length * h;
  const avg = G(g, { y: y - avgOf(idx) });
  path(avg, `M${x - 16} 0H${x + w + 16}`, { stroke: COL.chalk, 'stroke-width': 3.5, 'stroke-dasharray': '12 9' });
  return { g, bars, avg, avgOf, idx };
}

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };

/* ---------- shared numbers (computed, never typed twice) ---------- */

const SPEC_Q = 600, SPEC_M = 150;               // spec: heat and masses
const dT = (q, m, c) => q / (m * c);
const Q2 = { q: 900, m: 300 }, Q2_DT = dT(Q2.q, Q2.m, C_WATER);   // 3 °C
const HVAP = 580;                               // cal/g near body temperature (errata 12, "about")
const SWEAT_M = 100, SWEAT_DT = dT(HVAP * 1, SWEAT_M, C_WATER);     // 5.8 °C
const J_PER_CAL = 4.184;

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'Water and life', (m, D) => {

  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOLOGY · CHAPTER 3: WATER AND LIFE · LESSON 2', { x: 1190, y: 220, size: 26, fill: COL.dim, o: 1 });

  say(p, 'lifts water up to 100 m', 600, 300, m('tree') + .4, { size: 32, fill: WC.bond, anchor: 'start' });

/* ---------- part A: cohesion ---------- */
['cohes', 'Cohesion', (m, D) => {
  const p = panel(0), cam = camera(p, D, { x: 620, y: 450, z: .32 }), W = cam.world;
  cam.to({ x: 800, z: 1 }, .3, 1.5);
  const lake = G(W); hide(lake, .3, .4);
  path(lake, 'M-2400 1250H3600V3200H-2400Z', { fill: WC.water });
  path(lake, 'M-2400 1250H3600', { stroke: WC.waterHi, 'stroke-width': 8 });
  mk('circle', { cx: 620, cy: 450, r: 345, fill: '#14375c', stroke: WC.bond, 'stroke-width': 3, 'stroke-opacity': .35 }, W);
  const bl = G(W), ml = G(W);
  // the pair in the middle
  const s1 = 1.35, A = waterMolecule(ml, { x: 470, y: 440, s: s1 }), B = waterMolecule(ml, { x: 470 + 170 * s1, y: 440, s: s1, r: -90 });
  wAim(A, 1, st(B).x, st(B).y);
  const pair = hBond(bl, { w: 6 }).link(A, 1, B); put(pair, { o: 0 });
  // neighbours around them
  const ring = [], N = 10;
  for (let i = 0; i < N; i++) {
    const a = i / N * 2 * Math.PI + .2, rx = 262, ry = 255;
    ring.push(waterMolecule(ml, { x: 590 + rx * Math.cos(a), y: 450 + ry * Math.sin(a), s: .85, r: wHash(i, 3) * 360, o: .55 }));
  }
  const rb = [];
  ring.forEach((q, i) => {
    const nb = i % 2 ? ring[(i + 1) % N] : (Math.hypot(st(q).x - st(A).x, st(q).y - st(A).y) < Math.hypot(st(q).x - st(B).x, st(q).y - st(B).y) ? A : B);
    wAim(q, 1, st(nb).x, st(nb).y); rb.push([q, nb, hBond(bl, { o: 0 })]);
  });
  const base = [A, B, ...ring].map(q => ({ ...st(q) }));
  clockRun(t => {
    [A, B, ...ring].forEach((q, i) => { const b = base[i], f = 1.3 + .4 * wHash(i, 7); q.pose(b.x + 3 * Math.sin(f * t + i), b.y + 3 * Math.sin(1.2 * f * t + 2 * i), b.r + 4 * Math.sin(.9 * f * t + i)); });
    pair.link(A, 1, B); rb.forEach(([q, nb, b]) => b.link(q, 1, nb));
  }, D);
  // pull: partial charges
  A.deltas(m('pull') + .2, { size: 34, nudge: { 1: [-34, -52] } }); B.deltas(m('pull') + .9, { size: 34, nudge: { 0: [40, -62] } });
  say(p, 'oxygen end: slightly negative (δ−)', 1050, 230, m('pull') + .3, { size: 30, fill: '#ffb3a6', anchor: 'start' });
  say(p, 'hydrogen ends: slightly positive (δ+)', 1050, 278, m('pull') + 1.2, { size: 30, anchor: 'start' });
  // bond: one H drawn to the neighbour's O
  show(pair, m('bond') + .8, .1); pair.form(m('bond') + .8, .7);
  say(p, 'hydrogen bond', 600, 540, m('bond') + 1.3, { size: 30, fill: WC.bond });
  // many: weak, breaks and re-forms
  pair.flicker(m('many') + .3, 3, .7);
  say(p, 'one bond is weak:', 1050, 390, m('many'), { size: 30, anchor: 'start' });
  say(p, 'breaks and re-forms in a flash', 1050, 432, m('many') + .4, { size: 28, fill: COL.dim, anchor: 'start', weight: 500 });
  // team: every neighbour holds on
  ring.forEach((q, i) => tw(q, { o: 1 }, m('team') + .1 * i, .4));
  rb.forEach(([, , b], i) => { show(b, m('team') + .3 + .12 * i, .1); b.form(m('team') + .3 + .12 * i, .5); });
  say(p, 'many weak bonds together', 1050, 540, m('team') + 1, { size: 30, anchor: 'start' });
  say(p, 'hold the liquid as one body', 1050, 582, m('team') + 1.4, { size: 30, anchor: 'start' });
  // name
  const nm = say(p, 'COHESION', 1050, 720, m('name') + .3, { size: 84, fill: WC.bond, anchor: 'start', weight: 700 });
  say(p, 'water sticking to water', 1054, 770, m('name') + .8, { size: 30, fill: COL.dim, anchor: 'start', weight: 500 });
}],

['tree', 'Up the tree', (m, D) => {

  const K = .04, TX = 1000, tPush = m('push'), tA = tPush + 2.9, tLeaf = m('leaf'), tPull = m('pull'), tWall = m('wall'), tGrav = m('gravity');
  const tg = G(W, { x: 330 - K * 800, y: 560 - K * 450, s: K });

  pin('leaf', TX + 160, 186, tA - .4, { size: 24, fill: '#9fd0a8', weight: 500 });
  pin('air', TX - 150, 80, tLeaf, { size: 26, fill: COL.dim, weight: 500 });
  const cap1 = pin('a narrow tube in the trunk,', 1150, 270, tA, { size: 30, anchor: 'start' });
  const cap2 = pin('filled from roots to leaves', 1150, 312, tA + .4, { size: 30, anchor: 'start', fill: COL.dim, weight: 500 });
  hide(cap1, tPull, .4); hide(cap2, tPull, .4);

  pin('not to scale', 1540, 64, tA + 1, { size: 22, fill: COL.dim, anchor: 'end', weight: 500 });
  // leaf: the top molecule evaporates; pull: it tugs the next, and the chain follows one after another, like a rope
  const yb = j => 250 + 100 * j;
  const rise = (j, t) => -100 * io(ramp(t, tPull + .5 + .2 * j, tPull + 2.9 + .2 * j));
  tube.bonds[0].snap(tPull + .4);
  clockRun(t => {
    const lv = io(ramp(t, tLeaf + .2, tLeaf + 2.6)), tug = 10 * Math.sin(Math.PI * ramp(t, tLeaf + 1.5, tPull + .4));   // the chain is stretched up while the leaver pulls

              j => j < 0 ? lerp(TX + 9, TX + 150, lv) : TX + (j % 2 ? -9 : 9) + jig(j + 3));
  }, D);
  put(tube.mol(7), { o: 0 }); show(tube.mol(7), tPull + 1.2); put(tube.adh[0], { o: 0 });   // the escaped molecule grips nothing
  pin('evaporation', TX + 210, 72, tLeaf + 1.4, { size: 30, anchor: 'start' });
  const ups = G(inside, { o: 0 }); [330, 540, 750].forEach(y => wArrow(ups, [TX - 140, y + 50], [TX - 140, y - 30], { color: WC.bond, w: 5, head: 14 }));
  show(ups, tPull + .5); hide(ups, tWall - .5);
  const cap3 = pin('each molecule tugs the next:', 1150, 270, tPull + 1, { size: 30, anchor: 'start' });
  const cap4 = pin('the whole chain follows', 1150, 312, tPull + 1.5, { size: 30, anchor: 'start', fill: COL.dim, weight: 500 });
  hide(cap3, tWall, .4); hide(cap4, tWall, .4);
  // wall: adhesion bonds to the wall; label the two kinds of bond
  show(tube.adhL, tWall + 2.4, .8);

  pin('water links water', 1150, 435, tWall + .8, { size: 28, fill: COL.dim, anchor: 'start', weight: 500 });
  const l1 = path(inside, `M1140 405L${TX + 14} 400`, { stroke: WC.bond, 'stroke-width': 2.5 }, { d: 0 }); draw(l1, tWall + .6, .5);
  pin('adhesion:', 1150, 575, tWall + 2.6, { size: 30, fill: '#9fd0a8', anchor: 'start' });
  pin('water grips the wall', 1150, 615, tWall + 2.9, { size: 28, fill: COL.dim, anchor: 'start', weight: 500 });

  for (let i = 0; i <= 120; i++) { const x = 240 + i * 9.5, ph = i / 120 * 2 * Math.PI; ds += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + (450 - 210 * Math.sin(ph - .4)).toFixed(1); dw += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + (450 - 40 * Math.sin(ph - 1.2)).toFixed(1); }
  const ls = path(B, ds, { stroke: WC.sand, 'stroke-width': 6 }, { d: 0 }), lw = path(B, dw, { stroke: WC.bond, 'stroke-width': 7 }, { d: 0 });
  draw(ls, tBuf + .6, 2); draw(lw, tBuf + 1.2, 2);

}],

  const moon = mk('circle', { cx: 1350, cy: 120, r: 40, fill: COL.chalk }, W); put(moon, { o: 0 }); show(moon, tNight + .6, .8);
  path(W, 'M-400 600Q300 580 760 610L820 1300H-400Z', { fill: WC.sand });
  path(W, 'M760 612Q1200 596 2000 604V1300H820Z', { fill: WC.water });
  const ripple = path(W, 'M900 660h140M1180 700h200M980 760h160M1300 840h180M1120 860h120', { stroke: WC.waterHi, 'stroke-width': 5 });
  clockRun(t => put(ripple, { x: 14 * Math.sin(.8 * t) }), D);
  const thB = thermometer(W, { x: 420, y: 840, h: 280, min: 0, max: 45, side: 1 }), thS = thermometer(W, { x: 1240, y: 840, h: 280, min: 0, max: 45, side: 1 });
  const dayK = t => io(ramp(t, tDay + .3, tDay + 2.5)), nightK = t => io(ramp(t, tNight + .2, tNight + 3.3));
  clockRun(t => { const a = dayK(t), b = nightK(t); thB.set(20 + 18 * a - 22 * b); thS.set(20 + 2 * a - 1 * b); }, D);
  wLabel(W, 'beach', { x: 230, y: 700, size: 30, o: 1 }); wLabel(W, 'sea', { x: 1480, y: 670, size: 30, o: 1 });
  const dh = heatArrow(W, [1000, 330], [1000, 590], { label: 'air → sea', side: -1, size: 28 }); dh.in(tDay + 3, .9); hide(dh, tNight, .4);
  const nh = heatArrow(W, [1000, 590], [1000, 330], { label: 'sea → air', side: -1, size: 28 }); nh.in(tNight + 1.2, .9); hide(nh, tLife, .4);
  const op = say(p, 'water steadies whole places', 800, 90, .3, { size: 32 }); hide(op, tDay + .5, .4);
  const dl = say(p, 'the sand heats fast; the sea warms a little', 800, 90, tDay + 1, { size: 32 }); hide(dl, tNight, .4);
  const nl = say(p, 'at night the sea gives heat back', 800, 90, tNight + .6, { size: 32 }); hide(nl, tLife, .4);

  mk('rect', { x: 470, y: 150, width: 660, height: 190, rx: 18, fill: '#0f1e33', 'fill-opacity': .85, stroke: COL.faint, 'stroke-width': 2 }, sw);
  wLabel(sw, 'swing between day and night', { x: 800, y: 192, size: 26, fill: COL.dim, weight: 500, o: 1 });
  wLabel(sw, 'coast', { x: 610, y: 252, size: 28, anchor: 'end', o: 1 }); const b1 = mk('rect', { x: 630, y: 230, width: 110, height: 28, rx: 8, fill: WC.bond }, sw);
  wLabel(sw, 'inland', { x: 610, y: 310, size: 28, anchor: 'end', o: 1 }); const b2 = mk('rect', { x: 630, y: 288, width: 460, height: 28, rx: 8, fill: WC.heat }, sw);
  put(b1, { a_width: 0 }); put(b2, { a_width: 0 }); tw(b1, { a_width: 110 }, m('coast') + .5, .6, out); tw(b2, { a_width: 460 }, m('coast') + 1.1, 1.1, out);
  // life: a small cell in the sea; the camera pushes in until the cell fills the stage

  mk('ellipse', { cx: 720, cy: 470, rx: 520, ry: 320, fill: '#163d5e', stroke: '#8fd6b0', 'stroke-width': 10 }, C);

['evap', 'Evaporative cooling', (m, D) => {
  const p = panel(0), tLeave = m('leave'), tLeft = m('left'), tVap = m('vap'), tSweat = m('sweat');
  const A = G(p);
  const bk = beaker(A, { x: 440, y: 830, w: 600, h: 560, level: .8 });
  const cr = moleculeCrowd(A, { x: 440, y: 610, w: 520, h: 360, n: 15, s: .58, temp: 30, seed: 12 });
  // fast: each glows by its own speed
  cr.mols.forEach((q, i) => { const g = clamp01((cr.k[i] - .95) / .75); if (g > .05) tw(q.halo, { o: g }, m('fast') + .3 + .05 * i, .6); });
  // leave: the two fastest near the surface escape
  const top = cr.mols.map((q, i) => i).filter(i => cr.base[i][1] < -40).sort((a, b) => cr.k[b] - cr.k[a]).slice(0, 2);
  const path2 = [[[560, 150], tLeave + .3], [[300, 120], tLeave + 2.2]];
  top.forEach((i, n) => { cr.mols[i]._frozen = true; });
  clockRun(t => {
    cr.set(t);
    top.forEach((i, n) => {
      const [[ex, ey], t0] = path2[n], q = io(ramp(t, t0, t0 + 2.2)), [bx, by] = cr.base[i], x0 = 440 + bx, y0 = 610 + by;
      cr.mols[i].pose(lerp(bx, ex - 440, q), lerp(by, ey - 610, q) - 40 * Math.sin(q * Math.PI), cr.base[i][2] + 200 * q);
    });
  }, D);
  say(A, 'the fastest escape: evaporation', 440, 70, tLeave + 1.2, { size: 32 });
  // left: those left behind are slower on average; the water cools
  const sb = speedBars(A, cr.k, { x: 1000, y: 600, w: 460, h: 300 });
  put(sb.g, { o: 0 }); show(sb.g, m('fast') + 1);
  wLabel(sb.g, 'kinetic energy of each molecule', { x: 1230, y: 640, size: 24, fill: COL.dim, weight: 500, o: 1 });
  sb.bars.forEach(b => { if (top.includes(b._i)) tw(b, { o: .12 }, tLeft + .4, .6); });
  const rest = sb.idx.filter(i => !top.includes(i));
  tw(sb.avg, { y: 600 - sb.avgOf(rest) }, tLeft + 1.4, 1);
  say(A, 'average drops', 1240, 700, tLeft + 2, { size: 30, fill: WC.cold });
  const th = thermometer(A, { x: 860, y: 820, h: 400, min: 20, max: 35, side: 1, size: 28 });
  clockRun(t => th.set(30 - .6 * io(ramp(t, tLeft + 1.4, tLeft + 3))), D);
  say(A, 'the water cools', 1240, 745, tLeft + 3, { size: 30, fill: WC.cold });
  // vap: about 580 cal for each gram
  say(A, 'heat of vaporization:', 1000, 120, tVap + 3, { size: 30, anchor: 'start' });
  say(A, `about ${HVAP} cal to turn 1 g into vapor`, 1000, 162, tVap + 3.6, { size: 28, fill: WC.heat, anchor: 'start' });
  heatArrow(A, [760, 340], [620, 200]).in(tVap + .5, .8);
  say(A, `${HVAP} cal / g`, 780, 330, tVap + .9, { size: 28, fill: WC.heat, anchor: 'start' });
  // sweat: 1 g of sweat takes 580 cal from 100 g of water in the body
  hide(A, tSweat - .2, .5);
  const B = G(p, { o: 0 }); show(B, tSweat + .1, .6);
  // the sweat picture is not drawn until it is needed, and the beaker picture stops once it has faded (Firefox paint)
  B.style.display = 'none'; prog(() => { B.style.display = ''; }, tSweat + .1, .01, lin); prog(q => { A.style.display = q >= 1 ? 'none' : ''; }, tSweat + .4, .01, lin);
  mk('rect', { x: 0, y: 600, width: 1600, height: 300, fill: '#14375c' }, B);
  mk('rect', { x: 0, y: 560, width: 1600, height: 44, fill: '#c98f66' }, B);
  wLabel(B, 'skin', { x: 60, y: 592, size: 24, fill: '#3b1f10', anchor: 'start', o: 1 });
  const bw = moleculeCrowd(B, { x: 640, y: 790, w: 980, h: 150, n: 14, s: .42, temp: 37, seed: 14 });
  clockRun(t => bw.set(t), D);
  wLabel(B, `${SWEAT_M} g of water in the body`, { x: 140, y: 650, size: 26, fill: COL.dim, anchor: 'start', weight: 500, o: 1 });
  const drop = G(B, { x: 800, y: 560 });
  path(drop, 'M0 -110C26 -78 58 -46 58 -16A58 58 0 0 1 -58 -16C-58 -46 -26 -78 0 -110Z', { fill: WC.waterHi, stroke: '#7fb6e6', 'stroke-width': 3 });
  wLabel(B, '1 g of sweat', { x: 900, y: 500, size: 28, anchor: 'start', o: 1 });
  const vap = G(B, { o: 0 }); show(vap, tSweat + 1);
  [[760, 340, 20], [850, 280, -40], [720, 230, 60]].forEach(([x, y, r]) => waterMolecule(vap, { x, y, s: .45, r }));
  heatArrow(B, [700, 800], [760, 590], { label: `${HVAP} cal`, size: 28, side: -1 }).in(tSweat + .8, .9);
  const thB = thermometer(B, { x: 1420, y: 870, h: 230, min: 25, max: 40, side: -1, size: 28 });
  clockRun(t => thB.set(37 - SWEAT_DT * io(ramp(t, tSweat + 2, tSweat + 4))), D);
  say(B, `${HVAP} ÷ (${SWEAT_M} × 1) = ${SWEAT_DT} °C cooler`, 800, 100, tSweat + 2.2, { size: 36, fill: WC.cold });
  // pond: ponds and leaves too
  const pd = G(B, { o: 0 }); show(pd, m('pond') + .5);
  path(pd, 'M1180 330Q1300 290 1460 330Q1500 360 1440 380Q1300 404 1180 380Q1140 356 1180 330Z', { fill: WC.water });
  path(pd, 'M1250 300Q1300 230 1380 250Q1350 320 1250 300Z', { fill: WC.leaf });
  path(pd, 'M1240 270q-14 -30 0 -60M1320 220q-14 -30 0 -60M1420 290q-14 -30 0 -60', { stroke: '#bfefff', 'stroke-width': 4 });
  wLabel(pd, 'ponds and leaves cool the same way', { x: 1320, y: 450, size: 26, fill: COL.dim, weight: 500, o: 1 });
}],

['wrap', 'Summary', (m, D) => {
  const p = panel(0);
  const rows = [
    ['Hydrogen bonds give water cohesion:', 'it climbs trees and has surface tension.', g => { const c = cluster3(g, 175, 4, .42); }],
    ['Temperature is average kinetic energy;', 'heat is thermal energy in transfer.', g => thermometer(g, { x: 180, y: 40, h: 110, w: 16, min: 0, max: 50, size: 0 }).set(32)],
    ['Water’s high specific heat, from bonds', 'breaking and forming, steadies temperature.', g => { mk('rect', { x: 160, y: -60, width: 44, height: 110, rx: 6, fill: WC.bond }, g); mk('rect', { x: 160, y: 22, width: 44, height: 28, rx: 6, fill: WC.heat }, g); }],
    ['Evaporation cools,', 'because the fastest molecules leave.', g => { const q = waterMolecule(g, { x: 180, y: 0, s: .55, r: 20 }); put(q.halo, { o: 1 }); wArrow(g, [230, -10], [272, -52], { color: WC.cold, w: 5, head: 13 }); }],
  ];
  const icons = [];
  rows.forEach(([a, b, icon], i) => {
    const g = G(p, { x: -16, y: 190 + i * 160, o: 0 });
    const ic = G(g); icon(ic); icons.push(ic);
    T(g, a, { x: 330, y: -6, size: 36, weight: 600 }); T(g, b, { x: 330, y: 40, size: 32, fill: COL.dim });
    tw(g, { o: 1, x: 0 }, i ? m('w' + (i + 1)) : .15, .6);   // row 1 comes in with "To sum up"
  });
  say(p, 'Now try the chapter practice.', 800, 850, m('end'), { size: 32, fill: WC.bond });
  clockRun(t => icons.forEach((ic, i) => put(ic, { y: 5 * Math.sin(1.6 * t + 1.3 * i), r: 3 * Math.sin(1.1 * t + i) })), D);   // the icons breathe while each line is read
}],

['final1', 'Chapter practice', (m, D) => {
  // A picture on the right for each practice question; the card's build shows the one it needs (pics.show(key)).
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  at('conv', g => {
    const d = G(g, { x: 1270, y: 330 }); path(d, 'M0 -100C30 -60 78 -20 78 26A78 78 0 0 1 -78 26C-78 -20 -30 -60 0 -100Z', { fill: WC.waterHi, stroke: '#7fb6e6', 'stroke-width': 3 }); waterMolecule(d, { y: 20, s: .7 });
    heatArrow(g, [1000, 320], [1170, 320], { label: '50 cal', size: 34, o: 1 });
    wLabel(g, '1 cal = 4.184 J', { x: 1270, y: 560, size: 46, weight: 700, o: 1 });
    wLabel(g, '1 kcal = 1 000 cal', { x: 1270, y: 640, size: 46, weight: 700, o: 1 });
  });
  at('heat', g => {
    beaker(g, { x: 1240, y: 640, w: 380, h: 320 }); moleculeCrowd(g, { x: 1240, y: 500, w: 320, h: 220, n: 10, s: .42, temp: 30, seed: 21 });
    wLabel(g, '250 g of water', { x: 1240, y: 700, size: 34, o: 1 });
    thermometer(g, { x: 1500, y: 620, h: 380, min: 0, max: 50, side: -1, size: 34 }).set(40);
    wLabel(g, '20 °C → 40 °C', { x: 1500, y: 160, size: 30, fill: WC.heat, anchor: 'end', o: 1 });
    heatArrow(g, [1010, 140], [1130, 320], { label: '? cal', size: 34, o: 1 });
  });
  at('sweat', g => {
    mk('rect', { x: 960, y: 620, width: 640, height: 50, fill: '#c98f66' }, g); mk('rect', { x: 960, y: 670, width: 640, height: 230, fill: '#14375c' }, g);
    const d = G(g, { x: 1180, y: 620 }); path(d, 'M0 -110C26 -78 58 -46 58 -16A58 58 0 0 1 -58 -16C-58 -46 -26 -78 0 -110Z', { fill: WC.waterHi, stroke: '#7fb6e6', 'stroke-width': 3 });
    const q = waterMolecule(g, { x: 1330, y: 330, s: .8, r: 30 }); put(q.halo, { o: 1 });
    wArrow(g, [1250, 470], [1300, 390], { color: WC.cold, w: 6 });
    wLabel(g, 'sweat on skin', { x: 1180, y: 720, size: 32, o: 1 });
  });
  at('terms', g => {
    mk('rect', { x: 960, y: 430, width: 380, height: 170, rx: 40, fill: '#3a3350', stroke: WC.glass, 'stroke-width': 5 }, g);
    path(g, 'M1400 470V600H1530V470', { stroke: WC.glass, 'stroke-width': 5 }); mk('rect', { x: 1404, y: 500, width: 122, height: 96, fill: '#5a3138' }, g);
    wLabel(g, 'bathtub, 40 °C', { x: 1150, y: 650, size: 30, o: 1 }); wLabel(g, 'cup, 100 °C', { x: 1465, y: 650, size: 30, o: 1 });
    heatArrow(g, [1390, 530], [1350, 530], { o: 1, waves: 1, amp: 6 });
    cluster3(g, 1240, 260, .6);
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('conv');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-conv', prompt: ['Convert. 1 cal = 4.184 J and 1 kcal = 1 000 cal.'],
    build: withPic('conv', blanks([
      { parts: ['50 cal = ', { box: String(Math.round(50 * J_PER_CAL * 10) / 10) }, ' joules'], why: '50 × 4.184 = 209.2 J.', hint: 'Multiply calories by 4.184 to get joules.' },
      { parts: ['2 kcal = ', { box: '2000' }, ' calories'], why: '2 × 1 000 = 2 000 cal.', hint: 'A kilocalorie is a thousand calories.' },
    ])) },
  { id: 'p-heat', prompt: ['How much heat warms 250 g of water by 20 °C? (water: 1 cal/(g·°C))'],
    build: withPic('heat', blanks([
      { parts: ['heat = ', { box: String(250 * 20 * C_WATER) }, ' calories'], why: '250 g × 20 °C × 1 cal/(g·°C) = 5 000 cal.', hint: 'Heat = mass × temperature change × specific heat.' },
      { parts: ['= ', { box: String(250 * 20 / 1000) }, ' kilocalories'], why: '5 000 ÷ 1 000 = 5 kcal.', hint: 'Divide calories by 1 000.' },
      { parts: ['= ', { box: String(Math.round(250 * 20 * J_PER_CAL)) }, ' joules'], why: '5 000 × 4.184 = 20 920 J.', hint: 'Multiply calories by 4.184.' },
    ])) },
  { id: 'p-sweat', prompt: ['Why does evaporating sweat cool the skin?'],
    build: withPic('sweat', choice([
      ['The fastest molecules leave, so the average kinetic energy of those left behind is lower.'],
      ['Cold molecules from the air enter the sweat.'],
      ['Breaking hydrogen bonds makes heat that flows away.'],
      ['Sweat is already colder than the skin.'],
    ], 0, 'Right. The escaping molecules carry away more than their share of kinetic energy, so the water left behind is cooler.',
    [null, 'Nothing cold flows in: the cooling comes from energy leaving with the fastest molecules.',
     'Breaking bonds takes in energy rather than making heat; that is why it costs the water about 580 cal per gram.',
     'Sweat starts at skin temperature; it cools as its fastest molecules escape.'])) },
  { id: 'p-terms', prompt: ['True or false?'],
    build: withPic('terms', grid([
      { parts: ['Temperature is the average kinetic energy of the molecules.'], ans: ['t'], why: 'True: it is the average, not the total.' },
      { parts: ['A cup of boiling water has more thermal energy than a bathtub of warm water.'], ans: ['f'], why: 'False: the bathtub has far more molecules, so far more thermal energy in total.' },
      { parts: ['Heat is thermal energy moving from a warmer body to a cooler one.'], ans: ['t'], why: 'True.' },
      { parts: ['Water’s high specific heat comes partly from hydrogen bonds breaking as heat flows in.'], ans: ['t'], why: 'True: heat spent breaking bonds does not speed the molecules up.' },
      { parts: ['Adhesion is water molecules sticking to each other.'], ans: ['f'], why: 'False: that is cohesion. Adhesion is water sticking to other materials, like a cell wall.' },
    ], TF, { multi: false, text: true })) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
