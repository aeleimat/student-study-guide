'use strict';
// Biology, Chapter 8 (An Introduction to Metabolism), lesson 2: a campfire burns down, the camera pushes into a cell and
// the shared pathway strip with its energy drop lit; systems (isolated, open; organisms are open); the first law with a
// piece of fruit and a fixed total; the second law (work plus unusable heat, entropy, dots that scatter); spontaneous
// processes (water, sugar, rust; fast or slow; entropy of the universe); biological order paid for with disorder, light
// in and heat out; a worked glucose example; a four-row summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-08/lesson-02.md.
const CHAPTER = { number: 802, label: '8, lesson 2', title: 'The Laws of Thermodynamics', minutes: 7, language: 'en', lead: false, next: '../lesson-03/' };

/* ---------- colours of this lesson ---------- */
const EC = { chem: '#f3c95c', chemEdge: '#a8862c', work: '#8fd6b0', workEdge: '#4f9a78', heat: MC.exo, heatEdge: '#a85f12', light: MC.glow };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const rk = k => Math.round(mClamp(k) * 2000) / 2000;
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
// A label (centred text) with a leader to the thing it names; returns the group (it fades in at t0; null: shown at once).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 600, sub, subFill = COL.dim } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size);
  wLabel(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  if (sub) wLabel(g, sub, { x: tx, y: ty + size * 1.05, size: size * .8, fill: subFill, weight: 500, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + (sub ? size * 1.05 + size * .3 : size * .3); }
  else { sx = tx; sy = ty - size * 1.05; }
  if (ax !== null) { path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 }); mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g); }
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0 (null: shown at once).
function banner(p, a, b, x, y, t0, { color = COL.chalk, size = 40 } = {}) {
  const g = G(p, { o: 0 });
  wLabel(g, a, { x, y, size, weight: 700, fill: color, o: 1 });
  if (b) wLabel(g, b, { x, y: y + size * .95, size: size * .62, fill: COL.dim, weight: 500, o: 1 });
  if (t0 !== null) show(g, t0, .5); else put(g, { o: 1 });
  return g;
}
// A dark rounded box behind a scene.
const box = (g, x, y, w, hh, o = {}) => mk('rect', { x, y, width: w, height: hh, rx: 22, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3, ...o }, g);
// A pill with one line of text, centred at x, y.
function pill(p, str, x, y, t0, { color = COL.chalk, size = 30, stroke = COL.chalk, w } = {}) {
  const g = G(p, { o: 0 }), ww = w || uiW(str, size) + 60;
  mk('rect', { x: x - ww / 2, y: y - size * 1.05, width: ww, height: size * 1.9, rx: size * .95, fill: '#0b1626', stroke, 'stroke-opacity': .7, 'stroke-width': 2.5 }, g);
  wLabel(g, str, { x, y: y + size * .2, size, weight: 700, fill: color, o: 1 });
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A red cross centred at x, y.
function cross(p, x, y, r = 30, o = 0) {
  const g = G(p, { x, y, o });
  path(g, `M${-r} ${-r}L${r} ${r}M${r} ${-r}L${-r} ${r}`, { stroke: MC.stop, 'stroke-width': 9 });
  return g;
}
// An energy bar: a rounded block from its left edge (origin at the left middle); the name inside or under it.
function ebar(p, w, color, edge, name, { x = 0, y = 0, hh = 58, o = 1, under = false, size = 26 } = {}) {
  const g = G(p, { x, y, o });
  mk('rect', { x: 0, y: -hh / 2, width: w, height: hh, rx: 14, fill: color, stroke: edge, 'stroke-width': 3 }, g);
  if (name) wLabel(g, name, under ? { x: w / 2, y: hh / 2 + 34, size, fill: color, weight: 700, o: 1 } : { x: w / 2, y: size * .36, size, fill: '#14233a', weight: 800, o: 1 });
  return Object.assign(g, { w });
}
// A dashed outline the length of a bar (the original total), origin at its left middle.
function ghostBar(p, w, { x = 0, y = 0, hh = 70, o = 0, color = COL.chalk } = {}) {
  const g = G(p, { x, y, o });
  mk('rect', { x: -6, y: -hh / 2, width: w + 12, height: hh, rx: 18, fill: 'none', stroke: color, 'stroke-width': 3, 'stroke-dasharray': '12 9' }, g);
  return g;
}
// A plain cell: wobbly outline, cytoplasm fill; origin at its centre.
function cellBody(p, { x = 0, y = 0, rx = 200, ry = 150, o = 1, seed = 4, s = 1 } = {}) {
  const g = G(p, { x, y, o, s });
  path(g, cBlob(rx, ry, { seed }), { fill: CC.cyto, stroke: CC.membrane, 'stroke-width': 7 });
  return g;
}
// A piece of fruit (a green-gold apple) holding chemical energy; origin at its centre. .glow is a ring group behind it.
function fruit(p, { x = 0, y = 0, r = 100, o = 1, s = 1 } = {}) {
  const g = G(p, { x, y, o, s });
  const glow = G(g, { o: 0 });
  [1.75, 1.5, 1.28].forEach((k, i) => mk('circle', { r: r * k, fill: EC.chem, 'fill-opacity': .08 + .05 * i }, glow));
  path(g, `M0 ${-r * .78}C${r * .55} ${-r * 1.08} ${r * 1.1} ${-r * .6} ${r * .98} ${r * .05}C${r * .9} ${r * .7} ${r * .45} ${r * 1.02} 0 ${r * .86}C${-r * .45} ${r * 1.02} ${-r * .9} ${r * .7} ${-r * .98} ${r * .05}C${-r * 1.1} ${-r * .6} ${-r * .55} ${-r * 1.08} 0 ${-r * .78}Z`, { fill: '#c4d65a', stroke: '#7d8f2c', 'stroke-width': 4 });
  mk('ellipse', { cx: -r * .45, cy: -r * .35, rx: r * .2, ry: r * .12, fill: '#fff', 'fill-opacity': .35, transform: 'rotate(-35)' }, g);
  path(g, `M0 ${-r * .78}Q${r * .05} ${-r * 1.05} ${r * .14} ${-r * 1.2}`, { stroke: '#6b4a2e', 'stroke-width': 6 });
  path(g, `M${r * .1} ${-r * 1.0}Q${r * .45} ${-r * 1.28} ${r * .7} ${-r * 1.02}Q${r * .4} ${-r * .86} ${r * .1} ${-r * 1.0}Z`, { fill: '#5bbf5b', stroke: '#3a8a3a', 'stroke-width': 2 });
  return Object.assign(g, { glow });
}
// A sealed, insulated flask (a vacuum flask): double wall, stopper; jiggling dots inside. .jig(t)
function flask(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  mk('rect', { x: -95, y: -150, width: 190, height: 300, rx: 46, fill: '#2a3d55', stroke: '#a9c2df', 'stroke-width': 7 }, g);
  mk('rect', { x: -75, y: -128, width: 150, height: 256, rx: 34, fill: '#13263a', stroke: '#a9c2df', 'stroke-width': 3, 'stroke-dasharray': '8 7' }, g);
  mk('rect', { x: -46, y: -186, width: 92, height: 44, rx: 10, fill: '#7a5a3e', stroke: '#4a3524', 'stroke-width': 3 }, g);
  const dl = [0, 1, 2, 3, 4, 5, 6, 7].map(i => mk('circle', { r: 9, fill: MC.order }, g));
  dl.forEach(d => put(d, {}));
  const f = Object.assign(g, {
    jig(t) {
      t = Math.round(t * 30) / 30;
      dl.forEach((d, i) => cSet(d, { x: -40 + 80 * wHash(i, 3) + 14 * zWob(i, t * 2, 1), y: -95 + 190 * wHash(i, 8) + 14 * zWob(i, t * 2, 5) }));
      return f;
    },
  });
  return f.jig(0);
}
// A small plant (stem and leaves), origin at its foot.
function plant(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M0 0C-6 -60 6 -120 0 -180', { stroke: '#3a8a3a', 'stroke-width': 8 });
  [[-1, -70], [1, -110], [-1, -150]].forEach(([sd, yy]) => path(g, `M0 ${yy}Q${sd * 40} ${yy - 40} ${sd * 90} ${yy - 20}Q${sd * 50} ${yy + 10} 0 ${yy}Z`, { fill: '#5bbf5b', stroke: '#3a8a3a', 'stroke-width': 3 }));
  mk('rect', { x: -60, y: 0, width: 120, height: 14, rx: 7, fill: '#5d4630' }, g);
  return g;
}
// A sun disc with short rays, origin at its centre.
function sun(p, { x = 0, y = 0, r = 56, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  let rays = ''; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; rays += `M${cF(Math.cos(a) * r * 1.25)} ${cF(Math.sin(a) * r * 1.25)}L${cF(Math.cos(a) * r * 1.6)} ${cF(Math.sin(a) * r * 1.6)}`; }
  path(g, rays, { stroke: CC.light, 'stroke-width': 6 });
  mk('circle', { r, fill: CC.light, stroke: '#c9a23a', 'stroke-width': 3 }, g);
  return g;
}
// A straight light arrow (yellow-green), with its label.
function lightArrow(p, a, b, { label = '', o = 1, size = 28, dy = -18 } = {}) {
  const g = G(p, { o });
  mArrow(g, a, b, { color: EC.light, w: 8, head: 24 });
  if (label) wLabel(g, label, { x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2 + dy, size, weight: 700, fill: EC.light, o: 1 });
  return g;
}
// A clock face whose hands turn with .set(t), origin at its centre.
function clockFace(p, { x = 0, y = 0, r = 46, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { r, fill: '#0b1626', stroke: COL.chalk, 'stroke-width': 4 }, g);
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; path(g, `M${cF(Math.cos(a) * r * .78)} ${cF(Math.sin(a) * r * .78)}L${cF(Math.cos(a) * r * .9)} ${cF(Math.sin(a) * r * .9)}`, { stroke: COL.dim, 'stroke-width': 3 }); }
  const hh = path(g, '', { stroke: COL.chalk, 'stroke-width': 6 }), mm = path(g, '', { stroke: COL.chalk, 'stroke-width': 4 });
  const c = Object.assign(g, {
    set(t) {
      t = Math.round(t * 30) / 30;
      const am = t * 3, ah = t * .25;
      mD(mm, `M0 0L${cF(Math.sin(am) * r * .72)} ${cF(-Math.cos(am) * r * .72)}`);
      mD(hh, `M0 0L${cF(Math.sin(ah) * r * .48)} ${cF(-Math.cos(ah) * r * .48)}`);
      return c;
    },
  });
  return c.set(0);
}
// A padlock icon, origin at its body's centre.
function lock(p, { x = 0, y = 0, s = 1, o = 1, color = EC.heat } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M-16 -10V-24A16 16 0 0 1 16 -24V-10', { stroke: color, 'stroke-width': 7 });
  mk('rect', { x: -24, y: -12, width: 48, height: 38, rx: 7, fill: color, stroke: '#14233a', 'stroke-width': 2 }, g);
  mk('circle', { cy: 5, r: 5, fill: '#14233a' }, g);
  return g;
}
// A gauge: the total energy of the universe, its needle fixed. Origin at the dial's centre.
function totalGauge(p, { x = 0, y = 0, o = 1, s = 1 } = {}) {
  const g = G(p, { x, y, o, s });
  box(g, -150, -150, 300, 250);
  path(g, 'M-100 40A100 100 0 0 1 100 40', { stroke: COL.dim, 'stroke-width': 10 });
  for (let i = 0; i <= 6; i++) { const a = Math.PI + i * Math.PI / 6, c = Math.cos(a), sn = Math.sin(a); path(g, `M${cF(c * 84)} ${cF(40 + sn * 84)}L${cF(c * 100)} ${cF(40 + sn * 100)}`, { stroke: COL.dim, 'stroke-width': 3 }); }
  const needle = G(g, { y: 40 });
  path(needle, 'M0 0L0 -86', { stroke: EC.chem, 'stroke-width': 7 });
  mk('circle', { cy: 0, r: 11, fill: EC.chem }, needle);
  put(needle, { r: 20 });
  wLabel(g, 'total energy', { y: -112, size: 26, weight: 700, o: 1 });
  wLabel(g, 'of the universe', { y: 82, size: 22, weight: 600, fill: COL.dim, o: 1 });
  return Object.assign(g, { needle });
}
// Points scattered in a box, deterministic, apart from one another.
function scatter(n, [x0, y0, x1, y1], seed, minD = 40, avoid = []) {
  const pts = [];
  for (let i = 0; pts.length < n && i < n * 80; i++) {
    const x = x0 + (x1 - x0) * wHash(i, seed), y = y0 + (y1 - y0) * wHash(i, seed + 31);
    if (avoid.some(([a, b, c, d]) => x > a && x < c && y > b && y < d)) continue;
    if (pts.some(q => Math.hypot(q[0] - x, q[1] - y) < minD)) continue;
    pts.push([x, y]);
  }
  return pts;
}

/* ---------- the three spontaneous scenes (each drawn round its centre, about 380 × 260) ---------- */
// Water running down a slope into a pool; .set(t) runs the drops.
function waterScene(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  const P = [[-170, -80], [-80, -80], [10, -10], [80, 60], [170, 70]];
  path(g, `M-180 110V-80L-80 -80C-30 -80 0 -20 30 20C55 50 90 70 180 70V110Z`, { fill: '#24463a', stroke: '#5f8f6a', 'stroke-width': 4 });
  mk('ellipse', { cx: 135, cy: 66, rx: 52, ry: 12, fill: '#3a6ea5', stroke: '#a9c6ea', 'stroke-width': 2 }, g);
  path(g, 'M-170 -84L-80 -84C-30 -84 0 -24 30 16C55 46 90 62 120 64', { stroke: '#3a6ea5', 'stroke-width': 9, 'stroke-opacity': .8 });
  const drops = [0, 1, 2, 3, 4, 5].map(() => mk('circle', { r: 7, fill: '#a9c6ea' }, g));
  drops.forEach(d => put(d, {}));
  const e = Object.assign(g, {
    set(t) {
      t = Math.round(t * 30) / 30;
      drops.forEach((d, i) => { const u = cFrac(t * .35 + i / 6), q = cAlong(P, u); cSet(d, { x: q[0], y: q[1] - 6, o: Math.sin(Math.PI * u) }); });
      return e;
    },
  });
  return e.set(0);
}
// A cup of tea with a sugar cube that dissolves; .set(k) 0 a whole cube, 1 dissolved (gold specks spread).
function sugarScene(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M-120 -60L-96 100Q-94 112 -80 112H80Q94 112 96 100L120 -60Z', { fill: '#e8e2d4', stroke: '#9d957a', 'stroke-width': 4 });
  path(g, 'M118 -20Q170 -10 160 40Q150 80 104 70', { stroke: '#e8e2d4', 'stroke-width': 12 });
  path(g, 'M-110 -40L-92 92H92L110 -40Z', { fill: '#a8672e' });
  const cube = G(g, { y: -20 });
  mk('rect', { x: -30, y: -30, width: 60, height: 60, rx: 6, fill: '#ffffff', stroke: '#b9b2a0', 'stroke-width': 3 }, cube);
  const pts = scatter(16, [-84, -26, 84, 82], 7, 16);
  const specks = pts.map(() => mk('circle', { r: 5, fill: '#fff1c2' }, g));
  specks.forEach(d => put(d, {}));
  const e = Object.assign(g, {
    set(k) {
      k = rk(k);
      cSet(cube, { s: Math.max(.001, 1 - k), o: 1 - mRamp(k, .85, 1) });
      specks.forEach((d, i) => cSet(d, { x: pts[i][0] * mRamp(k, .05, .8), y: -20 + (pts[i][1] + 20) * mRamp(k, .05, .8), o: mRamp(k, .02, .2) }));
      return e;
    },
  });
  return e.set(0);
}
// An iron nail that rusts; .set(k) 0 bright, 1 rusted patches.
function nailScene(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o, r: -12 });
  path(g, 'M-150 -12H120L170 0L120 12H-150Z', { fill: '#9aa4ae', stroke: '#5d666f', 'stroke-width': 3 });
  mk('rect', { x: -168, y: -34, width: 20, height: 68, rx: 4, fill: '#9aa4ae', stroke: '#5d666f', 'stroke-width': 3 }, g);
  const rust = [[-110, 0, 16], [-60, -3, 12], [-20, 4, 15], [30, -2, 13], [70, 3, 11], [105, 0, 9], [-158, -18, 8], [-158, 16, 9]].map(([cx, cy, r], i) =>
    mk('ellipse', { cx, cy, rx: r * 1.5, ry: Math.min(r, 11), fill: i % 2 ? '#b5562a' : '#8f3f1c' }, g));
  rust.forEach(d => put(d, { o: 0 }));
  const e = Object.assign(g, { set(k) { k = rk(k); rust.forEach((d, i) => mO(d, mRamp(k, i * .09, i * .09 + .3) * .95)); return e; } });
  return e.set(0);
}

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

// Typed words in sentences (the engine's blanks take numbers only). rows: [{ parts: [text, { box: 'word', accept: [...] }], why, hint }].
// Case and spacing are ignored. Same keys as blanks: Tab moves between boxes, Enter checks, Esc leaves a box.
function wordBlanks(rowsIn) {
  return (body, api) => {
    const all = [], norm = v => String(v).trim().toLowerCase().replace(/\s+/g, ' ');
    const rows = rowsIn.map(it => {
      const line = h('div', 'bline'), mark = h('span', 'mark'), why = h('div', 'why'), boxes = [];
      for (const p of it.parts) {
        if (p && p.box !== undefined) {
          const b = h('input', 'box');
          Object.assign(b, { type: 'text', autocomplete: 'off', spellcheck: false });
          b.setAttribute('aria-label', translate('answerBox'));
          b.dataset.ans = p.box; b.ok = [p.box, ...(p.accept || [])].map(norm);
          b.style.width = `${Math.max(...b.ok.map(x => x.length)) + 2}ch`;
          line.append(b); boxes.push(b); all.push(b);
        } else line.append(h('span', 'btxt', [p]));
      }
      line.append(mark);
      body.append(h('div', 'brow', [line, why]));
      return { it, boxes, mark, why };
    });
    body.classList.add('blanks');
    const judge = r => {
      let ok = true;
      r.boxes.forEach(b => { const good = b.ok.includes(norm(b.value)); b.classList.toggle('good', good); b.classList.toggle('bad', !good); ok = ok && good; });
      r.mark.className = 'mark ' + (ok ? 'good' : 'bad'); r.mark.textContent = ok ? '✓' : '✗';
      r.why.replaceChildren(ok ? '' : rich(r.it.hint ?? r.it.why, 20));
      return ok;
    };
    requestAnimationFrame(() => { if (P.started) all[0]?.focus({ preventScroll: true }); });
    return {
      check() { const right = rows.filter(judge).length, done = right === rows.length; api.grade(done, done ? [] : [translate('rowsRight', { r: right, n: rows.length })], { right, total: rows.length }); },
      reveal() { rows.forEach(r => { r.boxes.forEach(b => { b.value = b.dataset.ans; }); judge(r); r.why.replaceChildren(rich(r.it.why, 20)); }); return 'the words are shown'; },
      lock() { all.forEach(b => { b.disabled = true; }); },
      hint: ['type a word', kbd('Tab'), translate('hintNextBox'), kbd('Enter'), translate('hintCheck'), kbd('Esc'), translate('hintLeaveBox')],
    };
  };
}

boot();
</script>
</body>
</html>
