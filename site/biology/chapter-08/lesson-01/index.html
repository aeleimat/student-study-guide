<script>
'use strict';
// Biology, Chapter 8 (An Introduction to Metabolism), lesson 1: a firefly at night, pushed into one cell of its tail, the
// cell as a chemical factory; metabolism as all the reactions, an emergent property; the metabolic pathway strip
// (A → B → C → D, one specific enzyme per step), which every later lesson of the chapter opens on; catabolic and
// anabolic pathways, bioenergetics; energy and its forms (kinetic, heat, potential, chemical); a worked example, a ball
// on a ledge and the firefly's own chain; summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-08/lesson-01.md.
const CHAPTER = { number: 801, label: '8, lesson 1', title: 'Metabolism, Pathways and Forms of Energy', minutes: 7, language: 'en', lead: false, next: '../lesson-02/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
// The start of the narrated sentence holding str, in beat id (from the voice's own cues).
const cue = (id, str, off = 0) => { const c = TIMINGS[id].cues.find(q => q[1].includes(str)); if (!c) throw new Error(`${id}: no cue "${str}"`); return c[0] + off; };
// A label (centred text) with a leader to the thing it names; returns the group (it fades in at t0).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 600, sub, subFill = COL.dim } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size);
  wLabel(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  if (sub) wLabel(g, sub, { x: tx, y: ty + size * 1.05, size: size * .8, fill: subFill, weight: 500, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + (sub ? size * 1.05 + size * .3 : size * .3); }
  else { sx = tx; sy = ty - size * 1.05; }
  path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 }); mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g);
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0 (null: shown at once).
function banner(p, a, b, x, y, t0, { color = COL.chalk, size = 40 } = {}) {
  const g = G(p, { o: 0 });
  wLabel(g, a, { x, y, size, weight: 700, fill: color, o: 1 });
  if (b) wLabel(g, b, { x, y: y + size * .95, size: size * .62, fill: COL.dim, weight: 500, o: 1 });
  if (t0 !== null) show(g, t0, .5); else put(g, { o: 1 });
  return g;
}
// A dark pill with one line of text, centred on x.
function pill(p, str, x, y, t0, { size = 30, color = COL.chalk, edge = COL.chalk } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size) + 70;
  mk('rect', { x: x - w / 2, y: y - size * 1.05, width: w, height: size * 1.9, rx: size * .95, fill: '#0b1626', stroke: edge, 'stroke-opacity': .6, 'stroke-width': 2.5 }, g);
  wLabel(g, str, { x, y: y + size * .02, size, weight: 700, fill: color, o: 1 });
  if (t0 !== null) show(g, t0, .5); else put(g, { o: 1 });
  return g;
}
const panelCard = (g, x, y, w, h) => mk('rect', { x, y, width: w, height: h, rx: 22, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, g);

// pathwayStrip's flow dots on the middle arrow pass x = 0 on the strip's centre line, where the engine drops their
// transform attribute and later adds it back after the opacity: a seek and a step-through then write the markup in a
// different order (the replay check compares it). A scale of .999, which the kit never writes, keeps the transform.
function primeDots(sp) { sp.arrows.forEach(a => a.querySelectorAll('circle').forEach(c => put(c, { s: .999 }))); return sp; }

/* ---------- local pieces ---------- */
// A cell drawn flat: membrane, cytoplasm, a nucleus on the left, small molecules with reaction arrows between pairs.
// .arrs (one group each), .mols (their group), .halo (a soft glow round the whole cell, o 0).
function cellArt(p, { x = 800, y = 480, rx = 600, ry = 300, n = 22, seed = 4, o = 1, minD = 78, nuc = true, r = 14 } = {}) {
  const g = G(p, { x, y, o });
  const halo = G(g, { o: 0 });
  [70, 44, 22].forEach((d, i) => mk('ellipse', { rx: rx + d, ry: ry + d, fill: 'none', stroke: MC.glow, 'stroke-width': 26, 'stroke-opacity': [.12, .2, .32][i] }, halo));
  mk('ellipse', { rx, ry, fill: MC.cyto, stroke: CC.membrane, 'stroke-width': 12 }, g);
  const NX = -rx * .62, NR = Math.min(ry * .42, 130);
  if (nuc) mk('circle', { cx: NX, cy: 0, r: NR, fill: CC.nucleo, stroke: CC.env, 'stroke-width': 6 }, g);
  const pts = [];
  for (let i = 0; pts.length < n && i < n * 120; i++) {
    const px = (wHash(i, seed) - .5) * 2 * rx * .86, py = (wHash(i, seed + 17) - .5) * 2 * ry * .8;
    if ((px / (rx * .86)) ** 2 + (py / (ry * .8)) ** 2 > 1) continue;
    if (nuc && Math.hypot(px - NX, py) < NR + 40) continue;
    if (pts.some(q => Math.hypot(q[0] - px, q[1] - py) < minD)) continue;
    pts.push([px, py]);
  }
  const arrL = G(g), mols = G(g), KINDS = ['sugar', 'dye1', 'dye2', 'sugar', 'dye2', 'dye1'];
  pts.forEach(([px, py], i) => solute(mols, KINDS[i % KINDS.length], { x: px, y: py, r, label: false }));
  // each molecule points at its nearest neighbour not yet used as a target
  const arrs = [], used = new Set();
  pts.forEach((a, i) => {
    let best = -1, bd = 1e9;
    pts.forEach((b, j) => { if (j === i || used.has(j)) return; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (d < bd) { bd = d; best = j; } });
    if (best < 0 || bd > minD * 2.2) return;
    used.add(best);
    const b = pts[best], L = bd, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    const ag = G(arrL, { o: 1 });
    mArrow(ag, [cF(a[0] + ux * (r + 8)), cF(a[1] + uy * (r + 8))].map(Number), [cF(b[0] - ux * (r + 8)), cF(b[1] - uy * (r + 8))].map(Number), { color: COL.chalk, w: 4, head: 12 });
    arrs.push(ag);
  });
  return Object.assign(g, { arrs, mols, halo, pts });
}
// A gear around its origin; .spin(deg).
function gear(p, { x = 0, y = 0, R = 60, teeth = 10, color = '#c9b27a', edge = '#8f7a48' } = {}) {
  const g = G(p, { x, y }), rot = G(g);
  let d = '';
  for (let i = 0; i < teeth * 4; i++) {
    const a = i / (teeth * 4) * 2 * Math.PI, r = (i % 4 < 2) ? R : R * .78;
    d += (i ? 'L' : 'M') + cF(r * Math.cos(a)) + ' ' + cF(r * Math.sin(a));
  }
  path(rot, d + 'Z', { fill: color, stroke: edge, 'stroke-width': 3 });
  mk('circle', { r: R * .28, fill: MC.cyto, stroke: edge, 'stroke-width': 3 }, rot);
  return Object.assign(g, { spin(deg) { cSet(rot, { r: deg }); return g; } });
}
// A short row of amino acids that joins into a chain: .join(k) (0 apart, 1 bonded).
function aminoRow(p, { x = 0, y = 0, n = 5, R = 28, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o }), sp = 2 * R + 16;
  const FROM = [[-170, -60], [-90, 50], [0, -70], [90, 60], [175, -40]];
  const bonds = [], beads = [];
  for (let i = 1; i < n; i++) bonds.push(path(g, `M${(i - 1 - (n - 1) / 2) * sp + R - 4} 0H${(i - (n - 1) / 2) * sp - R + 4}`, { stroke: WC.stick, 'stroke-width': 9 }, { o: 0 }));
  for (let i = 0; i < n; i++) beads.push(monomerBead(g, 'amino', { R }));
  return Object.assign(g, {
    beads,
    join(k) {
      k = rk(k);
      beads.forEach((b, i) => { const a = io(mRamp(k, i * .12, i * .12 + .5)), f = FROM[i % FROM.length]; mPose(b, mLerp(f[0] * 1.3, (i - (n - 1) / 2) * sp, a), mLerp(f[1], 0, a), 1); });
      bonds.forEach((bd, i) => mO(bd, mRamp(k, (i + 1) * .12 + .4, (i + 1) * .12 + .5)));
      return g;
    },
  }).join(0);
}
const rk = k => Math.round(mClamp(k) * 2000) / 2000;
// Glucose broken down: a gold hexagon that fades as small pieces fly out. .set(k) 0 whole, 1 broken.
function glucoseBreak(p, { x = 0, y = 0, s = 1, o = 1, R = 50 } = {}) {
  const g = G(p, { x, y, s, o });
  const burst = energyBurst(g, { r: R * 1.4, color: MC.exo }), F = R / 60;
  const glu = solute(g, 'sugar', { r: R, label: false });
  const gl = wLabel(glu, 'glucose', { y: 8, size: Math.round(R * .42), fill: '#24160a', weight: 800, o: 1 });
  const PIECES = [['CO2', -120, -70], ['water', 110, -90], ['CO2', 140, 40], ['water', -40, 120], ['CO2', -150, 60], ['water', 60, -140]];
  const pcs = PIECES.map(([kd]) => solute(g, kd, { r: Math.max(12, 18 * F), label: false }));
  return Object.assign(g, {
    burst, glu,
    set(k) {
      k = rk(k);
      const b = io(mRamp(k, .1, .7));
      mO(glu, 1 - mRamp(k, .05, .25));
      pcs.forEach((e, i) => mPose(e, PIECES[i][1] * F * b, PIECES[i][2] * F * b, mRamp(k, .05, .2)));
      burst.set(mRamp(k, .05, 1));
      return g;
    },
  }).set(0);
}
// A stone on a wall shelf, a drop line under it (potential energy from location).
function stoneShelf(p, { x = 0, y = 0, s = 1 } = {}) {
  const g = G(p, { x, y, s });
  path(g, 'M-110 -90H40M40 -90V-60L0 -90', { stroke: '#c9b27a', 'stroke-width': 10 });
  path(g, 'M-110 -150V60', { stroke: '#5a6f8a', 'stroke-width': 8 });
  path(g, 'M-48 -94Q-70 -96 -66 -122Q-58 -150 -28 -148Q4 -150 8 -122Q10 -96 -14 -94Z', { fill: '#9aa3ad', stroke: '#5e6670', 'stroke-width': 3 });
  path(g, 'M-28 -84V50', { stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '8 8' });
  path(g, 'M-150 60H130', { stroke: '#5a6f8a', 'stroke-width': 5 });
  return g;
}
// A rolling ball with speed streaks; .set(t) rolls it left to right, over and over.
function rollingBall(p, { x = 0, y = 0, s = 1, span = 220, r = 26 } = {}) {
  const g = G(p, { x, y, s });
  path(g, `M${-span / 2 - 40} ${r}H${span / 2 + 40}`, { stroke: '#5f8f6a', 'stroke-width': 5 });
  const streaks = G(g, { s: .999 });   // never an identity transform: see primeDots
  path(streaks, `M${-r - 14} -8H${-r - 54}M${-r - 10} 6H${-r - 70}M${-r - 18} 18H${-r - 44}`, { stroke: COL.dim, 'stroke-width': 4 });
  const ball = G(g);
  mk('circle', { r, fill: MC.exo, stroke: '#a85f12', 'stroke-width': 3 }, ball);
  path(ball, `M${-r + 3} 0H${r - 3}`, { stroke: '#a85f12', 'stroke-width': 5 });
  return Object.assign(g, {
    set(t) {
      const u = cFrac(Math.round(t * 60) / 60 * .28), bx = -span / 2 + span * u, fade = Math.sin(Math.PI * u);
      cSet(ball, { x: bx, r: (bx + span / 2) / r * 57.3, o: Math.min(1, fade * 3) });
      cSet(streaks, { x: bx, o: fade });
      return g;
    },
  }).set(0);
}
// The four energy-form pictures (kinetic, heat, potential, chemical) at a point, scaled; .set(t) animates them.
function formIcon(p, i, { x = 0, y = 0, s = 1 } = {}) {
  const g = G(p, { x, y, s });
  let a = null;
  if (i === 0) a = rollingBall(g, { y: 10 });
  if (i === 1) a = entropyDots(g, { w: 250, h: 200, n: 24, box: false, seed: 7 });
  if (i === 2) stoneShelf(g, { y: 20 });
  if (i === 3) { const glu = solute(g, 'sugar', { r: 62, label: false }); wLabel(glu, 'glucose', { y: 9, size: 26, fill: '#24160a', weight: 800, o: 1 }); a = energyBurst(g, { x: 62, y: -58, r: 30 }); }
  return Object.assign(g, {
    set(t) {
      if (i === 0) a.set(t);
      if (i === 1) a.set(1, t);
      if (i === 3) a.set(rk(.05 + .9 * cFrac(Math.round(t * 60) / 60 / 1.8)));
      return g;
    },
  }).set(0);
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'A firefly at night', (m, D) => {
  const p = panel(0), tN = m('night'), tG = m('glow'), tP = m('push'), tF = m('factory');
  const cam = camera(p, D, { x: 760, y: 470, z: 1.2 }), W = cam.world;
  const BX = -220, BY = 50;
  const ff = firefly(W, { x: 800, y: 450, bx: BX, by: BY, o: 0 });
  show(ff, .1, .6);
  put(ff.bug, { o: .25 }); tw(ff.bug, { o: 1 }, tN, .8);
  // the light: rays round the glowing abdomen, as bright as its glow
  const rays = G(W, { o: 0 }), ry = G(rays);
  let rd = '';
  for (let i = 0; i < 10; i++) { const an = i / 10 * 2 * Math.PI; rd += `M${cF(150 * Math.cos(an))} ${cF(150 * Math.sin(an))}L${cF(205 * Math.cos(an))} ${cF(205 * Math.sin(an))}`; }
  path(ry, rd, { stroke: MC.glow, 'stroke-width': 6 });
  show(rays, tG + .2, .5);
  clockRun(t => { ff.set(t); const [gx, gy] = ff.pt('glow'); mPose(ry, gx, gy, Math.round(ff.glowK(t) * 100) / 100); }, D);
  // the title card, in the sky to the right, under the moon
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOLOGY · CHAPTER 8 · LESSON 1', { x: 1150, y: 315, size: 26, fill: COL.dim, o: 1 });
  ['Metabolism, pathways', 'and forms of energy'].forEach((s, i) => wLabel(ttl, s, { x: 1150, y: 395 + i * 66, size: 52, o: 1 }));
  wLabel(ttl, 'An introduction to metabolism', { x: 1150, y: 540, size: 26, fill: COL.dim, weight: 500, o: 1 });
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tG - .3, .5);
  // glow: the name of it, beside the light
  const gx0 = 800 + BX - 80, gy0 = 450 + BY + 6;
  const lb = tag(W, 'bioluminescence', [gx0 + 300, gy0 - 190], [gx0 + 140, gy0 - 90], tG + 3.6, { size: 34, weight: 700, fill: MC.glow, line: MC.glow, sub: 'chemical energy → light' });
  hide(lb, tP, .4);
  // push: into the glowing tail, then the cell
  cam.to({ x: gx0, y: gy0, z: 5 }, tP + .3, tF - tP - .9);
  hide(cam.el, tF - .55, .35);
  // factory: one cell of the tail, with gears and a line of molecules; energy in from food, work out
  const fac = G(p, { o: 0 }); show(fac, tF - .2, .5);
  const cell = cellArt(fac, { x: 800, y: 480, rx: 600, ry: 300, n: 0, nuc: true });
  const g1 = gear(fac, { x: 720, y: 390, R: 72, teeth: 11 }), g2 = gear(fac, { x: 830, y: 320, R: 46, teeth: 7, color: '#d2a878', edge: '#8a6a40' });
  const g3 = gear(fac, { x: 1110, y: 380, R: 58, teeth: 9, color: '#a9c6ea', edge: '#5b82b8' });
  const belt = G(fac);
  mk('rect', { x: 560, y: 560, width: 640, height: 26, rx: 13, fill: '#2c4568', stroke: '#8fa3bd', 'stroke-width': 3 }, belt);
  [580, 1180].forEach(cx => mk('circle', { cx, cy: 573, r: 16, fill: '#8fa3bd' }, belt));
  const KD = ['sugar', 'dye1', 'dye2', 'sugar', 'dye2', 'dye1', 'sugar'];
  const rides = KD.map(kd => solute(fac, kd, { r: 18, label: false }));
  const fIn = G(fac, { o: 0 }), fOut = G(fac, { o: 0 });
  solute(fIn, 'sugar', { x: 70, y: 480, r: 26, label: false });
  mArrow(fIn, [106, 480], [240, 480], { color: MC.exo, w: 7, head: 20 });
  wLabel(fIn, 'energy in', { x: 120, y: 410, size: 28, weight: 700, fill: MC.exo, o: 1 });
  wLabel(fIn, 'from food', { x: 120, y: 444, size: 22, weight: 500, fill: COL.dim, o: 1 });
  mArrow(fOut, [1360, 480], [1500, 480], { color: MC.glow, w: 7, head: 20 });
  wLabel(fOut, 'work out', { x: 1480, y: 410, size: 28, weight: 700, fill: MC.glow, o: 1 });
  wLabel(fOut, 'light, motion', { x: 1480, y: 444, size: 22, weight: 500, fill: COL.dim, o: 1 });
  show(fIn, cue('intro', 'It pulls energy') + .2, .4); show(fOut, cue('intro', 'It pulls energy') + 2.4, .4);
  banner(fac, 'a miniature chemical factory', 'thousands of reactions at once', 800, 92, tF + .8, { size: 40 });
  clockRun(t => {
    const u = Math.max(0, t - tF), q = Math.round(u * 60) / 60;
    g1.spin(q * 40); g2.spin(-q * 40 * 72 / 46 + 12); g3.spin(q * 50);
    rides.forEach((e, i) => { const w = cFrac(q * .1 + i / rides.length); mPose(e, 590 + 580 * w, 540, Math.min(1, Math.sin(Math.PI * w) * 3)); });
  }, D);
}],

/* ---------- metab ---------- */
['metab', 'Metabolism', (m, D) => {
  const p = panel(0), tT = m('total'), tE = m('emerge');
  const cell = cellArt(p, { x: 800, y: 500, rx: 600, ry: 290, n: 26, r: 19, minD: 74 });
  const tLone = cue('metab', 'No single molecule'), tOut = cue('metab', 'Take the molecules out');
  // total: every reaction arrow lights, one after another
  const br = G(p, { o: 0 }); show(br, tT + 2, .5); hide(br, tE - .2, .4);
  path(br, 'M220 200V182H1380V200', { stroke: COL.chalk, 'stroke-width': 4 });
  banner(br, 'metabolism', 'all of an organism’s chemical reactions', 800, 96, null, { size: 44 });
  // emerge: the molecules dim, the whole cell glows
  const eb = G(p, { o: 0 }); show(eb, tE + .3, .5);
  banner(eb, 'an emergent property', 'it arises from molecules interacting in the cell', 800, 96, null, { size: 44, color: MC.glow });
  show(cell.halo, tE + .4, .8); hide(cell.halo, tOut + .4, .6);
  tw(cell.mols, { o: .55 }, tE + .4, .6);
  // one molecule on its own: no metabolism
  const lone = G(p, { o: 0 }); show(lone, tLone + .2, .4);
  solute(lone, 'sugar', { x: 1500, y: 830, r: 18, label: false });
  wLabel(lone, 'one molecule alone:', { x: 1462, y: 822, size: 26, anchor: 'end', weight: 600, o: 1 });
  wLabel(lone, 'no metabolism', { x: 1462, y: 854, size: 26, anchor: 'end', weight: 600, fill: COL.dim, o: 1 });
  const gone = G(p, { o: 0 }); show(gone, tOut + .6, .4);
  wLabel(gone, 'no interactions, no metabolism', { x: 140, y: 860, size: 26, anchor: 'start', weight: 600, fill: COL.dim, o: 1 });
  clockRun(t => {
    const n = cell.arrs.length, off = mRamp(t, tOut + .3, tOut + 1.1);
    cell.arrs.forEach((a, i) => {
      const lit = mRamp(t, tT + .2 + 1.6 * i / n, tT + .5 + 1.6 * i / n), osc = .78 + .22 * Math.sin(t * 3 + i * 1.3);
      mO(a, Math.round(mLerp(.14, osc, lit * (1 - off)) * 100) / 100);
    });
  }, D);
}],

/* ---------- pathway ---------- */
['pathway', 'A metabolic pathway', (m, D) => {
  const p = panel(0), tA = m('a'), tB = m('b'), tC = m('c'), tD = m('d'), tEn = m('enz'), tS = m('spec');
  banner(p, 'a metabolic pathway', 'the cell’s assembly line', 800, 92, .3, { size: 42 });
  const sp = primeDots(pathwayStrip(p, { x: 800, y: 420, w: 1000, s: 1.2 }));
  const enzL = sp.enzymes[0].parentNode;
  put(enzL, { o: 0 }); show(enzL, tEn + .2, .5);
  const tOne = cue('pathway', 'Enzyme one');
  sp.enzymes.forEach((e, i) => pulse(e, tOne + .1 + .85 * i, 1.25));
  [tA, tB, tC, tD].forEach((t0, i) => pulse(sp.mols[i], t0 + .1, 1.12));
  clockRun(t => {
    const lit = ['mol0'];
    if (t >= tB) lit.push('arrow1', 'mol1');
    if (t >= tC) lit.push('arrow2', 'mol2');
    if (t >= tD) lit.push('arrow3', 'mol3');
    if (t >= tEn) lit.push('enzymes');
    sp.focus(t < tA ? ['none'] : lit, 1);
    sp.flow(t, [mRamp(t, tB, tB + .6), mRamp(t, tC, tC + .6), mRamp(t, tD, tD + .6)]);
  }, D);

      { parts: ['heat: random molecular motion'], ans: ['k'], why: 'Kinetic: heat is the kinetic energy of molecules moving at random.' },
      { parts: ['a ball on a high ledge'], ans: ['p'], why: 'Potential: it is high up and not yet moving.' },
      { parts: ['energy held in glucose'], ans: ['p'], why: 'Potential: chemical energy is potential energy held in the structure of molecules.' },
    ], [['k', 'kinetic', null, 'K'], ['p', 'potential', null, 'P']], { multi: false, text: true })) },
  { id: 'p-emerge', prompt: ['Why is metabolism called an emergent property?'],
    build: withPic('emerge', choice([['it is found in a single molecule'], ['it appears only in large animals'], ['it arises from interactions between molecules within the cell'], ['it is created from nothing']], 2,
      'Right. No single molecule has it; it comes from many molecules interacting in the cell.',
      ['No single molecule is alive or has metabolism. It comes from many molecules together.',
        'Every living cell has a metabolism, even a single bacterium.', null,
        'Nothing comes from nothing: metabolism arises from the molecules interacting.'])) },
  { id: 'p-anab', prompt: ['Making a protein from amino acids is which kind of pathway?'],
    build: withPic('anab', choice([['catabolic: it releases energy by breaking down'], ['anabolic: it uses energy to build a complex molecule'], ['catabolic, because proteins are big'], ['neither: it is not a pathway']], 1,
      'Right. Building a large molecule from small ones is anabolic, and it uses energy.',
      ['That is the opposite: catabolic pathways break molecules down. This one builds a protein up.', null,
        'Size does not decide it: building up is anabolic, breaking down is catabolic.',
        'It is a pathway: many steps, each with its own enzyme.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
