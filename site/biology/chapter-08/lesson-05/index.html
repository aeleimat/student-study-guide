'use strict';
// Biology, Chapter 8 (An Introduction to Metabolism), lesson 5: a sugar cube that will not burn on its own, a cell
// where sugar goes in a blink, and the shared pathway strip with enzyme 1 lit; catalysts and enzymes (sucrase splits
// sucrose and water into glucose and fructose, and comes out unchanged); every reaction breaks and forms bonds; the
// energy curve with its transition state and activation energy, a ball in a dip behind a ridge; heat as the push, and
// why a cell can't just heat up; enzymes lower the barrier and leave ΔG alone; a worked example (20 → 8 kcal/mol,
// ΔG −5 both ways); a summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-08/lesson-05.md.
const CHAPTER = { number: 805, label: '8, lesson 5', title: 'Enzymes and the Activation Energy Barrier', minutes: 7, language: 'en', lead: false, next: '../lesson-06/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const sayC = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const rk = k => Math.round(mClamp(k) * 2000) / 2000;
// A label (centred text) with a leader to the thing it names; fades in at t0 (null: shown at once).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 600 } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size);
  wLabel(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + size * .3; }
  else { sx = tx; sy = ty - size * 1.05; }
  path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 });
  mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g);
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0.
function banner(p, a, b, x, y, t0, { color = COL.chalk, size = 40 } = {}) {
  const g = G(p, { o: 0 });
  wLabel(g, a, { x, y, size, weight: 700, fill: color, o: 1 });
  if (b) wLabel(g, b, { x, y: y + size * .95, size: size * .62, fill: COL.dim, weight: 500, o: 1 });
  show(g, t0, .5);
  return g;
}
const panelBox = (g, x, y, w, h) => mk('rect', { x, y, width: w, height: h, rx: 22, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, g);
// A straight vertical bracket arrow (y1 → y2) with an end tick, drawn in place.
function vBracket(p, x, y1, y2, color, { w = 5, head = 16, tick = true } = {}) {
  const g = G(p);
  mArrow(g, [x, y1], [x, y2], { color, w, head });
  if (tick) path(g, `M${x - 12} ${y1}H${x + 12}`, { stroke: color, 'stroke-width': 3 });
  return g;
}
// Reactants / Products / Transition state labels for an energyDiagram at (x, y) drawn with lab: 0 (the kit's
// "Transition state" sits low enough for the hump and its outline to strike it); returns { g, ts }.
function edLab(p, [x, y], ed, { r, pp, peak, size = 28, ts = true } = {}) {
  const g = G(p);
  wLabel(g, 'Reactants', { x: x + ed.X(0) + 4, y: y + ed.Y(r) + size * 1.25, size, anchor: 'start', o: 1 });
  wLabel(g, 'Products', { x: x + ed.X(1), y: y + ed.Y(pp) + size * 1.25, size, anchor: 'end', o: 1 });
  const tl = ts ? wLabel(g, 'Transition state', { x: x + ed.X(.5), y: y + ed.Y(peak) - size * 1.7, size, o: 1 }) : null;
  return { g, ts: tl };
}
const dashH = (p, x1, x2, y, color = COL.dim, w = 2.5) => path(p, `M${x1} ${y}H${x2}`, { stroke: color, 'stroke-width': w, 'stroke-dasharray': '9 8' });

/* ---------- the atoms of the slide-38 figure ---------- */
const ATOM = { A: '#f07a6a', B: '#f3c95c', C: '#8fd6b0', D: '#6c8cff' };
function atom(p, L, x, y, r = 15) {
  const g = G(p, { x, y });
  mk('circle', { r, fill: ATOM[L], stroke: mix(ATOM[L], '#000000', .35), 'stroke-width': 2.5 }, g);
  wLabel(g, L, { y: r * .4, size: r * 1.15, fill: '#14233a', weight: 800, o: 1 });
  return g;
}
const wavyD = (x1, y1, x2, y2, n = 3, a = 5) => {
  const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L; let d = `M${x1} ${y1}`;
  for (let i = 1; i <= 24; i++) { const f = i / 24, s = a * Math.sin(f * n * 2 * Math.PI); d += `L${(x1 + ux * L * f - uy * s).toFixed(1)} ${(y1 + uy * L * f + ux * s).toFixed(1)}`; }
  return d;
};
// Two atoms joined by a bond (a pair of the reaction): origin = the bond's middle.
function pair(p, a, b, { x = 0, y = 0, o = 1, gap = 42, r = 15, wavy = false } = {}) {
  const g = G(p, { x, y, o });
  if (wavy) path(g, wavyD(-gap / 2, 0, gap / 2, 0), { stroke: '#e8e2d0', 'stroke-width': 3.5 });
  else path(g, `M${-gap / 2} 0H${gap / 2}`, { stroke: '#e8e2d0', 'stroke-width': 6 });
  atom(g, a, -gap / 2, 0, r); atom(g, b, gap / 2, 0, r);
  return g;
}
// The transition state: A~B over C~D, all four held by wavy, half-made bonds.
function transitionArt(p, { x = 0, y = 0, o = 1, gap = 44, r = 15 } = {}) {
  const g = G(p, { x, y, o }), h = gap / 2;
  const st = { stroke: '#e8e2d0', 'stroke-width': 3.5 };
  path(g, wavyD(-h, -h, h, -h), st); path(g, wavyD(-h, h, h, h), st); path(g, wavyD(-h, -h, -h, h), st); path(g, wavyD(h, -h, h, h), st);
  atom(g, 'A', -h, -h, r); atom(g, 'B', h, -h, r); atom(g, 'C', -h, h, r); atom(g, 'D', h, h, r);
  return g;
}

/* ---------- backdrops: a sugar cube on a table, a flame crossed out, a flame, a cell ---------- */
function sugarCube(p, { x = 0, y = 0, s = 1, o = 1, a = 70 } = {}) {
  const g = G(p, { x, y, s, o }), c = a * .87;
  const st = { stroke: '#a89f8a', 'stroke-width': 3, 'stroke-linejoin': 'round' };
  path(g, `M0 ${-a}L${c} ${-a / 2}L0 0L${-c} ${-a / 2}Z`, { fill: '#fbf7ee', ...st });
  path(g, `M${-c} ${-a / 2}L0 0L0 ${a}L${-c} ${a / 2}Z`, { fill: '#e6dfcf', ...st });
  path(g, `M${c} ${-a / 2}L0 0L0 ${a}L${c} ${a / 2}Z`, { fill: '#d4ccb9', ...st });
  // sugar grains on the faces
  for (let i = 0; i < 14; i++) mk('circle', { cx: (wHash(i, 5) - .5) * c * 1.6, cy: -a * .2 + (wHash(i, 9) - .5) * a * 1.1 + a * .35, r: 2.2, fill: '#ffffff', 'fill-opacity': .7 }, g);
  return g;
}
const FLAME = s => `M0 ${-62 * s}C${30 * s} ${-32 * s} ${38 * s} ${-6 * s} ${30 * s} ${14 * s}C${22 * s} ${34 * s} ${-22 * s} ${34 * s} ${-30 * s} ${14 * s}C${-38 * s} ${-6 * s} ${-12 * s} ${-26 * s} 0 ${-62 * s}Z`;
function flameNo(p, { x = 0, y = 0, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  path(g, FLAME(1), { fill: MC.exo }); path(g, FLAME(.55), { fill: '#f3c95c', transform: 'translate(0 10)' });
  mk('circle', { r: 66, fill: 'none', stroke: '#e5533d', 'stroke-width': 9 }, g);
  path(g, 'M-47 -47L47 47', { stroke: '#e5533d', 'stroke-width': 9 });
  return g;
}
// A live flame (pure in t): three layered tongues that sway.
function flame(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  const L = [[MC.exo, 1], ['#f3c95c', .68], ['#fff1c2', .38]].map(([c, k]) => Object.assign(path(g, '', { fill: c }), { k }));
  return Object.assign(g, {
    set(t) {
      t = Math.round(t * 30) / 30;
      L.forEach((f, i) => {
        const k = f.k, sw = 12 * Math.sin(t * 5 + i * 1.7) + 5 * Math.sin(t * 8.3 + i), hh = 150 * k * (1 + .08 * Math.sin(t * 6.1 + i * 2)), bw = 62 * k;
        mD(f, `M${cF(-bw)} 0Q${cF(-bw * 1.05)} ${cF(-hh * .55)} ${cF(sw * k)} ${cF(-hh)}Q${cF(bw * 1.05)} ${cF(-hh * .55)} ${cF(bw)} 0Q0 ${cF(14 * k)} ${cF(-bw)} 0Z`);
      });
      return g;
    },
  }).set(0);
}
// A cell under heat: outline, heat arrows in from four sides, a limp enzyme inside; .set(k) the enzyme bends and greys.
function hotCell(p, { x = 0, y = 0, s = 1, o = 1, R = 180, cross = true } = {}) {
  const g = G(p, { x, y, s, o });
  mk('circle', { r: R, fill: '#153050', stroke: '#7fb8d8', 'stroke-width': 9 }, g);
  [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => {
    const a = [dx * (R + 120), dy * (R + 110)], b = [dx * (R - 30), dy * (R - 30)];
    heatArrow(g, a, b, { waves: 2, amp: 9, w: 7 }).in(0, .01);
  });
  const enz = enzymeBlob(g, { R: 70, y: 18 });
  const x1 = G(g, { o: cross ? 1 : 0 });
  path(x1, `M${-R * .75} ${-R * .75}L${R * .75} ${R * .75}M${R * .75} ${-R * .75}L${-R * .75} ${R * .75}`, { stroke: '#e5533d', 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-opacity': .85 });
  return Object.assign(g, { enz, x1, set(k) { enz.bend(k); enz.tint(.55 * k); return g; } });
}
// The dip-and-ridge landscape of the ball analogy, in a card; .set(k) k 0 rests in the dip, .2–.5 pushed over the
// ridge, .5–1 rolling down the long slope. origin = the card's top left.
function dipRidge(p, { x = 0, y = 0, o = 1, W = 420, H = 380 } = {}) {
  const g = G(p, { x, y, o });
  panelBox(g, 0, 0, W, H);
  const K = [[20, 120], [110, 236], [205, 140], [400, 330]];
  const yAt = xx => { for (let i = 1; i < K.length; i++) if (xx <= K[i][0]) { const [a, b] = [K[i - 1], K[i]], f = (xx - a[0]) / (b[0] - a[0]); return a[1] + (b[1] - a[1]) * (1 - Math.cos(Math.PI * f)) / 2; } return K[K.length - 1][1]; };
  let d = `M20 ${H - 10}`; for (let xx = 20; xx <= 400; xx += 5) d += `L${xx} ${cF(yAt(xx))}`; d += `L400 ${H - 10}Z`;
  path(g, d, { fill: '#24463a', stroke: '#5f8f6a', 'stroke-width': 4 });
  const r = 18, ball = G(g);
  mk('circle', { r, fill: MC.sub, stroke: MC.subEdge, 'stroke-width': 3 }, ball);
  mk('circle', { cx: -r * .35, cy: -r * .38, r: r * .24, fill: '#fff', 'fill-opacity': .45 }, ball);
  const push = G(g, { o: 0 }); mArrow(push, [24, 200], [76, 214], { color: COL.chalk, w: 6, head: 18 });
  return Object.assign(g, {
    set(k) {
      k = rk(k);
      const a = io(mRamp(k, .2, .5)), b = mRamp(k, .5, 1) ** 1.6;
      const xx = k < .5 ? mLerp(110, 205, a) : mLerp(205, 380, b);
      const yy = yAt(xx) - r - 1;
      cSet(ball, { x: xx, y: yy, r: (xx - 110) / r * 57.3 });
      mO(push, mRamp(k, .05, .15) * (1 - mRamp(k, .35, .45)));
      return g;
    },
  }).set(0);
}

['intro', 'A sugar cube that will not burn', (m, D) => {

  cam.to({ x: cx, y: cy, z: 3 }, tC + 1.4, tS - tC - 1.6);

  // strip: the shared pathway strip; lit: enzyme 1 lit, the rest dimmed
  const st = pathwayStrip(p, { x: 800, y: 440 });

  wLabel(q, 'how does it make a reaction fast?', { x: 800, y: 744, size: 26, fill: COL.dim, weight: 500, o: 1 });
  clockRun(t => {
    const u = Math.min(t, tC + .5);   // always written; still once the backdrop has gone
    air.forEach((a, i) => mPose(a.e, a.x + 8 * Math.sin(u * (1.1 + .3 * (i % 3)) + i), a.y + 8 * Math.cos(u * (.9 + .2 * (i % 4)) + i * 1.7), 1));
    sp.forEach((s, i) => { const ph = cFrac(t * .5 + i / 5); mPose(s.e, cx + s.dx, cy + s.dy, t > tC + 1.2 ? Math.sin(Math.PI * mClamp(ph * 2)) * (ph < .5 ? 1 : 0) : 0); });
    st.build(io(mRamp(t, tS - .3, tS + 1.8)));

  }, D);
  const e1 = st.pt('enzyme1');
  const r1 = G(p, { x: e1[0], y: e1[1], o: 0 }); mk('circle', { cy: 6, r: 40, fill: 'none', stroke: MC.enzyme, 'stroke-width': 4 }, r1);
  show(r1, tL + .8, .3); pulse(r1, tL + .9, 1.15);

/* ---------- barrier ---------- */
['barrier', 'The activation energy barrier', (m, D) => {
  const p = panel(0), tBo = m('bonds'), tGr = m('graph'), tH = m('hump'), tEa = m('ea'), tBa = m('ball');
  banner(p, 'every reaction: bonds break, bonds form', null, 800, 66, 0, { size: 36 });
  const ed = energyDiagram(p, { x: 220, y: 790, w: 900, h: 560, o: 0 });

  show(ed, tGr + .2, .5);
  // the pairs: A–B and C–D at the reactants, A–C and B–D at the products, the four held loosely at the top
  const rA = pair(p, 'A', 'B', { x: 300, y: 362, o: 0 }), rC = pair(p, 'C', 'D', { x: 300, y: 410, o: 0 });

  // bonds: first shown large in the middle, then they settle onto the reactant level
  const big = G(p, { o: 0 });
  pair(big, 'A', 'B', { x: -60, y: 0 }); pair(big, 'C', 'D', { x: 60, y: 0 });
  mArrow(big, [125, 0], [195, 0], { color: COL.chalk, w: 5, head: 16 });
  pair(big, 'A', 'C', { x: 260, y: -26 }); pair(big, 'B', 'D', { x: 260, y: 26 });

    // the transition state trembles: unstable

  say(p, 'downhill is not always fast', 1380, 640, Math.min(tBa + 12, D - 3), { size: 26, weight: 700, fill: COL.chalk });

      'Right. Hydrolysis splits sucrose into glucose and fructose; the water is split into H and OH, one piece on each sugar.',
      ['Water is a reactant here: it is split into H and OH, and both pieces end up on the sugars.', null,
        'Sucrase is the catalyst: it comes out unchanged, it is not turned into a product.',
        'Nothing is being joined into a long chain: one sugar is split into two.'])) },
  { id: 'p-heat', prompt: ['Why can’t a cell simply heat up to cross the activation energy barrier?'],
    build: withPic('heat', choice([['heat cannot supply activation energy'], ['a cell has no energy to spare'], ['heat strong enough would damage its proteins and speed up every reaction at once'], ['activation energy does not matter inside cells']], 2,
      'Right. A flame-sized push would denature the cell’s proteins, and it would speed every reaction, wanted or not. Enzymes lower the hill for one reaction instead.',
      ['Heat can supply it: that is how a flame lights a sugar cube. The trouble is what heat does to the cell.',
        'Energy is not the problem: heat would damage the cell’s proteins, and speed up every reaction at once.', null,
        'It matters a great deal: the barrier is why enzymes exist.'])) },
  { id: 'p-curve', prompt: ['With an enzyme added, the…'],
    build: withPic('curve', grid([
      { parts: ['the hill'], ans: ['l'], why: 'Lower: the enzyme lowers the activation energy barrier.' },
      { parts: ['reactant level'], ans: ['s'], why: 'The same: the starting level did not move.' },
      { parts: ['product level'], ans: ['s'], why: 'The same: the end level did not move.' },
      { parts: ['ΔG'], ans: ['s'], why: 'The same: both levels stayed, so the drop between them did too.' },
    ], [['l', 'lower', null, 'L'], ['s', 'same', null, 'S'], ['h', 'higher', null, 'H']], { multi: false, text: true })) },
  { id: 'p-num', prompt: ['The climb is 20 kcal/mol without an enzyme and 8 with one. ΔG is −5 kcal/mol without it. In kcal/mol:'],
    build: withPic('num', blanks([
      { parts: ['the barrier drops by ', { box: '12' }], why: '20 − 8 = 12 kcal/mol less to climb.', hint: 'Subtract the two climbs.' },
      { parts: ['with it, ΔG = ', { box: '-5' }], why: 'An enzyme does not change ΔG: still −5 kcal/mol.', hint: 'Did the start and end levels move?' },
    ])) },
  { id: 'p-uphill', prompt: ['A reaction is uphill (ΔG > 0): it will not go without added energy. You add the right enzyme. What happens?'],
    build: withPic('uphill', choice([['it now runs downhill'], ['it runs uphill on its own, only faster'], ['the enzyme supplies the energy it needs'], ['it still won’t go on its own']], 3,
      'Right. An enzyme lowers the hill but cannot change ΔG, so an uphill reaction still needs energy from somewhere else.',
      ['An enzyme cannot change ΔG: the start and end levels stay where they are.',
        'It does not help an uphill reaction go at all: it only speeds up reactions that would occur eventually.',
        'An enzyme is not an energy source: it is a catalyst, and it comes out unchanged.', null])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
