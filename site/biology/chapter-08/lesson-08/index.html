'use strict';
// Biology, Chapter 8 (An Introduction to Metabolism), lesson 8: a thermostat switches a heater off and on, then a
// plant cell, then the shared pathway strip with its stop sign lit; why pathways are regulated (genes, or enzyme
// activity); allosteric regulation (a regulator binds one site and changes another); the four-subunit enzyme between
// its active and inactive forms, stabilised by an activator or an inhibitor; cooperativity; feedback inhibition from
// threonine to isoleucine; the isoleucine level as a thermostat; a recap of the chapter; practice.
// Plan, errata and storyboard: books/biology/chapters/chapter-08/lesson-08.md.
const CHAPTER = { number: 808, label: '8, lesson 8', title: 'Allosteric Regulation and Feedback Inhibition', minutes: 7, language: 'en', lead: false, next: '../../chapter-09/lesson-01/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const DARK = '#0a1626', ISO = MC.pathD, THR = MC.pathA, GREEN = MC.activator, RED = MC.alloInh;
// a beat's sentence start (from the voice's cues), so actions can land on a sentence without a mark
const cue = (id, i) => TIMINGS[id].cues[i][0];
const setT = (e, s) => { if (e._s !== s) { e.textContent = s; e._s = s; } return e; };
const ss = v => { const c = mClamp(v); return c * c * (3 - 2 * c); };
// A label (centred text) with a leader to the thing it names; returns the group (it fades in at t0).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 600, sub, subFill = COL.dim } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size);
  wLabel(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  if (sub) wLabel(g, sub, { x: tx, y: ty + size * 1.05, size: size * .8, fill: subFill, weight: 500, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + (sub ? size * 1.05 + size * .3 : size * .3); }
  else { sx = tx; sy = ty - size * 1.05; }
  path(g, `M${cF(sx)} ${cF(sy)}L${cF(ax)} ${cF(ay)}`, { stroke: line, 'stroke-width': 2.5 }); mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g);
  if (t0 !== null) show(g, t0, .4);
  return g;
}
// A dark pill with a line of text, centred on (x, y); fades in at t0 (null: o 0, not scheduled).
function pill(p, str, x, y, t0, { size = 28, color = COL.chalk, edge = COL.faint, weight = 700 } = {}) {
  const g = G(p, { x, y, o: 0 }), w = uiW(str, size) + 40, h = size + 24;
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: DARK, stroke: edge, 'stroke-width': 2.5 }, g);
  wLabel(g, str, { y: size * .36, size, fill: color, weight, o: 1 });
  if (t0 !== null) { show(g, t0, .4); pulse(g, t0 + .1, 1.06); }
  return g;
}
// A ring that pops in round a point.
function ring(p, [x, y], r, t0, { color = COL.chalk, w = 4 } = {}) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: 'none', stroke: color, 'stroke-width': w }, g);
  if (t0 !== null) { show(g, t0, .3); pulse(g, t0 + .1, 1.12); }
  return g;
}
// A numbered badge.
function badge(p, str, x, y, { o = 0, r = 22, fill = '#3b8fd9' } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { r, fill, stroke: '#cfe6ff', 'stroke-width': 3 }, g);
  const t = wLabel(g, str, { y: r * .4, size: r * 1.15, fill: '#ffffff', weight: 800, o: 1 });
  return Object.assign(g, { t });
}
// A small molecule chip (rounded square with a short name): isoleucine "Ile", threonine "Thr".
function molChip(p, str, color, { x = 0, y = 0, size = 44, o = 1, s = 1 } = {}) {
  const g = G(p, { x, y, o, s });
  path(g, `M${-size / 2 + 10} ${-size / 2}H${size / 2 - 10}Q${size / 2} ${-size / 2} ${size / 2} ${-size / 2 + 10}V${size / 2 - 10}Q${size / 2} ${size / 2} ${size / 2 - 10} ${size / 2}H${-size / 2 + 10}Q${-size / 2} ${size / 2} ${-size / 2} ${size / 2 - 10}V${-size / 2 + 10}Q${-size / 2} ${-size / 2} ${-size / 2 + 10} ${-size / 2}Z`,
    { fill: color, stroke: mix(color, '#000000', .35), 'stroke-width': 3 });
  const t = wLabel(g, str, { y: size * .16, size: Math.round(size * .42), fill: '#14233a', weight: 800, o: 1 });
  return Object.assign(g, { t, body: g.firstChild });
}
// A regulator ball (a round drop) for an enzymeBlob's socket.
function regBall(p, color, { x = 0, y = 0, r = 24, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { r, fill: color, stroke: mix(color, '#000000', .35), 'stroke-width': 3 }, g);
  mk('ellipse', { cx: -r * .3, cy: -r * .32, rx: r * .3, ry: r * .18, fill: '#fff', 'fill-opacity': .35 }, g);
  return g;
}
// An octagonal stop sign.
function stopSign(p, { x = 0, y = 0, r = 24, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  path(g, zNgon(8, r, 0, 0, Math.PI / 8), { fill: MC.stop, stroke: '#fff', 'stroke-width': 3 });
  mk('rect', { x: -r * .55, y: -r * .14, width: r * 1.1, height: r * .28, rx: 2, fill: '#fff' }, g);
  return g;
}
// a polyline's point at fraction k of its length
function along(pts, k) {
  const L = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
  let want = mClamp(k) * tot;
  for (let i = 0; i < L.length; i++) { if (want <= L[i] || i === L.length - 1) { const u = L[i] ? Math.min(1, want / L[i]) : 1; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * u, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * u]; } want -= L[i]; }
  return pts[pts.length - 1];
}

/* ---------- the thermostat room (intro backdrop; the dial comes back in the example) ---------- */
// A wall thermostat: a dial from cool (blue, left) to warm (orange, right), the set point at the top, a needle.
function dial(p, { x = 0, y = 0, s = 1, o = 1, readout = true } = {}) {
  const g = G(p, { x, y, s, o });
  mk('rect', { x: -110, y: -110, width: 220, height: 220, rx: 30, fill: '#22364f', stroke: '#4a607c', 'stroke-width': 4 }, g);
  mk('circle', { r: 84, fill: '#0f1e33', stroke: '#7d8ea6', 'stroke-width': 4 }, g);
  for (let i = 0; i <= 12; i++) {
    const a = (-120 + i * 20) * Math.PI / 180, c = zMix(MC.endo, MC.exo, i / 12);
    path(g, `M${cF(62 * Math.sin(a))} ${cF(-62 * Math.cos(a))}L${cF(76 * Math.sin(a))} ${cF(-76 * Math.cos(a))}`, { stroke: c, 'stroke-width': i % 3 ? 4 : 7 });
  }
  path(g, 'M0 -88L-9 -102H9Z', { fill: COL.chalk });
  const nd = G(g);
  path(nd, 'M0 10L0 -58', { stroke: COL.chalk, 'stroke-width': 6 });
  mk('circle', { r: 11, fill: COL.chalk }, nd);
  const rd = readout ? wLabel(g, '', { y: 50, size: 24, fill: COL.chalk, weight: 700, o: 1 }) : null;
  const d = Object.assign(g, {
    // temp in °C: 20 is the set point (needle up)
    set(temp) {
      const tq = Math.round(temp * 20) / 20;
      cSet(nd, { r: mClamp((tq - 17) / 6) * 220 - 110 });
      if (rd) setT(rd, (Math.round(tq * 10) / 10).toFixed(1) + ' °C');
      return d;
    },
  });
  return d.set(20);
}
// A radiator: fins that glow orange when on, heat waves rising over it.
function heater(p, { x = 0, y = 0 } = {}) {
  const g = G(p, { x, y });
  mk('rect', { x: -20, y: 150, width: 380, height: 16, rx: 8, fill: '#33465f' }, g);
  const fins = G(g), glow = G(g, { o: 0 });
  for (let i = 0; i < 7; i++) {
    mk('rect', { x: i * 52, y: 0, width: 36, height: 170, rx: 14, fill: '#3a4c64', stroke: '#5a6e8a', 'stroke-width': 3 }, fins);
    mk('rect', { x: i * 52 + 5, y: 6, width: 26, height: 158, rx: 11, fill: MC.exo }, glow);
  }
  const waves = [0, 1, 2].map(i => path(g, 'M0 0q12 -12 0 -24t0 -24', { stroke: MC.exo, 'stroke-width': 6, transform: '' }));
  const wg = waves.map(w => { const h = G(g, { o: 0 }); h.appendChild(w); return h; });
  const hr = Object.assign(g, {
    set(heat, t) {
      heat = zK(heat); t = zT(t);
      mO(glow, .8 * heat);
      wg.forEach((h, i) => { const u = cFrac(t * .45 + i / 3); cSet(h, { x: 60 + i * 120, y: -10 - 30 * u, o: heat * mBump(u, 0, 1) }); });
      return hr;
    },
  });
  return hr.set(0, 0);
}
// A potted plant (the camera pushes into one of its leaves).
function plant(p, { x = 0, y = 0 } = {}) {
  const g = G(p, { x, y });
  path(g, 'M-70 0L-55 -110H55L70 0Z', { fill: '#b0643c', stroke: '#7a4126', 'stroke-width': 4 });
  path(g, 'M0 -110C-4 -180 6 -240 0 -300', { stroke: '#4f9a5c', 'stroke-width': 9 });
  [[-1, -170, 30], [1, -210, -25], [-1, -255, 40], [1, -290, -35]].forEach(([sd, yy, rot]) => {
    path(g, `M0 ${yy}c${sd * 30} -40 ${sd * 110} -40 ${sd * 140} 0c${-sd * 40} 30 ${-sd * 110} 30 ${-sd * 140} 0Z`, { fill: '#6fbf7a', stroke: '#3f8a4c', 'stroke-width': 3, transform: `rotate(${rot} 0 ${yy})` });
  });
  return g;
}
// A plant cell, centred on its origin, with little molecules running round in chains (its chemistry never stops).
function leafCell(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, rrect(1060, 640, 70), { fill: '#3f8a4c', stroke: '#2e6a3a', 'stroke-width': 6 });
  path(g, rrect(1010, 590, 56), { fill: MC.cyto, stroke: MC.head, 'stroke-width': 8 });
  mk('ellipse', { cx: 250, cy: -60, rx: 110, ry: 95, fill: CC.nucleo, stroke: CC.env, 'stroke-width': 5 }, g);
  mk('circle', { cx: 270, cy: -50, r: 30, fill: CC.nucleolus }, g);
  [[-380, -180, 20], [-120, 200, -15], [380, 190, 10], [-400, 170, 35]].forEach(([cx, cy, r]) => mk('ellipse', { cx, cy, rx: 62, ry: 30, fill: '#5fae5a', stroke: '#3a7f3a', 'stroke-width': 3, transform: `rotate(${r} ${cx} ${cy})` }, g));
  const PAL = [MC.pathA, MC.pathB, MC.pathC, MC.pathD];
  const dots = Array.from({ length: 24 }, (_, i) => mk('circle', { r: 9, fill: PAL[i % 4], stroke: '#14233a', 'stroke-width': 2 }, g));
  const pc = Object.assign(g, {
    set(t) {
      t = zT(t);
      dots.forEach((d, i) => {
        const ring = i % 3, u = cFrac(t * (.07 + .02 * ring) + i / 24), a = u * 2 * Math.PI;
        const cx = [-160, 80, -60][ring], cy = [-20, 60, -110][ring], rx = [240, 300, 180][ring], ry = [150, 120, 80][ring];
        cSet(d, { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
      });
      return pc;
    },
  });
  return pc.set(0);
}
const rrect = (w, h, r) => `M${-w / 2 + r} ${-h / 2}H${w / 2 - r}Q${w / 2} ${-h / 2} ${w / 2} ${-h / 2 + r}V${h / 2 - r}Q${w / 2} ${h / 2} ${w / 2 - r} ${h / 2}H${-w / 2 + r}Q${-w / 2} ${h / 2} ${-w / 2} ${h / 2 - r}V${-h / 2 + r}Q${-w / 2} ${-h / 2} ${-w / 2 + r} ${-h / 2}Z`;

/* ---------- a gene on a stretch of DNA with an on/off switch (allo, practice) ---------- */
function geneBar(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  let rungs = ''; for (let i = -190; i <= 190; i += 19) rungs += `M${i} -12V12`;
  path(g, rungs, { stroke: '#e9dcc0', 'stroke-width': 3, 'stroke-opacity': .6 });
  path(g, 'M-200 -14H200M-200 14H200', { stroke: '#5fd3e8', 'stroke-width': 6 });
  mk('rect', { x: -70, y: -24, width: 140, height: 48, rx: 10, fill: 'none', stroke: MC.ribose, 'stroke-width': 4 }, g);
  wLabel(g, 'gene', { y: -38, size: 24, fill: MC.ribose, weight: 700, o: 1 });
  const sw = G(g, { y: 70 });
  const bg = mk('rect', { x: -40, y: -20, width: 80, height: 40, rx: 20, fill: MC.off, stroke: COL.chalk, 'stroke-width': 2.5 }, sw);
  const knob = mk('circle', { r: 15, fill: COL.chalk }, sw);
  const lab = wLabel(sw, 'off', { x: 62, y: 8, size: 22, fill: COL.dim, anchor: 'start', weight: 700, o: 1 });
  const gb = Object.assign(g, {
    set(on) {
      on = zK(on);
      cSet(knob, { x: -20 + 40 * on }); cAttr(bg, 'fill', zMix(MC.off, GREEN, on)); setT(lab, on > .5 ? 'on' : 'off');
      return gb;
    },
  });
  return gb.set(0);
}

/* ---------- the feedback pathway: the shared strip with its own loop, rider and stop sign ---------- */
// The strip's own feedback() can't let the rider go again, so the loop, the isoleucine rider, enzyme 1's grey
// overlay and the stop sign are drawn here. Origin as the strip's parent; the strip sits at (800, cy).
const FB_LAB = ['threonine', 'A', 'B', 'C', 'D', 'isoleucine'];
function fbScene(p, { x = 0, y = 0, s = 1, o = 1, w = 1240, cy = 330, labels = FB_LAB, enzymes, endName = true } = {}) {
  const g = G(p, { x, y, s, o }), n = labels.length;
  const st = pathwayStrip(g, { x: 800, y: cy, w, labels, enzymes, names: labels.map((_, i) => i === 0 ? 'initial substrate' : '') });
  st.build(1);
  const P = st.pt('product'), E = st.pt('enzyme1'), S0 = st.pt('start'), bw0 = st.mols[0].bw;
  const endL = endName ? wLabel(g, 'end product', { x: P[0], y: cy - 68, size: 24, fill: COL.dim, weight: 600, o: 1 }) : null;
  const lx = S0[0] - bw0 / 2 - 30, low = cy + 50 + 90, hy = E[1] - 22, ex = E[0] - 52;
  const pts = [[P[0], P[1] + 54], [P[0], low], [lx, low], [lx, hy], [ex, hy]];
  const loop = path(g, 'M' + pts.map(cP).join('L'), { stroke: MC.stop, 'stroke-width': 7, 'stroke-linejoin': 'round' }, { d: 0 });
  const head = path(g, `M${ex - 22} ${hy - 14}L${ex} ${hy}L${ex - 22} ${hy + 14}Z`, { fill: MC.stop }, { o: 0 });
  const grey = enzymeBlob(g, { x: E[0], y: E[1], R: 30 }); grey.fit(1).tint(1); put(grey, { o: 0 });
  const stop = stopSign(g, { x: E[0], y: E[1] - 104, r: 24, o: 0 });
  const rider = molChip(g, 'Ile', ISO, { size: 40, o: 0 });
  const fs = Object.assign(g, {
    st, pts, E, P, rider, stop, loop,
    // the whole pose: t the flow clock; flow 0..1; built 0..1; off enzyme 1 switched off; loop drawn; ride the rider's
    // way along the loop; gone the rider let go (drops and fades); lit / litK the strip's focus
    set({ t = 0, flow = 1, built = 1, off = 0, loop: lk = 0, ride = 0, gone = 0, lit = [], litK = 0 } = {}) {
      off = zK(off); lk = zK(lk); ride = zK(ride); gone = zK(gone);
      st.build(built); st.focus(lit, litK); if (endL) mO(endL, mRamp(built, .9, 1)); st.flow(t, zK(flow) * (1 - off));
      cSet(loop, { d: lk }); mO(head, mRamp(lk, .92, 1));
      mO(grey, off); cSet(stop, { o: off, s: .6 + .4 * off });
      const q = along(pts, io(ride));
      cSet(rider, { x: q[0] - 20 * gone, y: q[1] + 70 * io(gone), o: (ride > 0 ? mRamp(ride, 0, .06) : 0) * (1 - gone) });
      return fs;
    },
  });
  return fs.set({});
}
// The close-up of enzyme 1 (an enzymeBlob with its allosteric socket), threonine cycling through its active site,
// isoleucine binding the socket. Origin = the enzyme's centre.
function e1Close(p, { x = 0, y = 0, R = 95, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  const e = enzymeBlob(g, { R, socket: true, label: 'enzyme 1' });
  const site = e.siteLocal(), sock = [R * 1.0, R * .68];
  const thr = molChip(g, 'Thr', THR, { size: R * .52 });
  const ile = molChip(g, 'Ile', ISO, { size: R * .42, o: 0 });
  const no = wLabel(g, '✗', { x: R * .62, y: site[1] - R * .62, size: 40, fill: RED, weight: 800, o: 0 });
  const ec = Object.assign(g, {
    e, site, sock, thr, ile,
    // t the clock; ile 0..1 isoleucine coming in and binding; off how far the site is bent; gone isoleucine leaving
    set({ t = 0, ile: ik = 0, off = 0, gone = 0, run = 1 } = {}) {
      t = zT(t); ik = zK(ik); off = zK(off); gone = zK(gone);
      e.bend(off).tint(.35 * off);
      // threonine cycles through the site while the enzyme works; switched off, it hovers above and can't fit
      const u = cFrac(t / 2.8), dn = io(mRamp(u, 0, .3)), up = io(mRamp(u, .62, .92));
      const cx = -R * 1.1 * (1 - dn) + R * 1.3 * up, cy = site[1] - R * 1.1 * (1 - dn) - R * .9 * up;
      const hov = [R * .05, site[1] - R * .85 + 8 * Math.sin(t * 4)];
      const bx = cx + (hov[0] - cx) * off, by = cy + (hov[1] - cy) * off;
      const conv = run * (1 - off) * mRamp(u, .38, .5);
      cSet(thr, { x: bx, y: by, o: 1 - (1 - off) * mRamp(u, .84, .95) });
      cAttr(thr.body, 'fill', zMix(THR, MC.pathB, conv)); setT(thr.t, conv > .5 ? 'A' : 'Thr');
      e.fit(run * (1 - off) * mBump(u, .25, .68));
      mO(no, mRamp(off, .7, 1));
      const ip = [sock[0] + R * 1.2 * (1 - io(ik)), sock[1] + R * .5 * (1 - io(ik))];
      cSet(ile, { x: ip[0] + R * .5 * io(gone), y: ip[1] + R * .8 * io(gone), o: (ik > 0 ? mRamp(ik, 0, .1) : 0) * (1 - gone) });
      return ec;
    },
  });
  return ec.set({});
}

/* ---------- beats ---------- */

/* ---------- intro ---------- */

/* ---------- example ---------- */
['example', 'The isoleucine level', (m, D) => {
  const p = panel(0), tF = m('full'), tD = m('drain'), tS = m('swing');
  const S0 = .62;
  const fs = fbScene(p, { x: 20, y: 60, s: S0 });
  // the level: plenty, then used up fast, then rising and falling round what is needed
  const NEED = .55;
  const LAt = t => {
    const u = Math.max(0, t - tS);
    return .4 + .45 * io(mRamp(t, tF + .4, tF + 2.4)) - .55 * io(mRamp(t, cue('example', 5) - .5, cue('example', 5) + 2.5))
      + .25 * io(mRamp(t, tS, tS + 1.5)) + .2 * Math.sin(1.5 * u) * Math.exp(-.12 * u) * mRamp(u, 0, 1);
  };
  // three enzyme-1 molecules, each switched off by its own isoleucine when the level is high enough
  const THR3 = [.45, .55, .65];
  const PG = G(p);
  wLabel(PG, 'enzyme 1 molecules in the cell', { x: 470, y: 560, size: 26, fill: COL.dim, weight: 700, o: 1 });
  const ens = THR3.map((_, i) => {
    const x = 200 + 270 * i, en = enzymeBlob(PG, { x, y: 690, R: 62, socket: true });
    const il = molChip(PG, 'Ile', ISO, { size: 28, o: 0 });
    return { en, il, x };
  });
  const gx = 1200, gt = 180, gb = 760;
  const GG = G(p);
  wLabel(GG, 'isoleucine level', { x: gx, y: 140, size: 30, weight: 700, fill: ISO, o: 1 });
  mk('rect', { x: gx - 80, y: gt, width: 160, height: gb - gt, rx: 20, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, GG);
  const lev = mk('rect', { x: gx - 70, y: gb - 10, width: 140, height: 0, rx: 12, fill: ISO, 'fill-opacity': .35 }, GG);
  const dotY = i => gb - 60 - 110 * Math.floor(i / 4);
  const dots = Array.from({ length: 20 }, (_, i) => molChip(GG, '', ISO, { size: 24, x: gx - 45 + 30 * (i % 4), y: dotY(i), o: 0 }));
  const yN = gb - 10 - (gb - gt - 20) * NEED;
  path(GG, `M${gx - 100} ${yN}H${gx + 100}`, { stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '10 8' });
  wLabel(GG, 'needed', { x: gx + 112, y: yN + 8, size: 24, fill: COL.chalk, anchor: 'start', weight: 700, o: 1 });
  const status = wLabel(p, '', { x: gx, y: 830, size: 28, weight: 700, o: 0 }); show(status, tF + .5, .4);
  // swing: the thermostat comes back beside the gauge
  const DG = G(p, { o: 0 }); show(DG, tS + 2, .6);
  const dl = dial(DG, { x: 1460, y: 420, s: .55, readout: false });
  wLabel(DG, 'like a thermostat', { x: 1460, y: 520, size: 24, fill: COL.dim, weight: 600, o: 1 });
  clockRun(t => {
    const L = LAt(t), h = Math.round((gb - gt - 20) * L);
    cAttr(lev, 'y', gb - 10 - h); cAttr(lev, 'height', h);
    dots.forEach((d, i) => mO(d, mRamp(dotY(i) - (gb - 10 - h), -14, 14)));
    const offs = THR3.map(th => ss((L - th) / .08 + .5));
    ens.forEach(({ en, il, x }, i) => {
      const k = offs[i];
      en.bend(k).tint(.4 * k);
      cSet(il, { x: x + 62 + 70 * (1 - k), y: 690 + 42 + 60 * (1 - k), o: k });
    });
    const mean = (offs[0] + offs[1] + offs[2]) / 3;
    fs.set({ t, off: mean, loop: 1, ride: 0 });
    const sk = L > .64 ? 2 : L < .46 ? 0 : 1;
    setT(status, ['running low: enzyme 1 working', 'about what is needed', 'plenty: enzyme 1 switched off'][sk]);
    cAttr(status, 'fill', [GREEN, COL.chalk, RED][sk]);
    dl.set(17 + 6 * L);
  }, D);
}],

/* ---------- wrap ---------- */
['wrap', 'The chapter in one picture', (m, D) => {
  const p = panel(0), tR = m('recap'), tG = m('reg'), tE = m('end');
  const st = pathwayStrip(p, { x: 820, y: 240, w: 1100, dirs: [1, -1, 1], drop: 60, names: ['starting molecule', '', '', ''] });
  const prL = wLabel(p, 'product', { size: 24, fill: COL.dim, weight: 600, o: 1 });
  const c2 = cue('wrap', 2), c4 = cue('wrap', 4), c5 = cue('wrap', 5), c6 = cue('wrap', 6);
  const tDn = c2, tAt = c2 + 1.8, tEn = c2 + 4.2;
  say(p, 'a network of pathways', 820, 56, tR + .3, { size: 30, weight: 700 });
  const RG = G(p);
  pill(RG, 'energy flows downhill', 290, 488, tDn + .2, { size: 26, color: MC.exo, edge: MC.exo });
  pill(RG, 'ATP pays for uphill work', 800, 488, tAt + .2, { size: 26, color: MC.spark, edge: MC.spark });
  pill(RG, 'enzymes lower the activation energy', 1290, 488, tEn + .2, { size: 26, color: MC.enzyme, edge: MC.enzyme });
  hide(RG, c6 - .3, .4);
  pill(p, 'feedback inhibition: the end product switches off its pathway', 800, 488, c6 + .2, { size: 28, color: MC.stop, edge: MC.stop });
  // regulation: two cards
  const C1 = G(p, { o: 0 }), C2 = G(p, { o: 0 }); show(C1, c4, .5); show(C2, c5, .5);
  mk('rect', { x: 130, y: 540, width: 640, height: 300, rx: 22, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, C1);
  mk('rect', { x: 830, y: 540, width: 640, height: 300, rx: 22, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, C2);
  const eb = enzymeBlob(C1, { x: 300, y: 690, R: 80, socket: true });
  const rb = regBall(C1, GREEN, { r: 16, o: 0 });
  wLabel(C1, 'a regulator binds', { x: 560, y: 650, size: 28, weight: 700, o: 1 });
  wLabel(C1, 'away from the active site', { x: 560, y: 688, size: 26, weight: 600, fill: COL.dim, o: 1 });
  wLabel(C1, 'and holds one form', { x: 560, y: 724, size: 26, weight: 600, fill: COL.dim, o: 1 });
  const ae = allostericEnzyme(C2, { x: 1000, y: 690, R: 52 });
  wLabel(C2, 'cooperativity', { x: 1290, y: 650, size: 28, weight: 700, fill: MC.sub, o: 1 });
  wLabel(C2, 'amplifies activity', { x: 1290, y: 688, size: 26, weight: 600, fill: COL.dim, o: 1 });
  clockRun(t => {
    st.tilt(mRamp(t, tDn, tDn + 1.2));
    st.spark(1, mRamp(t, tAt, tAt + .8));
    st.focus(['enzymes'], mRamp(t, tEn, tEn + .4) * (1 - mRamp(t, tG, tG + .4)));
    st.flow(t, 1);
    st.feedback(mRamp(t, c6, c6 + 3));
    const pq = st.pt('product'); cSet(prL, { x: pq[0], y: pq[1] - 66 });
    const k = io(mRamp(t, c4 + .6, c4 + 1.8));
    cSet(rb, { x: 300 + 80 + 90 * (1 - k), y: 690 + 54 + 60 * (1 - k), o: mRamp(t, c4 + .4, c4 + .6) });
    eb.fit(.6 * k);
    ae.coop(mRamp(t, c5 + .4, c5 + 3));
  }, D);
  say(p, 'Now try the chapter practice.', 800, 878, tE + .2, { size: 30, fill: WC.bond });
}],

/* ---------- final1 ---------- */
['final1', 'Chapter practice', (m, D) => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  const PCX = 1270;
  // a compact pathway for the feedback pictures: threonine … isoleucine
  const mini = (g, pose) => {
    const s = .68, fs = fbScene(g, { x: PCX - s * 785, y: 300 - s * 300, s, w: 600, labels: ['threonine', '…', 'isoleucine'], enzymes: ['enzyme 1', 'enzymes 2–5'], endName: false });
    fs.set(pose); return fs;
  };
  at('ways', g => {
    wLabel(g, 'two ways to avoid chaos?', { x: PCX, y: 150, size: 28, weight: 700, o: 1 });
    geneBar(g, { x: PCX, y: 300 }).set(1);
    enzymeBlob(g, { x: PCX, y: 620, R: 100, socket: true }).fit(.5);
    wLabel(g, '?', { x: PCX + 170, y: 640, size: 64, weight: 800, fill: MC.atp, o: 1 });
  });
  at('effect', g => {
    allostericEnzyme(g, { x: PCX, y: 280, R: 62 }).set({ form: 1 });
    allostericEnzyme(g, { x: PCX, y: 640, R: 62 }).set({ form: 0 });
    wLabel(g, 'active form', { x: PCX, y: 440, size: 28, weight: 700, fill: MC.enzyme, o: 1 });
    wLabel(g, 'inactive form', { x: PCX, y: 800, size: 28, weight: 700, fill: '#a7b096', o: 1 });
  });
  at('count', g => {
    const fs = mini(g, { off: 1, loop: 1, ride: 1, flow: 0 });
    badge(g, '?', fs.E[0] * .68 + PCX - .68 * 785 + 70, fs.E[1] * .68 + 300 - .68 * 300 - 70, { o: 1 });
    allostericEnzyme(g, { x: PCX, y: 640, R: 62 }).set({ form: 1 });
    wLabel(g, 'subunits?', { x: PCX, y: 820, size: 26, fill: COL.dim, o: 1 });
  });
  at('coop', g => {
    allostericEnzyme(g, { x: PCX, y: 440, R: 95 }).set({ form: .15, sub: [1, 0, 0, 0] });
    wLabel(g, 'one substrate bound', { x: PCX, y: 720, size: 28, fill: MC.sub, weight: 700, o: 1 });
    wLabel(g, 'what next?', { x: PCX, y: 760, size: 26, fill: COL.dim, o: 1 });
  });
  at('used', g => {
    mini(g, { off: 0, loop: 1, ride: 0, flow: 0 });
    const lv = G(g, { x: PCX, y: 620 });
    mk('rect', { x: -60, y: -110, width: 120, height: 220, rx: 18, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, lv);
    mk('rect', { x: -50, y: 70, width: 100, height: 30, rx: 8, fill: ISO, 'fill-opacity': .4 }, lv);
    wLabel(lv, 'isoleucine used up', { y: 150, size: 26, fill: ISO, weight: 700, o: 1 });
    wLabel(g, '?', { x: PCX + 150, y: 640, size: 64, weight: 800, fill: MC.atp, o: 1 });
  });
  at('why', g => {
    mini(g, { off: 1, loop: 1, ride: 1, flow: 0 });
    for (let i = 0; i < 12; i++) molChip(g, 'Ile', ISO, { size: 40, x: PCX - 90 + 46 * (i % 4), y: 560 + 46 * Math.floor(i / 4) });
    wLabel(g, 'enough isoleucine', { x: PCX, y: 740, size: 28, fill: ISO, weight: 700, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('ways');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-ways', prompt: ['How can a cell keep its pathways from ending in chemical chaos?'],
    build: withPic('ways', choice([['By stopping all of its enzymes'], ['By running only one pathway at a time'], ['By switching enzyme genes on or off, or by regulating enzyme activity'], ['By heating itself up']], 2,
      'Right. A cell regulates its pathways by switching genes for enzymes on or off, or by regulating the activity of the enzymes it has.',
      ['A cell needs its enzymes: with all of them stopped, its chemistry would stop too.',
       'A cell runs many pathways at once; it regulates them instead.', null,
       'Heat would not regulate anything, and too much heat denatures enzymes.'])) },
  { id: 'p-effect', prompt: ['Which form does each one stabilize?'],
    build: withPic('effect', grid([
      { parts: ['An activator'], ans: ['a'], why: 'Active form.' },
      { parts: ['An inhibitor'], ans: ['i'], why: 'Inactive form.' },
      { parts: ['Red: sites don’t work'], ans: ['i'], why: 'Inactive form: an inhibitor.' },
    ], [['a', 'active', null, 'A'], ['i', 'inactive', null, 'I']], { multi: false, text: true })) },
  { id: 'p-count', prompt: ['Fill in the numbers.'],
    build: withPic('count', blanks([
      { parts: ['Isoleucine switches off enzyme ', { box: '1' }], why: 'Enzyme 1, threonine deaminase, the first step: switching it off stops the whole pathway.', hint: 'Which enzyme takes the very first step?' },
      { parts: ['Intermediates before isoleucine: ', { box: '4' }], why: 'Four: A, B, C and D.', hint: 'They are named with letters, starting at A.' },
      { parts: ['Subunits in the enzyme: ', { box: '4' }], why: 'Four polypeptide subunits, each with an active site.', hint: 'Count the subunits round the regulatory site.' },
    ])) },
  { id: 'p-coop', prompt: ['In cooperativity, what happens when one substrate binds one active site?'],
    build: withPic('coop', choice([['It blocks the other active sites.'], ['It ends the pathway.'], ['It stabilizes the active form, so the other active sites act on substrate more readily.'], ['Nothing: each site works on its own.']], 2,
      'Right. One substrate primes the whole enzyme: the active form is stabilized and activity is amplified.',
      ['That would be inhibition. Cooperativity is a kind of activation.',
       'Cooperativity amplifies activity; it does not stop anything.', null,
       'Binding at one site does change the others: that is why cooperativity counts as allosteric.'])) },
  { id: 'p-used', prompt: ['The cell uses up its isoleucine. What happens next?'],
    build: withPic('used', choice([['The pathway stays off for good.'], ['Enzyme 1 is destroyed.'], ['Isoleucine lets go of enzyme 1, its active site is available again, and the pathway restarts.'], ['Threonine runs out and the pathway stops.']], 2,
      'Right. Feedback inhibition is reversible: with isoleucine gone, enzyme 1 works again and more isoleucine is made.',
      ['The inhibition is reversible: it lasts only while isoleucine is bound.',
       'Enzyme 1 was only switched off, not destroyed.', null,
       'Nothing stops threonine now: with enzyme 1 free, it is converted again.'])) },
  { id: 'p-why', prompt: ['Why is feedback inhibition useful to the cell?'],
    build: withPic('why', choice([['It speeds the pathway up when there is plenty of product.'], ['It makes enzyme 1 bind more substrate.'], ['It destroys the extra product.'], ['It stops the cell wasting resources making more product than it needs.']], 3,
      'Right. When there is enough end product, the pathway switches itself off, and no chemical resources are wasted.',
      ['The opposite: plenty of product slows the pathway down.',
       'Switched off, enzyme 1 can no longer convert threonine at all.',
       'The product is kept; only the pathway that makes it is switched off.', null])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };

boot();
</script>
