<script>
'use strict';
// Biology, Chapter 8 (An Introduction to Metabolism), lesson 3: a ball on a ledge, then a cell and the shared pathway
// strip with its energy drop lit; free energy and ΔG = ΔH − TΔS with a worked example; free energy as instability,
// equilibrium (ΔG = 0, no work); exergonic and endergonic diagrams; a sealed flask settles, a cell never does; the three
// water systems; a summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-08/lesson-03.md.
const CHAPTER = { number: 803, label: '8, lesson 3', title: 'Free Energy, Stability and Equilibrium', minutes: 7, language: 'en', lead: false, next: '../lesson-04/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const BOARD = '#0b1828';
const GREEN = '#5bbf5b';
// A label (centred text) with a leader to the thing it names; returns the group (it fades in at t0).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 600, sub, subFill = COL.dim } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size);
  wLabel(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  if (sub) wLabel(g, sub, { x: tx, y: ty + size * 1.05, size: size * .8, fill: subFill, weight: 500, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + (sub ? size * 1.05 + size * .3 : size * .3); }
  else { sx = tx; sy = ty - size * 1.05; }
  if (ax !== null) { path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 }); mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g); }
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0.
function banner(p, a, b, x, y, t0, { color = COL.chalk, size = 40 } = {}) {
  const g = G(p, { o: 0 });
  wLabel(g, a, { x, y, size, weight: 700, fill: color, o: 1 });
  if (b) wLabel(g, b, { x, y: y + size * .95, size: size * .62, fill: COL.dim, weight: 500, o: 1 });
  show(g, t0, .5);
  return g;
}
// A rounded pill with one line of text, centred at x, y.
function pill(p, str, x, y, { size = 30, color = COL.chalk, edge, o = 0, fill = '#0b1626', pad = 28 } = {}) {
  const g = G(p, { o }), w = uiW(str, size) * 1.08 + pad * 2, h = size * 1.7;
  mk('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: h / 2, fill, stroke: edge || color, 'stroke-width': 2.5 }, g);
  wLabel(g, str, { x, y: y + size * .36, size, weight: 700, fill: color, o: 1 });
  return g;
}
const board = (g, x, y, w, h) => mk('rect', { x, y, width: w, height: h, rx: 22, fill: BOARD, stroke: COL.faint, 'stroke-width': 3 }, g);
// Text whose content is set only when it changes.
function setText(e, str) { if (e._txt !== str) { e.textContent = str; e._txt = str; } }
// A vertical bar whose height is set from a value; origin at the base, growing up (dir −1) or down (dir 1).
function meter(p, x, y, { w = 44, H = 300, color = MC.exo, dir = -1, frame = true } = {}) {
  const g = G(p);
  if (frame) mk('rect', { x: x - w / 2 - 4, y: dir < 0 ? y - H - 4 : y, width: w + 8, height: H + 4, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2.5 }, g);
  const bar = mk('rect', { x: x - w / 2, y, width: w, height: 0, rx: 5, fill: color }, g);
  return Object.assign(g, {
    set(k) { const hh = Math.round(H * mClamp(k)); cAttr(bar, 'height', hh); cAttr(bar, 'y', dir < 0 ? y - hh : y); return g; },
  });
}

/* ---------- local pieces: a sealed flask, a small cell with materials in and out, a paddle wheel ---------- */
// The flask: origin at its base centre. .set(f) f 0..1 of the reactants converted up to the equilibrium mix.
function flaskArt(p, { x = 0, y = 0, s = 1, o = 1, n = 18, conv = 11 } = {}) {
  const g = G(p, { x, y, s, o });
  const outline = 'M-40 -330V-235L-170 -30Q-185 0 -150 0H150Q185 0 170 -30L40 -235V-330';
  path(g, outline + 'Z', { fill: '#1a3556', stroke: 'none' });
  path(g, 'M-138 -40L-30 -205H30L138 -40Q148 -14 120 -12H-120Q-148 -14 -138 -40Z', { fill: '#2a5a8a', 'fill-opacity': .55 });
  path(g, outline, { stroke: '#a9c2df', 'stroke-width': 6 });
  mk('rect', { x: -52, y: -372, width: 104, height: 50, rx: 10, fill: '#8f6a48', stroke: '#5e432c', 'stroke-width': 3 }, g);   // the stopper
  const pts = [[-90, -40], [-40, -55], [10, -38], [60, -52], [105, -36], [-110, -78], [-62, -100], [-10, -88], [42, -104], [88, -84],
    [-70, -140], [-22, -150], [28, -136], [60, -168], [-30, -190], [8, -112], [-118, -30], [120, -70]].slice(0, n);
  const dots = pts.map(([px, py], i) => {
    const d = G(g, { x: px, y: py });
    const a = mk('circle', { r: 14, fill: MC.sub, stroke: MC.subEdge, 'stroke-width': 2.5 }, d);
    const b = mk('rect', { x: -13, y: -13, width: 26, height: 26, rx: 6, fill: MC.prod2, stroke: MC.prod2Edge, 'stroke-width': 2.5 }, d);
    put(b, { o: 0 });
    return { d, a, b, px, py };
  });
  return Object.assign(g, {
    dots,
    set(f, t = 0) {
      const c = Math.round(mClamp(f) * conv), tt = Math.round(t * 15) / 15;
      dots.forEach((q, i) => {
        const on = i < c ? 1 : 0;
        mO(q.a, 1 - on); mO(q.b, on);
        mPose(q.d, q.px + 3 * Math.sin(tt * 2.1 + i * 1.7), q.py + 3 * Math.cos(tt * 1.7 + i * 2.3));
      });
      return g;
    },
  });
}
// A cell with materials coming in on the left and waste and heat leaving on the right; .set(t) runs the flow.
function openCell(p, { x = 0, y = 0, s = 1, o = 1, r = 170, labels = true } = {}) {
  const g = G(p, { x, y, s, o });
  mk('circle', { r, fill: MC.cyto, stroke: CC.membrane, 'stroke-width': 10 }, g);
  mk('circle', { cx: r * .18, cy: r * .12, r: r * .3, fill: CC.nucleo, stroke: CC.env, 'stroke-width': 5 }, g);
  mArrow(g, [-r - 150, -40], [-r - 20, -40], { color: COL.chalk, w: 6, head: 18 });
  mArrow(g, [r + 20, 50], [r + 150, 50], { color: COL.chalk, w: 6, head: 18 });
  const ins = [0, 1, 2].map(() => solute(g, 'sugar', { r: 15 }));
  const outs = [0, 1, 2].map(() => solute(g, 'CO2', { r: 13, label: false }));
  const heat = heatArrow(g, [r * .55, -r * .6], [r + 90, -r - 50], { waves: 2, amp: 9, w: 7, o: 1 });
  if (labels) {
    wLabel(g, 'materials in', { x: -r - 85, y: -70, size: 24, fill: COL.chalk, weight: 600, o: 1 });
    wLabel(g, 'waste out', { x: r + 85, y: 100, size: 24, fill: COL.chalk, weight: 600, o: 1 });
    wLabel(g, 'heat out', { x: r + 105, y: -r - 62, anchor: 'start', size: 24, fill: WC.heat, weight: 600, o: 1 });
  }
  return Object.assign(g, {
    heat,
    set(t) {
      const tt = Math.round(t * 30) / 30;
      ins.forEach((e, i) => { const u = cFrac(tt * .28 + i / 3); mPose(e, mLerp(-r - 150, -r * .35, u), -40 + 8 * Math.sin(u * 6 + i), Math.sin(Math.PI * u)); });
      outs.forEach((e, i) => { const u = cFrac(tt * .28 + i / 3 + .17); mPose(e, mLerp(r * .45, r + 150, u), 50 + 8 * Math.sin(u * 5 + i), Math.sin(Math.PI * u)); });
      return g;
    },
  }).set(0);
}
// A small paddle wheel; .set(deg) turns it.
function paddle(p, { x = 0, y = 0, r = 40, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('rect', { x: -6, y: -r - 34, width: 12, height: r + 34, fill: '#6b7f99' }, g);
  const wh = G(g);
  let d = ''; for (let j = 0; j < 6; j++) { const an = j * Math.PI / 3; d += `M0 0L${cF(Math.cos(an) * r)} ${cF(Math.sin(an) * r)}`; }
  path(wh, d, { stroke: '#e3d2a2', 'stroke-width': 9 });
  mk('circle', { r: 10, fill: '#8f7a48' }, wh);
  return Object.assign(g, { set(deg) { cSet(wh, { r: Math.round(deg * 10) / 10 }); return g; } });
}
// A small water tank pair icon (no turbine), for the practice picture.
function tankIcon(p, { x = 0, y = 0, s = 1, open = false } = {}) {
  const g = G(p, { x, y, s });
  [[-90, -60, 70], [40, 0, 40]].forEach(([tx, ty, lv]) => {
    mk('rect', { x: tx, y: ty - 100, width: 60, height: 100, fill: '#16304f' }, g);
    mk('rect', { x: tx, y: ty - lv, width: 60, height: lv, fill: '#3a8fd0' }, g);
    path(g, `M${tx} ${ty - 100}V${ty}H${tx + 60}V${ty - 100}`, { stroke: '#a9c2df', 'stroke-width': 4 });
  });
  path(g, 'M-30 -70L40 -40', { stroke: '#3a8fd0', 'stroke-width': 10 });
  if (open) {
    path(g, 'M-110 -140H-60V-120', { stroke: '#8fa3bd', 'stroke-width': 9 });
    path(g, 'M-60 -116V-70', { stroke: '#3a8fd0', 'stroke-width': 6, 'stroke-dasharray': '10 6' });
    path(g, 'M100 -10H130V30', { stroke: '#3a8fd0', 'stroke-width': 9 });
  }
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'A ball on a ledge', (m, D) => {
  const p = panel(0), tB = m('ball'), tC = m('cells'), tS = m('strip'), tD = m('drop');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const bs = ballSlope(W, { x: 560, y: 720, w: 860, h: 380, bars: false, o: 0 });
  show(bs, .2, .6);
  const tRoll = tB + 3.1, tStop = tB + 6.7;   // "nudge" … "never rolls back up"
  clockRun(t => bs.set(mRamp(t, tRoll, tStop)), D);
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOLOGY · CHAPTER 8 · LESSON 3', { x: 1260, y: 250, size: 26, fill: COL.dim, o: 1 });
  ['Free energy, stability', 'and equilibrium'].forEach((s, i) => wLabel(ttl, s, { x: 1260, y: 335 + i * 70, size: 52, o: 1 }));
  wLabel(ttl, 'An introduction to metabolism:', { x: 1260, y: 490, size: 26, fill: COL.dim, weight: 500, o: 1 });
  wLabel(ttl, 'which reactions run by themselves', { x: 1260, y: 526, size: 26, fill: COL.dim, weight: 500, o: 1 });
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tC - .2, .5);
  // ball: high and unstable; a nudge; it rolls down and stays
  const l1 = tag(W, 'high: unstable', [300, 200], [222, 300], tB + 1.4, { size: 32, weight: 700, fill: MC.endo, line: MC.endo });
  const push = G(W, { o: 0 }); mArrow(push, [120, 312], [182, 312], { color: COL.chalk, w: 6, head: 18 });
  wLabel(push, 'nudge', { x: 140, y: 280, size: 22, fill: COL.dim, weight: 600, o: 1 });
  show(push, tRoll - .5, .3); hide(push, tRoll + .5, .3);
  const l2 = say(W, 'low: stable', 940, 790, tStop - 1.1, { size: 32, weight: 700, fill: MC.exo });
  const l3 = say(W, 'it never rolls back up on its own', 560, 850, tB + 5.4, { size: 26, fill: COL.dim, weight: 500 });
  [l1, l2, l3].forEach(e => hide(e, tC, .4));
  // cells: a cell; the camera pushes into its cytoplasm
  hide(bs, tC, .5);
  const cm = cellMap(W, { kind: 'animal', x: 800, y: 450, s: .62, o: 0 });
  show(cm, tC + .2, .6);
  prog(k => cm.focus('cytoplasm', k), tC + .6, .7, io);
  const [cx, cy] = cm.pt('mitochondria');
  const lc = tag(p, 'inside: the cell’s chemistry', [cx, cy - 150], [cx, cy - 20], tC + .9, { size: 30, weight: 700 });
  hide(lc, tC + 2, .3);
  cam.to({ x: cx, y: cy, z: 4 }, tC + 2, tS - tC - 2.1);
  hide(cam.el, tS - .4, .35);
  // strip: the shared pathway strip; drop: free energy falls along it, step by step
  const ps = pathwayStrip(p, { x: 840, y: 420, w: 1100, o: 0 });
  show(ps, tS, .3);
  ps.tilt(1);
  const ap = [1, 2, 3].map(i => ps.pt('arrow' + i));
  ps.tilt(0);
  dotOrder(ps);
  clockRun(t => {
    ps.build(io(mRamp(t, tS, tS + 1.5)));
    ps.focus(['molecules'], 1 - io(mRamp(t, tD + .4, tD + 1)));
    ps.tilt(io(mRamp(t, tD + .4, tD + 2.2)));
    ps.flow(t, mRamp(t, tD + 2.6, tD + 3.2));
  }, D);
  ap.forEach(([x, y], i) => { const c = wChem(p, 'ΔG < 0', { x: x + 30, y: y + 64, size: 26, fill: MC.exo, weight: 700, o: 0 }); show(c, tD + 3.3 + .3 * i, .3); });
  say(p, 'each step: downhill', 840, 720, tD + 3.6, { size: 30, weight: 700, fill: MC.exo });
  banner(p, 'free energy decides', 'whether a step runs by itself', 840, 800, tD + 5.4, { size: 36 });
}],

/* ---------- formula ---------- */
['formula', 'ΔG = ΔH − TΔS', (m, D) => {
  const p = panel(0), tF = m('free'), tE = m('eq'), tK = m('kelvin'), tN = m('neg'), tX = m('ex'), tM = m('more');
  // free: the definition, top left; a cell with one temperature everywhere, right
  say(p, 'Free energy, G', 90, 100, tF + .1, { size: 44, weight: 700, anchor: 'start', fill: MC.spark });
  say(p, 'the energy of a system that can do work', 90, 146, tF + 2.6, { size: 28, anchor: 'start' });
  say(p, 'when temperature and pressure are uniform, as in a cell', 90, 184, tF + 4.1, { size: 24, anchor: 'start', fill: COL.dim, weight: 500 });
  const cellG = G(p, { o: 0 }); show(cellG, tF + 6.6, .5); hide(cellG, tE + 3.2, .4);
  mk('circle', { cx: 1290, cy: 310, r: 140, fill: MC.cyto, stroke: CC.membrane, 'stroke-width': 9 }, cellG);
  [[1230, 270], [1340, 250], [1300, 360], [1210, 370], [1370, 330]].forEach(([x, y], i) => wLabel(cellG, '37 °C', { x, y, size: 22, fill: i % 2 ? '#ffb070' : '#ffcf99', weight: 600, o: 1 }));
  wLabel(cellG, 'a living cell: the same', { x: 1290, y: 500, size: 26, weight: 600, o: 1 });
  wLabel(cellG, 'temperature and pressure throughout', { x: 1290, y: 534, size: 26, weight: 600, o: 1 });
  // eq: the equation, built term by term in a card
  const card = G(p, { o: 0 }); show(card, tF + 9.9, .4);
  mk('rect', { x: 80, y: 220, width: 880, height: 330, rx: 24, fill: BOARD, stroke: COL.faint, 'stroke-width': 3 }, card);
  const SZ = 88, EY = 400, terms = [['ΔG', MC.spark, tF + 10.1], ['=', COL.chalk, tE + .9], ['ΔH', '#ffcf6a', tE + 1.3], ['−', COL.chalk, tE + 2.5], ['T', '#ff8a76', tE + 2.9], ['ΔS', '#d9d1bd', tE + 3.6]];
  const gap = 30, widths = terms.map(([s]) => uiW(s, SZ) * 1.06), tot = widths.reduce((a, b) => a + b, 0) + gap * (terms.length - 1);
  let xx = 520 - tot / 2; const cxs = [];
  terms.forEach(([s, col, t0], i) => { cxs.push(xx + widths[i] / 2); const e = wLabel(p, s, { x: xx + widths[i] / 2, y: EY, size: SZ, weight: 800, fill: col, o: 0 }); show(e, t0, .3); xx += widths[i] + gap; });
  tag(p, 'change in total energy', [cxs[2] - 50, 480], [cxs[2], EY + 14], tE + 4.7, { size: 26, fill: '#ffcf6a', line: '#ffcf6a', sub: '(enthalpy)' });
  tag(p, 'change in entropy', [cxs[5] + 50, 480], [cxs[5], EY + 14], tE + 9, { size: 26, fill: '#d9d1bd', line: '#d9d1bd', sub: '(disorder)' });
  tag(p, 'temperature, in kelvin', [cxs[4] - 10, 270], [cxs[4], EY - 66], tE + 12.7, { size: 26, fill: '#ff8a76', line: '#ff8a76' });
  // ΔS: rows of dots that scatter (more disorder)
  const dotsG = G(p, { o: 0 }); show(dotsG, tE + 3.5, .4);
  const ed = entropyDots(dotsG, { x: 1290, y: 300, w: 440, h: 260, n: 36, seed: 5 });
  wLabel(dotsG, 'entropy, S: order → disorder', { x: 1290, y: 470, size: 26, fill: '#d9d1bd', weight: 600, o: 1 });
  // kelvin: a thermometer at body temperature
  const kg = G(p, { o: 0 }); show(kg, tK + .2, .4); hide(kg, tX - .2, .4);
  const th = thermometer(kg, { x: 1090, y: 790, h: 210, min: 0, max: 50, size: 30 }); th.set(37);
  wLabel(kg, '37 °C = 310 K', { x: 1150, y: 690, size: 40, weight: 800, anchor: 'start', o: 1 });
  wLabel(kg, 'kelvin = °C + 273', { x: 1150, y: 734, size: 26, fill: COL.dim, weight: 500, anchor: 'start', o: 1 });
  // neg: the rule
  const rule = pill(p, 'only a negative ΔG is spontaneous', 520, 612, { size: 32, color: MC.exo }); show(rule, tN + 2.2, .4);
  say(p, 'and a spontaneous process can be harnessed to do work', 520, 682, tN + 6.9, { size: 24, fill: COL.dim, weight: 500 });
  // ex: made-up numbers; more: a bigger TΔS
  const ex = G(p, { o: 0 }); show(ex, tX + .1, .4);
  wLabel(ex, 'worked example (made-up numbers, kcal/mol)', { x: 100, y: 730, size: 24, fill: COL.dim, weight: 600, anchor: 'start', o: 1 });
  const rH = say(p, 'ΔH = −5', 100, 784, tX + 3.1, { size: 34, weight: 700, anchor: 'start', fill: '#ffcf6a' });
  const rS = say(p, 'TΔS = +3', 330, 784, tX + 6.6, { size: 34, weight: 700, anchor: 'start', fill: '#d9d1bd' });
  const rG = say(p, 'ΔG = −5 − 3 = −8', 100, 846, tX + 9.4, { size: 40, weight: 800, anchor: 'start', fill: MC.exo });
  const rN = say(p, 'negative: it runs by itself', 640, 846, tX + 14.1, { size: 26, weight: 700, fill: MC.exo });
  // the ΔG gauge, right: down from zero, as the numbers are read
  const gg = G(p, { o: 0 }); show(gg, tX + 9.3, .4);
  path(gg, 'M1180 600H1400', { stroke: COL.chalk, 'stroke-width': 3 });
  wLabel(gg, '0', { x: 1166, y: 609, size: 24, anchor: 'end', fill: COL.dim, o: 1 });
  wLabel(gg, 'ΔG', { x: 1290, y: 580, size: 30, weight: 700, fill: MC.exo, o: 1 });
  const gm = meter(gg, 1290, 600, { w: 70, H: 220, color: MC.exo, dir: 1, frame: false });
  const gv = wLabel(gg, '', { x: 1345, y: 660, size: 30, weight: 800, anchor: 'start', fill: MC.exo, o: 1 });
  const tTS = t => Math.round(3 + 3 * io(mRamp(t, tM + .7, tM + 2.4)));
  clockRun(t => {
    ed.set(.55 * io(mRamp(t, tE + 9, tE + 11)) + .45 * io(mRamp(t, tM + .7, tM + 2.4)), t);
    const v = tTS(t), dg = -(5 + v);
    setText(rS, 'TΔS = +' + v);
    setText(rG, `ΔG = −5 − ${v} = −${5 + v}`);
    const shown = t < tX + 10.9 ? 0 : t < tX + 12 ? -5 : dg;
    gm.set(-shown / 14); setText(gv, shown ? '−' + (-shown) : '');
  }, D);
  say(p, 'more disorder: ΔG more negative', 1290, 860, tM + 2.5, { size: 26, weight: 700, fill: '#d9d1bd' });
}],

/* ---------- stable ---------- */
['stable', 'Instability and equilibrium', (m, D) => {
  const p = panel(0), tI = m('inst'), tDn = m('down'), tEq = m('equil'), tW = m('nowork');
  const bs = ballSlope(p, { x: 620, y: 740, w: 1000, h: 460, bars: false });
  mArrow(p, [70, 780], [70, 220], { color: COL.dim, w: 4, head: 16 });
  const ax = G(p, { x: 46, y: 500, r: -90 }); wLabel(ax, 'free energy', { size: 24, fill: COL.dim, o: 1 });
  // the paddle wheel, where the ball rolls under it at mid-slope
  const KW = .5, ptAt = k => { bs.set(k); return bs.pt('ball'); };
  const [wx, wy] = ptAt(KW), [ax1, ay1] = ptAt(KW - .02), [ax2, ay2] = ptAt(KW + .02); bs.set(0);
  const nl = Math.hypot(ax2 - ax1, ay2 - ay1) || 1, nx = (ay2 - ay1) / nl, ny = -(ax2 - ax1) / nl;   // the slope's upward normal

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// A flow dot passing (0, 0) loses its transform attribute and gets it back after its opacity, so a played and a seeked
// frame would differ in attribute order: put every dot through (0, 0) once now, so all of them carry opacity first.
function dotOrder(ps) { ps.arrows.forEach(a => a.querySelectorAll('circle').forEach(c => put(c, { x: 0, y: 0 }))); ps.flow(0, 0); }
// Reactants / Products for an energyDiagram drawn with lab: 0 (the kit puts both under their plateaus, where the curve
// crosses a long label at the high end): the high level's label stands above its line (clear of the ball), the low level's below.
function diaLabels(p, d, r, pp, size) {
  const [ox, oy] = [st(d).x, st(d).y], sc = st(d).s;
  const at = (u, lv, up, anchor, str) => wLabel(p, str, { x: ox + sc * d.X(u), y: oy + sc * (d.Y(lv) + (up ? -46 : size * 1.25)), size: size * sc, anchor, o: 1 });
  at(0, r, r > pp, 'start', 'Reactants'); at(1, pp, pp > r, 'end', 'Products');
}
// The ball's roll, rounded like the kit's own k, so a seek and a step draw the same frame.
function rkB(k) { return Math.round(mClamp(k) * 2000) / 2000; }
// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
