'use strict';
// Biology, Chapter 8 (An Introduction to Metabolism), lesson 4: a rechargeable battery, then a cell and the shared
// pathway strip with an ATP spark beside its uphill step; the three kinds of work and energy coupling; ATP's parts;
// hydrolysis to ADP + Pᵢ and where the energy comes from (the drop in free energy); the worked glutamine coupling
// (+3.4, −7.3, net −3.9 kcal/mol, a phosphorylated intermediate); transport and mechanical work; the ATP cycle; practice.
// Plan, errata and beats: books/biology/chapters/chapter-08/lesson-04.md.
const CHAPTER = { number: 804, label: '8, lesson 4', title: 'ATP and Energy Coupling', minutes: 7, language: 'en', lead: false, next: '../lesson-05/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const rk = k => Math.round(mClamp(k) * 2000) / 2000;
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
// A label (centred text) with a leader to the thing it names; returns the group (it fades in at t0; null: shown).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 600, sub, subFill = COL.dim } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size);
  wLabel(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  if (sub) wLabel(g, sub, { x: tx, y: ty + size * 1.05, size: size * .8, fill: subFill, weight: 500, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + (sub ? size * 1.05 + size * .3 : size * .3); }
  else { sx = tx; sy = ty - size * 1.05; }
  path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 }); mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g);
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0.
function banner(p, a, b, x, y, t0, { color = COL.chalk, size = 40, subColor = COL.dim } = {}) {
  const g = G(p, { o: 0 });
  wLabel(g, a, { x, y, size, weight: 700, fill: color, o: 1 });
  if (b) wLabel(g, b, { x, y: y + size * .95, size: size * .62, fill: subColor, weight: 500, o: 1 });
  show(g, t0, .5);
  return g;
}
// A numbered step badge; .t is its text, .disc its circle.
function badge(p, str, x, y, { o = 0, r = 24 } = {}) {
  const g = G(p, { x, y, o });
  const disc = mk('circle', { r, fill: '#3b8fd9', stroke: '#cfe6ff', 'stroke-width': 3 }, g);
  const t = wLabel(g, str, { y: r * .4, size: r * 1.15, fill: '#ffffff', weight: 800, o: 1 });
  return Object.assign(g, { t, disc });
}
// Text whose content is set only when it changes.
function setText(e, str) { if (e._txt !== str) { e.textContent = str; e._txt = str; } }
// Piecewise-linear map of t through [[t, v], …] (flat outside).
function lerpTable(tab, t) {
  if (t <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) if (t < tab[i][0]) { const [a, va] = tab[i - 1], [b, vb] = tab[i]; return va + (vb - va) * (t - a) / (b - a); }
  return tab[tab.length - 1][1];
}
// A dark rounded card.
const boardCard = (g, x, y, w, h, stroke = COL.faint) => mk('rect', { x, y, width: w, height: h, rx: 22, fill: '#0b1828', stroke, 'stroke-width': 3 }, g);
// A plain arrow from a to b, drawn on.
const arrowAB = (p, a, b, color, o = {}) => mArrow(p, a, b, { color, w: 6, head: 20, ...o });
// The pump's ATP chip fades out before its ADP chip fades in (the kit crossfades them on one spot, q 1.5 to 1.6).
const atpThenAdp = (pu, k) => { const q = rk(k) * 6; mO(pu.atp, q < 1.45 ? 1 : 1 - mRamp(q, 1.45, 1.5)); };
// The pump's third Na⁺ leaves to NA3OUT, not the kit's spot (85, −148), which lies on the second K⁺'s way in.
const NA3OUT = [55, -150];
const na3Out = (pu, k) => { const l = io(mRamp(rk(k) * 6, 2.65, 3)); if (l > 0) mPose(pu.na[2], mLerp(0, NA3OUT[0], l), mLerp(38, NA3OUT[1], l)); };

/* ---------- page pieces ---------- */
// The backdrop: a rechargeable battery wired to a small bulb; .set(t) its charge rises and falls (pure in t).
function battery(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M0 -172V-230H260V-86M0 172V230H260V34', { stroke: '#8fa3bd', 'stroke-width': 6 });
  mk('rect', { x: -30, y: -176, width: 60, height: 26, rx: 6, fill: '#c8d2de' }, g);
  mk('rect', { x: -84, y: -154, width: 168, height: 330, rx: 26, fill: '#16263c', stroke: COL.chalk, 'stroke-width': 6 }, g);
  const H = 300, lvl = mk('rect', { x: -68, y: 162, width: 136, height: 0, rx: 14, fill: '#5bbf5b' }, g);
  path(g, 'M12 -60L-30 20H4L-14 92L34 2H0L18 -60Z', { fill: '#fff6d8', 'fill-opacity': .85, stroke: '#14233a', 'stroke-width': 3 });
  wLabel(g, '+', { x: 0, y: -186, size: 30, fill: '#14233a', weight: 800, o: 1 });
  // the bulb it powers
  const bulb = G(g, { x: 260, y: -40 });
  const glow = mk('circle', { r: 86, fill: '#ffe9a6', 'fill-opacity': .22 }, bulb);
  const glass = mk('circle', { r: 46, fill: '#ffe9a6', stroke: '#c8b47a', 'stroke-width': 4 }, bulb);
  mk('rect', { x: -22, y: 40, width: 44, height: 34, rx: 6, fill: '#8fa3bd' }, bulb);
  const read = wLabel(g, '', { x: 0, y: 236 + 60, size: 30, weight: 700, o: 1 });
  let lastL = -1;
  return Object.assign(g, {
    set(t) {
      t = Math.round(t * 60) / 60;
      const L = Math.round((.52 + .4 * Math.cos(t * .75)) * 200) / 200, spending = Math.sin(t * .75) >= 0;
      if (L !== lastL) {
        lastL = L;
        const h = Math.round(H * L);
        cAttr(lvl, 'height', h); cAttr(lvl, 'y', 162 - h); cAttr(lvl, 'fill', zMix('#e5533d', '#5bbf5b', mRamp(L, .15, .8)));
      }
      mO(glow, spending ? .3 + .7 * L : .05); cAttr(glass, 'fill', spending ? '#ffe9a6' : '#6b6450');
      setText(read, spending ? 'spending: the bulb is lit' : 'charging again');
      return g;
    },
  }).set(0);
}
// The three kinds of work as small moving icons; .set(t) pure in t. kind 'chem' | 'trans' | 'mech'.
function workIcon(p, kind, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  mk('circle', { r: 92, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, g);
  if (kind === 'chem') {
    const a = G(g), b = G(g), bond = path(g, 'M-6 0H6', { stroke: COL.chalk, 'stroke-width': 6 });
    path(a, roundRect(50, 50, 12), { fill: MC.sub, stroke: '#a84d40', 'stroke-width': 3 });
    path(b, roundRect(50, 50, 12), { fill: MC.prod2, stroke: '#b8902e', 'stroke-width': 3 });
    return Object.assign(g, { set(t) { t = Math.round(t * 60) / 60; const u = cFrac(t * .22), j = io(mRamp(u, .15, .45)) * (1 - io(mRamp(u, .88, 1))), d = 31 + 22 * (1 - j); mPose(a, -d, 0, 1); mPose(b, d, 0, 1); mO(bond, j); return g; } }).set(0);
  }
  if (kind === 'trans') {
    const mem = G(g);
    mk('rect', { x: -86, y: -16, width: 62, height: 32, rx: 8, fill: '#c9a4d8' }, mem); mk('rect', { x: 24, y: -16, width: 62, height: 32, rx: 8, fill: '#c9a4d8' }, mem);
    mk('rect', { x: -22, y: -34, width: 44, height: 68, rx: 12, fill: '#7d88e0', stroke: '#4f58a8', 'stroke-width': 3 }, mem);
    mArrow(g, [60, 56], [60, -56], { color: MC.endo, w: 5, head: 16 });
    const sol = solute(g, 'Na', { r: 13, label: false });
    return Object.assign(g, { set(t) { t = Math.round(t * 60) / 60; const u = cFrac(t * .3); mPose(sol, -2, 62 - 124 * io(u), Math.sin(Math.PI * u) ** .5); return g; } }).set(0);
  }
  const wrap = G(g), mp = motorProtein(wrap, { y: 50, s: .42, len: 300, steps: 4 });
  return Object.assign(g, { set(t) { t = Math.round(t * 60) / 60; const u = cFrac(t * .12); mp.walk(u); mO(wrap, Math.min(mRamp(u, 0, .06), 1 - mRamp(u, .94, 1))); return g; } }).set(0);
}
// a rounded rectangle path centred on the origin (page copy; the kit's is internal)
function roundRect(w, h, r) { const x = -w / 2, y = -h / 2; return `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`; }
// A free-energy ladder: axis up at x, a high level and a low level, an orange drop arrow and its value.
function ladder(p, { x = 0, y0 = 700, y1 = 160, hi = 240, lo = 560, w = 220, hiLab = 'ATP + H_2O', loLab = 'ADP + P_i', val = ['ΔG = −7.3', 'kcal/mol'], size = 30, o = 1 } = {}) {
  const g = G(p, { o });
  mArrow(g, [x, y0], [x, y1], { color: COL.chalk, w: 4, head: 16 });
  const yl = G(g, { x: x - 24, y: (y0 + y1) / 2, r: -90 }); wChem(yl, 'free energy, G', { size: size * .8, fill: COL.dim, o: 1 });
  const H = G(g, { o: 0 }), L = G(g, { o: 0 }), A = G(g, { o: 0 }), V = G(g, { o: 0 });
  path(H, `M${x + 30} ${hi}H${x + 30 + w}`, { stroke: COL.chalk, 'stroke-width': 6 });
  wChem(H, hiLab, { x: x + 30 + w / 2, y: hi - 18, size, fill: COL.chalk, weight: 700, o: 1 });
  path(L, `M${x + 30} ${lo}H${x + 30 + w}`, { stroke: COL.chalk, 'stroke-width': 6 });
  wChem(L, loLab, { x: x + 30 + w / 2, y: lo + size * 1.25, size, fill: COL.chalk, weight: 700, o: 1 });
  mArrow(A, [x + 60 + w, hi + 8], [x + 60 + w, lo - 8], { color: MC.exo, w: 7, head: 22 });
  val.forEach((s, i) => wChem(V, s, { x: x + 84 + w, y: (hi + lo) / 2 + (i - (val.length - 1) / 2) * size * 1.2 + size * .35, size, fill: MC.exo, weight: 700, anchor: 'start', o: 1 }));
  return Object.assign(g, { H, L, A, V });
}
// Signed ΔG bars on a zero line: [{v, x, color, label}] stacked when `from` is given; scale px per kcal/mol.
function dgBars(p, bars, { x0 = 0, x1 = 500, y0 = 500, scale = 40, size = 26, zero = true, o = 1 } = {}) {
  const g = G(p, { o });
  if (zero) { path(g, `M${x0} ${y0}H${x1}`, { stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '10 8' }); wLabel(g, '0', { x: x0 - 14, y: y0 + 9, size: 24, anchor: 'end', fill: COL.dim, o: 1 }); }
  const out = bars.map(({ v, from = 0, x, w = 70, color, label, sub }) => {
    const b = G(g, { o: 0 }), yA = y0 - from * scale, yB = y0 - (from + v) * scale;
    const rect = mk('rect', { x: x - w / 2, y: Math.min(yA, yB), width: w, height: Math.abs(yB - yA), rx: 8, fill: color, 'fill-opacity': .85 }, b);
    mArrow(b, [x, yA], [x, yB + (v > 0 ? 6 : -6)], { color: '#0b1626', w: 4, head: 14 });
    const ly = v > 0 ? yB - 16 : yB + size + 8;
    wLabel(b, label, { x, y: ly, size, weight: 800, fill: color, o: 1 });
    if (sub) wLabel(b, sub, { x, y: v > 0 ? ly - size * 1.05 : ly + size * 1.05, size: size * .78, weight: 500, fill: COL.dim, o: 1 });
    return Object.assign(b, { rect, yA, yB });
  });
  return Object.assign(g, { bars: out });
}
// A membrane strip: cytoplasm shading below, the kit's bilayer; origin on the midline.
function memStrip(p, { x = 0, y = 0, w = 600, s = 1, gaps = [], depth = 260, seed = 3, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  mk('rect', { x: -w / 2, y: 46, width: w, height: depth, fill: MC.cyto }, g);
  bilayer(g, { w, gaps, seed, unsat: .3 });
  return g;
}

['cycle', 'The ATP cycle', (m, D) => {
  const p = panel(0), tR = m('renew'), tRg = m('regen'), tCa = m('catab'), tD = m('door'), tWo = m('workout'), tF = m('fast'), tE = m('end'), tS1 = m('s1'), tS2 = m('s2'), tS3 = m('s3');
  const W = G(p, { x: 800, y: 440 });
  const cyc = atpCycle(W, { R: 180, o: 0 }); show(cyc, 0, .4);
  const rn = banner(p, 'ATP is renewable', null, 800, 90, tR + .3, { size: 40, color: MC.spark });
  // u: down the right (hydrolysis) during renew, up the left (regeneration) at regen, then round and round, faster
  const uAt = t => {
    if (t < tRg) return .5 * io(mRamp(t, tR + .4, tRg - .1));
    if (t < tD) return .5 + .5 * io(mRamp(t, tRg + .3, tD - .3));
    const dt = t - tD, x = Math.max(0, dt - (tF - tD)), ramp = x < 3 ? .9 * x * x / 6 : .9 * 1.5 + .9 * (x - 3);
    return 1 + .3 * dt + ramp;
  };
  clockRun(t => cyc.set(uAt(Math.round(t * 120) / 120)), D);
  const rg = say(p, 'a phosphate group is added back onto ADP', 800, 860, tRg + .3, { size: 28, weight: 600 }); hide(rg, tD, .3);
  const [ix, iy] = cyc.pt('in'), [ox, oy] = cyc.pt('out');
  const ci = G(W, { o: 0 }); show(ci, tCa + .3, .3); hide(ci, tCa + 2.2, .3);
  mk('rect', { x: ix - 200, y: iy + 44, width: 400, height: 90, rx: 18, fill: 'none', stroke: MC.exo, 'stroke-width': 3 }, ci);
  const co = G(W, { o: 0 }); show(co, tWo + .3, .3); hide(co, tWo + 2.2, .3);
  mk('rect', { x: ox - 200, y: oy + 44, width: 400, height: 90, rx: 18, fill: 'none', stroke: MC.endo, 'stroke-width': 3 }, co);
  const door = say(p, 'a revolving door', 800, 870, tD + .3, { size: 30, weight: 700 });
  const fast = say(p, 'a busy cell: millions of times a second', 800, 870, tF + .3, { size: 30, weight: 700, fill: MC.spark });
  hide(door, tF, .3); hide(fast, tE, .3); hide(rn, tE, .3);

  const SUM = [['hydrolysis', 'exergonic: ATP → ADP + Pᵢ', MC.exo, tS1], ['coupling', 'drives endergonic work', MC.endo, tS2], ['catabolism', 'recharges ADP + Pᵢ to ATP', MC.spark, tS3]];
  SUM.forEach(([a, b, col, t0], i) => {

}],

      { parts: ['three phosphates'], ans: ['a'], why: 'ATP: triphosphate, three.' },
      { parts: ['two phosphates'], ans: ['d'], why: 'ADP: diphosphate, two.' },
      { parts: ['made by hydrolysis'], ans: ['d'], why: 'ADP: ATP + H₂O → ADP + Pᵢ.' },
      { parts: ['rebuilt by catabolism'], ans: ['a'], why: 'ATP: a phosphate goes back onto ADP.' },
    ], [['a', 'ATP', null, 'A'], ['d', 'ADP', null, 'D']], { multi: false, text: true })) },
  { id: 'p-net', prompt: ['A reaction has ΔG = +5.0 kcal/mol. It is coupled to ATP hydrolysis (−7.3 kcal/mol). What is the net ΔG?'],
    build: withPic('net', choice([['−2.3 kcal/mol, exergonic, so it goes'], ['+12.3 kcal/mol'], ['+2.3 kcal/mol'], ['−12.3 kcal/mol']], 0,
      'Right. +5.0 + (−7.3) = −2.3 kcal/mol. The net ΔG is negative, so the coupled reaction goes.',
      [null, 'That adds the sizes and ignores the sign: −7.3 is a release, so it counts negative.',
        'The sign is wrong: −7.3 is larger than +5.0, so the sum is negative.',
        'That subtracts +5.0 instead of adding it: +5.0 + (−7.3) = −2.3.'])) },
  { id: 'p-inter', prompt: ['In the glutamine reaction, what is the phosphorylated intermediate?'],
    build: withPic('inter', choice([['ATP itself'], ['glutamic acid carrying a phosphate group from ATP'], ['glutamine'], ['the free inorganic phosphate']], 1,
      'Right. In step 1, ATP hands a phosphate group to glutamic acid. That less stable, more reactive molecule is the intermediate.',
      ['ATP is the donor: it gives the phosphate away and becomes ADP.', null,
        'Glutamine is the final product, and it carries no phosphate.',
        'The inorganic phosphate is only released at the end, when ammonia takes its place.'])) },
  { id: 'p-regen', prompt: ['What supplies the energy to rebuild ATP from ADP + Pᵢ?'],
    build: withPic('regen', choice([['anabolic reactions'], ['the hydrolysis of ADP'], ['catabolic reactions in the cell'], ['the water molecule']], 2,
      'Right. Catabolic, exergonic reactions such as cellular respiration release the energy that adds a phosphate back onto ADP.',
      ['Anabolic reactions build molecules: they use ATP, they do not make it.', 'ADP + Pᵢ is what hydrolysis leaves behind; it cannot pay for its own recharge.', null,
        'Water gives no energy; in the cycle it is used in hydrolysis.'])) },
  { id: 'p-order', prompt: ['Number the cycle’s steps, 1 to 4.'],
    build: withPic('order', blanks([
      { parts: ['hydrolysis: ', { box: '1' }], why: 'Step 1: hydrolysis, ATP → ADP + Pᵢ.', hint: 'Start at ATP, the top of the ring.', fx: () => ordFx(0, '1') },
      { parts: ['energy released: ', { box: '2' }], why: 'Step 2: the drop in free energy is released.', hint: 'It follows the split.', fx: () => ordFx(1, '2') },
      { parts: ['work done: ', { box: '3' }], why: 'Step 3: the energy pays for work.', hint: 'The energy is spent before ATP is rebuilt.', fx: () => ordFx(2, '3') },
      { parts: ['recharged: ', { box: '4' }], why: 'Step 4: energy from catabolism remakes ATP.', hint: 'This closes the ring.', fx: () => ordFx(3, '4') },
    ])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }
function ordFx(i, str) { const b = S.ordB?.[i]; if (!b) return; fxp(q => { b.t.textContent = q > 0 ? str : '?'; put(b.lab, { o: q }); }, 0, .3); pulseFx(b, 1.4); }

boot();
</script>
