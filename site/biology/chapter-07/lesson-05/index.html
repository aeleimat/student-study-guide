<script>
'use strict';
// Biology, Chapter 7 (Membrane Structure and Function), lesson 5: a plain gate and a revolving door, then the cell and
// the shared membrane patch with its transport proteins lit; facilitated diffusion (channel, aquaporin, gated channel,
// carrier; passive, downhill); active transport (against the gradient, ATP, a ball rolled uphill); the sodium-potassium
// pump step by step with its counters; a worked case (a gated Na⁺ channel lets sodium in, the pump sends it out);
// a three-way summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-07/lesson-05.md.
const CHAPTER = { number: 705, label: '7, lesson 5', title: 'Facilitated Diffusion and Active Transport', minutes: 7, language: 'en', lead: false, next: '../lesson-06/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const notToScale = (p, x, y, t0) => say(p, 'not to scale', x, y, t0, { size: 22, fill: COL.dim, anchor: 'end', weight: 500 });
const rk = k => Math.round(mClamp(k) * 2000) / 2000;
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const PCX = 1270;
// A label (centred text) with a leader to the thing it names; returns the group (it fades in at t0).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 600, sub, subFill = COL.dim } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size);
  wLabel(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  if (sub) wLabel(g, sub, { x: tx, y: ty + size * 1.05, size: size * .8, fill: subFill, weight: 500, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + (sub ? size * 1.05 + size * .3 : size * .3); }
  else { sx = tx; sy = ty - size * 1.05; }
  if (ax !== null) { path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 }); mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g); }
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A ring that pops in round a point (o 0 before t0; t0 null: shown at once).
function ring(p, [x, y], r, t0, { color = COL.chalk, w = 4 } = {}) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: 'none', stroke: color, 'stroke-width': w }, g);
  if (t0 !== null) { show(g, t0, .3); pulse(g, t0 + .1, 1.12); } else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0.
function banner(p, a, b, x, y, t0, { color = COL.chalk, size = 40 } = {}) {
  const g = G(p, { o: 0 });
  wLabel(g, a, { x, y, size, weight: 700, fill: color, o: 1 });
  if (b) wLabel(g, b, { x, y: y + size * .95, size: size * .62, fill: COL.dim, weight: 500, o: 1 });
  show(g, t0, .5);
  return g;
}
// Points scattered in a box, deterministic, keeping out of the avoid boxes and apart from one another.
function scatter(n, [x0, y0, x1, y1], seed, avoid = [], minD = 46) {
  const pts = [];
  for (let i = 0; pts.length < n && i < n * 80; i++) {
    const x = x0 + (x1 - x0) * wHash(i, seed), y = y0 + (y1 - y0) * wHash(i, seed + 31);
    if (avoid.some(([a, b, c, d]) => x > a && x < c && y > b && y < d)) continue;
    if (pts.some(q => Math.hypot(q[0] - x, q[1] - y) < minD)) continue;
    pts.push([x, y]);
  }
  return pts;
}
// A crowd of solutes at points; .jig(t) jiggles them in place (pure in t).
function crowd(p, kind, pts, { r, label = 'name', amp = 5, o = 1 } = {}) {
  const g = G(p, { o }), list = pts.map(([x, y]) => ({ e: solute(g, kind, { x, y, r, label }), x, y }));
  return Object.assign(g, {
    list,
    jig(t) { t = Math.floor(t * 15) / 15; if (g._jt === t) return g; g._jt = t; list.forEach((q, i) => mPose(q.e, q.x + amp * Math.sin(t * (1.1 + .37 * (i % 5)) + i * 2.1), q.y + amp * Math.cos(t * (.9 + .29 * (i % 4)) + i * 1.3), 1)); return g; },
  });
}
// A flat strip of membrane: the kit's bilayer with the cytoplasm shaded below it; origin on the bilayer's midline.
function strip(p, { x = 800, y = 450, w = 1200, gaps = [], s = 1, depth = 500, o = 1, seed = 2, full = true } = {}) {
  const g = G(p, { x, y, s, o });
  mk('rect', { x: full ? -4000 : -w / 2 - 400, y: 46, width: full ? 8000 : w + 800, height: depth, fill: MC.cyto }, g);
  const bl = bilayer(g, { w, gaps, seed, unsat: .3 });
  return Object.assign(g, { bl });
}
// gaps for strip(): proteins at stage x positions, relative to the strip centre
const gapsAt = (cx, s, list) => list.map(([x, half]) => [(x - cx) / s, half]);
// A numbered step badge; .t is its text, .disc its circle.
function badge(p, str, x, y, { o = 0, r = 24 } = {}) {
  const g = G(p, { x, y, o });
  const disc = mk('circle', { r, fill: '#3b8fd9', stroke: '#cfe6ff', 'stroke-width': 3 }, g);
  const t = wLabel(g, str, { y: r * .4, size: r * 1.15, fill: '#ffffff', weight: 800, o: 1 });
  return Object.assign(g, { t, disc });
}
// An uphill arrow's ATP spark (gradArrow puts it at the arrow's middle, on the membrane) moved to x, y.
const atpAt = (a, x, y) => { mPose(a.atp, x, y, 1); return a; };
// The pump's ATP chip fades out before its ADP chip fades in (the kit crossfades them on one spot, q 1.5 to 1.6).
const atpThenAdp = (pu, k) => { const q = rk(k) * 6; mO(pu.atp, q < 1.45 ? 1 : 1 - mRamp(q, 1.45, 1.5)); };
// The pump's third Na⁺ leaves to NA3OUT, not the kit's spot (85, −148), which lies on the second K⁺'s way in.
const NA3OUT = [55, -150];
const na3Out = (pu, k) => { const l = io(mRamp(rk(k) * 6, 2.65, 3)); if (l > 0) mPose(pu.na[2], mLerp(0, NA3OUT[0], l), mLerp(38, NA3OUT[1], l)); };
// Text whose content is set only when it changes.
function setText(e, str) { if (e._txt !== str) { e.textContent = str; e._txt = str; } }

/* ---------- backdrops (top view): a wall with a plain gate, a wall with a revolving door ---------- */
function gateArt(p, { x = 0, y = 0, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  path(g, 'M-230 0H-62M62 0H230', { stroke: '#c9b27a', 'stroke-width': 16 });
  mk('circle', { cx: -62, cy: 0, r: 12, fill: '#8f7a48' }, g); mk('circle', { cx: 62, cy: 0, r: 12, fill: '#8f7a48' }, g);
  path(g, 'M-62 0L-100 -52M62 0L100 -52', { stroke: '#e3d2a2', 'stroke-width': 9 });   // the two leaves, swung open
  const walkers = G(g), kinds = ['Na', 'sugar', 'K', 'Cl', 'Na', 'sugar'];
  const ws = kinds.map((kd, i) => solute(walkers, kd, { r: 15, label: kd === 'sugar' ? false : 'sign' }));
  return Object.assign(g, {
    walk(t) {
      ws.forEach((e, i) => {
        const u = cFrac(t * .23 + i / ws.length), dir = i % 2 ? -1 : 1;   // both ways, anyone, at any time
        const yy = dir * (-190 + 380 * u), xx = [-30, 22, -8, 36, 4, -40][i];
        mPose(e, xx, yy, Math.sin(Math.PI * u));
      });
      return g;
    },
  }).walk(0);
}
function revolvingDoor(p, { x = 0, y = 0, R = 100, o = 1, s = 1, wall = true } = {}) {
  const g = G(p, { x, y, o, s });
  if (wall) path(g, `M-230 0H${-R}M${R} 0H230`, { stroke: '#c9b27a', 'stroke-width': 16 });
  // housing: arcs on the left and right, open at the top and the bottom
  const a = 50 * Math.PI / 180, arc = sd => `M${cF(sd * R * Math.cos(a))} ${cF(-R * Math.sin(a))}A${R} ${R} 0 0 ${sd > 0 ? 1 : 0} ${cF(sd * R * Math.cos(a))} ${cF(R * Math.sin(a))}`;
  path(g, arc(1) + arc(-1), { stroke: '#a9c6ea', 'stroke-width': 9 });
  const rot = G(g);
  path(rot, `M${-R + 8} 0H${R - 8}M0 ${-R + 8}V${R - 8}`, { stroke: '#e3d2a2', 'stroke-width': 8 });
  mk('circle', { r: 9, fill: '#8f7a48' }, rot);
  const riders = [0, 1].map(i => solute(g, i ? 'Na' : 'sugar', { r: 15, label: i ? 'sign' : false }));
  return Object.assign(g, {
    spin(t) {
      const th = Math.round(t * 36 * 10) / 10;   // degrees, a steady rhythm
      cSet(rot, { r: th });
      riders.forEach((e, i) => { const an = (th + 45 + 180 * i) * Math.PI / 180; mPose(e, R * .55 * Math.cos(an), R * .55 * Math.sin(an), 1); });
      return g;
    },
  }).spin(0);
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'Gates and revolving doors', (m, D) => {
  const p = panel(0), tDo = m('door'), tC = m('cells'), tP = m('patch'), tL = m('lit');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const gate = gateArt(W, { x: 290, y: 470, o: 0 }), door = revolvingDoor(W, { x: 730, y: 470, o: 0 });
  show(gate, .2, .6); show(door, .5, .6);
  clockRun(t => { const u = Math.min(t, tC); gate.walk(u); door.spin(u); }, D);   // still while they fade out, but always written (replay)
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOLOGY · CHAPTER 7 · LESSON 5', { x: 1250, y: 250, size: 26, fill: COL.dim, o: 1 });
  ['Facilitated diffusion', 'and active transport'].forEach((s, i) => wLabel(ttl, s, { x: 1250, y: 335 + i * 70, size: 52, o: 1 }));
  wLabel(ttl, 'Membrane structure and function:', { x: 1250, y: 490, size: 26, fill: COL.dim, weight: 500, o: 1 });
  wLabel(ttl, 'channels, carriers and pumps', { x: 1250, y: 526, size: 26, fill: COL.dim, weight: 500, o: 1 });
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tC - .2, .5);
  // door: the gate lets anyone through, the door turns one compartment at a time
  pulse(gate, tDo + .1, 1.05); pulse(door, tDo + 2.3, 1.05);
  const l1 = G(p, { o: 0 }), l2 = G(p, { o: 0 });
  wLabel(l1, 'a plain gate', { x: 290, y: 720, size: 32, o: 1 }); wLabel(l1, 'anyone, any time', { x: 290, y: 760, size: 24, fill: COL.dim, weight: 500, o: 1 });
  wLabel(l2, 'a revolving door', { x: 730, y: 720, size: 32, o: 1 }); wLabel(l2, 'one turn at a time', { x: 730, y: 760, size: 24, fill: COL.dim, weight: 500, o: 1 });
  show(l1, tDo + .2, .4); show(l2, tDo + 2.3, .4);
  const sideG = G(p, { o: 0 }); show(sideG, tDo + .4, .4);
  wLabel(sideG, 'seen from above', { x: 510, y: 180, size: 22, fill: COL.dim, weight: 500, o: 1 });
  [l1, l2, sideG].forEach(e => hide(e, tC, .4));
  // cells: the cell appears; its membrane lights; the camera pushes into its edge
  hide(gate, tC, .5); hide(door, tC, .5);
  const cm = cellMap(W, { kind: 'animal', x: 800, y: 470, s: .62, o: 0 });
  show(cm, tC + .2, .6);
  prog(k => cm.focus('membrane', k), tC + .6, .7, io);
  const [mx, my] = cm.pt('membrane');
  const lm = tag(p, 'the plasma membrane', [mx + 60, my - 70], [mx + 8, my + 6], tC + .9, { size: 30, weight: 700, fill: CC.membrane, line: CC.membrane });
  hide(lm, tC + 1.6, .3);
  cam.to({ x: mx, y: my, z: 4.5 }, tC + 1.6, tP - tC - 1.7);   // z 4.5, not 6: the dimmed map's layers grow with the zoom
  // patch: the shared fluid-mosaic patch; lit: the transport proteins light, the rest dims
  hide(cam.el, tP - .4, .35);   // the push fades out before the patch fades in: never both layers at once
  const mp = membranePatch(p, { x: 800, y: 470, o: 0 });
  show(mp, tP, .5);
  const sides = mp.sides(); show(sides, tP + .6, .5);
  // no drift here: each drift redraw repaints the whole 1500-wide patch (≈3× the frame time); the lit proteins carry the beat
  prog(k => mp.focus(['transport'], k), tL + .2, .9, io);
  const pc = mp.pt('channel'), pr = mp.pt('carrier'), pu = mp.pt('pump');
  tag(p, 'channel', [pc[0] - 40, 590], [pc[0], pc[1] + 70], tL + 3.1, { size: 32, weight: 700, fill: MC.channel, line: MC.channel });
  tag(p, 'carrier', [pr[0] + 10, 590], [pr[0], pr[1] + 70], tL + 3.9, { size: 32, weight: 700, fill: MC.carrier, line: MC.carrier });
  tag(p, 'pump', [pu[0] + 190, 700], [pu[0] + 30, pu[1] + 90], tL + 4.8, { size: 32, weight: 700, fill: '#9aa8ff', line: '#9aa8ff' });
  say(p, 'transport proteins', 800, 860, tL + 1.2, { size: 30, weight: 700 });
}],

/* ---------- facil ---------- */
['facil', 'Facilitated diffusion', (m, D) => {
  const p = panel(0), tF = m('fd'), tCh = m('channel'), tA = m('aqua'), tG = m('gated'), tCr = m('carrier'), tDn = m('down');
  const MY = 470, CH = 480, AQ = 770, GT = 1060, CR = 1350;
  const sp = strip(p, { x: 905, y: MY, w: 1330, gaps: gapsAt(905, 1, [[CH, 66], [AQ, 66], [GT, 66], [CR, 78]]) });
  // the gradient: crowded outside, sparse inside
  const wedge = G(p, { x: 120, y: MY, r: 90 }); gradientWedge(wedge, { w: 600, h: 120, n: 46 });
  wLabel(p, 'crowded', { x: 120, y: 140, size: 24, fill: COL.dim, weight: 600, o: 1 });
  wLabel(p, 'sparse', { x: 120, y: 820, size: 24, fill: COL.dim, weight: 600, o: 1 });
  // the side names in two lines, clear of the channel's ion column (x 480 ± 20) and the down arrow (x 195)
  wLabel(p, 'EXTRACELLULAR', { x: 222, y: 352, size: 22, fill: COL.dim, anchor: 'start', weight: 700, o: 1 });
  wLabel(p, 'FLUID', { x: 222, y: 378, size: 22, fill: COL.dim, anchor: 'start', weight: 700, o: 1 });
  wLabel(p, 'CYTOPLASM', { x: 222, y: 562, size: 22, fill: COL.dim, anchor: 'start', weight: 700, o: 1 });
  // solutes: crowded above each protein, a few below
  const top = [175, 380], av = [[0, 0, 1600, 130]];
  const cNa = crowd(p, 'Na', scatter(7, [CH - 130, top[0], CH + 120, top[1]], 3, [[CH - 34, 250, CH + 34, 400], [250, 330, 580, 400], ...av], 50), { r: 17 });
  const cW = crowd(p, 'water', scatter(10, [AQ - 120, top[0], AQ + 120, top[1]], 5, [[AQ - 30, 250, AQ + 30, 400]], 40));
  const cCl = crowd(p, 'Cl', scatter(7, [GT - 130, top[0], GT + 120, top[1]], 7, [[GT - 34, 250, GT + 34, 400]], 50), { r: 17 });
  const cS = crowd(p, 'sugar', scatter(6, [CR - 130, top[0], CR + 130, top[1]], 9, [[CR - 60, 280, CR + 60, 400]], 54));
  const below = [crowd(p, 'Na', [[CH - 90, 770]], { r: 17 }), crowd(p, 'water', [[AQ - 80, 770], [AQ + 90, 790], [AQ + 10, 820]]),
    crowd(p, 'Cl', [[GT + 90, 780]], { r: 17 }), crowd(p, 'sugar', [[CR - 100, 790]])];
  const crowds = [cNa, cW, cCl, cS, ...below];
  // the four proteins, dim until named
  const gCh = G(p, { x: CH, y: MY, o: .3 }), gAq = G(p, { x: AQ, y: MY, o: .3 }), gGt = G(p, { x: GT, y: MY, o: .3 }), gCr = G(p, { x: CR, y: MY, o: .3 });
  const ch = channelProtein(gCh, { gated: false, kind: 'Na', n: 3 });
  const aq = aquaporin(gAq, { n: 5 });
  const gt = channelProtein(gGt, { kind: 'Cl', n: 3 });
  const cr = carrierProtein(gCr, {});
  const sugar2 = solute(p, 'sugar', { x: CR + 30, y: MY + 155, o: 0 });   // the first one carried in, left behind
  const sig = solute(p, 'signal', { x: GT - 120, y: 200, r: 18, o: 0 });
  // fd: the banner, a cream downhill arrow by the wedge
  banner(p, 'facilitated diffusion', 'passive · down the gradient · through a transport protein', 800, 60, tF + .2, { size: 40 });
  const dArr = gradArrow(p, [195, 230], [195, 700], { o: 0 }); show(dArr, tF + 5, .5);
  say(p, 'down', 195, 210, tF + 5.2, { size: 22, fill: MC.down, weight: 700 });
  // labels under each protein, as each is named
  const lab = (x, a, b, t0, col) => { const g = G(p, { o: 0 }); wLabel(g, a, { x, y: 680, size: 28, weight: 700, fill: col, o: 1 }); wLabel(g, b, { x, y: 712, size: 22, fill: COL.dim, weight: 500, o: 1 }); show(g, t0, .4); return g; };
  show(gCh, tCh, .4); pulse(gCh, tCh + .1, 1.06); lab(CH, 'channel protein', 'a corridor for one ion', tCh + .3, MC.channel);
  show(gAq, tA, .4); pulse(gAq, tA + .1, 1.06); lab(AQ, 'aquaporin', 'a channel for water', tA + .3, MC.channel);
  show(gGt, tG, .4); pulse(gGt, tG + .1, 1.06); lab(GT, 'gated channel', 'opens to a stimulus', tG + .3, MC.channel);
  show(gCr, tCr, .4); pulse(gCr, tCr + .1, 1.06); lab(CR, 'carrier protein', 'binds, changes shape', tCr + .3, MC.carrier);
  // the gated channel: a signal comes in, the lid swings open, Cl⁻ pass
  const tSig = tG + 1.6, tOpen = tSig + 1.6;
  show(sig, tSig, .3); tw(sig, { x: GT - 6, y: MY - 108 }, tSig, 1.5, io);
  say(p, 'signal', GT - 150, 190, tSig + .1, { size: 22, fill: MC.ligand, weight: 700 });
  // the carrier: two turns, the second on "open to the outside, bind, change shape, open to the inside, release"
  const c1 = [tCr + 2.3, tCr + 8.6], c2 = [tCr + 9.3, tCr + 15.1];
  const tDoor = tCr + 15.3;
  const dr = revolvingDoor(p, { x: 1500, y: 800, R: 46, wall: false, o: 0 }); show(dr, tDoor, .4);
  say(p, 'like a revolving door', 1430, 810, tDoor + .1, { size: 24, anchor: 'end', fill: COL.chalk, weight: 600 });
  clockRun(t => {
    crowds.forEach(c => c.jig(t));
    ch.flow(t >= tCh ? t - tCh : 0, { speed: 80 });
    aq.flow(t >= tA ? t - tA : 0, { speed: 60 });
    gt.gate(io(mRamp(t, tOpen, tOpen + .7)));
    gt.flow(t >= tG ? t - tG : 0, { speed: 80 });
    const k = t < c2[0] ? mRamp(t, c1[0], c1[1]) : mRamp(t, c2[0], c2[1]);
    cr.carry(k);
    const kk = rk(k), first = t < c2[0];
    mO(cr.sol[0], first ? 1 - mRamp(kk, .86, .98) : mRamp(kk, 0, .05));
    const k1 = first ? kk : 1, w = io(mRamp(t, c1[1] + .1, c1[1] + .7));
    mPose(sugar2, mLerp(CR + 30, CR + 110, w), mLerp(MY + 155, MY + 330, w), mRamp(k1, .86, .98));
    if (t >= tDoor) dr.spin(t - tDoor);
  }, D);
  // down: every one of them runs downhill, with no ATP
  [CH, AQ, GT, CR].forEach((x, i) => {
    const a = gradArrow(p, [x + 88, MY - 80], [x + 88, MY + 80], { o: 0, w: 6, head: 18 }); show(a, tDn + .2 + .15 * i, .4);
  });
  const no = G(p, { o: 0 }); show(no, tDn + 1.4, .5);
  mk('rect', { x: 520, y: 830, width: 760, height: 56, rx: 28, fill: '#0b1626', stroke: MC.down, 'stroke-width': 2.5 }, no);
  wLabel(no, 'all passive: down the gradient, no ATP', { x: 900, y: 868, size: 30, weight: 700, o: 1 });
}],

/* ---------- q1 ---------- */
['q1', 'Quick check', (m, D) => {

  channelProtein(p, { x: 180, y: MY, gated: false, kind: 'Na', n: 3 }).flow(1.2);
  carrierProtein(p, { x: 460, y: MY }).carry(.2);
  wLabel(p, 'channel', { x: 180, y: 690, size: 30, weight: 700, fill: MC.channel, o: 1 });
  wLabel(p, 'carrier', { x: 460, y: 690, size: 30, weight: 700, fill: MC.carrier, o: 1 });
  wLabel(p, 'a pore', { x: 180, y: 726, size: 22, fill: COL.dim, weight: 500, o: 1 });
  wLabel(p, 'a shape change', { x: 460, y: 726, size: 22, fill: COL.dim, weight: 500, o: 1 });
}, { ask: done => quiz(SIDE, [{
  id: 'c-chan-carrier', prompt: ['Channel or carrier?'],
  build: grid([
    { parts: ['a pore the solute passes straight through'], ans: ['c'], why: 'Channel: it is a corridor, open through the middle.' },

  wLabel(gL, 'low again', { x: GX, y: GY0 + 44, size: 26, weight: 700, fill: MC.carrier, o: 1 });
  clockRun(t => {
    oNa.jig(t);
    ch.gate(gateK(t)); ch.flow(t);
    dots.forEach(d => {
      if (t < d.t0) { mO(d.e, 0); return; }
      const a = io(mRamp(t, d.t0, d.t0 + 1.1));
      let [x, y] = [mLerp(exit[0], d.slot[0], a), mLerp(exit[1], d.slot[1], a)];
      let o = d.t0 < 0 ? 1 : mRamp(t, d.t0 + .3, d.t0 + .5);   // shows once the channel's own ion has faded at the exit
      if (d.take !== undefined) {
        const w = io(mRamp(t, d.take - 1.6, d.take - .1));
        x = mLerp(x, d.site[0], w); y = mLerp(y, d.site[1], w);
        if (t >= d.take) o = 0;
      }
      mPose(d.e, x, y, o);
    });
    const c = cycAt(t);
    const kc = c < 0 ? 0 : rk(mRamp(t, CYC[c][0], CYC[c][1])); pu.cycle(kc); atpThenAdp(pu, kc); na3Out(pu, kc);
    left.forEach(({ c: cc, na, k }) => {
      const t0 = CYC[cc][0], on = t >= t0 ? 1 : 0, a = io(mRamp(t, t0, t0 + 1));
      // the Na⁺ just sent out rise a little and fade into the crowd outside (their own spots would land on its members)
      na.forEach((e, i) => mPose(e, NAOUT[i][0], NAOUT[i][1] - 40 * a, on * (1 - mRamp(t, t0 + .3, t0 + .9))));
      k.forEach((e, i) => mPose(e, mLerp(KIN[i][0], KAWAY[cc - 1][i][0], a), mLerp(KIN[i][1], KAWAY[cc - 1][i][1], a), on));
    });
    const nn = count(t);
    setText(gN, String(nn));
    const hgt = Math.round((GH - 12) * Math.min(1, nn / GMAX));
    cAttr(fillR, 'height', hgt); cAttr(fillR, 'y', GY0 - 6 - hgt);
  }, D);
  // arrows: downhill through the channel, uphill (with ATP) through the pump
  const dA = gradArrow(p, [CX + 90, 262], [CX + 90, 640], { o: 0 }); show(dA, tCh + 2.4, .4);
  say(p, 'in: downhill, no energy', CX + 110, 372, tCh + 2.6, { size: 24, fill: MC.down, weight: 700, anchor: 'start' });
  const uA = atpAt(gradArrow(p, [PX + 120, 640], [PX + 120, 262], { against: true, o: 0 }), PX + 154, 305); show(uA, tPu + .4, .4);   // the spark clear of the membrane and the pump's Pi
  say(p, 'out: uphill, ATP', PX + 140, 372, tPu + .6, { size: 24, fill: MC.against, weight: 700, anchor: 'start' });
  // bal: the two together
  const bl = G(p, { o: 0 }); show(bl, tBa + .2, .5);
  mk('rect', { x: 380, y: 806, width: 860, height: 60, rx: 30, fill: '#0b1626', stroke: COL.chalk, 'stroke-opacity': .5, 'stroke-width': 2.5 }, bl);
  wLabel(bl, 'the channel lets it in · the pump sends it out', { x: 810, y: 846, size: 30, weight: 700, o: 1 });
}],

/* ---------- wrap ---------- */
['wrap', 'Summary', (m, D) => {
  const p = panel(0), tDi = m('diff'), tFa = m('fac'), tAc = m('act'), tE = m('end');
  const XS = [290, 800, 1310], MY = 380;
  const ttl = G(p, { o: 0 }); show(ttl, 0, .3);
  wLabel(ttl, 'Summary: three ways across', { x: 800, y: 56, size: 36, weight: 700, o: 1 });
  const cols = [], o2 = [];
  XS.forEach((x, i) => {
    const g = G(p, { o: 0 }); cols.push(g);
    mk('rect', { x: x - 220, y: 180, width: 440, height: 420, rx: 22, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, g);
    const sg = G(g);
    mk('rect', { x: x - 216, y: MY + 46, width: 432, height: 150, fill: MC.cyto }, sg);
    bilayer(sg, { x, y: MY, w: 420, gaps: i === 0 ? [] : i === 1 ? [[-90, 66], [90, 78]] : [[0, 84]], seed: 4 + i });
  });
  // diffusion: O₂ straight through the bilayer
  const O2s = [0, 1, 2].map(i => solute(cols[0], 'O2', { r: 15 }));
  mArrow(cols[0], [XS[0] + 130, MY - 110], [XS[0] + 130, MY + 110], { color: MC.down, w: 6, head: 18 });
  // facilitated: a channel and a carrier
  const ch = channelProtein(cols[1], { x: XS[1] - 90, y: MY, gated: false, kind: 'Na', n: 3, s: .85 });   // its ions stay below the title
  const cr = carrierProtein(cols[1], { x: XS[1] + 90, y: MY });
  mArrow(cols[1], [XS[1] + 175, MY - 110], [XS[1] + 175, MY + 110], { color: MC.down, w: 6, head: 18 });
  // active: the pump, an orange uphill arrow with ATP
  const pg = G(cols[2], { x: XS[2], y: MY, s: .85 }); naKPump(pg, {}).cycle(.12);
  atpAt(gradArrow(cols[2], [XS[2] + 140, MY + 110], [XS[2] + 140, MY - 110], { against: true, w: 6, head: 18 }), XS[2] + 174, MY + 100);
  const T3 = [['diffusion', 'no protein, no energy', 'downhill', MC.down], ['facilitated diffusion', 'a channel or a carrier', 'downhill, no energy', MC.channel],
    ['active transport', 'a pump, paid in ATP', 'uphill: 3 Na⁺ out, 2 K⁺ in', MC.against]];
  T3.forEach(([a, b, c, col], i) => {
    wLabel(cols[i], a, { x: XS[i], y: 224, size: 32, weight: 700, fill: col, o: 1 });
    wLabel(cols[i], b, { x: XS[i], y: 650, size: 26, weight: 600, o: 1 });
    wLabel(cols[i], c, { x: XS[i], y: 688, size: 26, weight: 600, fill: COL.dim, o: 1 });
  });
  [tDi, tFa, tAc].forEach((t0, i) => show(cols[i], t0 + .1, .5));
  // the bracket: both passive
  const br = G(p, { o: 0 }); show(br, m('fac', 6.1), .5);
  path(br, `M${XS[0] - 210} 160V136H${XS[1] + 210}V160`, { stroke: MC.down, 'stroke-width': 4 });
  wLabel(br, 'passive transport', { x: (XS[0] + XS[1]) / 2, y: 122, size: 30, weight: 700, fill: MC.down, o: 1 });
  const ba = G(p, { o: 0 }); show(ba, tAc + .3, .5);
  path(ba, `M${XS[2] - 210} 160V136H${XS[2] + 210}V160`, { stroke: MC.against, 'stroke-width': 4 });
  wLabel(ba, 'needs energy', { x: XS[2], y: 122, size: 30, weight: 700, fill: MC.against, o: 1 });
  clockRun(t => {
    O2s.forEach((e, i) => { const u = cFrac(t * .3 + i / 3); mPose(e, XS[0] - 60 + 50 * i, MY - 150 + 300 * u, Math.sin(Math.PI * u)); });
    ch.flow(t);
    const k = rk(cFrac(t / 5));
    cr.carry(k); mO(cr.sol[0], mRamp(k, 0, .06) * (1 - mRamp(k, .86, .98)));
  }, D);
  say(p, 'Now try the chapter practice.', 800, 820, tE, { size: 32, fill: WC.bond });
}],

/* ---------- final1 ---------- */
['final1', 'Chapter practice', (m, D) => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  const card = (g, x, y, w, h) => mk('rect', { x, y, width: w, height: h, rx: 22, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, g);
  const mini = (g, x, y, w, gaps, seed = 4, d = 120) => { mk('rect', { x: x - w / 2, y: y + 46, width: w, height: d, fill: MC.cyto }, g); bilayer(g, { x, y, w, gaps, seed }); };
  at('passive', g => {
    const rows = [[160, 'diffusion'], [420, 'facilitated'], [680, 'active']];
    rows.forEach(([y, s], i) => {
      card(g, 990, y - 110, 560, 230);
      mini(g, 1230, y, 400, i === 0 ? [] : i === 1 ? [[-80, 66], [80, 78]] : [[0, 84]], 5 + i, 70);   // the cytoplasm stops at the card's foot
      if (i === 0) { solute(g, 'O2', { x: 1190, y: y - 80, r: 14 }); solute(g, 'O2', { x: 1260, y: y + 90, r: 14 }); mArrow(g, [1330, y - 80], [1330, y + 80], { color: MC.down, w: 5, head: 16 }); }
      if (i === 1) { channelProtein(g, { x: 1150, y, gated: false, kind: 'Na', n: 3, s: .8 }).flow(1); carrierProtein(g, { x: 1310, y, s: .8 }).carry(.2); mArrow(g, [1390, y - 80], [1390, y + 80], { color: MC.down, w: 5, head: 16 }); }
      if (i === 2) { const pg = G(g, { x: 1230, y, s: .7 }); mO(naKPump(pg, {}).cycle(.12).atp, 0); /* its ATP chip would hang below the card */ atpAt(gradArrow(g, [1340, y + 80], [1340, y - 80], { against: true, w: 5, head: 16 }), 1382, y - 74); }
      wLabel(g, s, { x: 1006, y: y - 80, size: 22, weight: 700, anchor: 'start', fill: COL.dim, o: 1 });
    });
  });
  at('order', g => {
    card(g, 980, 90, 580, 720);
    const MY = 450, cx = 1270;
    mk('rect', { x: 990, y: MY + 46, width: 560, height: 300, fill: MC.cyto }, g);
    bilayer(g, { x: cx, y: MY, w: 560, gaps: [[0, 72]], seed: 6 });
    naKPump(G(g, { x: cx, y: MY, s: 1 }), {}).cycle(.12);
    // the six steps; every badge clear of the membrane
    const pos = [[cx - 200, MY + 120], [cx + 200, MY + 230], [cx + 200, MY - 220], [cx - 200, MY - 220], [cx, MY + 290], [cx - 200, MY + 250]];
    const names = ['Na⁺ bind', 'P from ATP', 'Na⁺ out', 'K⁺ bind, P off', 'shape back', 'K⁺ released'];
    S.ordB = pos.map(([x, y], i) => { const b = badge(g, '?', x, y, { o: 1, r: 26 }); b.lab = wLabel(g, names[i], { x, y: y + 52, size: 22, weight: 600, o: 0 }); return b; });
    wLabel(g, 'EXTRACELLULAR FLUID', { x: 1000, y: 130, size: 20, anchor: 'start', fill: COL.dim, weight: 700, o: 1 });
    wLabel(g, 'CYTOPLASM', { x: 1000, y: 790, size: 20, anchor: 'start', fill: COL.dim, weight: 700, o: 1 });
  });
  at('uphill', g => {
    card(g, 980, 90, 580, 720);
    const MY = 450;
    mk('rect', { x: 990, y: MY + 46, width: 560, height: 300, fill: MC.cyto }, g);
    bilayer(g, { x: 1270, y: MY, w: 560, gaps: [], seed: 7 });
    crowd(g, 'Na', scatter(4, [1010, 560, 1530, 780], 41, [], 70), { r: 17 });
    crowd(g, 'Na', scatter(11, [1010, 130, 1530, 370], 43, [], 62), { r: 17 });
    gradArrow(g, [1270, 640], [1270, 250], { against: true });
    wLabel(g, 'low → high: which kind?', { x: 1270, y: 790, size: 26, weight: 700, fill: MC.against, o: 1 });
  });
  at('gated', g => {
    card(g, 980, 90, 580, 720);
    const MY = 450;
    mk('rect', { x: 990, y: MY + 46, width: 560, height: 300, fill: MC.cyto }, g);
    bilayer(g, { x: 1270, y: MY, w: 560, gaps: [[0, 66]], seed: 8 });
    const c = channelProtein(g, { x: 1270, y: MY, kind: 'Cl', n: 3, s: 1.3 }); c.gate(.75); c.flow(1.5);
    solute(g, 'signal', { x: 1240, y: MY - 145, r: 18 });
    wLabel(g, 'signal', { x: 1170, y: MY - 160, size: 24, weight: 700, fill: MC.ligand, anchor: 'end', o: 1 });
    wLabel(g, 'what does the gate do?', { x: 1270, y: 790, size: 26, weight: 700, fill: MC.channel, o: 1 });
  });
  at('after', g => {
    card(g, 980, 90, 580, 720);
    const MY = 420;
    mk('rect', { x: 990, y: MY + 46, width: 560, height: 330, fill: MC.cyto }, g);
    bilayer(g, { x: 1270, y: MY, w: 560, gaps: [[-150, 66], [130, 84]], seed: 9 });
    const c = channelProtein(g, { x: 1120, y: MY, kind: 'Na', n: 3 }); c.gate(1); c.flow(2);
    naKPump(G(g, { x: 1400, y: MY }), {}).cycle(0);
    crowd(g, 'Na', [[1040, 620], [1200, 650], [1080, 720], [1240, 740], [1160, 590]], { r: 17 });
    wLabel(g, '?', { x: 1400, y: MY - 150, size: 70, weight: 800, fill: MC.against, o: 1 });
    wLabel(g, 'Na⁺ flooded in: now what?', { x: 1270, y: 800, size: 26, weight: 700, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('passive');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-passive', prompt: ['Passive or active?'],
    build: withPic('passive', grid([
      { parts: ['oxygen slips through the bilayer'], ans: ['p'], why: 'Passive: simple diffusion, downhill, with no protein and no energy.' },
      { parts: ['glucose through a carrier, from high to low'], ans: ['p'], why: 'Passive: facilitated diffusion. The carrier changes shape, but the glucose runs downhill and no ATP is spent.' },
      { parts: ['water through an aquaporin'], ans: ['p'], why: 'Passive: an aquaporin is a channel, so water moves down its gradient.' },
      { parts: ['sodium pushed out against its gradient'], ans: ['a'], why: 'Active: against the gradient takes energy, here from the sodium-potassium pump.' },
      { parts: ['needs ATP'], ans: ['a'], why: 'Active: passive transport needs no energy; a pump is paid in ATP.' },
    ], [['p', 'passive', null, 'P'], ['a', 'active', null, 'A']], { multi: false, text: true })) },
  { id: 'p-order', prompt: ['Number the pump’s six steps, 1 to 6.'],
    // two steps a row, so all six fit on the card with its feedback
    build: withPic('order', blanks([
      { parts: ['Na⁺ out: ', { box: '3' }, '   K⁺ released: ', { box: '6' }], why: 'Step 3: the phosphate changes its shape, so it opens outward and lets the Na⁺ go. Step 6, last: open inward again, it lets the K⁺ go into the cytoplasm.', hint: 'Sodium goes out first, then potassium comes in.', fx: () => { ordFx(2, '3'); ordFx(5, '6'); } },
      { parts: ['P from ATP: ', { box: '2' }, '   shape back: ', { box: '5' }], why: 'Step 2: with the Na⁺ bound, ATP gives the pump a phosphate. Step 5: without the phosphate, it returns to its first shape, holding the K⁺.', hint: 'The pump is paid right after the sodium binds.', fx: () => { ordFx(1, '2'); ordFx(4, '5'); } },
      { parts: ['K⁺ bind, P off: ', { box: '4' }, '   Na⁺ bind: ', { box: '1' }], why: 'Step 1: open to the cytoplasm, the pump binds three Na⁺. Step 4: two K⁺ bind from outside, and the phosphate comes off.', hint: 'Where is the pump open when the cycle starts?', fx: () => { ordFx(3, '4'); ordFx(0, '1'); } },
    ])) },
  { id: 'p-uphill', prompt: ['Which transport moves a solute from low to high concentration?'],
    build: withPic('uphill', choice([['a channel protein'], ['a carrier in facilitated diffusion'], ['active transport by a pump, using ATP'], ['simple diffusion through the bilayer']], 2,
      'Right. Only active transport goes uphill, and the pump pays for it with ATP.',
      ['A channel is a corridor: solutes run through it downhill only.', 'A carrier in facilitated diffusion changes shape, but still moves solutes downhill, with no ATP.', null,
        'Simple diffusion runs downhill, from crowded to sparse, with no protein at all.'])) },
  { id: 'p-gated', prompt: ['What does a gated ion channel do?'],
    build: withPic('gated', choice([['pumps ions with ATP'], ['opens or closes in response to a stimulus'], ['stays open all the time'], ['binds glucose and changes shape']], 1,
      'Right. A stimulus, such as a chemical signal or a change in voltage, opens or closes its gate. The ions still flow downhill.',
      ['That is a pump. A channel only lets ions run downhill; it spends no ATP.', null,
        'That is a channel without a gate. A gated channel can shut.',
        'That is a carrier protein. A channel is a pore with no shape change.'])) },
  { id: 'p-after', prompt: ['A gated sodium channel opens and Na⁺ floods in. How does the cell get the sodium back out?'],
    build: withPic('after', choice([['it diffuses out through the same channel'], ['aquaporins carry it out'], ['the sodium-potassium pump pushes it out, against the gradient, using ATP'], ['nothing is needed']], 2,
      'Right. Outside is still crowded with Na⁺, so getting it out is uphill: the pump does it, paid in ATP.',
      ['The gradient runs inward: outside is crowded, so the channel only lets more in.', 'Aquaporins carry water, not ions.', null,
        'Without the pump, sodium would keep building up inside the cell.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }
function ordFx(i, str) { const b = S.ordB?.[i]; if (!b) return; fxp(q => { b.t.textContent = q > 0 ? str : '?'; put(b.lab, { o: q }); }, 0, .3); pulseFx(b, 1.4); }

boot();
</script>
