'use strict';
// Biology, Chapter 7 (Membrane Structure and Function), lesson 6: a sugar beet and a nerve cell, then the membrane
// patch with its pump and carrier lit; membrane potential (uneven ions, inside negative, a thin charge layer, millivolts);
// the chemical and electrical forces of the electrochemical gradient (sodium: both in; potassium: they disagree);
// electrogenic pumps (sodium-potassium in animals, proton pump in plants, fungi, bacteria); the proton pump building
// charge and stored energy; the sucrose-H⁺ cotransporter; the whole chain and a blocked pump; summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-07/lesson-06.md.
const CHAPTER = { number: 706, label: '7, lesson 6', title: 'Membrane Potential, Ion Pumps and Cotransport', minutes: 7, language: 'en', lead: false, next: '../lesson-07/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const notToScale = (p, x, y, t0) => say(p, 'not to scale', x, y, t0, { size: 22, fill: COL.dim, anchor: 'end', weight: 500 });
const ELEC = '#7fc8ff', CORAL = '#f4a48c', GREEN = '#8fdc8f', RED = '#e5533d';
// A label (centred text) with a leader to the thing it names; returns the group (it fades in at t0).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 600, sub, subFill = COL.dim } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str, size);
  wLabel(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  if (sub) wLabel(g, sub, { x: tx, y: ty + size * 1.05, size: size * .8, fill: subFill, weight: 500, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + (sub ? size * 1.05 + size * .3 : size * .3); }
  else { sx = tx; sy = ty - size * 1.05; }
  path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 });
  mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g);
  if (t0 !== null) show(g, t0, .4);
  return g;
}
// A pulse relative to the element's own scale s (the engine's pulse() sets scale absolutely).
const pulseS = (e, t0, s, k) => { tw(e, { s: s * k }, t0, .22, out); tw(e, { s }, t0 + .22, .4); };
// A ring that pops in round a point (o 0 before t0; t0 null: no tweens).
function ring(p, [x, y], r, t0, { color = COL.chalk, w = 4, dash = null } = {}) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: 'none', stroke: color, 'stroke-width': w, ...(dash ? { 'stroke-dasharray': dash } : {}) }, g);
  if (t0 !== null) { show(g, t0, .3); pulse(g, t0 + .1, 1.12); }
  return g;
}
// A straight arrow, solid or dashed, head at b.
function arw(p, [x1, y1], [x2, y2], { color = COL.chalk, w = 7, head = 22, dash = null, o = 1 } = {}) {
  const g = G(p, { o }), L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  path(g, `M${cF(x1)} ${cF(y1)}L${cF(x2 - ux * head * .8)} ${cF(y2 - uy * head * .8)}`, { stroke: color, 'stroke-width': w, ...(dash ? { 'stroke-dasharray': dash, 'stroke-linecap': 'butt' } : {}) });
  path(g, `M${cF(x2 - ux * head - uy * head * .7)} ${cF(y2 - uy * head + ux * head * .7)}L${cF(x2)} ${cF(y2)}L${cF(x2 - ux * head + uy * head * .7)} ${cF(y2 - uy * head - ux * head * .7)}Z`, { fill: color, stroke: color, 'stroke-width': 2 });
  return g;
}
// The electrochemical arrow: a wide cream arrow with a blue core (both forces in one).
function fatArrow(p, a, b, { o = 1 } = {}) {
  const g = G(p, { o });
  arw(g, a, b, { color: MC.down, w: 22, head: 40 });
  arw(g, [a[0], a[1] + 6], [b[0], b[1] - 14], { color: ELEC, w: 8, head: 20 });
  return g;
}
// A dark plate behind a caption.
function plate(p, x, y, w, h, { o = 1 } = {}) { return mk('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 18, fill: '#0a1626', stroke: COL.chalk, 'stroke-opacity': .45, 'stroke-width': 2.5, 'fill-opacity': .92 }, p); }
// A membrane across the stage: cytoplasm below (+y), the bilayer at y. gaps: [[x in parent, half-width in the
// bilayer's own units]] leave room for proteins. .face / .faceIn: the outer and inner faces in parent coordinates.
function memb(p, { x = 800, y = 470, w = 1640, s = 1, gaps = [], seed = 2, unsat = .3 } = {}) {
  const g = G(p);
  mk('rect', { x: x - w / 2, y: y + 46 * s, width: w, height: 1000, fill: MC.cyto }, g);
  const bl = bilayer(g, { x, y, s, w: w / s, gaps: gaps.map(([gx, h]) => [(gx - x) / s, h]), seed, unsat, fluid: .5 });
  return Object.assign(g, { bl, y, s, face: y - 59 * s, faceIn: y + 59 * s });
}
// Lipids jiggle (redrawn 12 times a second, from that rounded time).
const lipidLife = (M, D) => clockRun(t => M.bl.drift(Math.floor(t * 12) / 12), D);
// EXTRACELLULAR FLUID / CYTOPLASM labels at the left edge.
function sideNames(p, M, t0, { size = 24, inDy = 52 } = {}) {
  const g = G(p, { o: 0 });
  wLabel(g, 'EXTRACELLULAR FLUID', { x: 30, y: 44, size, fill: COL.dim, anchor: 'start', weight: 700, o: 1 });
  wLabel(g, 'CYTOPLASM', { x: 30, y: M.faceIn + inDy, size, fill: COL.dim, anchor: 'start', weight: 700, o: 1 });
  if (t0 !== null) show(g, t0, .5); else put(g, { o: 1 });
  return g;
}
// Charge rows: coral + along the outer face, blue − along the inner, at the given x's (in the order they appear).
// .set(f) shows the share f of them (the next one fading in), drawn from f rounded to 1/1000.
function signs(p, xs, yo, yi, { size = 36 } = {}) {
  const g = G(p), P = [], N = [];
  xs.forEach(x => {
    P.push(wLabel(g, '+', { x, y: yo + size * .36, size, fill: MC.plus, weight: 800, o: 0 }));
    N.push(wLabel(g, '−', { x, y: yi + size * .36, size, fill: MC.minus, weight: 800, o: 0 }));
  });
  let last = -1;
  const sg = Object.assign(g, {
    n: xs.length,
    set(f) {
      f = Math.round(mClamp(f) * 1000) / 1000; if (f === last) return sg; last = f;
      const m = f * xs.length; xs.forEach((_, i) => { const q = mClamp(m - i); mO(P[i], q); mO(N[i], q); });
      return sg;
    },
  });
  return sg;
}
// x's from a to b every dx, leaving out the spans [c, half] (round proteins).
function rowXs(a, b, dx, skip = []) { const xs = []; for (let x = a; x <= b; x += dx) if (!skip.some(([c, h]) => Math.abs(x - c) < h)) xs.push(x); return xs; }
// n points on a jittered grid inside [x0, y0, x1, y1].
function scatter(n, [x0, y0, x1, y1], seed = 1) {
  const W = x1 - x0, H = y1 - y0, cols = Math.max(1, Math.round(Math.sqrt(n * W / H))), rows = Math.ceil(n / cols), cw = W / cols, rh = H / rows, pts = [];
  for (let i = 0; i < n; i++) { const c = i % cols, r = Math.floor(i / cols); pts.push([x0 + cw * (c + .5) + (wHash(i, seed) - .5) * cw * .5, y0 + rh * (r + .5) + (wHash(i, seed + 3) - .5) * rh * .5]); }
  return pts;
}
// A small wander for particle i at time t (quantised to 1/15 s by the caller).
const jig = (i, t, a = 4) => [a * Math.sin(t * 1.7 + i * 2.1), a * Math.cos(t * 1.3 + i * 1.7)];
// The voltmeter with its two leads: a reference electrode in the extracellular fluid (+ terminal) and a fine
// microelectrode through the membrane into the cytoplasm (− terminal), as the kit's membranePotential wires it.
function meterRig(p, { x = 1460, y = 170, s = .9, inTip = [1420, 620], outTip = [1540, 330], o = 1 } = {}) {
  const g = G(p, { o });
  const leads = G(g), vm = voltmeter(g, { x, y, s });
  const [tm, tp] = vm.terminals();
  path(leads, `M${cP(tm)}C${cF(tm[0])} ${cF(tm[1] + 60)} ${cF(inTip[0])} ${cF(inTip[1] - 260)} ${cP(inTip)}`, { stroke: '#cfe6ff', 'stroke-width': 3.5, 'stroke-opacity': .85 });
  path(leads, `M${cF(inTip[0])} ${cF(inTip[1] - 90)}L${cP(inTip)}`, { stroke: '#e8f4ff', 'stroke-width': 7, 'stroke-opacity': .5 });
  path(leads, `M${cP(tp)}C${cF(tp[0] + 20)} ${cF(tp[1] + 40)} ${cF(outTip[0])} ${cF(outTip[1] - 40)} ${cP(outTip)}`, { stroke: COL.dim, 'stroke-width': 3.5 });
  mk('circle', { cx: inTip[0], cy: inTip[1], r: 5, fill: COL.chalk }, leads); mk('circle', { cx: outTip[0], cy: outTip[1], r: 5, fill: COL.chalk }, leads);
  return Object.assign(g, { vm, leads, set(mV) { vm.set(mV); return g; } });
}
// On a voltmeter's own dial: an arc over [a, b] mV (the kit's dial runs 205° … 335° for −200 … 0 at radius 78).
function dialArc(vm, a, b, { color = MC.against, r = 94, w = 8 } = {}) {
  const ang = v => (205 + 130 * (v + 200) / 200) * Math.PI / 180, cy = 28;
  const p0 = [r * Math.cos(ang(a)), cy + r * Math.sin(ang(a))], p1 = [r * Math.cos(ang(b)), cy + r * Math.sin(ang(b))];
  return path(vm, `M${cP(p0)}A${r} ${r} 0 0 1 ${cP(p1)}`, { stroke: color, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 });
}

/* ---------- backdrops ---------- */
// A sugar beet: a cream conical root with a rosette of leaves; origin at the top of the root.
function beetArt(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  [-52, -26, 0, 26, 52].forEach((a, i) => {
    const lf = G(g, { y: -40, r: a });
    const L = 190 - Math.abs(a) * 1.2;
    path(lf, `M0 0C-38 ${-L * .3} -40 ${-L * .75} 0 ${-L}C40 ${-L * .75} 38 ${-L * .3} 0 0Z`, { fill: i % 2 ? '#4fae55' : '#5bbf5b', stroke: '#2f7a3a', 'stroke-width': 4 });
    path(lf, `M0 -6V${-L + 14}`, { stroke: '#a7dca8', 'stroke-width': 3, 'stroke-opacity': .7 });
  });
  path(g, 'M-120 -30C-132 90 -50 230 0 360C50 230 132 90 120 -30C80 -66 -80 -66 -120 -30Z', { fill: '#efe2c4', stroke: '#b8a47a', 'stroke-width': 5 });
  path(g, 'M-98 50Q0 70 98 50M-78 140Q0 158 78 140M-48 236Q0 250 48 236', { stroke: '#d4c39a', 'stroke-width': 3 });
  path(g, 'M0 360L8 412', { stroke: '#b8a47a', 'stroke-width': 4 });

}
// A nerve cell: a cell body with dendrites and a long axon to the right (stage coordinates). .axon: its points.
function nerveArt(p, { o = 1 } = {}) {
  const g = G(p, { o }), NC = '#c9a0dc', ND = '#8a5fa6';
  const axon = []; for (let i = 0; i <= 40; i++) { const x = 775 + i * 16.5; axon.push([x, 640 + 14 * Math.sin((x - 775) / 80)]); }
  path(g, 'M690 610L640 560L600 548M640 560L630 515M680 670L630 720L590 726M630 720L626 770M712 590L716 530L690 498M716 530L748 500',
    { stroke: NC, 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  path(g, 'M' + axon.map(cP).join('L'), { stroke: NC, 'stroke-width': 10 });
  const end = axon[axon.length - 1];
  path(g, `M${cP(end)}l46 -40M${cP(end)}l58 4M${cP(end)}l44 44`, { stroke: NC, 'stroke-width': 7, 'stroke-linecap': 'round' });
  for (const [dx, dy] of [[46, -40], [58, 4], [44, 44]]) mk('circle', { cx: end[0] + dx, cy: end[1] + dy, r: 9, fill: NC }, g);
  path(g, cBlob(62, 54, { seed: 4, wob: .06, cx: 718, cy: 640 }), { fill: NC, stroke: ND, 'stroke-width': 4 });
  mk('circle', { cx: 714, cy: 636, r: 20, fill: '#7d5596' }, g);

}
// Beet root storage cells seen through a lens round (0, 0), radius R; the centre cell's edge carries tiny + and −.
function beetLens(p, { x = 0, y = 0, R = 170, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  mk('circle', { r: R, fill: '#0b1828', stroke: COL.chalk, 'stroke-width': 6 }, g);
  let wd = '', vd = '';
  for (let row = -5; row <= 5; row++) for (let col = -4; col <= 4; col++) {
    const cx = col * 72 + (row % 2 ? 36 : 0), cy = row * 52;
    if (Math.hypot(cx, cy) > R - 30) continue;
    wd += `M${cx - 32} ${cy - 22}h64v44h-64Z`;
    vd += `M${cx - 24} ${cy - 14}h48v28h-48Z`;
  }
  path(g, wd, { fill: CC.cyto, stroke: CC.wall, 'stroke-width': 3 });
  path(g, vd, { fill: CC.vac, 'fill-opacity': .55 });
  const edge = G(g, { o: 0 });
  path(edge, 'M-30 -19.2h60', { stroke: CC.membrane, 'stroke-width': 1.2 });
  let pl = '', mi = '';
  for (let i = 0; i < 7; i++) {
    const xx = -27 + i * 9;
    pl += `M${xx - 1.6} -26.2h3.2M${xx} -27.8v3.2`;
    mi += `M${xx - 1.6} -15.6h3.2`;
  }
  path(edge, pl, { stroke: MC.plus, 'stroke-width': .9 });
  path(edge, mi, { stroke: MC.minus, 'stroke-width': .9 });
  return Object.assign(g, { edge });
}

const BEATS = [

['proton', 'The proton pump at work', (m, D) => {

  const Y = 470, S1 = 1.4, PX = 560;
  const M = memb(p, { y: Y, s: S1, gaps: [[PX, 70]] }); sideNames(p, M, .2); lipidLife(M, D);
  // H⁺ already crowded outside, few inside
  [[140, 170], [180, 290], [320, 120], [800, 130], [920, 270], [1020, 300], [1120, 250], [1230, 290]].forEach(q => solute(p, 'H', { x: q[0], y: q[1], r: 19 }));
  [[200, 700], [320, 810], [960, 640]].forEach(q => solute(p, 'H', { x: q[0], y: q[1], r: 19 }));
  const pp = protonPump(p, { x: PX, y: Y, s: S1 });
  say(p, 'proton pump', PX, 86, .3, { size: 32, weight: 700, fill: '#aab6ff' });
  // one value drives the charge rows and the meter: c protons out (0 … 4), 3 + c charge pairs, −10 mV a pair
  const XS = [300, 820, 180, 940, 1060, 1180, 1300];
  const sg = signs(p, XS, M.face - 28, M.faceIn + 28, { size: 38 });
  const rig = meterRig(p, { x: 1460, y: 170, inTip: [1420, 580], outTip: [1545, 340] });
  const kAt = t => .25 * mRamp(t, tPu + .6, tPu + 6) + .75 * mRamp(t, tCh + .3, tCh + 8.5);
  const outCount = k => { k = Math.round(mClamp(k) * 2000) / 2000; let c = 0; for (let i = 0; i < 4; i++) c += io(mRamp(mRamp(k, i / 4, (i + 1) / 4), .6, .95)); return c; };
  clockRun(t => {
    const k = kAt(t), c = outCount(k), pairs = 3 + c;
    pp.run(k); sg.set(pairs / 7); rig.set(-10 * pairs);
  }, D);
  const Lmp = G(p, { o: 0 }); show(Lmp, tCh + 4, .4);
  wLabel(Lmp, 'membrane potential', { x: 1300, y: 160, size: 30, weight: 700, anchor: 'end', o: 1 });

  const Lc = say(p, 'cytoplasm → extracellular fluid', PX, 870, tPu + 3, { size: 24, fill: COL.dim, weight: 500 });
  // charge: each proton out leaves a + outside and a − inside

  hide(Lc, tCh + 3.5, .3);
  const L2 = say(p, '− charge left behind inside', 820, 870, tCh + 4.4, { size: 26, fill: MC.minus, weight: 700 });
  // store: like water behind a dam

  scatter(10, [1072, 752, 1276, 852], 6).forEach(q => mk('circle', { cx: cF(q[0]), cy: cF(q[1]), r: 7, fill: MC.H }, dam));
  wLabel(dam, 'H⁺ crowded outside', { x: 1174, y: 760, size: 18, fill: '#ffd0e0', weight: 700, o: 1 });

  prog(k => pp.run(k), tPl + .3, 5, lin);
  const Lp = say(p, 'plants: an H⁺ gradient built by proton pumps', 520, 112, tPl + .6, { size: 24, fill: MC.H, weight: 700 });
  // cot: the cotransporter lights
  tw(cot, { o: 1 }, tCo + .1, .5); pulseS(cot, tCo + .4, S1, 1.06);
  show(cLabel(p, [CX + 70, Y - 70], [1235, 340], 'sucrose-H⁺ cotransporter', { size: 26, color: MC.carrier }), tCo + .4, .4);
  hide(Lp, tCo, .3);
  // h: one H⁺ drifts to the cotransporter and binds, down its gradient; it does not pass alone
  const [hS, sS] = cot.sol, G2L = q => cOut(cot, q);   // local → parent
  const site = [G2L([0, -18]), G2L([0, 18])], hFrom = [900, 300], sFrom = [1300, 170];
  const fin1 = [[930, 760], [1150, 750]];
  const da = arw(p, [880, 214], [1010, 370], { color: MC.down, w: 6, head: 22, dash: '14 10', o: 0 }); show(da, tH + .3, .4);
  const Lh = G(p, { o: 0 }); show(Lh, tH + .6, .4);
  wLabel(Lh, 'diffusion of H⁺', { x: 1040, y: 116, size: 26, fill: MC.down, weight: 700, o: 1 });
  wLabel(Lh, 'down its gradient', { x: 1040, y: 146, size: 22, fill: COL.dim, weight: 500, o: 1 });
  pulse(da, tH + 6, 1.08);
  // suc: a sucrose joins, the carrier flips, both go in (sucrose uphill); ind: a second pair goes the same way
  hide(sOut[0], tSu + 3.5, .05);
  const fin = [solute(p, 'H', { x: fin1[0][0], y: fin1[0][1], r: 19, o: 0 }), solute(p, 'sucrose', { x: fin1[1][0], y: fin1[1][1], r: 17, o: 0 })];
  clockRun(t => {
    const tq = Math.floor(t * 30) / 30;
    if (tq < tI + .3) {
      const hk = io(mRamp(tq, tH + .8, tH + 3)), sk = io(mRamp(tq, tSu + 3.5, tSu + 5.4));
      const fl = io(mRamp(tq, tSu + 5.6, tSu + 7)) - io(mRamp(tq, tSu + 8.8, tSu + 9.6)), lv = io(mRamp(tq, tSu + 7.1, tSu + 8.6));
      cot.flip(fl);
      const hp = lv > 0 ? cLerp2(site[0], fin1[0], lv) : cLerp2(hFrom, site[0], hk), sp = lv > 0 ? cLerp2(site[1], fin1[1], lv) : cLerp2(sFrom, site[1], sk);
      // the pieces live in the carrier's frame: convert back from parent coordinates
      const { x: gx, y: gy, s: gs } = st(cot);
      cSet(hS, { x: (hp[0] - gx) / gs, y: (hp[1] - gy) / gs, o: tq < tH + .5 ? 0 : mRamp(tq, tH + .5, tH + .8) });
      cSet(sS, { x: (sp[0] - gx) / gs, y: (sp[1] - gy) / gs, o: tq < tSu + 3.5 ? 0 : 1 });
      mO(fin[0], 0); mO(fin[1], 0);
    } else {
      mO(fin[0], 1); mO(fin[1], 1);
      const k = mRamp(tq, tI + .5, tI + 6.5); cot.carry(k);
      const fo = mRamp(tq, tI + .3, tI + .7); mO(hS, fo); mO(sS, fo);
    }
  }, D);
  const ua = arw(p, [1205, 400], [1205, 650], { color: MC.against, w: 8, head: 24, o: 0 }); show(ua, tSu + 7.4, .4);
  const Lu = G(p, { o: 0 }); show(Lu, tSu + 7.6, .4);
  wLabel(Lu, 'sucrose: uphill', { x: 1225, y: 622, size: 26, fill: MC.against, weight: 700, anchor: 'start', o: 1 });
  wLabel(Lu, 'against its gradient', { x: 1225, y: 650, size: 22, fill: COL.dim, weight: 500, anchor: 'start', o: 1 });
  // ind: the ledger
  const l1 = G(p, { o: 0 }); show(l1, tI + .6, .4);
  mChip(l1, [['ATP spent here', MC.atp]], { x: PX, y: 850, size: 24, edge: MC.atp });
  const l2 = G(p, { o: 0 }); show(l2, tI + 2.4, .4);
  mChip(l2, [['no ATP here', COL.chalk]], { x: CX - 40, y: 850, size: 24, edge: COL.dim });
  const Li = G(p, { o: 0 }); show(Li, tI + 6.4, .5);
  plate(Li, 720, 660, 520, 92);
  wLabel(Li, 'indirect', { x: 720, y: 652, size: 34, weight: 800, fill: MC.carrier, o: 1 });
  wLabel(Li, 'the pump spent ATP on H⁺, not on sucrose', { x: 720, y: 688, size: 22, fill: COL.chalk, weight: 500, o: 1 });
  hide(Lu, tI + 6, .3);
  notToScale(p, 1570, 900 - 14, .3);
}],

/* ---------- example ---------- */
['example', 'The whole chain', (m, D) => {
  const p = panel(0), tA = m('a'), tB = m('b'), tC = m('c'), tDd = m('d'), tX = m('block');
  const Y = 430, S1 = .9, PX = 200, CX = 820;
  const M = memb(p, { x: 640, y: Y, w: 1260, s: S1, gaps: [[PX, 70], [CX, 72]] }); sideNames(p, M, .2, { inDy: 130 }); lipidLife(M, D);
  const pp = protonPump(p, { x: PX, y: Y, s: S1 }), cot = cotransporter(p, { x: CX, y: Y, s: S1 });
  const sg = signs(p, rowXs(80, 1220, 92, [[PX, 100], [CX, 100]]), M.face - 24, M.faceIn + 24, { size: 32 });
  // one level (0 … 1) for the H⁺ gradient and the voltage: built from "b", lost after the block
  const level = t => mRamp(t, tB + .5, tB + 4) * (1 - mRamp(t, tX + .6, tX + 5));
  const crowd = scatter(12, [320, 140, 700, 330], 11).map(q => solute(p, 'H', { x: q[0], y: q[1], r: 17, o: 0 }));
  [[420, 640], [560, 760]].forEach(q => solute(p, 'H', { x: q[0], y: q[1], r: 17 }));
  // the pump cycles (4 H⁺ a cycle) from "b" until it is blocked; the cotransporter from "c", slowing with the gradient
  const pumpPh = t => Math.max(0, Math.min(t, tX + .3) - (tB + .3)) / 2.4;
  const r0 = 1 / 3.2;
  const cotPh = t => { if (t < tC + .3) return 0; const B = tX + .6; if (t < B) return r0 * (t - tC - .3); const u = Math.min(t - B, 4.4); return r0 * (B - tC - .3) + r0 * (u - u * u / 8.8); };
  const delivered = ph => ph < .82 ? 0 : Math.floor(ph - .82) + 1;
  const sIn = scatter(12, [900, 560, 1230, 860], 12).map((q, i) => solute(p, 'sucrose', { x: q[0], y: q[1], r: 15, o: i < 3 ? 1 : 0 }));
  [[960, 200], [1080, 290], [1180, 180]].forEach(q => solute(p, 'sucrose', { x: q[0], y: q[1], r: 15 }));
  const beet = beetArt(p, { x: 1430, y: 300, s: .42 });
  const rig = meterRig(p, { x: 1440, y: 700, s: .72, inTip: [1200, 580], outTip: [1290, 330] });
  clockRun(t => {
    const tq = Math.floor(t * 30) / 30, lv = level(tq);
    sg.set(lv); rig.set(-70 * lv);
    crowd.forEach((e, i) => mO(e, mClamp(lv * crowd.length - i)));
    const ph = pumpPh(tq), kf = cFrac(ph);
    pp.run(ph > 0 ? kf : 0);
    pp.h.forEach((e, i) => { const u = mRamp(kf, i / 4, (i + 1) / 4); mO(e, ph <= 0 ? 1 : (1 - mRamp(u, .9, 1)) * (ph > 1 ? mRamp(kf, 0, .06) : 1)); });
    const cp = cotPh(tq), cf = cFrac(cp);
    cot.carry(cp > 0 ? cf : 0);
    const so = cp <= 0 ? 0 : cf < .1 ? cf / .1 : cf > .86 ? (1 - cf) / .14 : 1;
    cot.sol.forEach(e => mO(e, so));
    const dv = delivered(cp);
    sIn.forEach((e, i) => { if (i >= 3) mO(e, mClamp(dv - (i - 3))); });
    cSet(beet, { s: .42 + .022 * Math.min(9, dv) });
  }, D);
  // the four steps
  const badgeAt = (n, x, str, t0) => { const g = G(p, { o: 0 }); show(g, t0, .4); badge(g, String(n), x, 74, { o: 1 }); wLabel(g, str, { x, y: 128, size: 22, fill: COL.chalk, weight: 600, o: 1 }); return g; };
  badgeAt(1, PX, 'ATP powers the pump', tA);
  const a0 = solute(p, 'ATP', { x: PX + 130 * S1, y: Y + 170 * S1, r: 14 * S1, o: 0 }); show(a0, tA + .1, .3); pulse(a0, tA + .4, 1.3); hide(a0, tB + .3, .05);
  badgeAt(2, 510, 'H⁺ out: gradient + voltage', tB + .2);
  badgeAt(3, CX, 'H⁺ back in, with sucrose', tC + .2);
  badgeAt(4, 1430, 'sucrose piles up', tDd + .2);
  // block: a poison stops the pump
  const X = G(p, { x: PX, y: Y, o: 0 }); show(X, tX + .3, .2); pulse(X, tX + .4, 1.15);
  path(X, 'M-70 -70L70 70M70 -70L-70 70', { stroke: RED, 'stroke-width': 16, 'stroke-linecap': 'round' });
  say(p, 'poison: pump blocked', PX, 640, tX + .6, { size: 26, fill: RED, weight: 700 });
  const nb = G(p, { o: 0 }); show(nb, tX + 2.6, .4);
  plate(nb, 640, 860, 420, 54); wLabel(nb, 'no pump, no push', { x: 640, y: 869, size: 28, weight: 800, fill: RED, o: 1 });
  say(p, 'the cotransporter itself is fine', CX, 700, tX + 8.5, { size: 22, fill: MC.carrier, weight: 600 });
  say(p, 'simplified: a real gradient', 1440, 846, tX + 3, { size: 20, fill: COL.dim, weight: 500 });
  say(p, 'runs down over time', 1440, 872, tX + 3, { size: 20, fill: COL.dim, weight: 500 });
}],

/* ---------- wrap ---------- */
['wrap', 'Summary', (m, D) => {
  const p = panel(0);
  const rows = [
    ['Membrane potential: a voltage across the membrane,', 'made by uneven ions; the inside is negative.', g => {
      path(g, 'M60 0H200', { stroke: MC.head, 'stroke-width': 18 }); path(g, 'M60 0H200', { stroke: MC.tail, 'stroke-width': 6 });
      wLabel(g, '+ + +', { x: 130, y: -20, size: 26, fill: MC.plus, weight: 800, o: 1 }); wLabel(g, '− − −', { x: 130, y: 40, size: 26, fill: MC.minus, weight: 800, o: 1 });

  const X0 = 150;

    pulse(ic, m('w' + (i + 1)) + .5, 1.06);
  });
  say(p, 'Now try the chapter practice.', 800, 870, m('end'), { size: 32, fill: WC.bond });

/* ---------- final1 ---------- */
['final1', 'Chapter practice', (m, D) => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  const PCX = 1270;
  at('sign', g => {
    const ecf = mk('rect', { x: 990, y: 110, width: 560, height: 270, rx: 18, fill: '#132a46', 'fill-opacity': .5 }, g);
    const M = memb(g, { x: PCX, y: 450, w: 580 });
    const cy = mk('rect', { x: 990, y: 520, width: 560, height: 300, rx: 18, fill: '#1d3d63', 'fill-opacity': .6 }, g);
    wLabel(g, 'extracellular fluid', { x: 1150, y: 170, size: 26, fill: COL.chalk, o: 1 });
    wLabel(g, 'cytoplasm', { x: 1150, y: 700, size: 26, fill: COL.chalk, o: 1 });
    meterRig(g, { x: 1440, y: 230, s: .7, inTip: [1440, 640], outTip: [1520, 330] }).set(-70);
    S.signPick = [{ el: cy, box: [990, 520, 560, 300], label: 'the cytoplasm' }, { el: ecf, box: [990, 110, 560, 270], label: 'the extracellular fluid' }];
    void M;
  });
  at('pumps', g => {
    const M = memb(g, { x: PCX, y: 450, w: 600, s: .9, gaps: [[1130, 84], [1420, 70]] });
    naKPump(g, { x: 1130, y: 450, s: .9 }); protonPump(g, { x: 1420, y: 450, s: .9 });
    wLabel(g, 'sodium-potassium pump', { x: 1130, y: 230, size: 22, fill: '#aab6ff', weight: 700, o: 1 });
    wLabel(g, 'proton pump', { x: 1420, y: 230, size: 22, fill: '#aab6ff', weight: 700, o: 1 });
    void M;
  });
  at('force', g => {
    const M = memb(g, { x: PCX, y: 450, w: 600 });
    signs(g, rowXs(1000, 1540, 68), M.face - 26, M.faceIn + 26, { size: 32 }).set(1);
    scatter(9, [1000, 130, 1540, 320], 13).forEach(q => solute(g, 'Cl', { x: q[0], y: q[1], r: 18 }));
    [[1080, 700], [1420, 780]].forEach(q => solute(g, 'Cl', { x: q[0], y: q[1], r: 18 }));
    wLabel(g, 'Cl⁻: more outside', { x: PCX, y: 100, size: 26, fill: MC.Cl, weight: 700, o: 1 });
    wLabel(g, 'chemical force: ?', { x: PCX, y: 640, size: 24, fill: MC.down, weight: 700, o: 1 });
    wLabel(g, 'electrical force: ?', { x: PCX, y: 680, size: 24, fill: ELEC, weight: 700, o: 1 });
  });
  at('cot', g => {
    const M = memb(g, { x: PCX, y: 450, w: 600, s: .9, gaps: [[1110, 70], [1420, 72]] });
    signs(g, rowXs(1000, 1540, 72, [[1110, 90], [1420, 90]]), M.face - 24, M.faceIn + 24, { size: 30 }).set(1);
    protonPump(g, { x: 1110, y: 450, s: .9 }).run(1); cotransporter(g, { x: 1420, y: 450, s: .9 }).carry(.45);
    [[1010, 160], [1200, 140], [1260, 260], [1320, 160]].forEach(q => solute(g, 'H', { x: q[0], y: q[1], r: 17 }));
    [[1500, 200]].forEach(q => solute(g, 'sucrose', { x: q[0], y: q[1], r: 16 }));
    scatter(5, [1300, 640, 1540, 820], 3).forEach(q => solute(g, 'sucrose', { x: q[0], y: q[1], r: 16 }));
    wLabel(g, 'proton pump', { x: 1110, y: 100, size: 22, fill: '#aab6ff', weight: 700, o: 1 });
    wLabel(g, 'sucrose-H⁺ cotransporter', { x: 1420, y: 100, size: 22, fill: MC.carrier, weight: 700, o: 1 });
  });
  at('steps', g => {
    const M = memb(g, { x: PCX, y: 430, w: 600, s: .8, gaps: [[1060, 70], [1400, 72]] });
    protonPump(g, { x: 1060, y: 430, s: .8 }); cotransporter(g, { x: 1400, y: 430, s: .8 });
    solute(g, 'ATP', { x: 1060 + 104, y: 430 + 136, r: 12 });
    [[1180, 240], [1240, 300], [1280, 220]].forEach(q => solute(g, 'H', { x: q[0], y: q[1], r: 15 }));
    scatter(5, [1300, 600, 1540, 800], 5).forEach(q => solute(g, 'sucrose', { x: q[0], y: q[1], r: 14 }));
    S.stepB = [badge(g, '?', 1060, 700, { o: 1 }), badge(g, '?', 1240, 150, { o: 1 }), badge(g, '?', 1400, 220, { o: 1 }), badge(g, '?', 1420, 840, { o: 1 })];
    void M;
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('sign');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-sign', prompt: ['A cell has a membrane potential. Click the side of the membrane that is negative.'],
    build: withPic('sign', (body, api) => pickEls(S.signPick, 0, 'Right. The cytoplasm is negative: pumping + charge out leaves a surplus of − charge inside.',
      i => [null, 'The extracellular fluid holds the surplus of + charge. The minus sign of −70 mV says the inside is negative.'][i])(body, api)) },
  { id: 'p-pumps', prompt: ['Which is the main electrogenic pump of each cell?'],
    build: withPic('pumps', grid([
      { parts: ['sugar beet'], ans: ['p'], why: 'A proton pump: plants use proton pumps as their main electrogenic pump.' },
      { parts: ['nerve cell'], ans: ['s'], why: 'The sodium-potassium pump: it is the major electrogenic pump of animal cells.' },
      { parts: ['yeast (a fungus)'], ans: ['p'], why: 'A proton pump: fungi, like plants and bacteria, mainly use proton pumps.' },
      { parts: ['bacterium'], ans: ['p'], why: 'A proton pump, as in plants and fungi.' },
      { parts: ['muscle cell'], ans: ['s'], why: 'The sodium-potassium pump, as in every animal cell.' },
    ], [['s', 'Na⁺/K⁺ pump', null, 'S'], ['p', 'proton pump', null, 'P']], { multi: false, text: true })) },
  { id: 'p-force', prompt: ['Chloride (Cl⁻) is more concentrated outside a cell whose inside is negative. Which statement is right?'],
    build: withPic('force', choice([['The chemical force points in and the electrical force points out: they oppose.'], ['Both forces point in.'], ['Both forces point out.'], ['There is no electrical force on Cl⁻.']], 0,
      'Right. Cl⁻ spreads in from the crowded outside, but the negative inside pushes a negative ion away, so the two forces oppose.',
      [null, 'The chemical force does point in, but the negative inside repels a negative ion: the electrical force points out.',
       'More Cl⁻ outside means it spreads inward: the chemical force points in.',
       'A membrane potential acts on every charged particle, and Cl⁻ carries a − charge.'])) },
  { id: 'p-cot', prompt: ['In a plant cell, sucrose enters against its concentration gradient. What supplies the energy?'],
    build: withPic('cot', choice([['The H⁺ gradient built by the proton pump with ATP: H⁺ flows back in through the cotransporter and carries sucrose.'], ['The cotransporter splits ATP for each sucrose.'], ['Nothing: sucrose just diffuses in.'], ['The negative inside pulls the sucrose in.']], 0,
      'Right. The pump spends ATP on H⁺; the H⁺ gradient then pays for sucrose. That is why cotransport is called indirect.',
      [null, 'No ATP is spent at the cotransporter. The ATP went into the pump, which built the H⁺ gradient: that is why it is indirect.',
       'Sucrose moves uphill, from less to more, so it needs a push: diffusion only runs downhill.',
       'Sucrose carries no charge, so the voltage does not pull it. The push comes from the H⁺ flowing in with it.'])) },
  { id: 'p-steps', prompt: ['Put the chain in order: number the steps from 1 to 4.'],
    build: withPic('steps', blanks([
      { parts: ['protons ride the carrier back in: step ', { box: '3' }], why: 'Step 3: the H⁺ gradient drives H⁺ back in, through the cotransporter.', hint: 'Energy first, then the gradient, then the cotransporter, then the sugar.', fx: () => stepFx(2, '3') },
      { parts: ['ATP powers the proton pump: step ', { box: '1' }], why: 'Step 1: the energy comes first, from ATP.', hint: 'Energy first, then the gradient, then the cotransporter, then the sugar.', fx: () => stepFx(0, '1') },
      { parts: ['sucrose is carried into the cell: step ', { box: '4' }], why: 'Step 4: sucrose rides in with the H⁺ and piles up in the cell.', hint: 'Energy first, then the gradient, then the cotransporter, then the sugar.', fx: () => stepFx(3, '4') },
      { parts: ['the pump pushes protons out: step ', { box: '2' }], why: 'Step 2: the pump moves H⁺ out, building the gradient and the voltage.', hint: 'Energy first, then the gradient, then the cotransporter, then the sugar.', fx: () => stepFx(1, '2') },
    ])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// A numbered step badge; .t is its text.
function badge(p, str, x, y, { o = 0, r = 24 } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { r, fill: '#3b8fd9', stroke: '#cfe6ff', 'stroke-width': 3 }, g);
  const t = wLabel(g, str, { y: r * .4, size: r * 1.15, fill: '#ffffff', weight: 800, o: 1 });
  return Object.assign(g, { t });
}
// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.q?.remove(); S.q = null; S.pics?.(key); return build(body, api); }; }   // drops the last question's stage rings
function stepFx(i, str) { const b = S.stepB?.[i]; if (!b) return; fxp(q => { b.t.textContent = q > 0 ? str : '?'; }, 0, .2); pulseFx(b, 1.4); }
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };

boot();
</script>
