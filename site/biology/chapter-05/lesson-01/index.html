'use strict';
// Biology, Chapter 5 (Large Biological Molecules), lesson 1: from a bowl of pasta into a cell; the four classes of large
// molecules; monomers and polymers (lipids the exception); dehydration step by step; enzymes; hydrolysis and digestion;
// check 1; variety from a small set of monomers; check 2; summary; practice. Molecules are the only cast.
// Plan, errata and storyboard: books/biology/chapters/chapter-05/lesson-01.md.
const CHAPTER = { number: 501, label: '5, lesson 1', title: 'Macromolecules, Monomers and Polymers', minutes: 7, language: 'en', lead: false, next: '../lesson-02/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const KINDS = ['circle', 'square', 'hex', 'diamond'];
const H2O = 'H₂O';
// A leader line from a label to the thing it names.
const leader = (p, a, b, t0, color = COL.dim) => { const e = path(p, `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`, { stroke: color, 'stroke-width': 2.5 }, { d: 0 }); draw(e, t0, .5); return e; };
// Write x, y, o (and s) only when they change.
const place = (e, x, y, o = 1, s) => { const v = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, o: Math.round(o * 1000) / 1000 }; if (s !== undefined) v.s = Math.round(s * 1000) / 1000; const c = st(e); if (Object.keys(v).some(k => c[k] !== v[k])) put(e, v); return e; };
const ptsPath = pts => pts.map(([a, b], i) => (i ? 'L' : 'M') + a.toFixed(1) + ' ' + b.toFixed(1)).join('');
// Points of a wavy chain of n beads, centred on its origin.
const wavePts = (n, sp, amp = 0, ph = 0, f = .9) => Array.from({ length: n }, (_, i) => [(i - (n - 1) / 2) * sp, amp * Math.sin(i * f + ph)]);

// One bead of a monomer kind (macro.js shapes and colours), around (x, y).
function bead(p, kind, x, y, r, o = {}) {
  const [f, e] = M_BEAD[kind], g = G(p, { x, y, ...o });
  path(g, mBeadPath(kind, r), { fill: f, stroke: e, 'stroke-width': Math.max(1.5, r * .09) });
  if (r > 14) mk('ellipse', { cx: -r * .34, cy: -r * .4, rx: r * .28, ry: r * .16, fill: '#fff', 'fill-opacity': .3 }, g);
  return g;
}
// A string of beads along pts (no HO/H tags): a polymer drawn small. .beads[i] are groups at their points; .stick the line.
function beadString(p, pts, kinds, { r = 20, x = 0, y = 0, s = 1, r0 = 0, o = 1 } = {}) {
  const g = G(p, { x, y, s, r: r0, o });
  g.stick = path(g, ptsPath(pts), { stroke: WC.stick, 'stroke-width': Math.max(3, r * .34), 'stroke-linejoin': 'round' });
  g.beads = pts.map(([a, b], i) => bead(g, kinds[i % kinds.length], a, b, r));
  return g;
}
// A wobbly cell outline.
function cellBlob(p, { x = 800, y = 450, w = 1400, h = 780, fill = MC.cyto, edge = MC.membrane, sw = 8, o = 1, seed = 0 } = {}) {
  const g = G(p, { x, y, o }), rx = w / 2, ry = h / 2; let d = '';
  for (let i = 0; i <= 72; i++) { const t = i / 72 * 2 * Math.PI, k = 1 + .025 * Math.sin(3 * t + .6 + seed) + .018 * Math.sin(5 * t + 2.1 + seed); d += (i ? 'L' : 'M') + (rx * k * Math.cos(t)).toFixed(1) + ' ' + (ry * k * Math.sin(t)).toFixed(1); }
  path(g, d + 'Z', { fill, stroke: edge, 'stroke-width': sw });
  return g;
}
// A paper clip lying flat, about 100 wide, centred on its origin.
function paperClip(p, o = {}) {
  const g = G(p, o);
  path(g, 'M-30 -15H35A15 15 0 0 1 35 15H-38A11 11 0 0 1 -38 -7H25A7 7 0 0 1 25 7H-20', { stroke: '#c9d2dc', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  return g;
}
// A cream check mark and a red cross, centred on their origins.
const checkMark = (p, o = {}) => { const g = G(p, o); mk('circle', { r: 26, fill: '#0b1626', stroke: COL.chalk, 'stroke-width': 3 }, g); path(g, 'M-12 1L-3 11L13 -9', { stroke: COL.chalk, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }); return g; };
const crossMark = (p, o = {}) => { const g = G(p, o); path(g, 'M-70 -60L70 60M70 -60L-70 60', { stroke: COL.bad, 'stroke-width': 12, 'stroke-linecap': 'round' }); return g; };

/* ---------- the four classes, as glyphs (about 240 × 150, centred) ---------- */
const LIPID = { head: '#e0a85c', headEdge: '#a8762f', tail: '#f1d08a' };
function carbGlyph(p, o = {}) {
  const g = G(p, o), pts = [[-96, 12], [-32, -12], [32, 12], [96, -12]];
  path(g, ptsPath(pts), { stroke: WC.stick, 'stroke-width': 8 });
  pts.forEach(([x, y]) => { path(g, mPoly(6, 30, 0, x, y), { fill: MC.sugar, stroke: MC.sugarEdge, 'stroke-width': 3 }); mk('circle', { cx: x + 12, cy: y - 14, r: 4, fill: MC.oh }, g); });
  return g;
}
function lipidGlyph(p, o = {}) {
  const g = G(p, o);
  [-34, 0, 34].forEach((dy, i) => {
    let d = `M-60 ${dy * .5}`; for (let k = 1; k <= 8; k++) d += `L${-60 + k * 22} ${dy + (k % 2 ? -9 : 9) + (i === 1 && k > 4 ? 10 * (k - 4) / 4 : 0)}`;
    path(g, d, { stroke: LIPID.tail, 'stroke-width': 9, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  });
  mk('ellipse', { cx: -82, cy: 0, rx: 34, ry: 46, fill: LIPID.head, stroke: LIPID.headEdge, 'stroke-width': 3 }, g);
  mk('ellipse', { cx: -92, cy: -16, rx: 10, ry: 6, fill: '#fff', 'fill-opacity': .3 }, g);
  return g;
}
function protGlyph(p, o = {}) {
  const g = G(p, o), pts = [];
  for (let i = 0; i < 12; i++) { const row = Math.floor(i / 4), c = row % 2 ? 3 - i % 4 : i % 4; pts.push([(c - 1.5) * 46 + (row === 1 ? 8 : 0), (row - 1) * 40]); }
  pts.unshift([-120, -40]); pts.push([110, 66]);
  path(g, ptsPath(pts), { stroke: '#9a7fb0', 'stroke-width': 8, 'stroke-linejoin': 'round' });
  pts.forEach(([x, y]) => bead(g, 'amino', x, y, 17));
  return g;
}
function nucGlyph(p, o = {}) {
  const g = G(p, o), xs = [], pair = [['A', 'T'], ['G', 'C'], ['T', 'A'], ['C', 'G'], ['A', 'T'], ['G', 'C'], ['C', 'G']];
  for (let i = 0; i < 7; i++) xs.push(-108 + i * 36);
  const yT = x => -38 * Math.cos((x + 108) / 216 * Math.PI * 1.15), yB = x => -yT(x);
  pair.forEach(([a, b], i) => { const x = xs[i], y1 = yT(x), y2 = yB(x), ym = (y1 + y2) / 2; path(g, `M${x} ${y1}L${x} ${ym}`, { stroke: MC[a], 'stroke-width': 9 }); path(g, `M${x} ${ym}L${x} ${y2}`, { stroke: MC[b], 'stroke-width': 9 }); });
  let d1 = '', d2 = ''; for (let x = -120; x <= 120; x += 6) { d1 += (x > -120 ? 'L' : 'M') + x + ' ' + yT(x).toFixed(1); d2 += (x > -120 ? 'L' : 'M') + x + ' ' + yB(x).toFixed(1); }
  path(g, d1, { stroke: MC.dna, 'stroke-width': 10 }); path(g, d2, { stroke: MC.dna, 'stroke-width': 10 });
  return g;
}
const GLYPHS = [['carbohydrates', carbGlyph], ['lipids', lipidGlyph], ['proteins', protGlyph], ['nucleic acids', nucGlyph]];

/* ---------- backdrops ---------- */
// A bowl of pasta and a slice of bread on a table (intro). Returns { g, bowl, bread, steam }; the noodle at NOODLE is the way in.

  const bowl = G(g, { x: 480, y: 600 });

  mk('ellipse', { cx: 0, cy: -12, rx: 248, ry: 44, fill: '#c4c0b6' }, bowl);

  let nd = '';
  for (let k = 0; k < 9; k++) { const y0 = -24 - k * 10, w = 200 - k * 18; nd += `M${-w} ${y0}`; for (let x = -w + 20; x <= w; x += 20) nd += `Q${x - 10} ${y0 + ((x / 20) % 2 ? -12 : 12)} ${x} ${y0}`; }

  path(bowl, 'M-250 -14Q-244 130 0 132Q244 130 250 -14Z', { fill: '#eeeae0', stroke: '#b9b3a6', 'stroke-width': 4 });

  const steam = path(g, 'M410 450q-20 -30 0 -60t0 -60M480 430q-20 -30 0 -60t0 -60M550 450q-20 -30 0 -60t0 -60', { stroke: '#cfd8ea', 'stroke-width': 5, 'stroke-opacity': .5, 'stroke-dasharray': '30 26', 'stroke-linecap': 'round' });
  const bread = G(g, { x: 900, y: 650 });

  path(bread, 'M-66 -8V-116Q-100 -126 -98 -158Q-94 -186 -48 -186H48Q94 -186 98 -158Q100 -126 66 -116V-8Z', { fill: '#efcf93' });
  let holes = ''; [[-30, -140], [20, -100], [-10, -60], [40, -40], [-40, -30], [30, -160]].forEach(([x, y]) => { holes += `M${x - 5} ${y}a5 4 0 1 0 10 0a5 4 0 1 0 -10 0`; });

// Lock and key: the shape of a molecule decides what it can do (classes, fit). .key slides into the notch at y 0.
function lockKey(p, o = {}) {
  const g = G(p, o);
  path(g, 'M-130 -60Q-130 -80 -110 -80H-42L0 -32L42 -80H110Q130 -80 130 -60V60Q130 80 110 80H-110Q-130 80 -130 60Z', { fill: M_BEAD.amino[0], stroke: M_BEAD.amino[1], 'stroke-width': 4 });
  const key = G(g);
  path(key, 'M-38 -82L0 -38L38 -82Z', { fill: M_BEAD.diamond[0], stroke: M_BEAD.diamond[1], 'stroke-width': 3 });
  path(key, 'M0 -82V-118', { stroke: WC.stick, 'stroke-width': 7 });
  mk('circle', { cx: 0, cy: -130, r: 15, fill: M_BEAD.diamond[0], stroke: M_BEAD.diamond[1], 'stroke-width': 3 }, key);
  return Object.assign(g, { key });
}

// Gut tube with a long chain that enzymes cut into single monomers (hydro, eat). pose(t) draws it at beat time t.
function gutScene(p, t0) {
  const g = G(p), cy = 470, n = 8, sp = 60, r = 22, gap = 78;
  const top = x => cy - 150 + 20 * Math.sin(x / 150), bot = x => cy + 150 + 20 * Math.sin(x / 150 + .7);
  let dt = '', db = '';
  for (let x = -20; x <= 1620; x += 20) { dt += (x > -20 ? 'L' : 'M') + x + ' ' + top(x).toFixed(1); }
  for (let x = 1620; x >= -20; x -= 20) { db += 'L' + x + ' ' + bot(x).toFixed(1); }
  path(g, dt + db + 'Z', { fill: '#3b2433' });
  path(g, dt, { stroke: '#c98f9a', 'stroke-width': 12 });
  path(g, 'M' + db.slice(1), { stroke: '#c98f9a', 'stroke-width': 12 });
  const kinds = ['hex', 'circle', 'square', 'diamond', 'hex', 'square', 'circle', 'hex'];
  const sticks = Array.from({ length: n }, () => path(g, '', { stroke: WC.stick, 'stroke-width': 8 }));
  const waters = Array.from({ length: n }, () => waterMolecule(g, { s: .34, o: 0 }));
  const beads = kinds.map(k => bead(g, k, 0, 0, r));
  const order = [4, 2, 6, 1, 5, 3, 7], tb = {};
  order.forEach((b, k) => { tb[b] = t0 + 1 + .62 * k; });
  const enz = [0, 1, 2].map(() => enzyme(g, { R: 30, dir: 90 }));
  const brk = (b, t) => io(ramp(t, tb[b], tb[b] + .7));
  const pos = t => {
    const xs = []; let acc = 0, tot = 0;
    for (let b = 1; b < n; b++) tot += brk(b, t);
    for (let j = 0; j < n; j++) { if (j > 0) acc += brk(j, t); xs.push(800 + (j - (n - 1) / 2) * sp + gap * (acc - tot / 2)); }
    return xs.map((x, j) => [x, cy + 10 * Math.sin(1.4 * t + j) * ramp(t, tb[order[0]], tb[order[0]] + 1)]);
  };
  const tasks = [0, 1, 2].map(e => order.filter((b, k) => k % 3 === e));
  return {
    g, beads, enz,
    pose(t) {
      const P = pos(t);
      P.forEach(([x, y], j) => place(beads[j], x, y));
      for (let b = 1; b < n; b++) {
        const [x1, y1] = P[b - 1], [x2, y2] = P[b], o = 1 - ramp(t, tb[b], tb[b] + .15);
        mD(sticks[b], mSeg([x1 + r - 2, y1], [x2 - r + 2, y2])); mO(sticks[b], o);
        place(waters[b], (x1 + x2) / 2, lerp(cy + 110, cy + 34, io(ramp(t, tb[b] - .7, tb[b] - .1))), mBump(t, tb[b] - .7, tb[b] + .35));
      }
      enz.forEach((e, k) => {
        let [x, y] = [520 + 280 * k, cy - 260];
        let bite = 1;
        tasks[k].forEach(b => {
          const [x1, y1] = P[b - 1], [x2, y2] = P[b], q = io(ramp(t, tb[b] - 1.1, tb[b] - .35));
          x = lerp(x, (x1 + x2) / 2, q); y = lerp(y, (y1 + y2) / 2 - r - 30, q);
          bite = Math.min(bite, 1 - mBump(t, tb[b] - .3, tb[b] + .35));
        });
        const last = tb[tasks[k][tasks[k].length - 1]], up = io(ramp(t, last + .5, last + 1.3));
        place(e, x, lerp(y, cy - 220 + 20 * k, up), 1); e.bite(bite);
      });
    },
  };
}

// The three polymers of one small set of monomers (diverse order, q2): a legend row of the four kinds, then three chains.
const ORDERS = [['circle', 'square', 'hex', 'diamond', 'circle'], ['hex', 'hex', 'circle', 'diamond', 'square', 'square', 'circle', 'diamond'], ['diamond', 'circle', 'circle', 'square', 'hex', 'circle']];
function orderPic(p, { y0, ys, x0 = 330, r = 26, sp = 72, t0 = null, lc = 800, legend = 'a small set of monomers' }) {
  const L = G(p, { o: t0 === null ? 1 : 0 });
  wLabel(L, legend, { x: lc, y: y0 - 60, size: 28, fill: COL.dim, weight: 500, o: 1 });
  KINDS.forEach((k, i) => bead(L, k, lc - 150 + i * 100, y0, 30));
  if (t0 !== null) show(L, t0);
  return ORDERS.map((seq, c) => {
    const s = beadString(p, seq.map((_, i) => [x0 + i * sp, 0]), seq, { r, y: ys[c], o: t0 === null ? 1 : 0 });
    if (t0 !== null) tw(s, { o: 1 }, t0 + .6 + .7 * c, .5);
    return s;
  });
}

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };

// Three real polymers (examples, q3): the monomer drawn at a group's origin, and the chain grown from x 580 at row y

const AMINO_HUES = ['#c9a0dc', '#f4a48c', '#86c9e8', '#8fd6b0', '#e8a0c8', '#ffd27a', '#a8c66c', '#6c8cff', '#f39a2b', '#bba8ee'];

}

];
// A fat: a glycerol bar with three fatty acid tails, the bar centred at (x, y).
function fatMolecule(p, x, y) {

    let d = `M${x + 26} ${y + dy}`; for (let k = 1; k <= 10; k++) d += `L${x + 26 + k * 48} ${y + dy + (k % 2 ? -14 : 14) + (i === 2 && k > 5 ? 9 * (k - 5) : 0)}`;
    path(g, d, { stroke: LIPID.tail, 'stroke-width': 12, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  });
  mk('rect', { x: x - 34, y: y - 140, width: 68, height: 280, rx: 24, fill: LIPID.head, stroke: LIPID.headEdge, 'stroke-width': 4 }, g);
  mk('ellipse', { cx: x - 12, cy: y - 100, rx: 10, ry: 22, fill: '#fff', 'fill-opacity': .25 }, g);
  return g;
}
// The worked count (worked): 10 units, n − 1 bonds, n − 1 water out to build and in to break.
const WK_N = 10;

/* ---------- shared numbers (computed, never typed twice) ---------- */
const bondsIn = n => n - 1;                   // n monomers in one chain are held by n − 1 bonds
const Q1_N = 5, P_BUILD = 6, P_BREAK = 8, P_SPLIT = 9;

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'Big molecules from small ones', (m, D) => {
  // A table with pasta and bread; on "cell" the camera dives into one noodle until a cell fills the stage. The cell is
  // drawn at scale K around NOODLE, so at zoom 1/K its own coordinates are the stage's.
  const p = panel(0), cam = camera(p, D), W = cam.world, sc = pastaScene(W), tMeal = m('meal'), tCell = m('cell'), tChain = m('chain');
  const K = .04, [CX, CY] = NOODLE;
  clockRun(t => { const off = (-t * 18).toFixed(1); if (sc.steam._off !== off) sc.steam.setAttribute('stroke-dashoffset', sc.steam._off = off); }, D);
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOLOGY · CHAPTER 5: LARGE BIOLOGICAL MOLECULES · LESSON 1', { x: 1190, y: 170, size: 22, fill: COL.dim, o: 1 });
  ['Macromolecules,', 'monomers and', 'polymers'].forEach((s, i) => wLabel(ttl, s, { x: 1190, y: 260 + i * 78, size: 66, o: 1 }));
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tCell - .2, .5);
  // meal: the bowl, then the bread
  pulse(sc.bowl, tMeal + .1, 1.06);
  const l1 = say(p, 'a bowl of pasta', 480, 860, tMeal + .2, { size: 34 });
  const l2 = say(p, 'or a slice of bread', 900, 720, tMeal + 1.4, { size: 28, fill: COL.dim, weight: 500 });
  hide(l1, tCell, .3); hide(l2, tCell, .3);
  // cell: a ring on one noodle, then the dive
  const ring = mk('circle', { cx: CX, cy: CY, r: 40, fill: 'none', stroke: MC.membrane, 'stroke-width': 4 }, W); put(ring, { o: 0 });

/* ---------- dehydration ---------- */
['dehy', 'Dehydration', (m, D) => {
  const p = panel(0), tEnds = m('ends'), tMeet = m('meet'), tLose = m('lose'), tBond = m('bond'), tAgain = m('again');
  const X = 640, Y = 430, s = 1.45, ch = polymerChain(p, { n: 5, x: X, y: Y, s, water: .001 });
  const M0 = i => [X + s * ((ch.sp * (i - 1 - 2) + ch.sp * (i - 2) + 90) / 2), Y + s * (ch.R + 50)];
  // our own leaving waters, one per new bond: they form where H and OH meet, then drift off
  const ws = [3, 4].map(i => { const g = G(p, { o: 0 }); waterMolecule(g, { s: .62 * s * .9 }); wLabel(g, H2O, { x: 0, y: 92, size: 28, fill: COL.chalk, o: 1 }); return { i, g, at: M0(i) }; });
  const k1 = t => t < tMeet ? lerp(0, .12, ramp(t, .2, .9)) : t < tLose ? lerp(.12, .35, io(ramp(t, tMeet, tMeet + 1.6))) : t < tBond ? lerp(.35, .62, ramp(t, tLose, tLose + 3)) : lerp(.62, 1, ramp(t, tBond, tBond + 1.4));
  const k2 = t => ramp(t, tAgain + .2, tAgain + 2.2);
  const drift = [[tLose + 3.4, tLose + 6.8, [300, 200]], [tAgain + 1.8, tAgain + 3, [420, 60]]];
  clockRun(t => {
    const a = k1(t);
    if (a < 1) ch.dehydrate(3, a); else { ch.dehydrate(3, 1); if (t < tAgain + .2) ch.show(4); else ch.dehydrate(4, k2(t)); }   // the k = 1 pose first, so seeking and playing leave the same hidden state
    ws.forEach(({ i, g, at: [x0, y0] }, n) => {
      const k = i === 3 ? a : (t < tAgain + .2 ? 0 : k2(t)), [ta, tb, [dx, dy]] = drift[n], d = io(ramp(t, ta, tb));
      place(g, x0 + dx * d, y0 + dy * d - 30 * Math.sin(Math.PI * d), ramp(k, .55, .6));
    });
  }, D);
  // ends: every monomer has H at one end and OH at the other
  say(p, 'every monomer: OH at one end, H at the other', 800, 110, tEnds + .2, { size: 32 });
  [ch.beads[0].tagL, ch.beads[2].tagR, ch.beads[3].tagL, ch.beads[3].tagR].forEach((e, i) => pulse(e, tEnds + .5 + .3 * i, 1.5));
  hide(say(p, 'new monomer', 1203, 240, tEnds + .8, { size: 26, fill: COL.dim, weight: 500 }), tMeet + .6, .4);
  // lose: the chain's H and the monomer's OH leave together as one water
  say(p, 'H + OH leave together as one water', 800, 160, tLose + 2.6, { size: 28, fill: COL.dim, weight: 500 });
  // bond: the new bond, and the name
  const nb = G(p, { o: 0 }); show(nb, tBond + .5);
  wLabel(nb, 'new bond', { x: ch.mid(3)[0], y: Y - 120, size: 28, fill: MC.flash, o: 1 });
  path(nb, `M${ch.mid(3)[0]} ${Y - 106}V${Y - 30}`, { stroke: MC.flash, 'stroke-width': 3 });
  hide(nb, tAgain, .4);
  say(p, 'DEHYDRATION', 110, 720, tBond + 2.6, { size: 72, fill: WC.bond, anchor: 'start', weight: 700 });
  say(p, 'water removed, bond formed, polymer longer', 112, 772, tBond + 3.4, { size: 30, fill: COL.dim, anchor: 'start', weight: 500 });
  // again: one more block, one more water
  const cnt = say(p, '', 1480, 110, tBond + .8, { size: 30, anchor: 'end' });
  clockRun(t => { const n = t < tBond + .6 ? '' : t < tAgain + 1.6 ? 'units: 4' : 'units: 5'; if (cnt.textContent !== n) cnt.textContent = n; }, D);
}],

  say(B, 'big polymers chopped into monomers,', 800, 790, tEat + 4, { size: 32 });
  say(B, 'small enough to use', 800, 836, tEat + 5, { size: 30, fill: COL.dim, weight: 500 });
}],

/* ---------- a worked count ---------- */
['worked', 'Counting bonds and water', (m, D) => {
  // One function of t gives every bead, link and water, and the counter panel reads the same function.
  const p = panel(0), tTen = m('ten'), tB = m('bonds'), tW = m('waters'), tBk = m('back'), tR = m('rule');
  const n = WK_N, nb = bondsIn(n), sp = 124, y0 = 380, X = j => 800 + (j - (n - 1) / 2) * sp;
  say(p, `build a chain of ${n} glucose units, then digest it`, 800, 90, .3, { size: 32 });
  const tUnit = j => tTen + .2 + .2 * j, tLink = j => tB + .4 + .42 * j, tOut = j => tW + .6 + .62 * j, tIn = j => tBk + 1.4 + .74 * j;
  const links = Array.from({ length: nb }, () => path(p, '', { stroke: MC.flash, 'stroke-width': 10 }, { o: 0 }));
  const beads = Array.from({ length: n }, () => { const g = G(p, { o: 0 }); path(g, mPoly(6, 34, 0), { fill: MC.sugar, stroke: MC.sugarEdge, 'stroke-width': 3 }); return g; });
  const outs = Array.from({ length: nb }, () => waterMolecule(p, { s: .42, o: 0 }));
  const ins = Array.from({ length: nb }, () => waterMolecule(p, { s: .42, o: 0 }));
  // the counter panel
  mk('rect', { x: 140, y: 620, width: 1320, height: 170, rx: 22, fill: '#0f2338', stroke: COL.faint, 'stroke-width': 2 }, p);
  const cells = [['units', COL.chalk], ['bonds', MC.flash], ['water released', WC.bond], ['water used', WC.heat]].map(([lab, c], k) => {
    const x = 305 + k * 330; wLabel(p, lab, { x, y: 670, size: 26, fill: COL.dim, weight: 500, o: 1 });
    return wLabel(p, '0', { x, y: 755, size: 64, fill: c, weight: 800, o: 1 });
  });
  const count = (t, f) => Array.from({ length: nb }, (_, j) => f(j)).filter(t0 => t >= t0).length;
  clockRun(t => {
    const units = Array.from({ length: n }, (_, j) => j).filter(j => t >= tUnit(j)).length;
    const lit = count(t, tLink), out = count(t, j => tOut(j) + .2), used = count(t, j => tIn(j) + .5), bonds = lit - used;
    const spread = io(ramp(t, tIn(nb - 1) + .6, tIn(nb - 1) + 1.6));
    const bx = j => X(j) + 26 * (j - (n - 1) / 2) * spread * .9, by = j => y0 + 14 * Math.sin(1.5 * t + j) * spread;
    beads.forEach((b, j) => place(b, bx(j), by(j), ramp(t, tUnit(j), tUnit(j) + .2), .7 + .3 * ramp(t, tUnit(j), tUnit(j) + .2)));
    links.forEach((l, j) => {
      mD(l, mSeg([bx(j) + 30, by(j)], [bx(j + 1) - 30, by(j + 1)]));
      mO(l, ramp(t, tLink(j), tLink(j) + .15) * (1 - ramp(t, tIn(j) + .45, tIn(j) + .6)));
    });
    outs.forEach((w, j) => { const d = io(ramp(t, tOut(j), tOut(j) + 1.6)); w.pose(X(j) + sp / 2 + 30 * d, y0 - 30 - 170 * d); mO(w, ramp(t, tOut(j) - .1, tOut(j) + .1) * (1 - ramp(t, tOut(j) + 1.3, tOut(j) + 1.7))); });
    ins.forEach((w, j) => { const d = io(ramp(t, tIn(j) - .3, tIn(j) + .45)); w.pose(X(j) + sp / 2, y0 - 200 + 160 * d); mO(w, ramp(t, tIn(j) - .3, tIn(j) - .1) * (1 - ramp(t, tIn(j) + .45, tIn(j) + .6))); });
    [units, bonds, out, used].forEach((v, k) => { const s = String(v); if (cells[k].textContent !== s) cells[k].textContent = s; });
  }, D);
  hide(say(p, `${n} units in a row: ${nb} links`, 800, 520, tB + 3.7, { size: 30, fill: MC.flash }), tW + .6, .3);
  const bl = say(p, `building: one water out per bond`, 800, 520, tW + 1, { size: 30, fill: WC.bond }); hide(bl, tBk, .4);
  say(p, `digesting: one water in per bond`, 800, 520, tBk + .6, { size: 30, fill: WC.heat });
  say(p, 'n units: n − 1 bonds, n − 1 water, either way', 800, 860, tR + .5, { size: 34, fill: COL.chalk, weight: 700 });
}],

['q1', 'Quick check', (m, D) => {
  const p = panel(0);
  polymerChain(p, { n: Q1_N, x: 410, y: 220, s: .85 });
  wLabel(p, `a chain of ${Q1_N} monomers`, { x: 410, y: 130, size: 30, o: 1 });
  mArrow(p, [410, 290], [410, 450], { color: COL.dim, w: 6 });
  wLabel(p, 'fully digested', { x: 440, y: 380, size: 28, fill: COL.dim, anchor: 'start', weight: 500, o: 1 });
  const wq = G(p, { x: 310, y: 370 }); waterMolecule(wq, { s: .55 }); wLabel(wq, '?', { x: -60, y: 12, size: 40, fill: WC.bond, weight: 700, o: 1 });
  Array.from({ length: Q1_N }, (_, i) => bead(p, KINDS[i % 4], 410 + (i - (Q1_N - 1) / 2) * 130, 540, 32));
  wLabel(p, 'single monomers', { x: 410, y: 630, size: 28, fill: COL.dim, weight: 500, o: 1 });
}, { ask: done => quiz({ x: 860, y: 90, w: 700, cls: 'side' }, [{
  id: 'c-count',
  prompt: [`A chain of ${Q1_N} monomers is fully digested into single monomers. Which reaction is this, and how many water molecules does it use?`],
  build: choice([[`dehydration, ${bondsIn(Q1_N)} water released`], [`hydrolysis, ${bondsIn(Q1_N)} water added`], [`hydrolysis, ${Q1_N} water added`], [`dehydration, ${Q1_N} water released`]], 1,
    `Right. Breaking a chain apart is hydrolysis, which adds water. ${Q1_N} units are held by ${bondsIn(Q1_N)} bonds, so ${bondsIn(Q1_N)} breaks use ${bondsIn(Q1_N)} water molecules.`,
    ['Dehydration builds a chain and releases water. Digesting breaks the chain apart.', null,
     `Water is used once per bond, not once per monomer: count the bonds between ${Q1_N} beads.`,
     'That is building, not breaking: digestion splits the chain by adding water.']),
}], done) }],

/* ---------- variety ---------- */
['diverse', 'Endless variety', (m, D) => {
  const p = panel(0), tCells = m('cells'), tVary = m('vary'), tLet = m('letters'), tOrd = m('order');
  // cells: one cell, many different polymers
  const A = G(p);
  cellBlob(A, { x: 800, y: 430, w: 1320, h: 700 });
  const crowd = [];
  for (let i = 0; i < 16; i++) {
    const c = i % 4, r = Math.floor(i / 4), n = 4 + Math.floor(wHash(i, 2) * 6);
    const seq = Array.from({ length: n }, (_, j) => KINDS[Math.floor(wHash(i * 13 + j, 3) * 4)]);
    const x = 380 + c * 280 + (wHash(i, 4) - .5) * 90, y = 220 + r * 140 + (wHash(i, 5) - .5) * 40;
    const g = G(A, { x, y }), b = beadString(g, wavePts(n, 32, 10 + 10 * wHash(i, 6), i, .9), seq, { r: 13, r0: (wHash(i, 7) - .5) * 60, o: 0 });
    tw(b, { o: 1 }, tCells + .1 + .06 * i, .4); crowd.push([g, x, y]);
  }
  clockRun(t => { t = Math.min(t, tVary + .5); crowd.forEach(([g, x, y], i) => place(g, x + 6 * Math.sin(.8 * t + i), y + 5 * Math.sin(.6 * t + 2 * i))); }, D);
  say(A, 'thousands of different macromolecules in one cell', 800, 850, tCells + .8, { size: 32 });
  hide(A, tVary - .2, .4);
  prog(q => { A.style.display = q >= 1 ? 'none' : ''; }, tVary + .3, .01, lin);
  // vary: the same kinds of molecule differ a little between cells, more within a species, most between species
  const B = G(p, { o: 0 }); show(B, tVary + .1, .4);
  const base = ['circle', 'square', 'hex', 'diamond', 'circle', 'hex', 'square'];
  const rows = [['two cells of one body', [3]], ['two members of a species', [1, 4, 5]], ['two different species', [0, 2, 3, 5, 6]]];
  wLabel(B, 'how different', { x: 1260, y: 160, size: 26, fill: COL.dim, anchor: 'start', weight: 500, o: 1 });
  rows.forEach(([lab, diff], k) => {
    const y = 270 + k * 170, t0 = tVary + .3 + [0, 2.2, 4.6][k], R = G(B, { o: 0 }); show(R, t0, .5);
    wLabel(R, lab, { x: 80, y: y + 10, size: 28, anchor: 'start', o: 1 });
    const other = base.map((b, j) => diff.includes(j) ? KINDS[(KINDS.indexOf(b) + 1 + j) % 4] : b);
    beadString(R, wavePts(7, 46), base, { r: 19, x: 700, y });
    beadString(R, wavePts(7, 46), other, { r: 19, x: 1060, y });
    diff.forEach(j => mk('circle', { cx: 1060 + (j - 3) * 46, cy: y, r: 27, fill: 'none', stroke: MC.hi, 'stroke-width': 4 }, R));
    const bar = mk('rect', { x: 1260, y: y - 14, width: 0, height: 28, rx: 8, fill: MC.hi }, R);
    put(bar, { a_width: 0 }); tw(bar, { a_width: 46 * diff.length }, t0 + .4, .8, out);
  });
  say(B, 'differ more ↓', 1500, 760, tVary + 5.6, { size: 26, fill: MC.hi, anchor: 'end' });
  hide(B, tLet - .2, .4);
  prog(q => { B.style.display = q >= 1 ? 'none' : ''; }, tLet + .3, .01, lin);
  // letters: an analogy, 26 letters spell every word
  const C = G(p, { o: 0 }); show(C, tLet + .1, .4);
  const AB = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lx = i => 125 + i * 54;
  [...AB].forEach((c, i) => wLabel(C, c, { x: lx(i), y: 230, size: 40, weight: 700, o: 1 }));
  wLabel(C, 'an analogy: 26 letters', { x: 800, y: 140, size: 30, fill: COL.dim, weight: 500, o: 1 });
  ['MONOMER', 'POLYMER', 'ENZYME'].forEach((w, k) => {
    const t0 = tLet + 2.6 + 1.2 * k, y = 400 + k * 110;
    [...w].forEach((c, i) => {
      const g = G(C, { x: lx(AB.indexOf(c)), y: 230, o: 0 }); wLabel(g, c, { size: 52, fill: MC.hi, weight: 800, o: 1 });
      tw(g, { o: 1 }, t0 + .05 * i, .2); tw(g, { x: 800 + (i - (w.length - 1) / 2) * 50, y }, t0 + .05 * i, .8, io);
    });
  });
  say(C, 'spell every word in a library', 800, 760, tLet + 3.2, { size: 30 });
  hide(C, tOrd - .2, .4);
  prog(q => { C.style.display = q >= 1 ? 'none' : ''; }, tOrd + .3, .01, lin);
  // order: the same blocks, different order and length
  const E = G(p);
  const chains = orderPic(E, { y0: 190, ys: [350, 490, 630], t0: tOrd + .1 });
  chains.forEach((c, i) => say(E, `polymer ${i + 1}`, 1300, [350, 490, 630][i] + 10, tOrd + .9 + .7 * i, { size: 28, fill: COL.dim, anchor: 'start', weight: 500 }));
  say(E, 'same blocks, different order and length: a different polymer', 800, 800, tOrd + 2.6, { size: 30 });
}],

['q2', 'Quick check', (m, D) => {
  const p = panel(0);
  orderPic(p, { y0: 190, ys: [340, 460, 580], x0: 90, sp: 62, r: 23, lc: 410 });
  ['polymer 1', 'polymer 2', 'polymer 3'].forEach((s, i) => wLabel(p, s, { x: 590, y: [340, 460, 580][i] + 10, size: 26, fill: COL.dim, anchor: 'start', weight: 500, o: 1 }));
  wLabel(p, 'and thousands more…', { x: 410, y: 700, size: 28, fill: COL.dim, weight: 500, o: 1 });
}, { ask: done => quiz({ x: 860, y: 90, w: 700, cls: 'side' }, [{
  id: 'c-diverse',
  prompt: ['Cells make thousands of different polymers from a small set of monomers. Why is that possible?'],
  build: choice([['Each polymer uses its own special monomers.'], ['The same monomers can be joined in different orders and lengths.'], ['Water changes the monomers each time.'], ['Enzymes become part of every polymer.']], 1,
    'Right. Like letters making many words: the order and the length of the chain make each polymer different.',
    ['The set of monomers is small and shared: the polymers differ in how the same blocks are arranged.', null,
     'Water only leaves or enters at the bond; the monomers themselves stay the same kinds.',
     'Enzymes are not used up: they speed the reaction and are free to work again.']),
}], done) }],

/* ---------- summary ---------- */
['wrap', 'Summary', (m, D) => {
  const p = panel(0);
  const rows = [
    ['Four classes of large molecules;', 'three are polymers, built from monomers.', g => { carbGlyph(g, { x: 180, y: 0, s: .5 }); }],
    ['Dehydration removes water and forms a bond;', 'enzymes speed it up.', g => { bead(g, 'circle', 130, 0, 22); bead(g, 'square', 190, 0, 22); path(g, 'M152 0H168', { stroke: WC.stick, 'stroke-width': 8 }); waterMolecule(g, { x: 250, y: 40, s: .36 }); mArrow(g, [200, 38], [230, 54], { color: COL.dim, w: 3, head: 9 }); }],
    ['Hydrolysis adds water and breaks a bond.', '', g => { bead(g, 'circle', 120, 0, 22); bead(g, 'square', 220, 0, 22); waterMolecule(g, { x: 170, y: 40, s: .36 }); }],
    ['A small set of monomers, in different orders,', 'gives endless variety.', g => { ORDERS.forEach((seq, i) => beadString(g, seq.slice(0, 5).map((_, j) => [100 + j * 34, -40 + i * 40]), seq, { r: 13 })); }],
  ];
  const icons = [];
  rows.forEach(([a, b, icon], i) => {
    const g = G(p, { x: -16, y: 190 + i * 160, o: 0 });
    const ic = G(g); icon(ic); icons.push(ic);
    T(g, a, { x: 330, y: b ? -6 : 12, size: 36, weight: 600 }); if (b) T(g, b, { x: 330, y: 40, size: 32, fill: COL.dim });
    tw(g, { o: 1, x: 0 }, i ? m('w' + (i + 1)) : .15, .6);   // row 1 comes in with "To sum up"
  });
  say(p, 'Now try the chapter practice.', 800, 850, m('end'), { size: 32, fill: WC.bond });
  pulse(icons[0], m('end') + .2, 1.15);
  clockRun(t => icons.forEach((ic, i) => put(ic, { y: Math.round(50 * Math.sin(1.6 * t + 1.3 * i)) / 10 })), D);   // the icons breathe while each line is read
}],

['final1', 'Chapter practice', (m, D) => {
  // A picture on the right for each practice question; the card's build shows the one it needs (pics.show(key)).
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  at('terms', g => {
    beadString(g, wavePts(6, 60, 14), KINDS, { r: 22, x: 1270, y: 220 });
    wLabel(g, 'polymer', { x: 1270, y: 290, size: 28, fill: COL.dim, weight: 500, o: 1 });
    lipidGlyph(g, { x: 1150, y: 480, s: .8 }); wLabel(g, 'lipid', { x: 1150, y: 580, size: 28, fill: COL.dim, weight: 500, o: 1 });
    enzyme(g, { x: 1420, y: 480, R: 50 }); wLabel(g, 'enzyme', { x: 1420, y: 580, size: 28, fill: COL.dim, weight: 500, o: 1 });
    waterMolecule(g, { x: 1270, y: 720, s: .7 }); wLabel(g, H2O, { x: 1270, y: 810, size: 28, fill: COL.dim, weight: 500, o: 1 });
  });
  at('build', g => {
    Array.from({ length: P_BUILD }, (_, i) => bead(g, KINDS[i % 4], 1270 + (i - (P_BUILD - 1) / 2) * 92, 200, 28));
    wLabel(g, `${P_BUILD} monomers`, { x: 1270, y: 120, size: 30, o: 1 });
    mArrow(g, [1270, 260], [1270, 420], { color: COL.dim });
    wLabel(g, 'dehydration', { x: 1295, y: 350, size: 26, fill: COL.dim, anchor: 'start', weight: 500, o: 1 });
    const w = waterMolecule(g, { x: 1140, y: 340, s: .5 }); wLabel(g, '?', { x: 1080, y: 352, size: 40, fill: WC.bond, weight: 700, o: 1 });
    beadString(g, wavePts(P_BUILD, 70), KINDS, { r: 26, x: 1270, y: 500 });
    wLabel(g, 'one chain', { x: 1270, y: 580, size: 28, fill: COL.dim, weight: 500, o: 1 });
  });
  at('break', g => {
    beadString(g, wavePts(P_BREAK, 64), KINDS, { r: 23, x: 1270, y: 200 });
    wLabel(g, `${P_BREAK} monomers in one chain`, { x: 1270, y: 120, size: 30, o: 1 });
    mArrow(g, [1270, 260], [1270, 420], { color: COL.dim });
    wLabel(g, 'hydrolysis', { x: 1295, y: 350, size: 26, fill: COL.dim, anchor: 'start', weight: 500, o: 1 });
    waterMolecule(g, { x: 1140, y: 340, s: .5 }); wLabel(g, '?', { x: 1080, y: 352, size: 40, fill: WC.bond, weight: 700, o: 1 });
    Array.from({ length: P_BREAK }, (_, i) => bead(g, KINDS[i % 4], 1270 + (i - (P_BREAK - 1) / 2) * 76, 500 + (i % 2 ? 16 : -16), 23));
    wLabel(g, '?', { x: 1270, y: 600, size: 40, fill: WC.bond, weight: 700, o: 1 });
  });
  at('lipid', g => {
    GLYPHS.forEach(([name, f], i) => { const x = 1130 + (i % 2) * 290, y = 230 + Math.floor(i / 2) * 300; f(g, { x, y, s: .85 }); wLabel(g, '?', { x, y: y + 120, size: 36, fill: WC.bond, weight: 700, o: 1 }); });
  });
  at('split', g => {
    Array.from({ length: P_SPLIT }, (_, i) => waterMolecule(g, { x: 1100 + (i % 5) * 85, y: 200 + Math.floor(i / 5) * 100, s: .45 }));
    wLabel(g, `${P_SPLIT} water used`, { x: 1270, y: 120, size: 30, o: 1 });
    mArrow(g, [1270, 360], [1270, 480], { color: COL.dim });
    wLabel(g, 'hydrolysis', { x: 1295, y: 430, size: 26, fill: COL.dim, anchor: 'start', weight: 500, o: 1 });
    wLabel(g, '? monomers', { x: 1270, y: 580, size: 40, fill: WC.bond, weight: 700, o: 1 });
  });
  at('pairs', g => {
    EXAMPLES.forEach((ex, k) => { const y = 180 + k * 190, mono = G(g, { x: 1060, y, s: .8 }); ex.mono(mono); mArrow(g, [1120, y], [1200, y], { color: COL.dim, w: 4, head: 12 }); wLabel(g, '?', { x: 1300, y: y + 14, size: 40, fill: WC.bond, weight: 700, o: 1 }); });
    fatMolecule(G(g, { x: 1080 * .6, y: 760 * .6, s: .4 }), 1080, 760);
    wLabel(g, 'a fat', { x: 1400, y: 770, size: 28, fill: COL.dim, weight: 500, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('terms');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-terms', prompt: ['True or false?'],
    build: withPic('terms', grid([
      { parts: ['A polymer is a long molecule made of many similar monomers.'], ans: ['t'], why: 'True: monomers are the building blocks, the polymer is the chain.' },
      { parts: ['Lipids are polymers, just like proteins.'], ans: ['f'], why: 'False: lipids are large, but they are not chains of repeating monomers.' },
      { parts: ['A dehydration reaction forms a bond and releases a water molecule.'], ans: ['t'], why: 'True: H from one block and OH from the other leave as water.' },
      { parts: ['Hydrolysis builds polymers by removing water.'], ans: ['f'], why: 'False: hydrolysis adds water and breaks a bond, making the polymer shorter.' },
      { parts: ['Enzymes speed up the dehydration reaction.'], ans: ['t'], why: 'True: an enzyme holds the blocks in position and is then free to work again.' },
    ], TF, { multi: false, text: true })) },
  { id: 'p-build', prompt: [`A cell joins ${P_BUILD} monomers into one chain by dehydration.`],
    build: withPic('build', blanks([
      { parts: ['bonds formed: ', { box: String(bondsIn(P_BUILD)) }], why: `${P_BUILD} monomers in a row are held by ${bondsIn(P_BUILD)} bonds.`, hint: 'Count the gaps between the beads in a row.' },
      { parts: ['water molecules released: ', { box: String(bondsIn(P_BUILD)) }], why: `Each bond formed releases one water: ${bondsIn(P_BUILD)}.`, hint: 'One water leaves for every new bond.' },
    ])) },
  { id: 'p-break', prompt: [`A chain of ${P_BREAK} monomers is fully hydrolysed.`],
    build: withPic('break', blanks([
      { parts: ['water molecules used: ', { box: String(bondsIn(P_BREAK)) }], why: `${P_BREAK} monomers have ${bondsIn(P_BREAK)} bonds, and each break uses one water.`, hint: 'One water goes in for every bond broken.' },
      { parts: ['monomers released: ', { box: String(P_BREAK) }], why: `Every one of the ${P_BREAK} monomers ends up on its own.`, hint: 'Fully hydrolysed: every bond is broken.' },
    ])) },
  { id: 'p-split', prompt: [`A polymer is fully hydrolysed using ${P_SPLIT} water molecules, one per bond.`],
    build: withPic('split', blanks([
      { parts: ['it had ', { box: String(P_SPLIT + 1) }, ' monomers'], why: `${P_SPLIT} bonds join ${P_SPLIT + 1} monomers: one more monomer than bonds.`, hint: 'One water per bond, and a chain has one more monomer than bonds.' },
    ])) },
  { id: 'p-pairs', prompt: ['True or false?'],
    build: withPic('pairs', grid([
      { parts: ['Starch is made of glucose.'], ans: ['t'], why: 'True: starch is a chain of glucose units.' },
      { parts: ['A protein is made of nucleotides.'], ans: ['f'], why: 'False: a protein is a chain of amino acids.' },
      { parts: ['DNA is made of nucleotides.'], ans: ['t'], why: 'True: DNA is a nucleic acid, a chain of nucleotides.' },
      { parts: ['A fat is a long chain of identical fatty acids.'], ans: ['f'], why: 'False: a fat is one glycerol plus three fatty acid tails, not a chain of repeating units.' },
    ], TF, { multi: false, text: true })) },
  { id: 'p-lipid', prompt: ['Which class of large biological molecule is NOT built from repeating monomers?'],
    build: withPic('lipid', choice([['carbohydrates'], ['lipids'], ['proteins'], ['nucleic acids']], 1,
      'Right. Lipids are large, but they are not chains of repeating units, so they are not true polymers.',
      ['Carbohydrates are polymers: long chains of monomers.', null,
       'Proteins are polymers: long chains of monomers.',
       'Nucleic acids are polymers: long chains of monomers.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
