'use strict';
// Biology, Chapter 9 (Cellular Respiration), lesson 5: a roundabout that lets cars in, round and out and stays itself;
// the respiration map with pyruvate oxidation and the citric acid cycle lit; pyruvate through the transport protein
// into the mitochondrion, and pyruvate dehydrogenase's three steps (CO₂ out, NAD⁺ → NADH, coenzyme A on) giving
// acetyl CoA; the cycle in the matrix: acetyl (2 C) + oxaloacetate (4 C) → citrate (6 C), a walk round steps 2–8 with
// the carbons on screen (6, 5, 4), the tally of one turn and the carriers relaying electrons on; the carbon audit per
// glucose (6 C in, 6 CO₂ out); the totals per glucose; a summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-09/lesson-05.md.
const CHAPTER = { number: 905, label: '9, lesson 5', title: 'Pyruvate Oxidation and the Citric Acid Cycle', minutes: 8, language: 'en', lead: false, next: '../lesson-06/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, weight: 700, ...o, o: 0 }); show(e, t0, .4); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const dg = a => a * Math.PI / 180;
const box5 = (g, x, y, w, h, { fill = '#0b1626', stroke = COL.faint, sw = 3, rx = 22, fo = 1 } = {}) => mk('rect', { x, y, width: w, height: h, rx, fill, 'fill-opacity': fo, stroke, 'stroke-width': sw }, g);
// keyframes [[t, a, b, …], …]: eased (soft) between keys, held before the first and after the last
function keyAt(t, K) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const a = K[i - 1], b = K[i], f = soft((t - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => v + (b[j + 1] - v) * f); }
  return K[K.length - 1].slice(1);
}
// one text whose words change at given times [[t, str], …]: it fades out before each change and back in after, so two
// words never share one spot; before the first time it is hidden
function stepText(p, steps, { x = 0, y = 0, size = 28, fill = COL.chalk, anchor = 'middle', weight = 700 } = {}) {
  const e = wChem(p, steps[0][1], { x, y, size, fill, anchor, weight, o: 0 });
  return Object.assign(e, {
    set(t) {
      let i = -1; for (let j = 0; j < steps.length; j++) if (t >= steps[j][0]) i = j;
      wChemSet(e, steps[Math.max(0, i)][1]);
      const nx = steps[i + 1] ? steps[i + 1][0] : null;
      mO(e, i < 0 ? 0 : mRamp(t, steps[i][0], steps[i][0] + .3) * (nx == null ? 1 : 1 - mRamp(t, nx - .3, nx)));
      return e;
    },
  });
}
// carbon beads in rows (as on the kit's cycle nodes); .set(n, x, y, o) shows n of them (n up to 6), centred on (x, y).
// Every bead is written on every change, so a played and a seeked frame carry the same markup.
function beadCluster(p, { r = 7, sp = 17, s = 1 } = {}) {
  const g = G(p, { x: 1, y: 1, s, o: 0 });
  const beads = Array.from({ length: 6 }, () => {
    const b = G(g, { s: .999 });
    mk('circle', { r, fill: MC.carbon, stroke: MC.carbonEdge, 'stroke-width': 2 }, b);
    mk('circle', { cx: -r * .3, cy: -r * .35, r: r * .3, fill: '#fff', 'fill-opacity': .45 }, b);
    return b;
  });
  const lay = n => { const rows = n >= 5 ? [3, n - 3] : n === 4 ? [2, 2] : [n], out = []; rows.forEach((m, ri) => { for (let b = 0; b < m; b++) out.push([(b - (m - 1) / 2) * sp, (ri - (rows.length - 1) / 2) * sp]); }); return out; };
  const L6 = lay(6);
  let N = -1;
  return Object.assign(g, {
    set(n, x, y, o = 1) {
      if (n !== N) { const L = lay(n); beads.forEach((b, i) => cSet(b, i < n ? { x: L[i][0], y: L[i][1], o: 1 } : { x: L6[i][0], y: L6[i][1], o: 0 })); N = n; }
      mPose(g, x, y, o);
      return g;
    },
  });
}
// a lavender phosphate ball with its P
function phosBall(p, { r = 14 } = {}) {
  const g = G(p, { x: 1, y: 1, o: 0 });
  mk('circle', { r, fill: MC.P, stroke: MC.Pedge, 'stroke-width': 2.5 }, g);
  wLabel(g, 'P', { y: r * .45, size: r * 1.2, fill: '#24160a', weight: 800, o: 1 });
  return g;
}
// a dark pill with text, origin at its centre
function pill(p, str, { x = 0, y = 0, size = 24, fill = COL.chalk, edge = COL.chalk, o = 1, w } = {}) {
  const g = G(p, { x, y, o }), ww = w ?? Math.round(uiW(str.replace(/[_^]/g, ''), size) * 1.1 + 30), hh = size + 18;
  mk('rect', { x: -ww / 2, y: -hh / 2, width: ww, height: hh, rx: hh / 2, fill: '#0b1626', stroke: edge, 'stroke-width': 2.5 }, g);
  const t = wChem(g, str, { y: size * .36, size, fill, weight: 700, o: 1 });
  return Object.assign(g, { t, w: ww });
}
// the numbered step badge of slide 27 (blue disc)
function stepBadge(p, n, x, y) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r: 20, fill: '#2f5fc4', stroke: '#cfe0ff', 'stroke-width': 2.5 }, g);
  wLabel(g, String(n), { y: 8, size: 24, fill: '#fff', weight: 800, o: 1 });
  return g;
}
// coenzyme A as a teal tag (the kit's look), origin = its centre
function coaTag(p, { w = 70, h = 34, size = 22 } = {}) {
  const g = G(p, { x: 1, y: 1, o: 0 });
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 10, fill: MC.coa, stroke: MC.coaEdge, 'stroke-width': 3 }, g);
  wLabel(g, 'CoA', { y: size * .36, size, fill: '#0b2224', weight: 800, o: 1 });
  return g;
}
// a polyline with its length table: .at(k), .dir(k)
function lineOf(pts) {
  const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[L.length - 1];
  const seg = k => { const want = mClamp(k) * tot; let i = 1; while (i < L.length - 1 && L[i] < want) i++; return [i, (want - L[i - 1]) / ((L[i] - L[i - 1]) || 1)]; };
  return {
    at(k) { const [i, f] = seg(k), a = pts[i - 1], b = pts[i]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; },
    dir(k) { const [i] = seg(k), a = pts[i - 1], b = pts[i]; return Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI; },
  };
}

/* ---------- the wheel used by the cycle beats ---------- */
const WX = 600, WY = 440, WR = 200;
const nodeAng = idx => dg(-112.5 + 45 * idx);
const onWheel = (idx, cx = WX, cy = WY, R = WR) => [cx + R * Math.cos(nodeAng(idx)), cy + R * Math.sin(nodeAng(idx))];
const stepAt = (i, d = 0, cx = WX, cy = WY, R = WR) => { const a = dg(-90 + 45 * (i - 1)); return [cx + (R + d) * Math.cos(a), cy + (R + d) * Math.sin(a)]; };
// a small cycle glyph: a red ring with an arrowhead, origin = centre
function miniWheel(p, x, y, r = 60, w = 12) {
  const g = G(p, { x, y });
  const a1 = dg(250);
  path(g, `M0 ${-r}A${r} ${r} 0 1 1 ${cF(r * Math.cos(a1))} ${cF(r * Math.sin(a1))}`, { stroke: MC.cac, 'stroke-width': w, fill: 'none' });
  const hx = r * Math.cos(a1), hy = r * Math.sin(a1);
  path(g, `M${cF(hx - 16)} ${cF(hy + 14)}L${cF(hx + 4)} ${cF(hy - 6)}L${cF(hx + 20)} ${cF(hy + 18)}Z`, { fill: MC.cac, stroke: MC.cac, 'stroke-width': 3 });
  return g;
}
// the matrix as a backdrop: a dark warm field inside the inner membrane
function matrixBack(p) {
  const g = G(p);
  box5(g, 24, 24, 1552, 852, { fill: MC.matrix, fo: .5, stroke: MC.cristae, sw: 6, rx: 70 });
  wLabel(g, 'mitochondrial matrix', { x: 70, y: 74, size: 26, fill: MC.cristae, weight: 700, anchor: 'start', o: 1 });
  return g;
}
// a shuttle that docks beside a step, takes an electron pair from (sx, sy), is reduced and drives to a tray slot.
// o: { kind, dock: [x, y], src: [x, y], tA (arrives), tE (electrons leave the molecule), tGo (drives off), slot: [x, y], s,
// via: corners of its road to the slot (kept clear of the wheel's names and the tray's row labels), go: seconds on it }
function carrier(p, { kind = 'NAD', dock, src, tA, tE, tGo, slot, s = .75, text = true, via = [], go = 1.4 }) {
  const fad = kind === 'FAD', sh = nadShuttle(p, { kind, label: false, s, o: 0 });
  const pair = electron(p, { n: 2, r: 6, o: 0 });
  const lab = text ? wChem(p, fad ? 'FAD → FADH_2' : 'NAD^+ → NADH', { x: dock[0], y: dock[1] - 44, size: 22, fill: fad ? MC.fad : MC.nad, weight: 700, o: 0 }) : null;
  const seat = [dock[0] - sh.w * .19 * s, dock[1] - 22];
  const tR = tE + 1.25, road = lineOf([dock, ...via, slot]);
  return {
    sh,
    set(t) {
      const [x, y, o] = t < tGo ? keyAt(t, [[tA - .7, dock[0] + 50, dock[1] + 40, 0], [tA, dock[0], dock[1], 1]]) : [...road.at(io(mRamp(t, tGo, tGo + go))), 1];
      sh.pose(x, y); mO(sh, o); sh.set(mRamp(t, tR - .3, tR + 1));
      const k = io(mRamp(t, tE, tR));
      pair.pose(mLerp(src[0], seat[0], k), mLerp(src[1], seat[1], k)); mO(pair, mRamp(t, tE - .1, tE + .15) * (1 - mRamp(t, tR - .05, tR + .25)));
      if (lab) mO(lab, mRamp(t, tA, tA + .4) * (1 - mRamp(t, tGo - .2, tGo + .2)));
      return sh;
    },
  };
}
// a CO₂ that leaves a molecule at t0 from src, drifts to mid, then flies to a tray slot at tT (no tray: it fades)
function co2Out(p, { t0, src, mid, slot = null, tT = 0, r = 12 }) {
  const c = co2Molecule(p, { r, o: 0 });
  return {
    c,
    set(t) {
      const K = [[t0, src[0], src[1], 0], [t0 + .2, src[0], src[1], 1], [t0 + 1.4, mid[0], mid[1], 1]];
      if (slot) K.push([tT, mid[0], mid[1], 1], [tT + 1.3, slot[0], slot[1], 1]); else K.push([t0 + 2.4, mid[0], mid[1], 0]);
      const [x, y, o] = keyAt(t, K); c.pose(x, y); mO(c, o); return c;
    },
  };
}
// the tray of one turn's products (steps beat): rows CO₂, NADH, FADH₂, ATP with their slots
const TRAY = { x: 1110, y: 150, w: 460, h: 620, rows: { CO2: 290, NADH: 420, FADH2: 550, ATP: 680 }, slots: { CO2: [1330, 1440], NADH: [1290, 1395, 1500], FADH2: [1300], ATP: [1300] } };
function trayPanel(p) {
  const g = G(p, { o: 0 });
  box5(g, TRAY.x, TRAY.y, TRAY.w, TRAY.h);
  wLabel(g, 'made in one turn', { x: TRAY.x + TRAY.w / 2, y: TRAY.y + 52, size: 28, weight: 700, o: 1 });
  const hi = {};
  [['CO2', 'CO_2', COL.chalk], ['NADH', 'NADH', MC.nad], ['FADH2', 'FADH_2', MC.fad], ['ATP', 'ATP', MC.elec]].forEach(([k, str, c]) => {
    const y = TRAY.rows[k];
    hi[k] = mk('rect', { x: TRAY.x + 10, y: y - 46, width: TRAY.w - 20, height: 92, rx: 14, fill: MC.elec, 'fill-opacity': .14, stroke: MC.elec, 'stroke-width': 2 }, g); put(hi[k], { o: 0 });
    wChem(g, str, { x: TRAY.x + 26, y: y + 9, size: 26, fill: c, weight: 700, anchor: 'start', o: 1 });
  });
  return Object.assign(g, { hi });
}
const SLOT = (k, i) => [TRAY.slots[k][i], TRAY.rows[k]];

/* ---------- intro backdrop: a roundabout from above ---------- */
const RB = { x: 500, y: 470, R: 170 };
function roundabout(p) {
  const g = G(p);
  box5(g, 50, 70, 900, 790, { fill: '#24463a', stroke: '#3c6b52', sw: 4, rx: 40 });
  const road = { stroke: '#3a3f47', 'stroke-width': 86, fill: 'none' };
  path(g, `M54 ${RB.y}H${RB.x}M${RB.x} 74V${RB.y}M${RB.x} 856V${RB.y}M946 ${RB.y}H${RB.x}`, road);
  mk('circle', { cx: RB.x, cy: RB.y, r: RB.R, fill: 'none', ...road }, g);
  path(g, `M54 ${RB.y}H${RB.x - RB.R - 43}M${RB.x + RB.R + 43} ${RB.y}H946M${RB.x} 74V${RB.y - RB.R - 43}M${RB.x} ${RB.y + RB.R + 43}V856`, { stroke: '#e8e2d0', 'stroke-width': 3, 'stroke-dasharray': '16 14', fill: 'none' });
  mk('circle', { cx: RB.x, cy: RB.y, r: RB.R - 52, fill: '#3f7a4a', stroke: '#e8e2d0', 'stroke-width': 4 }, g);
  [[-40, -20, 30], [30, 10, 36], [-10, 45, 24]].forEach(([dx, dy, r]) => mk('circle', { cx: RB.x + dx, cy: RB.y + dy, r, fill: '#2f6a3c', stroke: '#245530', 'stroke-width': 3 }, g));
  const glow = G(g, { x: RB.x, y: RB.y, o: 0 });
  mk('circle', { r: RB.R, fill: 'none', stroke: MC.elec, 'stroke-width': 8, 'stroke-opacity': .8 }, glow);
  return Object.assign(g, { glow });
}
// a car seen from above, origin = its centre, facing +x
function car(p, color) {
  const g = G(p, { x: 1, y: 1, o: 0 });
  mk('rect', { x: -30, y: -16, width: 60, height: 32, rx: 9, fill: color, stroke: mix(color, '#000000', .4), 'stroke-width': 2.5 }, g);
  mk('rect', { x: 2, y: -12, width: 15, height: 24, rx: 4, fill: '#1b2a3e' }, g);
  mk('rect', { x: -22, y: -11, width: 10, height: 22, rx: 3, fill: '#1b2a3e' }, g);
  return g;
}
// routes (anticlockwise round the ring, as cars drive on the right): in from one road, round, out along another
function route(inA, outA) {
  const lane = 22, R = RB.R, pts = [];
  const far = a => { const c = Math.cos(dg(a)), s = Math.sin(dg(a)); return [RB.x + c * 470 - s * lane, RB.y + s * 390 + c * lane]; };
  const edge = (a, sg) => { const c = Math.cos(dg(a)), s = Math.sin(dg(a)); return [RB.x + c * (R + 30) - sg * s * lane, RB.y + s * (R + 30) + sg * c * lane]; };
  // incoming lanes keep to the right of their road; the car heads inwards, so its right is the road's +lane side
  const inFar = (a => { const c = Math.cos(dg(a)), s = Math.sin(dg(a)); return [RB.x + c * 470 + s * lane, RB.y + s * 390 - c * lane]; })(inA);
  pts.push(inFar, edge(inA, -1));
  let a = inA; const end = outA > inA ? outA - 360 : outA;
  for (; a > end; a -= 10) pts.push([RB.x + R * Math.cos(dg(a)), RB.y + R * Math.sin(dg(a))]);
  pts.push([RB.x + R * Math.cos(dg(end)), RB.y + R * Math.sin(dg(end))], edge(outA, 1), far(outA));
  return lineOf(pts);
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'A roundabout and the map', (m, D) => {
  const p = panel(0), tR = m('round'), tM = m('map'), tL = m('lit');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const back = G(W, { o: 0 }); show(back, .2, .6);
  const rb = roundabout(back);
  const cars = [[180, 270, '#e5533d', 0], [90, 180, '#6c8cff', .36], [0, 90, '#f3c95c', .7]].map(([a, b, c, off]) => ({ line: route(a, b), off, e: car(back, c) }));
  const lc = G(back, { o: 0 }); show(lc, tR + 4.8, .4);
  wLabel(lc, 'cars come and go · the roundabout stays', { x: RB.x, y: 830, size: 28, weight: 700, o: 1 });
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOLOGY · CHAPTER 9 · LESSON 5', { x: 1260, y: 250, size: 24, fill: COL.dim, o: 1 });
  ['Pyruvate oxidation', 'and the citric', 'acid cycle'].forEach((s, i) => wLabel(ttl, s, { x: 1260, y: 335 + i * 64, size: 50, o: 1 }));
  wLabel(ttl, 'Cellular respiration', { x: 1260, y: 540, size: 26, fill: COL.dim, weight: 500, o: 1 });
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tM - .5, .5);
  hide(back, tM - .3, .5);
  // map: the shared respiration map; glycolysis done, pyruvate waiting; lit: this lesson's two stages
  const mapG = G(W, { o: 0 }); show(mapG, tM, .6);
  const map = respMap(mapG, { x: 800, y: 430, s: .95 });
  const MP = ([lx, ly]) => [800 + .95 * lx, 430 + .95 * ly];
  const [px, py] = MP([-262, -30]);
  const pyr = carbonChain(mapG, { x: px, y: py, s: .7, o: 0 }); show(pyr, tM + 3.4, .4);
  say(mapG, 'pyruvate', px, py - 26, tM + 3.4, { size: 20, fill: MC.pyruvate });
  const today = G(p, { o: 0 }); show(today, tL + 1.5, .5);
  wLabel(today, 'today, inside the mitochondrion:', { x: 800, y: 790, size: 26, fill: COL.dim, weight: 600, o: 1 });
  wLabel(today, 'pyruvate oxidation', { x: 778, y: 836, size: 32, fill: MC.pyrOx, weight: 800, anchor: 'end', o: 1 });
  wLabel(today, '+', { x: 800, y: 836, size: 32, weight: 800, o: 1 });
  wLabel(today, 'citric acid cycle', { x: 822, y: 836, size: 32, fill: MC.cac, weight: 800, anchor: 'start', o: 1 });
  hide(today, D - 2.6, .4);
  const LIT = ['pyruvateOx', 'cycle', 'atp2', 'e2', 'e3'];
  clockRun(t => {
    cars.forEach(({ line, off, e }) => {
      const u = cFrac(t / 6.4 + off), [x, y] = line.at(u);
      cSet(e, { x, y, r: line.dir(u), o: mRamp(u, 0, .05) * (1 - mRamp(u, .95, 1)) });
    });
    mO(rb.glow, mBump(t, tR + 4.6, tR + 7.6) * .9);
    map.tick('glycolysis', mRamp(t, tM + 2.6, tM + 3.2));
    if (t < tL) map.focus(['glycolysis', 'flow1'], io(mRamp(t, tM + 2.4, tM + 3.2)) * (1 - mRamp(t, tL - .6, tL)));
    else map.focus(LIT, io(mRamp(t, tL, tL + .9)));
    map.shine(t);
  }, D);
  // the push into the mitochondrion as the narration ends
  cam.to({ x: 790, y: 450, z: 2 }, D - 2.4, 2.2);
}],

/* ---------- enter ---------- */
['enter', 'Into the mitochondrion: pyruvate oxidation', (m, D) => {
  const p = panel(0), tMi = m('mito'), tP = m('pyr'), tC = m('co2'), tN = m('nadh'), tA = m('coa'), tAc = m('acetyl'), tK = m('count');
  // shot A: the whole mitochondrion; pyruvate crosses through the transport protein
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const A = G(W, { o: 0 }); show(A, .1, .6);
  const mc = mitoCutaway(A, { x: 900, y: 470, s: .9 });
  const cyA = wLabel(A, 'cytosol', { x: 150, y: 300, size: 28, fill: COL.dim, weight: 700, o: 1 }); hide(cyA, tP - .7, .4);   // gone before shot B's own
  const o2 = o2Molecule(A, { x: 150, y: 690, r: 20 }); say(A, 'O_2 present', 150, 745, 1.2, { size: 24, fill: MC.oxy });
  void o2;
  const tp = cLabel(A, [332, 500], [250, 600], 'transport protein', { size: 24 }); show(tp, tMi + 4, .4);
  const pA = carbonChain(A, { x: 150, y: 470 });
  wLabel(pA, 'pyruvate', { y: -68, size: 24, fill: MC.pyruvate, weight: 700, o: 1 });   // above the chain: below, it crossed the glowing transport protein
  clockRun(t => {
    mc.labels(mRamp(t, .8, 1.6)).porter(mRamp(t, tMi + 3.6, tMi + 4.2) * (1 - mRamp(t, tP - .4, tP)));
    pA.pose(mLerp(150, 430, io(mRamp(t, tMi + 4.4, tMi + 6.6))), 470);
  }, D);
  cam.to({ x: 646, y: 457, z: 1.53 }, tP - .3, 1.4);
  hide(cam.el, tP + .5, .7);

  // shot B, close up (slide 27): cytosol, the double membrane, the matrix; the enzyme's three steps

    ['s2', 'Acetyl (2 C) + oxaloacetate (4 C) → citrate (6 C)', 'eight steps later, oxaloacetate is back', MC.cac],
    ['s3', 'Each turn: 1 ATP, 3 NADH, 1 FADH_2, 2 CO_2', 'the carriers take the electrons on to the chain', MC.elec],
    ['s4', 'Two turns per glucose', 'all 6 carbons of glucose leave as 6 CO_2', COL.chalk],
  ];
  // while each line is read, its picture acts it out gently: the CO₂ floats off the chain, acetyl nudges towards
  // oxaloacetate, the products lift in turn, the six CO₂ rise; every motion a pure function of t
  const live = [];   // [row, (t, k) => …]: k is 0 … 1, the row's line being read
  const env = (t, i) => { const a = m(ROWS[i][0]) + .8, b = i < 3 ? m(ROWS[i + 1][0]) : D + 1; return mRamp(t, a, a + .6) * (1 - mRamp(t, b - .6, b)); };
  const wave = (t, per, ph = 0) => (1 - Math.cos(2 * Math.PI * (t / per - ph))) / 2;
  ROWS.forEach(([k, a, b, col], i) => {
    const y = 180 + i * 172, g = G(p, { o: 0 });

      wLabel(g, '+', { x: 205, y: y + 10, size: 30, weight: 800, o: 1 });
      const oa = beadCluster(g).set(4, 250, y, 1); live.push([1, (t, k) => oa.set(4, 250 - 8 * k * wave(t, 2.2), y, 1)]);

      const cit = beadCluster(g).set(6, 380, y, 1); live.push([1, (t, k) => cit.set(6, 380, y - 6 * k * wave(t, 2.2, .5), 1)]);

      const ic = respIcon(g, kd, { x, y, s: .82 }); live.push([2, (t, k) => mPose(ic, x, y - 7 * k * Math.max(0, Math.sin(2 * Math.PI * (t / 2.4 - j / 7))), 1)]);
    });
    if (i === 3) for (let j = 0; j < 6; j++) {
      const x = 160 + (j % 3) * 60, yy = y - 22 + Math.floor(j / 3) * 44, c = co2Molecule(g, { x, y: yy, r: 11 });
      live.push([3, (t, k) => c.pose(x, yy - 6 * k * wave(t, 2.2, j / 6))]);

      carbonChain(g, { x: 1060, y, s: .9 });
      mArrow(g, [1125, y], [1170, y], { color: COL.chalk, w: 4, head: 14 });
      carbonChain(g, { x: 1225, y, s: .9, n: 2, color: MC.pyrOx });
      mArrow(g, [1270, y], [1315, y], { color: COL.chalk, w: 4, head: 14 });
      miniWheel(g, 1370, y, 36, 9);
      wChem(g, '? CO_2', { x: 1150, y: y - 50, size: 22, fill: COL.chalk, weight: 700, o: 1 });
      wChem(g, '? CO_2', { x: 1480, y: y + 8, size: 22, fill: COL.chalk, weight: 700, o: 1 });
    });
    wLabel(g, 'count the carbons that leave', { x: 1270, y: 760, size: 26, weight: 700, o: 1 });
  });
  at('gtp', g => {
    frame(g);
    const d = G(g, { x: 1130, y: 330 }); mk('circle', { r: 46, fill: '#1a1220', stroke: MC.cac, 'stroke-width': 4 }, d);
    beadCluster(g).set(4, 1130, 330, 1);
    wLabel(g, 'succinyl CoA', { x: 1130, y: 410, size: 22, weight: 700, o: 1 });
    const pb = phosBall(g); put(pb, { x: 1260, y: 330, o: 1 });
    mArrow(g, [1180, 330], [1238, 330], { color: COL.chalk, w: 4, head: 14 });
    mArrow(g, [1282, 330], [1340, 330], { color: COL.chalk, w: 4, head: 14 });
    pill(g, 'GDP', { x: 1400, y: 330, size: 24 });
    mArrow(g, [1400, 362], [1400, 470], { color: COL.chalk, w: 4, head: 14 });
    wLabel(g, '?', { x: 1400, y: 540, size: 64, weight: 800, fill: MC.elec, o: 1 });
    wLabel(g, 'step 5: how is ATP made?', { x: 1270, y: 760, size: 26, weight: 700, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('where');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-where', prompt: ['Where does the citric acid cycle take place?'],
    build: withPic('where', choice([['in the cytosol'], ['in the intermembrane space'], ['in the mitochondrial matrix'], ['in the folded inner membrane']], 2,
      'Right. The cycle runs in the matrix, the innermost compartment of the mitochondrion.',
      ['Glycolysis runs in the cytosol. Pyruvate has to cross into the mitochondrion before the cycle.',
        'The intermembrane space is where the H⁺ gradient builds up (lessons six and seven), not where the cycle runs.', null,
        'The electron transport chain sits in the inner membrane. The cycle’s enzymes are in the matrix it encloses.'])) },
  { id: 'p-join', prompt: ['In step 1 of the cycle, what joins the acetyl group, and what forms?'],
    build: withPic('join', choice([['pyruvate joins it, forming oxaloacetate'], ['oxaloacetate (4 C) joins it, forming citrate (6 C)'], ['citrate joins it, forming oxaloacetate'], ['NAD⁺ joins it, forming NADH']], 1,
      'Right. 2 C + 4 C = 6 C: the acetyl group and oxaloacetate make citrate.',
      ['Pyruvate is already used up: it became the acetyl group. The acceptor is the 4-carbon molecule the cycle returns to.', null,
        'That runs backwards: citrate is the product of step 1, and oxaloacetate the acceptor.',
        'NAD⁺ is an electron carrier, not the acceptor of the acetyl group. It is reduced at steps 3, 4 and 8.'])) },
  { id: 'p-steps', prompt: ['What does each step make?'],
    build: withPic('steps', grid([
      { parts: ['step 3'], ans: ['n'], why: 'NADH: isocitrate is oxidized.' },
      { parts: ['step 5'], ans: ['a'], why: 'ATP, via GTP.' },
      { parts: ['step 6'], ans: ['f'], why: 'FADH₂: only step 6 uses FAD.' },
      { parts: ['step 8'], ans: ['n'], why: 'NADH: malate is oxidized.' },
    ], [['n', 'NADH', null, 'N'], ['f', 'FADH₂', null, 'F'], ['a', 'ATP', null, 'A']], { multi: false, text: true })) },
  { id: 'p-why2', prompt: ['Why does one glucose give two turns of the cycle?'],
    build: withPic('why2', choice([['the cycle always turns twice'], ['glycolysis makes two pyruvate, each gives one acetyl CoA, and each acetyl CoA is one turn'], ['each turn uses half the oxaloacetate'], ['glucose has two carbons']], 1,
      'Right. One glucose → two pyruvate → two acetyl CoA → two turns.',
      ['The cycle turns once per acetyl group that enters, not a fixed number of times.', null,
        'Oxaloacetate is regenerated whole at the end of every turn.',
        'Glucose has six carbons. It is split into two 3-carbon pyruvate.'])) },
  { id: 'p-blanks', prompt: ['Count the carbon dioxide made from one glucose:'],
    build: withPic('blanks', blanks([
      { parts: ['pyruvate oxidation releases ', { box: '2' }, ' CO₂'], why: 'One CO₂ per pyruvate, and there are two pyruvate.', hint: 'One per pyruvate: how many pyruvate per glucose?' },
      { parts: ['two turns of the cycle release ', { box: '4' }, ' CO₂'], why: 'Two CO₂ per turn, two turns.', hint: 'Two per turn.' },
      { parts: ['so in all ', { box: '6' }, ' CO₂'], why: '2 + 4 = 6: all six carbons of glucose leave as CO₂.', hint: 'Add the two, and compare with the carbons in glucose.' },
    ])) },
  { id: 'p-gtp', prompt: ['In step 5 of the cycle, how is ATP made?'],
    build: withPic('gtp', choice([['an electron carrier drives ATP synthase'], ['a phosphate moves from succinyl CoA to GDP, making GTP, which hands it on to ADP'], ['oxygen is reduced to water'], ['CO₂ is joined to ADP']], 1,
      'Right. That is substrate-level phosphorylation: an enzyme moves a phosphate from a substrate, via GTP, to make ATP.',
      ['That is oxidative phosphorylation, at the chain and ATP synthase (lessons six and seven). Step 5 needs no carrier.', null,
        'Oxygen is used only at the very end of the electron transport chain, not in the cycle.',
        'CO₂ only leaves the cycle; it is never joined to anything here.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
