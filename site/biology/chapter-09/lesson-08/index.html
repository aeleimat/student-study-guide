'use strict';
// Biology, Chapter 9 (Cellular Respiration), lesson 8: dough rising in a bowl, a push into a yeast cell and the shared
// respiration map with glycolysis lit and the mitochondrion crossed out; glycolysis needs NAD⁺ back (a supply that runs
// dry, the chain and O₂ that return it); anaerobic respiration (a chain ending on sulfate) vs fermentation (no chain,
// substrate-level ATP, glycolysis + NAD⁺ regeneration); alcohol fermentation (CO₂ off, acetaldehyde reduced to ethanol;
// yeast, bread, beer); lactic acid fermentation (pyruvate reduced by NADH; cheese, yogurt, a muscle fibre short of O₂);
// the two routes compared (final acceptor, 2 ATP vs about 30 to 32); the pyruvate fork, obligate and facultative
// anaerobes; a summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-09/lesson-08.md.
const CHAPTER = { number: 908, label: '9, lesson 8', title: 'Fermentation and Anaerobic Respiration', minutes: 8, language: 'en', lead: false, next: '../lesson-09/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wLabel(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const sayC = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const SIDE = { x: 880, y: 60, w: 680, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const rk = k => Math.round(mClamp(k) * 2000) / 2000;
const rt = t => Math.round(t * 120) / 120;
// A label (centred text, chemistry markup allowed) with a leader to the thing it names; fades in at t0 (null: at once).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 26, fill = COL.chalk, line = COL.dim, weight = 700 } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str.replace(/[_^]/g, ''), size);
  wChem(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + size * .3; }
  else { sx = tx; sy = ty - size * 1.05; }
  path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 });
  mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g);
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0.
function banner(p, a, b, x, y, t0, { color = COL.chalk, size = 38 } = {}) {
  const g = G(p, { o: 0 });
  wChem(g, a, { x, y, size, weight: 700, fill: color, o: 1 });
  if (b) wChem(g, b, { x, y: y + size * .95, size: size * .62, fill: COL.dim, weight: 500, o: 1 });
  show(g, t0, .5);
  return g;
}
const panelBox = (g, x, y, w, h, edge = COL.faint) => mk('rect', { x, y, width: w, height: h, rx: 22, fill: '#0b1828', stroke: edge, 'stroke-width': 3 }, g);
// A pill with text (chemistry markup), centred on (x, y).
function pill(p, str, x, y, { size = 24, fill = COL.chalk, edge = COL.dim, bg = '#0b1626', o = 1, pad = 22 } = {}) {
  const g = G(p, { o }), w = uiW(str.replace(/[_^]/g, ''), size) + 2 * pad, h = size * 1.7;
  mk('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: h / 2, fill: bg, stroke: edge, 'stroke-width': 3 }, g);
  wChem(g, str, { x, y: y + size * .36, size, fill, weight: 700, o: 1 });
  return Object.assign(g, { w, h });
}
// A red X of half-size a over (x, y).
const redX = (p, x, y, a, w = 10) => path(p, `M${x - a} ${y - a}L${x + a} ${y + a}M${x + a} ${y - a}L${x - a} ${y + a}`, { stroke: MC.inhib, 'stroke-width': w, 'stroke-linecap': 'round' });
// Piecewise-linear progress through [[t, k] …] knots (held before the first and after the last).
const knots = KT => t => { if (t <= KT[0][0]) return KT[0][1]; for (let i = 1; i < KT.length; i++) if (t < KT[i][0]) return KT[i - 1][1] + (KT[i][1] - KT[i - 1][1]) * (t - KT[i - 1][0]) / (KT[i][0] - KT[i - 1][0]); return KT[KT.length - 1][1]; };

// A point at u (0..1, by length) along a polyline.
const alongLine = pts => { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return u => { const d = mClamp(u) * L[L.length - 1]; let i = 1; while (i < L.length - 1 && L[i] < d) i++; const f = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]; }; };
// Tokens running along a polyline: .set(t, w) n of them, one lap each `period` s, faded in and out at the ends and by w.
function tokenRun(p, pts, make, { n = 3, period = 2.4 } = {}) {
  const at = alongLine(pts), T = Array.from({ length: n }, () => { const w = G(p, { o: 0 }); make(w); return w; });
  const b = { set(t, w) { t = rt(t); w = rk(w); T.forEach((e, i) => { const u = cFrac(t / period + i / n); const [x, y] = at(u); cSet(e, { x, y, o: w * mClamp(Math.min(u, 1 - u) * 7) }); }); return b; } };
  return b;
}

/* ---------- local pieces ---------- */
// A yeast cell: a cream oval with a bud, a nucleus and a vacuole. origin = the mother cell's centre.
function yeastCell(p, { x = 0, y = 0, s = 1, o = 1, r = 26, bud = 1, ang = -40 } = {}) {
  const g = G(p, { x, y, s, o });
  if (bud) {
    const a = ang * Math.PI / 180, bx = Math.cos(a) * r * 1.12, by = Math.sin(a) * r * .9;
    mk('ellipse', { cx: bx, cy: by, rx: r * .45 * bud, ry: r * .38 * bud, fill: MC.yeast, stroke: '#a8946a', 'stroke-width': 2.5 }, g);
  }
  mk('ellipse', { rx: r, ry: r * .8, fill: MC.yeast, stroke: '#a8946a', 'stroke-width': 3 }, g);
  mk('circle', { cx: r * .25, cy: r * .12, r: r * .3, fill: '#cdd9e8', 'fill-opacity': .8 }, g);
  mk('circle', { cx: -r * .3, cy: -r * .1, r: r * .2, fill: '#c9a66a' }, g);
  mk('ellipse', { cx: -r * .45, cy: -r * .42, rx: r * .22, ry: r * .1, fill: '#fff', 'fill-opacity': .5 }, g);
  return g;
}
// The bowl of dough on the table: .set(k) the dough swells (k 0 a lump … 1 a loaf-sized dome) with its gas bubbles;
// .cell() the target yeast cell's point (in parent) at full rise. origin = the bowl's foot.
function doughBowl(p, { x = 0, y = 0 } = {}) {
  const g = G(p, { x, y });
  const dough = path(g, '', { fill: '#f1dfb8', stroke: '#c9b07e', 'stroke-width': 4 });
  const BUB = Array.from({ length: 16 }, (_, i) => ({ fx: (wHash(i, 3) - .5) * 1.5, fy: .12 + .7 * wHash(i, 8), r: 5 + 7 * wHash(i, 5), e: mk('circle', { r: 1, fill: '#fbf3df', stroke: '#d9c393', 'stroke-width': 2 }, g) }));
  const YC = [[-.55, .3], [.45, .25], [-.15, .62], [.62, .55], [-.7, .55], [.15, .45]].map(([fx, fy], i) => ({ fx, fy, e: yeastCell(g, { r: 6, ang: -30 + 50 * i }) }));
  // bowl in front of the dough's foot
  path(g, 'M-250 -150Q-238 2 -120 2H120Q238 2 250 -150Z', { fill: '#c96f4a', stroke: '#8a4528', 'stroke-width': 4 });
  path(g, 'M-252 -150H252', { stroke: '#e08a62', 'stroke-width': 12, 'stroke-linecap': 'round' });
  path(g, 'M-180 -96Q0 -70 180 -96', { stroke: '#e08a62', 'stroke-width': 5, 'stroke-opacity': .6 });
  const H = k => 40 + 160 * k, at = (fx, fy, k) => [fx * 205 * (1 - fy * .45), -150 - fy * H(k) * .78];
  const b = Object.assign(g, {
    set(k) {
      k = rk(k); const h = H(k);
      mD(dough, `M-232 -146C-232 ${cF(-150 - h * 1.3)} 232 ${cF(-150 - h * 1.3)} 232 -146Z`);
      BUB.forEach(q => { const [bx, by] = at(q.fx, q.fy, k); cSet(q.e, { x: bx, y: by, s: .5 + q.r * k, o: .2 + .8 * k }); });
      YC.forEach(q => { const [bx, by] = at(q.fx, q.fy, k); cSet(q.e, { x: bx, y: by }); });
      return b;
    },
    cell() { const [bx, by] = at(YC[5].fx, YC[5].fy, 1); return [x + bx, y + by]; },
    bubble() { const q = BUB[2], [bx, by] = at(q.fx, q.fy, 1); return [x + bx, y + by]; },
  });
  return b.set(0);
}
// The NAD⁺ supply: eight pills; .set(level) level·8 of them full (NAD⁺), the rest empty (used: now NADH).
function supplyBox(p, { x = 0, y = 0, o = 1, n = 8 } = {}) {
  const g = G(p, { x, y, o });
  const P = Array.from({ length: n }, (_, i) => {
    const px = (i - (n - 1) / 2) * 74;
    const empty = G(g, { o: 0 }); mk('rect', { x: px - 30, y: -17, width: 60, height: 34, rx: 17, fill: 'none', stroke: MC.nadEdge, 'stroke-width': 2.5, 'stroke-dasharray': '6 5' }, empty);
    const full = G(g); mk('rect', { x: px - 30, y: -17, width: 60, height: 34, rx: 17, fill: MC.nad, stroke: MC.nadEdge, 'stroke-width': 2.5 }, full);
    wChem(full, 'NAD^+', { x: px, y: 6, size: 15, fill: '#3a1d08', weight: 800, o: 1 });
    return { empty, full };
  });
  const b = Object.assign(g, {
    set(level) { const L = rk(level) * n; P.forEach((q, i) => { const f = mClamp(L - i); mO(q.full, f); mO(q.empty, 1 - f); }); return b; },
  });
  return b.set(1);
}
// A vertical O₂ gauge; origin = the tube's foot. .set(level) 0..1.
function o2Gauge(p, { x = 0, y = 0, s = 1, o = 1, h = 150, w = 36, label = true } = {}) {
  const g = G(p, { x, y, s, o });
  mk('rect', { x: -w / 2, y: -h, width: w, height: h, rx: w / 2, fill: '#0b1626', stroke: COL.dim, 'stroke-width': 3 }, g);
  const fill = path(g, '', { fill: MC.oxy, 'fill-opacity': .85 });
  if (label) wChem(g, 'O_2', { y: -h - 16, size: 26, fill: MC.oxy, weight: 800, o: 1 });
  const b = Object.assign(g, {
    set(level) { const L = rk(level), hh = Math.max(0, (h - 8) * L); mD(fill, hh < 1 ? 'M0 0' : `M${-w / 2 + 4} -4V${cF(-4 - hh)}H${w / 2 - 4}V-4Z`); return b; },
  });
  return b.set(1);
}
// A muscle fibre (a long striped cell) with lactate dots; .set(k) k·n dots shown. origin = centre.
function muscleFibre(p, { x = 0, y = 0, s = 1, o = 1, w = 460, h = 96, n = 14 } = {}) {
  const g = G(p, { x, y, s, o });
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: '#7a3a3a', stroke: '#c06060', 'stroke-width': 4 }, g);
  let d = ''; for (let sx = -w / 2 + 34; sx < w / 2 - 20; sx += 22) d += `M${sx} ${-h / 2 + 10}V${h / 2 - 10}`;
  path(g, d, { stroke: '#a65555', 'stroke-width': 6 });
  [-w * .3, w * .1, w * .36].forEach(nx => mk('ellipse', { cx: nx, cy: -h / 2 + 14, rx: 16, ry: 7, fill: '#c98b8b' }, g));
  const dots = Array.from({ length: n }, (_, i) => mk('circle', { cx: (wHash(i, 21) - .5) * (w - 70), cy: (wHash(i, 23) - .5) * (h - 34), r: 8, fill: MC.lactate, stroke: '#a85a5a', 'stroke-width': 2 }, g));
  dots.forEach(e => put(e, { o: 0 }));
  const b = Object.assign(g, { set(k) { const L = rk(k) * n; dots.forEach((e, i) => mO(e, mClamp(L - i))); return b; } });
  return b;
}
// A cut loaf (crust, crumb with gas holes). origin = the loaf's foot centre.
function loafCut(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M-160 0C-160 -150 160 -150 160 0Z', { fill: '#b5733a', stroke: '#7a4a22', 'stroke-width': 4 });
  path(g, 'M-144 -6C-144 -128 144 -128 144 -6Z', { fill: '#f1dfb8' });
  for (let i = 0; i < 16; i++) { const fx = (wHash(i, 31) - .5) * 220, fy = -14 - 78 * wHash(i, 33); if (Math.abs(fx) < 128 - (-fy) * .5) mk('ellipse', { cx: fx, cy: fy, rx: 5 + 7 * wHash(i, 35), ry: 4 + 5 * wHash(i, 37), fill: '#d9c393' }, g); }
  return g;
}
// A glass with rising bubbles; .set(t). origin = the glass foot.
function bubblyGlass(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M-58 -10L-70 -190H70L58 -10Z', { fill: '#e8b84a', 'fill-opacity': .55 });
  path(g, 'M-72 -190Q-40 -212 0 -196Q40 -214 72 -190Z', { fill: '#fbf3df' });
  const B = Array.from({ length: 12 }, (_, i) => ({ fx: (wHash(i, 41) - .5) * 90, ph: wHash(i, 43), r: 3 + 4 * wHash(i, 45), e: mk('circle', { r: 4, fill: 'none', stroke: '#fff8e0', 'stroke-width': 2 }, g) }));
  path(g, 'M-60 -6L-74 -200M60 -6L74 -200M-60 -6H60', { stroke: '#d8eef5', 'stroke-width': 5, 'stroke-linecap': 'round' });
  const b = Object.assign(g, { set(t) { t = rt(t); B.forEach(q => { const u = cFrac(t * .45 + q.ph); cSet(q.e, { x: q.fx * (1 - u * .1), y: -16 - 170 * u, s: q.r / 4, o: Math.sin(Math.PI * u) }); }); return b; } });
  return b.set(0);
}
// Cheese wedge and a yogurt pot. origin = between them, on the table.
function dairy(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M-190 0L-40 -40L-40 -110L-190 -70Z', { fill: '#e8c24a', stroke: '#a88422', 'stroke-width': 3 });
  path(g, 'M-190 -70L-40 -110L-110 -130Z', { fill: '#f6d978', stroke: '#a88422', 'stroke-width': 3 });
  [[-150, -40, 10], [-95, -62, 13], [-70, -30, 8], [-130, -80, 6]].forEach(([cx, cy, r]) => mk('ellipse', { cx, cy, rx: r, ry: r * .8, fill: '#c9a033' }, g));
  path(g, 'M40 0L28 -110H152L140 0Z', { fill: '#f4f1ea', stroke: '#b9b5aa', 'stroke-width': 3 });

// A small NAD⁺ loop glyph: an orange loop with NADH on top and NAD⁺ underneath, dots running round it; .set(t).
function loopGlyph(p, { x = 0, y = 0, s = 1, o = 1, rx = 70, ry = 34 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, `M${-rx} 0A${rx} ${ry} 0 0 1 ${rx} 0A${rx} ${ry} 0 0 1 ${-rx} 0`, { stroke: MC.nad, 'stroke-width': 5 });
  path(g, `M14 ${-ry - 9}L28 ${-ry}L14 ${-ry + 9}Z`, { fill: MC.nad });
  path(g, `M-14 ${ry - 9}L-28 ${ry}L-14 ${ry + 9}Z`, { fill: MC.nad });

  const dots = [0, 1].map(() => mk('circle', { r: 6, fill: MC.elec, stroke: MC.elecEdge, 'stroke-width': 1.5 }, g));
  const b = Object.assign(g, { set(t) { t = rt(t); dots.forEach((d, j) => { const a = (t * .4 + j / 2) * 2 * Math.PI; cSet(d, { x: rx * Math.cos(Math.PI + a), y: ry * Math.sin(Math.PI + a) }); }); return b; } });
  return b.set(0);
}
// A glucose count row: n glucose icons (the last `dash` of them dashed outlines), spacing sp; origin = the row's centre.
function glucoseRow(p, n, { x = 0, y = 0, s = 1, o = 1, sp = 34, dash = 0, iconS = .55 } = {}) {
  const g = G(p, { x, y, s, o });
  for (let i = 0; i < n; i++) {
    const gx = (i - (n - 1) / 2) * sp;
    if (i >= n - dash) path(g, zNgon(6, 20 * iconS * 1.05, gx, 0, 0), { fill: 'none', stroke: MC.glucose, 'stroke-width': 2.5, 'stroke-dasharray': '4 4' });
    else respIcon(g, 'glucose', { x: gx, s: iconS });

// The supply-and-stall picture for practice and the intro of `need`: a glycolysis arrow and the NAD⁺ supply.
function glyArrow(p, x1, x2, y, { label = true } = {}) {
  const g = G(p);

/* ---------- shared scene builders (a beat and its continuation draw the same picture) ---------- */

const fermPt = (fe, name) => fe.pt(name);

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'Dough, yeast and the map', (m, D) => {

  wLabel(wy, 'ethanol', { x: 540, y: 669, size: 18, fill: MC.ethanol, weight: 700, o: 1, anchor: 'start' });
  wLabel(wy, 'energy still locked in: not harvested', { x: L, y: 722, size: 22, fill: MC.elec, weight: 700, o: 1 });
  // ten: about fifteen glucose to one
  const tn = G(p, { o: 0 }); show(tn, tT + .3, .5);
  glucoseRow(tn, 16, { x: L, y: 780, sp: 36, dash: 1 });
  wLabel(tn, 'roughly 15 or 16 glucose', { x: L, y: 832, size: 24, weight: 700, fill: MC.glucose, o: 1 });
  glucoseRow(tn, 1, { x: R, y: 780 });
  wLabel(tn, '1 glucose', { x: R, y: 832, size: 24, weight: 700, fill: MC.glucose, o: 1 });
  wLabel(tn, 'for the same ATP (30–32 ÷ 2): an estimate, not from the slides', { x: 800, y: 872, size: 20, fill: COL.dim, weight: 500, o: 1 });
  // acc: electron pairs arrive at each final acceptor in turn (pyruvate from the left, acetaldehyde and O₂ from the right)
  const pair = g => { [-7, 7].forEach(dx => mk('circle', { cx: dx, r: 6.5, fill: MC.elec, stroke: MC.elecEdge, 'stroke-width': 1.5 }, g)); return g; };
  const ePy = tokenRun(p, [[150, 276], [278, 276]], pair, { n: 2, period: 2.2 });
  const eAc = tokenRun(p, [[700, 276], [562, 276]], pair, { n: 2, period: 2.2 });
  const eO2 = tokenRun(p, [[1400, 278], [1215, 278]], pair, { n: 2, period: 2.2 });
  const accs = [...al.querySelectorAll(':scope > g')].slice(0, 2);   // the pyruvate and acetaldehyde chains
  // why: glucose after glucose slides into the fermentation column for its 2 ATP
  const gIn = tokenRun(p, [[110, 470], [352, 470]], g => respIcon(g, 'glucose', { s: .55 }), { n: 2, period: 1.6 });
  const wE = knots([[tA + .8, 0], [tA + 1.3, 1], [t2 - .3, 1], [t2 + .2, 0]]), wO = knots([[tA + 7.1, 0], [tA + 7.6, 1], [t2 - .3, 1], [t2 + .2, 0]]);
  const wG = knots([[tW + 9.2, 0], [tW + 9.7, 1], [tT - .2, 1], [tT + .3, 0]]);
  clockRun(t => {
    t = rt(t);
    ePy.set(t, wE(t)); eAc.set(t - 1.1, wE(t)); eO2.set(t, wO(t));
    const hit = (t0, w) => w * Math.max(0, 1 - Math.abs(cFrac(t0 / 1.1 + .5) - .5) * 8);   // a pair arriving
    accs.forEach((e, i) => cSet(e, { s: 1 + .08 * hit(i ? t - 1.1 : t, wE(t)) }));
    gIn.set(t, wG(t));
    lb.forEach((e, i) => { mO(e, mRamp(t, t2 + .3 + .4 * i, t2 + .6 + .4 * i)); cSet(e, { s: 1 + .14 * wG(t) * Math.max(0, 1 - Math.abs(cFrac(t / .8 + .5) - .5) * 6) }); });
    rb.forEach((e, i) => mO(e, mRamp(t, t32 + .2 + i * .07, t32 + .4 + i * .07)));
    mO(glow, .55 + .45 * Math.sin(t * 3) ** 2);
  }, D);
}],

/* ---------- fork ---------- */
['fork', 'The pyruvate fork', (m, D) => {
  const p = panel(0), tF = m('fork'), tN = m('noo2'), tO = m('o2on'), tB = m('obl'), tC = m('fac'), tW = m('sw');
  const pf = pyruvateFork(p, { x: 800, y: 440, s: .88 });
  pf.build(0);
  // obl: obligate anaerobes stay on the left branch
  const ob = G(p, { o: 0 }); show(ob, tB + 2.4, .5);
  const obI = G(ob, { x: 300, y: 690 }); o2Molecule(obI, { r: 16 }); redX(obI, 0, 0, 26, 7);
  wLabel(ob, 'obligate anaerobes:', { x: 340, y: 682, size: 24, weight: 800, fill: MC.stim, anchor: 'start', o: 1 });
  wLabel(ob, 'this side only; O₂ kills them', { x: 340, y: 714, size: 20, fill: COL.dim, weight: 600, anchor: 'start', o: 1 });
  // fac: facultative anaerobes use either branch
  const fc = G(p, { o: 0 }); show(fc, tC + .3, .5);
  const fcP = G(fc, { x: 800, y: 826 }); pill(fcP, 'facultative anaerobes: yeast, many bacteria', 0, 0, { size: 24, fill: MC.yeast, edge: MC.yeast });
  mArrow(fc, [560, 806], [470, 772], { color: MC.yeast, w: 4, head: 14 });
  mArrow(fc, [1040, 806], [1130, 772], { color: MC.yeast, w: 4, head: 14 });
  wLabel(fc, 'either branch', { x: 800, y: 784, size: 20, fill: COL.dim, weight: 600, o: 1 });
  // sw: the O₂ level decides; a switch at the pyruvate box follows it
  const sw = G(p, { o: 0 }); show(sw, tW, .4);
  const gg = o2Gauge(sw, { x: 1480, y: 600, h: 260 });
  const lev = G(sw, { x: 800, y: 360 });
  const arm = G(lev, { s: .999 }); path(arm, 'M0 0H74', { stroke: MC.elec, 'stroke-width': 8, 'stroke-linecap': 'round' }); mk('circle', { cx: 78, r: 11, fill: MC.elec, stroke: MC.elecEdge, 'stroke-width': 2 }, arm);
  mk('circle', { r: 9, fill: '#3a2a06', stroke: MC.elec, 'stroke-width': 3 }, lev);
  // tokens: glucose down the glycolysis arrow, pyruvate down whichever branch is lit, acetyl groups round the cycle
  const F = ([lx, ly]) => [800 + .88 * lx, 440 + .88 * ly];
  const hexTok = g => { path(g, zNgon(6, 11, 0, 0, 0), { fill: MC.glucose, stroke: MC.glucoseEdge, 'stroke-width': 2.5 }); return g; };
  const pyrTok = g => carbonChain(g, { n: 3, r: 6, sp: 12, back: true });
  const runS = tokenRun(p, [[0, -282], [0, -172]].map(F), hexTok, { n: 2, period: 2.3 });
  const runL = tokenRun(p, [[-112, -100], [-322, 36]].map(F), pyrTok, { n: 3, period: 2.4 });
  const runR = tokenRun(p, [[112, -100], [204, 34]].map(F), pyrTok, { n: 2, period: 2.3 });
  const lap = [[312, 112], [384, 136], ...Array.from({ length: 21 }, (_, i) => { const a = (202 + i * 14) * Math.PI / 180; return [455 + 70 * Math.cos(a), 160 + 70 * Math.sin(a)]; })];
  const runC = tokenRun(p, lap.map(F), g => carbonChain(g, { n: 2, r: 6, sp: 12, color: MC.pyrOx }), { n: 3, period: 3.4 });
  const KL = knots([[tN + 1.6, 0], [tN + 2.2, 1], [tO - .4, 1], [tO, 0], [tB + .2, 0], [tB + .8, 1]]);
  const KR = knots([[tO + 2, 0], [tO + 2.6, 1], [tB - .6, 1], [tB, 0], [tC + .2, 0], [tC + .8, 1]]);
  const BK = knots([[tF, 0], [tF + 4, .5], [tN, .5], [tN + 1.5, 4 / 6], [tO, 4 / 6], [tO + 2, 1]]);
  clockRun(t => {
    t = rt(t);
    pf.build(BK(t));
    {
      const lvl = .5 + .5 * Math.cos(2 * Math.PI * Math.max(0, t - tW) / 4), sw = mRamp(t, tW, tW + .4);
      const wL = KL(t) * (1 - sw) + sw * (1 - lvl), wR = KR(t) * (1 - sw) + sw * lvl;
      runS.set(t, mRamp(t, tF + 3.6, tF + 4.4)); runL.set(t, wL); runR.set(t, wR); runC.set(t - 1, wR);
      // obligate anaerobes: the crossed-out O₂ throbs as the voice says they cannot survive in it; the yeast pill as yeast is named
      const throb = (a, b, per) => mRamp(t, a, a + .4) * (1 - mRamp(t, b - .4, b)) * Math.sin(Math.PI * cFrac((t - a) / per)) ** 2;
      cSet(obI, { s: 1 + .14 * throb(tB + 4.6, tC - .4, 1.1) });
      cSet(fcP, { s: 1 + .05 * throb(tC + 3.1, tW, 1.4) });
    }
    const level = .5 + .5 * Math.cos(2 * Math.PI * Math.max(0, t - tW) / 4);
    gg.set(level);
    const ang = 147 - 93 * io(level); cSet(arm, { r: ang });
    const base = ['cell', 'glucose', 'pyruvate'];
    if (t >= tW) pf.focus([...base, level > .5 ? 'aerobic' : 'fermentation'], Math.abs(level - .5) * 2 * mRamp(t, tW, tW + .4));
    else if (t >= tC) pf.focus([], 1);
    else if (t >= tB) pf.focus([...base, 'fermentation'], io(mRamp(t, tB + .2, tB + .8)));
    else if (t >= tO) pf.focus([...base, 'aerobic'], io(mRamp(t, tO + 2, tO + 2.6)) * (1 - mRamp(t, tB - .6, tB)));
    else pf.focus([...base, 'fermentation'], io(mRamp(t, tN + 1.5, tN + 2.1)) * (1 - mRamp(t, tO - .4, tO)));
  }, D);
}],

/* ---------- q2 ---------- */
['q2', 'Quick check', (m, D) => {
  const p = panel(0);
  pyruvateFork(p, { x: 410, y: 480, s: .56 });
  wLabel(p, 'a yeast cell loses its O₂', { x: 430, y: 150, size: 30, weight: 700, fill: MC.yeast, o: 1 });
  o2Gauge(p, { x: 830, y: 640, h: 180 }).set(0);
  wLabel(p, 'O₂: none', { x: 830, y: 676, size: 22, fill: MC.oxy, weight: 700, o: 1 });
}, { ask: done => quiz(SIDE, [{
  id: 'c-yeast', prompt: ['A yeast cell loses its oxygen. What does it do?'],
  build: choice([['it dies at once'], ['it switches to fermentation, and still makes 2 ATP per glucose'], ['it runs its electron transport chain with sulfate instead'], ['it stops glycolysis and makes no ATP']], 1,
    'Right. Yeast is a facultative anaerobe: without O₂ it ferments, making 2 ATP per glucose by glycolysis.',
    ['Yeast is a facultative anaerobe: it survives without O₂ by switching branches.', null,
      'That is anaerobic respiration, done by some bacteria. Yeast ferments instead.',
      'Glycolysis does not need O₂: it keeps going as long as fermentation returns NAD⁺.']),
}], done) }],

/* ---------- wrap ---------- */
['wrap', 'Summary', (m, D) => {
  const p = panel(0), tE = m('end');
  wLabel(p, 'Summary: fermentation and anaerobic respiration', { x: 800, y: 62, size: 34, weight: 700, o: 1 });
  const ROWS = [
    ['s1', 'Glycolysis makes ATP with or without O_2', 'but it needs NAD^+ to keep going', MC.gly],
    ['s2', 'Fermentation regenerates NAD^+ without a chain', 'alcohol: ethanol + CO_2 · lactic acid: lactate', MC.nad],
    ['s3', '2 ATP per glucose', 'against about 30 to 32 for aerobic respiration', MC.elec],
    ['s4', 'Pyruvate is the fork: O_2 decides the road', 'obligate anaerobes: one side · facultative: either', MC.stim],
  ];
  const rows = [];
  ROWS.forEach(([mk_, a, b, col], i) => {
    const y = 175 + i * 160, g = G(p, { o: 0 });
    panelBox(g, 150, y - 68, 1300, 140);
    wChem(g, a, { x: 450, y: y - 4, size: 32, weight: 700, fill: col, anchor: 'start', o: 1 });
    wChem(g, b, { x: 450, y: y + 38, size: 24, weight: 500, fill: COL.dim, anchor: 'start', o: 1 });
    if (i === 0) { glucoseRing(g, { x: 215, y, R: 26, r: 7 }); mArrow(g, [252, y], [312, y], { color: MC.gly, w: 6, head: 16 }); nadShuttle(g, { x: 368, y: y - 4, s: .6, label: false }); }
    if (i === 1) { rows.push(loopGlyph(g, { x: 230, y, s: .6 })); carbonChain(g, { x: 350, y: y - 22, n: 2, r: 8, sp: 18, color: MC.ethanol }); carbonChain(g, { x: 350, y: y + 22, n: 3, r: 8, sp: 18, color: MC.lactate }); }
    if (i === 2) { atpBar(g, { x: 190, y: y - 20, w: 220, h: 20, size: 12, ticks: false, segs: [{ n: 2, color: MC.ethanol }] }); atpBar(g, { x: 190, y: y + 20, w: 220, h: 20, size: 12, ticks: false, segs: [{ n: 32, color: MC.oxph }] }); }
    if (i === 3) {
      path(g, `M290 ${y - 50}V${y - 12}M290 ${y - 12}L215 ${y + 40}M290 ${y - 12}L365 ${y + 40}`, { stroke: COL.chalk, 'stroke-width': 5 });
      mk('rect', { x: 255, y: y - 30, width: 70, height: 34, rx: 8, fill: '#6c9fe0' }, g);
      mk('rect', { x: 185, y: y + 34, width: 60, height: 28, rx: 8, fill: MC.stim }, g);
      mk('rect', { x: 335, y: y + 34, width: 60, height: 28, rx: 14, fill: MC.oxph }, g);
    }
    show(g, m(mk_) + .1, .5);
  });
  say(p, 'Now try the chapter practice.', 800, 862, tE, { size: 30, fill: WC.bond });
  clockRun(t => rows.forEach(r => r.set(t)), D);
}],

/* ---------- final1 ---------- */
['final1', 'Chapter practice', (m, D) => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  at('nad', g => {
    panelBox(g, 980, 90, 580, 720);
    respIcon(g, 'glucose', { x: 1060, y: 300, s: 1.2 });
    glyArrow(g, 1110, 1350, 300);
    redX(g, 1230, 298, 24, 8);
    wLabel(g, 'glycolysis stalls', { x: 1270, y: 200, size: 30, weight: 800, fill: MC.inhib, o: 1 });
    wChem(g, 'NAD^+ supply', { x: 1270, y: 480, size: 26, weight: 700, fill: MC.nad, o: 1 });
    const sb = supplyBox(g, { x: 1270, y: 540, n: 6 }); sb.set(0);
    wLabel(g, 'every seat empty', { x: 1270, y: 600, size: 22, fill: COL.dim, weight: 500, o: 1 });
    nadShuttle(g, { x: 1170, y: 700, s: .8, size: 22 }).set(1); nadShuttle(g, { x: 1370, y: 700, s: .8, size: 22 }).set(1);
  });
  at('which', g => {
    panelBox(g, 980, 90, 580, 720);
    wLabel(g, 'alcohol fermentation', { x: 1270, y: 150, size: 26, weight: 700, fill: MC.ethanol, o: 1 });
    fermentation(g, { kind: 'alcohol', x: 1307, y: 330, s: .5 });
    wLabel(g, 'lactic acid fermentation', { x: 1270, y: 500, size: 26, weight: 700, fill: MC.lactate, o: 1 });
    fermentation(g, { kind: 'lactic', x: 1307, y: 660, s: .5 });
  });
  at('atp', g => {
    panelBox(g, 980, 90, 580, 720);
    wLabel(g, 'fermentation', { x: 1270, y: 160, size: 28, weight: 700, fill: MC.ethanol, o: 1 });
    [0, 1].forEach(i => respIcon(g, 'ATP', { x: 1240 + 60 * i, y: 230 }));
    wLabel(g, '? ATP', { x: 1270, y: 300, size: 26, weight: 800, fill: MC.elec, o: 1 });
    wLabel(g, 'aerobic respiration', { x: 1270, y: 400, size: 28, weight: 700, fill: MC.oxph, o: 1 });
    for (let i = 0; i < 32; i++) respIcon(g, 'ATP', { x: 1095 + 50 * (i % 8), y: 470 + 46 * Math.floor(i / 8) });
    wLabel(g, 'about ? ATP', { x: 1270, y: 700, size: 26, weight: 800, fill: MC.elec, o: 1 });
  });
  at('acc', g => {
    panelBox(g, 980, 90, 580, 720);
    const route = (y, name, col, chain) => {
      wLabel(g, name, { x: 1270, y: y - 60, size: 26, weight: 700, fill: col, o: 1 });
      pill(g, 'glycolysis', 1090, y, { size: 20, fill: MC.gly, edge: MC.gly });
      mArrow(g, [1160, y], [1210, y], { color: COL.dim, w: 4, head: 12 });
      if (chain) chainIcon(g, { x: 1290, y: y - 4, s: .5, label: false }); else wLabel(g, 'no chain', { x: 1290, y: y + 8, size: 20, fill: COL.dim, weight: 600, o: 1 });
      mArrow(g, [1360, y], [1410, y], { color: COL.dim, w: 4, head: 12 });
      pill(g, '?', 1460, y, { size: 26, fill: MC.oxy, edge: MC.oxy });
    };
    route(240, 'fermentation', MC.ethanol, false);
    route(470, 'aerobic respiration', MC.oxph, true);
    route(700, 'anaerobic respiration', MC.complex, true);
  });
  at('obl', g => {
    panelBox(g, 980, 90, 580, 720);
    pyruvateFork(g, { x: 1270, y: 440, s: .42 });
    redX(g, 1410, 500, 70, 10);
    wLabel(g, 'an organism that can only', { x: 1270, y: 700, size: 24, weight: 700, o: 1 });
    wLabel(g, 'live on the left branch', { x: 1270, y: 732, size: 24, weight: 700, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('nad');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-nad', prompt: ['Why does glycolysis stall in a cell that cannot regenerate NAD⁺?'],
    build: withPic('nad', choice([['it has run out of glucose'], ['it needs NAD⁺ to take electrons, and none is left'], ['it needs O₂ directly'], ['ATP piles up and blocks it']], 1,
      'Right. Each glucose turns 2 NAD⁺ into 2 NADH. With every NAD⁺ used up and none returned, glycolysis has nothing to hand its electrons to.',
      ['Glucose is not the problem: there is plenty. The helper that takes electrons is.', null,
        'Glycolysis itself does not use O₂. It needs NAD⁺, which O₂ (through the chain) or fermentation gives back.',
        'That is not the reason here: the supply of NAD⁺ has run dry.'])) },
  { id: 'p-which', prompt: ['Which fermentation does this?'],
    build: withPic('which', grid([
      { parts: ['releases CO₂'], ans: ['a'], why: 'Alcohol: pyruvate loses a carbon as CO₂.' },
      { parts: ['the product is lactate'], ans: ['l'], why: 'Lactic acid: pyruvate goes straight to lactate.' },
      { parts: ['NADH reduces pyruvate itself'], ans: ['l'], why: 'Lactic acid: the electrons go onto pyruvate, not acetaldehyde.' },
      { parts: ['makes acetaldehyde on the way'], ans: ['a'], why: 'Alcohol: acetaldehyde is the step after CO₂ leaves.' },
      { parts: ['yeast raising bread'], ans: ['a'], why: 'Alcohol: the CO₂ puffs up the dough.' },
      { parts: ['a muscle fibre short of O₂'], ans: ['l'], why: 'Lactic acid: muscle makes lactate when O₂ is scarce.' },
    ], [['a', 'alcohol', null, 'A'], ['l', 'lactic acid', null, 'L']], { multi: false, text: true })) },
  { id: 'p-atp', prompt: ['ATP from one glucose (give respiration’s upper figure):'],
    build: withPic('atp', blanks([
      { parts: ['fermentation: ', { box: '2' }, ' ATP'], why: 'Fermentation stops after glycolysis: 2 ATP, by substrate-level phosphorylation.', hint: 'Fermentation makes only what glycolysis makes.' },
      { parts: ['aerobic respiration: about ', { box: '32' }, ' ATP'], why: 'About 30 to 32: glycolysis, the cycle and, above all, oxidative phosphorylation.', hint: 'Respiration adds the cycle and the chain to glycolysis: think tens, not units.', test: v => v[0] === 32 || v[0] === 30 },
    ])) },
  { id: 'p-acc', prompt: ['Which route ends with this final electron acceptor?'],
    build: withPic('acc', grid([
      { parts: ['O₂'], ans: ['a'], why: 'Aerobic respiration: the chain ends on O₂, making water.' },
      { parts: ['sulfate'], ans: ['n'], why: 'Anaerobic respiration: a chain, but its last acceptor is not O₂.' },
      { parts: ['acetaldehyde'], ans: ['f'], why: 'Fermentation (alcohol): NADH reduces acetaldehyde; no chain.' },
      { parts: ['pyruvate (lactic)'], ans: ['f'], why: 'Fermentation (lactic acid): pyruvate becomes lactate; no chain.' },
    ], [['f', 'fermentation', null, 'F'], ['a', 'aerobic', null, 'A'], ['n', 'anaerobic', null, 'N']], { multi: false, text: true })) },
  { id: 'p-obl', prompt: ['What makes an organism an obligate anaerobe?'],
    build: withPic('obl', choice([['it makes more ATP in O₂'], ['it can switch between fermentation and respiration'], ['it uses only fermentation or anaerobic respiration, and cannot survive in O₂'], ['it needs O₂ to start glycolysis']], 2,
      'Right. An obligate anaerobe stays on the no-O₂ side: fermentation or anaerobic respiration only, and O₂ kills it.',
      ['O₂ harms it: it cannot use O₂ at all.',
        'That is a facultative anaerobe, such as yeast.', null,
        'Glycolysis needs no O₂ in any organism.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
