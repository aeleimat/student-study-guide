// Biology, Chapter 9 (Cellular Respiration), lesson 7: a dam whose gate opens on a turbine, then the shared respiration
// map with oxidative phosphorylation lit and a push into the inner membrane; complexes I, III and IV pump H⁺ into the
// intermembrane space until it is crowded (an H⁺ gradient), the membrane a wall with one door; ATP synthase's four
// parts and slide 37's five steps with one proton followed through; chemiosmosis, the proton-motive force, coupling,
// oxidative phosphorylation = chain + chemiosmosis, and the energy flow glucose → NADH → chain → proton-motive force →
// ATP; slide 41's count, 2 + 2 + 26 or 28 = about 30 or 32; why only an estimate (the shuttles, other work, ratios);
// a summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-09/lesson-07.md.

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const eR = (t, a, b) => io(mRamp(t, a, b));
const lerp2 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
const SHUTTLE = '#c9a0dc';
// A label (centred text, chemistry markup) with a leader to the thing it names; fades in at t0 (null: shown at once).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 28, fill = COL.chalk, line = COL.dim, weight = 700, sub = '', anchor = 'middle' } = {}) {
  const g = G(p, { o: 0 }), w = uiW(str.replace(/[_^]/g, ''), size);
  wChem(g, str, { x: tx, y: ty, size, fill, weight, anchor, o: 1 });
  if (sub) wChem(g, sub, { x: tx, y: ty + size * 1.1, size: size * .76, fill: COL.dim, weight: 500, anchor, o: 1 });
  const left = anchor === 'start' ? tx : anchor === 'end' ? tx - w : tx - w / 2, right = left + w;
  let sx = ax < left ? left - 10 : right + 10;
  path(g, `M${sx.toFixed(1)} ${(ty - size * .35).toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 });
  mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g);
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0 and (with t1) out at t1.
function banner(p, a, b, x, y, t0, t1, { color = COL.chalk, size = 38 } = {}) {
  const g = G(p, { o: 0 });
  wChem(g, a, { x, y, size, weight: 700, fill: color, o: 1 });

  show(g, t0, .45); if (t1 != null) hide(g, t1, .35);
  return g;
}
const panelBox = (g, x, y, w, h, stroke = COL.faint) => mk('rect', { x, y, width: w, height: h, rx: 22, fill: '#0b1828', stroke, 'stroke-width': 3 }, g);
// A dark pill with chemistry text, origin at its centre.
function pill(p, str, { x = 0, y = 0, size = 24, fill = COL.chalk, edge = fill, o = 1, weight = 700 } = {}) {
  const g = G(p, { x, y, o }), w = Math.round(uiW(str.replace(/[_^]/g, ''), size) * 1.08 + 26), h = size + 14;
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: '#0b1626', stroke: edge, 'stroke-width': 2.5 }, g);
  wChem(g, str, { y: size * .36, size, fill, weight, o: 1 });
  return Object.assign(g, { w, h });
}
// A bracket under a span (x1..x2) at y, ticks up; its label (and a dim line) under it.
function bracket(p, x1, x2, y, a, b, color, { size = 28 } = {}) {
  const g = G(p, { o: 0 });
  path(g, `M${x1} ${y - 16}V${y}H${x2}V${y - 16}`, { stroke: color, 'stroke-width': 4 });

}
// A small turbine wheel (six blades) for the dam and the "tiny turbine"; .set(deg) turns it.
function turbineIcon(p, { x = 0, y = 0, r = 40, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { r: r + 6, fill: '#22303f', stroke: '#8fa3b8', 'stroke-width': 3 }, g);
  const wh = G(p, { x, y, r: .1, o }), d = [];

  path(wh, d.join(''), { fill: '#cfd8e3', stroke: '#6f8296', 'stroke-width': 2 });
  mk('circle', { r: r * .2, fill: '#6f8296' }, wh);
  return Object.assign(g, { wh, set(deg) { cSet(wh, { r: .1 + ((deg % 360) + 360) % 360 }); return g; } });
}
// A numbered callout (slide 37's blue circles).
function badge(p, n, x, y, { r = 17, o = 0 } = {}) {

// A small dam glyph (wall, water behind) for "like the water behind the dam".
function damGlyph(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  path(g, 'M-50 -18H0V30H-50Z', { fill: '#3f7fb5' });

}
const SUM = (a, b) => a + b;
// Re-home a kit protonCloud (built with seed, w, h, r): its H⁺ keep `gap` apart, stay inside `region` and out of the
// `avoid` boxes ([x0, y0, x1, y1]), all in the cloud's own coordinates, so they never sit on each other, on a label or in
// a lane where other H⁺ travel. Each keeps the kit's home when it is free, or takes the nearest free spot (none: hidden).
// Fixed at build; .at(t) poses them with the kit's own jiggle; call it after the kit's setters, every frame.
function tidyCloud(cloud, { seed, w, h, r, gap, region, avoid = [] }) {
  const homes = [];
  const free = ([x, y]) => x >= region[0] && x <= region[2] && y >= region[1] && y <= region[3]
    && avoid.every(([a, b, c, d]) => x < a || x > c || y < b || y > d) && homes.every(q => !q || Math.hypot(x - q[0], y - q[1]) >= gap);
  for (let i = 0; i < cloud.n; i++) {
    const k = [(wHash(i, seed) - .5) * (w - 2 * r), (wHash(i, seed + 7) - .5) * (h - 2 * r)];
    let best = free(k) ? k : null, bd = 1e9;
    if (!best) for (let x = region[0]; x <= region[2]; x += 4) for (let y = region[1]; y <= region[3]; y += 4) {
      const d = Math.hypot(x - k[0], y - k[1]); if (d < bd && free([x, y])) { bd = d; best = [x, y]; }
    }
    homes.push(best);
  }
  return { homes, at(t) {
    const T = Math.round(t * 120) / 120;
    cloud.hs.forEach((hp, i) => { const q = homes[i]; if (!q) { mO(hp, 0); return; } hp.pose(q[0] + 7 * zWob(i, T * 1.6, seed), q[1] + 6 * zWob(i + 50, T * 1.6, seed)); });
  } };
}
// A box in page coordinates, padded by m, moved into a cloud's coordinates (cloud origin ox, oy on the page, scale s).
const boxIn = ([x0, y0, x1, y1], m, ox, oy, s = 1) => [(x0 - m - ox) / s, (y0 - m - oy) / s, (x1 + m - ox) / s, (y1 + m - oy) / s];
// A point along a polyline, k 0..1 by length.
function alongPts(pts, k) {
  const L = pts.slice(1).map((q, i) => Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1])), tot = L.reduce(SUM, 0);
  let d = Math.max(0, Math.min(1, k)) * tot;
  for (let i = 0; i < L.length; i++) { if (d <= L[i] || i === L.length - 1) return lerp2(pts[i], pts[i + 1], L[i] ? Math.min(1, d / L[i]) : 1); d -= L[i]; }
  return pts[pts.length - 1];
}

/* ---------- the count map (slide 41): the map at CM with carriers and the ATP bar ---------- */

// The ATP bar of slide 41: glycolysis 2, cycle 2, oxidative phosphorylation 26 (or 28); a dashed mark at 30.
function countBar(p, { x = 300, y = 700, w = 1000, ox = 26, labels = ['2', '2', ''], size = 22 } = {}) {
  const b = atpBar(p, { x, y, w, size, segs: [{ n: 2, color: MC.gly, label: labels[0] }, { n: 2, color: MC.cac, label: labels[1] }, { n: ox, color: MC.oxph, label: labels[2] }] });

  wLabel(m30, '30', { x: x30, y: y - 38, size: size * .9, weight: 700, fill: COL.chalk, o: 1 });
  return Object.assign(b, { m30 });
}

}],

  const res = [['total about 32', 378], ['total about 30', 568]].map(([s, y]) => { const g = G(sh, { o: 0 }); wLabel(g, s, { x: 1400, y, size: 22, weight: 800, fill: MC.elec, o: 1 }); return g; });
  const fn = pill(sh, 'FADH_2 enters lower: fewer H^+ pumped', { x: 1222, y: 645, size: 21, fill: MC.fad, o: 0 });
  // the reason cards
  const cards = [
    ['the shuttle', '2 NADH or 2 FADH_2 inside: 28 or 26 ATP', atL(29.0)],
    ['the gradient also does other work', 'not every H^+ goes through ATP synthase', atL(30.039)],
    ['H^+ per ATP is not a whole number', 'so the count cannot come out exact', atL(36.458)],
  ].map(([a, b, t0], i) => {
    const g = G(p, { o: 0 }), y = 140 + i * 170;
    panelBox(g, 880, y, 690, 148);
    wChem(g, a, { x: 1020, y: y + 64, size: 28, weight: 700, anchor: 'start', o: 1 });
    wChem(g, b, { x: 1020, y: y + 102, size: 22, weight: 500, fill: COL.dim, anchor: 'start', o: 1 });
    if (i === 0) [-14, 14].forEach(dy => mk('circle', { cx: 950, cy: y + 74 + dy * 1.6, r: 17, fill: SHUTTLE, stroke: '#8f68a6', 'stroke-width': 2.5 }, g));
    if (i === 1) { proton(g, { x: 930, y: y + 74, r: 16 }); mArrow(g, [952, y + 70], [990, y + 44], { color: COL.chalk, w: 4, head: 12 }); mArrow(g, [952, y + 78], [990, y + 104], { color: COL.chalk, w: 4, head: 12 }); }
    if (i === 2) { proton(g, { x: 932, y: y + 52, r: 15 }); wLabel(g, '÷', { x: 970, y: y + 64, size: 30, weight: 800, fill: COL.chalk, o: 1 }); atpBurst(g, { x: 950, y: y + 104, r: 18, size: 9 }); }
    show(g, t0 + .2, .4); return g;
  });
  void cards;
  const stp = G(p, { x: 1225, y: 770, r: -4, o: 0 }); show(stp, tEs + .3, .3); pulse(stp, tEs + .35, 1.08);
  mk('rect', { x: -250, y: -52, width: 500, height: 104, rx: 16, fill: '#1a1408', stroke: MC.elec, 'stroke-width': 5 }, stp);
  wLabel(stp, 'an estimate', { y: -6, size: 38, weight: 800, fill: MC.elec, o: 1 });
  wLabel(stp, '“about”, never “exactly”', { y: 32, size: 24, weight: 600, fill: COL.chalk, o: 1 });
  const tC0 = at(10.156), tU = at(14.648), tF = at(21.901);
  clockRun(t => {
    rm.focus(['oxphos', 'atp3'], 1 - .4 * mRamp(t, tSh, tSh + .6)).shine(t);
    // NADH in the cytosol tries the membrane and bounces off
    nIn.forEach((n, i) => { const u = mBump(t, tSh + .8 + i * .4, tSh + 2.6 + i * .4); n.pose(1010 + 90 * u, i ? 470 : 280); n.set(1 - eR(t, tC0 + 1.2 + i * .3, tC0 + 2.6 + i * .3)); });
    mO(xm, mRamp(t, tSh + 1.5, tSh + 1.9) * (1 - mRamp(t, tC0 - .5, tC0)));
    circ.forEach(c => mO(c, mRamp(t, tC0, tC0 + .5)));
    mO(sl, mRamp(t, tC0 + .3, tC0 + .8));
    // electron pairs: cytosolic NADH → shuttle (in the membrane) → NADH or FADH₂ inside
    ePr.forEach((e, i) => {
      const y = i ? 470 : 280, a = eR(t, tC0 + 1.2 + i * .3, tC0 + 2.6 + i * .3), b = eR(t, tU + .3 + i * 2.2, tU + 1.8 + i * 2.2);
      const q = b > 0 ? lerp2([1222, y + 12], [1400, y - 6], b) : lerp2([1010, y - 6], [1222, y + 12], a);
      e.pose(q[0], q[1]); mO(e, mRamp(a, 0, .08) * (1 - mRamp(b, .85, 1)));
      mO(nOut[i], mRamp(t, tU + .1 + i * 2.2, tU + .4 + i * 2.2)); nOut[i].set(eR(t, tU + 1.4 + i * 2.2, tU + 2.6 + i * 2.2));
      mO(res[i], mRamp(t, tU + 2.6 + i * 2.2, tU + 3 + i * 2.2));
    });
    mO(fn, mRamp(t, tF + .2, tF + .6));
  }, D);
}],

/* ---------- q2 ---------- */
['q2', 'Quick check', (m, D) => {
  const p = panel(0);
  respMap(p, { x: 330, y: 300, s: .4 }).focus(['oxphos', 'atp3'], 1);
  const bar = countBar(p, { x: 60, y: 560, w: 520, ox: 28, size: 18 }); put(bar.m30, { o: 1 });
  wLabel(p, 'ATP per glucose', { x: 60, y: 510, size: 22, weight: 700, anchor: 'start', o: 1 });
  wLabel(p, 'about 30 or 32 in all', { x: 320, y: 640, size: 26, weight: 700, fill: MC.elec, o: 1 });
}, { ask: done => quiz(SIDE, [{
  id: 'c-most', prompt: ['Which stage makes most of the ATP from one glucose?'],
  build: choice([['glycolysis'], ['pyruvate oxidation'], ['the citric acid cycle'], ['oxidative phosphorylation']], 3,
    'Right. About 26 or 28 of the 30 or 32 ATP come from oxidative phosphorylation: about nine in ten.',
    ['Glycolysis makes only 2 ATP, by substrate-level phosphorylation.', 'Pyruvate oxidation makes no ATP directly: its NADH pays out later, in the chain.',
      'The citric acid cycle makes only 2 ATP per glucose, one per turn.', null]),
}], done) }],

/* ---------- wrap ---------- */
['wrap', 'Summary', (m, D) => {
  const p = panel(0), tE = m('end');
  wLabel(p, 'Summary: chemiosmosis and the ATP count', { x: 800, y: 70, size: 36, weight: 700, o: 1 });
  const ROWS = [
    ['s1', 'The chain pumps H^+ into the intermembrane space', 'an H^+ gradient builds: a proton-motive force', MC.proton],
    ['s2', 'H^+ flow back through ATP synthase', 'the rotor spins like a turbine, and the knob makes ATP: chemiosmosis', '#b6c0ff'],
    ['s3', 'Chain + chemiosmosis = oxidative phosphorylation', 'one glucose: about 30 or 32 ATP (2 + 2 + 26 or 28)', '#b6a9f0'],
  ];
  let syn = null;
  ROWS.forEach(([mk_, a, b, col], i) => {
    const y = 200 + i * 205, g = G(p, { o: 0 });
    panelBox(g, 150, y - 85, 1300, 175);
    wChem(g, a, { x: 450, y: y - 6, size: 34, weight: 700, fill: col, anchor: 'start', o: 1 });
    wChem(g, b, { x: 450, y: y + 40, size: 26, weight: 500, fill: COL.dim, anchor: 'start', o: 1 });
    if (i === 0) { chainIcon(g, { x: 300, y: y + 10, s: .7, label: false }); [[245, -55], [300, -62], [355, -50]].forEach(([x, dy]) => proton(g, { x, y: y + dy, r: 12 })); }
    if (i === 1) syn = atpSynthase(g, { x: 300, y: y - 30, s: .36 });
    if (i === 2) atpBurst(g, { x: 300, y: y + 4, r: 46 });
    show(g, m(mk_) + .1, .5);
  });
  say(p, 'Now try the chapter practice.', 800, 840, tE, { size: 32, fill: MC.elec, weight: 700 });
  clockRun(t => syn.run(t, { speed: .5, flow: 1, make: 1 }), D);
}],

/* ---------- final1 ---------- */
['final1', 'Chapter practice', (m, D) => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  at('dir', g => {
    panelBox(g, 980, 90, 580, 720);
    etcChain(g, { x: 1270, y: 440, s: .42, w: 1300, synthase: true, labels: false }).gradient(.5, 0);
    wLabel(g, 'intermembrane space', { x: 1270, y: 318, size: 22, weight: 700, fill: COL.dim, o: 1 });
    wLabel(g, 'matrix', { x: 1270, y: 600, size: 22, weight: 700, fill: COL.dim, o: 1 });
    [[1130, MC.proton], [1480, MC.elec]].forEach(([x, c]) => {
      mArrow(g, [x, 470], [x, 380], { color: c, w: 5, head: 14 }); mArrow(g, [x, 412], [x, 505], { color: c, w: 5, head: 14 });
      wLabel(g, '?', { x: x + 26, y: 460, size: 34, weight: 800, fill: c, o: 1 });
    });
    wLabel(g, 'pumped at the chain · back through ATP synthase', { x: 1270, y: 720, size: 20, weight: 600, fill: COL.dim, o: 1 });
    wLabel(g, 'which way do H⁺ go?', { x: 1270, y: 170, size: 28, weight: 700, fill: MC.proton, o: 1 });
  });
  at('parts', g => {
    panelBox(g, 980, 90, 580, 720);
    atpSynthase(g, { x: 1262, y: 330, s: 1.05, labels: true, size: 24 }).angle(30).labels(1);
    wLabel(g, 'spins, or stays still?', { x: 1270, y: 750, size: 28, weight: 700, fill: MC.elec, o: 1 });
  });
  at('opx', g => {
    panelBox(g, 980, 90, 580, 720);
    chainIcon(g, { x: 1140, y: 330, s: .85, label: false });
    atpSynthase(g, { x: 1440, y: 290, s: .5 });
    [[1040, 1250, '1  ?', MC.complex], [1360, 1520, '2  ?', '#b6c0ff']].forEach(([a, b, s, c]) => put(bracket(g, a, b, 470, s, null, c), { o: 1 }));
    put(bracket(g, 1030, 1530, 590, 'oxidative phosphorylation', null, MC.oxph, { size: 30 }), { o: 1 });
    wLabel(g, 'two halves, one process', { x: 1270, y: 170, size: 28, weight: 700, fill: '#b6a9f0', o: 1 });
  });
  at('sum', g => {
    panelBox(g, 980, 90, 580, 720);
    atpBar(g, { x: 1010, y: 330, w: 480, size: 20, segs: [{ n: 2, color: MC.gly, label: '' }, { n: 2, color: MC.cac, label: '' }, { n: 28, color: MC.oxph, label: '28' }] }).total('?');
    [['glycolysis: ?', MC.gly], ['citric acid cycle: ?', '#ee7b66'], ['oxidative phosphorylation: 28', '#b6a9f0'], ['total: ?', MC.elec]].forEach(([s, c], i) =>
      wLabel(g, s, { x: 1030, y: 450 + i * 60, size: 26, weight: 700, fill: c, anchor: 'start', o: 1 }));
    wLabel(g, 'ATP per glucose', { x: 1270, y: 200, size: 28, weight: 700, o: 1 });
  });
  at('est', g => {
    panelBox(g, 980, 90, 580, 720);
    mk('rect', { x: 1290, y: 92, width: 268, height: 716, fill: '#3a2410', 'fill-opacity': .7 }, g);
    path(g, 'M1255 190V640M1290 190V640', { stroke: MC.mito, 'stroke-width': 6 });
    [[300, 'NAD'], [520, 'FAD']].forEach(([y, kind]) => {
      nadShuttle(g, { x: 1110, y, size: 22 }).set(1);
      const c = G(g, { x: 1272, y: y + 12 }); mk('circle', { r: 24, fill: SHUTTLE, stroke: '#8f68a6', 'stroke-width': 3 }, c);
      nadShuttle(g, { x: 1430, y, kind, size: 22 }).set(1);
    });
    wLabel(g, 'cytosol', { x: 1110, y: 170, size: 24, weight: 700, fill: COL.dim, o: 1 });
    wLabel(g, 'mitochondrion', { x: 1425, y: 170, size: 24, weight: 700, fill: MC.mito, o: 1 });
    wLabel(g, 'one NADH, two endings', { x: 1270, y: 730, size: 28, weight: 700, fill: SHUTTLE, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('dir');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-dir', prompt: ['In the electron transport chain, which way are H⁺ pumped, and which way do they flow back through ATP synthase?'],
    build: withPic('dir', choice([['pumped from the matrix into the intermembrane space; they flow back into the matrix'], ['pumped into the matrix; they flow back out of it'], ['both toward the intermembrane space'], ['H⁺ do not move: only electrons do']], 0,
      'Right. The complexes pump H⁺ out of the matrix into the narrow intermembrane space; they come back down their gradient through ATP synthase.',
      [null, 'That is reversed: the H⁺ crowd builds in the intermembrane space, and the flow back runs into the matrix.',
        'To do work they must come back across the membrane: through ATP synthase, into the matrix.',
        'The H⁺ gradient is the whole point: electrons power the pumping, and H⁺ flowing back power ATP synthase.'])) },
  { id: 'p-parts', prompt: ['In ATP synthase, each part…'],
    build: withPic('parts', grid([
      { parts: ['the rotor'], ans: ['s'], why: 'Spins: H⁺ turn the ring.' },
      { parts: ['the internal rod'], ans: ['s'], why: 'Spins with the rotor.' },
      { parts: ['the stator'], ans: ['t'], why: 'Still: anchored in the membrane.' },
      { parts: ['the catalytic knob'], ans: ['t'], why: 'Still: the stator holds it.' },
    ], [['s', 'spins', null, 'S'], ['t', 'stays still', null, 'T']], { multi: false, text: true })) },
  { id: 'p-opx', prompt: ['Why is oxidative phosphorylation the chain and chemiosmosis together?'],
    build: withPic('opx', choice([['the chain builds the H⁺ gradient and chemiosmosis uses it to make ATP'], ['the chain makes ATP and chemiosmosis makes heat'], ['they are two names for the same step'], ['chemiosmosis needs no gradient']], 0,
      'Right. Part one, the chain, builds the H⁺ gradient; part two, chemiosmosis, spends it to make ATP. Neither makes ATP alone.',
      [null, 'The chain makes no ATP itself: it only pumps H⁺.', 'They are two halves: one builds the gradient, the other spends it.',
        'Chemiosmosis is driven by the gradient: no gradient, no ATP.'])) },
  { id: 'p-sum', prompt: ['One glucose. Oxidative phosphorylation gives 28 ATP. Count the ATP:'],
    build: withPic('sum', blanks([
      { parts: ['glycolysis + citric acid cycle: ', { box: '4' }, ' ATP'], why: '2 + 2 = 4, both by substrate-level phosphorylation.', hint: 'Glycolysis gives 2; the cycle gives 2 per glucose.' },
      { parts: ['total, with 28 more: ', { box: '32' }, ' ATP'], why: '4 + 28 = 32: about 32 ATP per glucose.', hint: 'Add 28 to your first answer.' },
    ])) },
  { id: 'p-est', prompt: ['Why is the total given as about 30 or 32 ATP, and not one exact number?'],
    build: withPic('est', choice([['glycolysis makes 2 or 4 ATP'], ['the cycle makes ATP only some of the time'], ['the shuttle for cytosolic NADH changes the yield, and H⁺ per ATP is not a whole number'], ['the slides disagree with each other']], 2,
      'Right. Electrons from cytosolic NADH arrive as NADH or as FADH₂ depending on the shuttle, and the H⁺-to-ATP ratio is not a whole number, so the count is an estimate.',
      ['Glycolysis nets 2 ATP every time.', 'The cycle makes 2 ATP per glucose, one per turn, every time.', null,
        'They agree: 2 + 2 + 26 = 30 and 2 + 2 + 28 = 32. The range comes from the shuttle.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
