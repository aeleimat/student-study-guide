'use strict';
// Biology, Chapter 9 (Cellular Respiration), lesson 6: a water wheel smashed by one big drop and turned by a staircase
// of small ones; the shared respiration map with oxidative phosphorylation lit; NADH and FADH2 carry the energy to the
// chain in the inner membrane (cristae, more surface); complexes I to IV; NADH into I, FADH2 into II, Q, complex III,
// cytochrome c, complex IV, each carrier reduced then oxidized; the free-energy staircase (about 50, 43, 10); oxygen
// takes the electrons and two H+ to make water and pulls the chain (without it the chain backs up); the chain makes no
// ATP itself, it breaks one big drop into small steps (lesson 7 makes the ATP); numbers; a summary; practice.
// Plan, errata and beats: books/biology/chapters/chapter-09/lesson-06.md.
const CHAPTER = { number: 906, label: '9, lesson 6', title: 'The Electron Transport Chain', minutes: 7, language: 'en', lead: false, next: '../lesson-07/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, ...o, o: 0 }); show(e, t0); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const rk = k => Math.round(mClamp(k) * 2000) / 2000;
const rt = t => Math.round(t * 60) / 60;
const plain = str => str.replace(/[_^]/g, '');
// A label (centred text, chem markup) with a leader to the thing it names; fades in at t0 (null: shown at once).
function tag(p, str, [tx, ty], [ax, ay], t0, { size = 26, fill = COL.chalk, line = COL.dim, weight = 700, sub = null } = {}) {
  const g = G(p, { o: 0 }), w = uiW(plain(str), size);
  wChem(g, str, { x: tx, y: ty, size, fill, weight, o: 1 });
  if (sub) wChem(g, sub, { x: tx, y: ty + size * 1.05, size: size * .78, fill: COL.dim, weight: 500, o: 1 });
  let sx, sy;
  if (Math.abs(ay - ty) < size * 1.6 && Math.abs(ax - tx) > w / 2) { sx = tx + Math.sign(ax - tx) * (w / 2 + 10); sy = ty - size * .35; }
  else if (ay > ty) { sx = tx; sy = ty + (sub ? size * 1.3 : size * .3); }
  else { sx = tx; sy = ty - size * 1.05; }
  path(g, `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ax.toFixed(1)} ${ay.toFixed(1)}`, { stroke: line, 'stroke-width': 2.5 });
  mk('circle', { cx: ax, cy: ay, r: 4.5, fill: line }, g);
  if (t0 !== null) show(g, t0, .4); else put(g, { o: 1 });
  return g;
}
// A title and a dim second line, centred; fades in at t0.
function banner(p, a, b, x, y, t0, { color = COL.chalk, size = 38 } = {}) {
  const g = G(p, { o: 0 });
  wChem(g, a, { x, y, size, weight: 700, fill: color, o: 1 });
  if (b) wChem(g, b, { x, y: y + size * .95, size: size * .64, fill: COL.dim, weight: 500, o: 1 });
  show(g, t0, .5);
  return g;
}
// Captions that replace one another on one line: [[t0, t1, text, colour]]; each fades out before the next comes in.
function capLine(p, list, { y = 92, size = 32 } = {}) {
  list.forEach(([t0, t1, str, color = COL.chalk]) => {
    const g = G(p, { o: 0 });
    wChem(g, str, { x: 800, y, size, weight: 700, fill: color, o: 1 });

    if (t1 != null) hide(g, t1 - .3, .25);

}
const panelBox = (g, x, y, w, h) => mk('rect', { x, y, width: w, height: h, rx: 22, fill: '#0b1828', stroke: COL.faint, 'stroke-width': 3 }, g);
// A vertical bracket arrow (y1 → y2) with a tick at its start.
function vBracket(p, x, y1, y2, color, { w = 5, head = 16 } = {}) {
  const g = G(p);
  mArrow(g, [x, y1], [x, y2], { color, w, head });
  path(g, `M${x - 12} ${y1}H${x + 12}`, { stroke: color, 'stroke-width': 3 });
  return g;
}
const dashH = (p, x1, x2, y, color = COL.dim, w = 2.5) => path(p, `M${x1} ${y}H${x2}`, { stroke: color, 'stroke-width': w, 'stroke-dasharray': '9 8' });
// A red cross (centre, half-size r).
function redX(p, x, y, r, o = 1) {
  const g = G(p, { x, y, o });
  path(g, `M${-r} ${-r}L${r} ${r}M${r} ${-r}L${-r} ${r}`, { stroke: MC.inhib, 'stroke-width': Math.max(6, r * .22), 'stroke-linecap': 'round' });
  return g;
}
const boxD = (w, h, cx = 0, cy = 0) => `M${cx - w / 2} ${cy - h / 2}H${cx + w / 2}V${cy + h / 2}H${cx - w / 2}Z`;
// A small inset: the mitochondrion with a marked stretch of inner membrane, "you are here".
function mitoInset(p, t0) {
  const g = G(p, { o: 0 });
  mitoCutaway(g, { x: 120, y: 128, s: .14, porter: false, labels: false });
  mk('rect', { x: 128, y: 82, width: 26, height: 22, fill: 'none', stroke: COL.chalk, 'stroke-width': 3 }, g);
  path(g, 'M154 104L205 248', { stroke: COL.chalk, 'stroke-width': 2, 'stroke-dasharray': '6 6' });
  if (t0 === null) put(g, { o: 1 }); else show(g, t0, .4);
  return g;
}

/* ---------- the backdrop: water wheels, a cliff, a staircase of falls ---------- */
const WOOD = '#b98a5a', WOOD_D = '#7a5634', WATER = '#7cc8e6';
// A water wheel, origin = the axle. .set(deg, broken) turns it; broken 0..1 cracks it, tips it and throws two paddles.
function waterWheel(p, { x = 0, y = 0, R = 70, o = 1, leg = R * 1.05 } = {}) {
  const g = G(p, { x, y, o });
  path(g, `M0 0L${cF(-R * .4)} ${cF(leg)}M0 0L${cF(R * .4)} ${cF(leg)}`, { stroke: WOOD_D, 'stroke-width': Math.max(4, R * .1) });
  const body = G(g, { s: .999 });
  let d = ''; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; d += `M0 0L${cF(R * Math.cos(a))} ${cF(R * Math.sin(a))}`; }
  path(body, d, { stroke: WOOD, 'stroke-width': Math.max(3, R * .07) });
  mk('circle', { r: R, fill: 'none', stroke: WOOD, 'stroke-width': Math.max(4, R * .1) }, body);
  let pd = '';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + Math.PI / 8, c = Math.cos(a), s = Math.sin(a), w = R * .15, L = R * .32;
    const pts = [[R * c - s * w, R * s + c * w], [R * c + s * w, R * s - c * w], [(R + L) * c + s * w, (R + L) * s - c * w], [(R + L) * c - s * w, (R + L) * s + c * w]];
    pd += 'M' + pts.map(q => cF(q[0]) + ' ' + cF(q[1])).join('L') + 'Z';
  }
  path(body, pd, { fill: WOOD, stroke: WOOD_D, 'stroke-width': 2.5 });
  mk('circle', { r: R * .2, fill: WOOD_D }, body);
  const crack = path(body, `M${cF(-R * .1)} ${cF(-R * .95)}L${cF(R * .12)} ${cF(-R * .5)}L${cF(-R * .08)} ${cF(-R * .15)}L${cF(R * .1)} ${cF(R * .3)}`, { stroke: MC.inhib, 'stroke-width': Math.max(4, R * .08) }, { o: 0 });
  const bits = [0, 1].map(() => { const b = G(g, { x: 1, y: 1, s: .999, o: 0 }); path(b, boxD(R * .3, R * .28), { fill: WOOD, stroke: WOOD_D, 'stroke-width': 2.5 }); return b; });
  const ww = Object.assign(g, {
    set(deg, br = 0) {
      br = rk(br); deg = Math.round(deg * 4) / 4;
      cSet(body, { r: deg % 360 + 28 * br, x: 10 * br, y: 22 * br, s: .999 });
      mO(crack, br > 0 ? Math.min(1, br * 4) : 0);
      bits.forEach((b, i) => {
        const sx = i ? 1 : -1;
        cSet(b, { x: sx * (R * .9 + 150 * br), y: -R * .7 - 160 * br + 220 * br * br, r: sx * 300 * br, s: .999 });
        mO(b, br > 0 ? 1 - mRamp(br, .8, 1) : 0);
      });
      return ww;
    },
  });
  return ww.set(0);
}
// A falling stream from (x, y0) to (x, y1): a pale band and droplets running down it; .set(t).
function waterFall(p, x, y0, y1, { w = 24, n = 6, speed = .9 } = {}) {
  const g = G(p);
  mk('rect', { x: x - w / 2, y: y0, width: w, height: y1 - y0, rx: w / 2, fill: WATER, 'fill-opacity': .55 }, g);
  const drops = Array.from({ length: n }, () => mk('ellipse', { rx: w * .18, ry: w * .42, fill: '#e8f7ff' }, g));
  drops.forEach(e => put(e, { x, y: y0, o: 0 }));
  return Object.assign(g, {
    set(t) {
      t = rt(t);
      drops.forEach((e, i) => { const u = cFrac(t * speed + i / n), dx = (i % 3 - 1) * w * .2; mPose(e, x + dx, y0 + (y1 - y0) * u, Math.min(1, u * 8, (1 - u) * 8)); });
      return g;
    },
  });
}

/* ---------- the folded membrane panel (lesson-local) ---------- */
// The folded line: five fingers 160 deep across 560 px; its length is 560 + 10 × 160 = 2160, about 4 × the flat line.
const FOLD = (() => { const pts = [[900, 470]]; for (let i = 0; i < 5; i++) { const x0 = 900 + 40 + i * 104; pts.push([x0, 470], [x0, 630], [x0 + 40, 630], [x0 + 40, 470]); } pts.push([1460, 470]); return pts; })();
function alongPts(pts, n) {   // n points evenly spaced along a polyline (the middle of each of n equal pieces)
  const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[L.length - 1];
  return Array.from({ length: n }, (_, k) => {
    const d = (k + .5) * tot / n; let i = 1; while (i < L.length - 1 && L[i] < d) i++;
    const f = (d - L[i - 1]) / (L[i] - L[i - 1]), a = pts[i - 1], b = pts[i];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, Math.abs(b[0] - a[0]) < 1];
  });
}
function foldPanel(p, t0) {
  const g = G(p, { o: 0 });
  panelBox(g, 830, 190, 720, 600);
  const chip = (x, y, vert) => mk('rect', vert ? { x: x - 9, y: y - 14, width: 18, height: 28, rx: 5, fill: MC.complex, stroke: MC.complexEdge, 'stroke-width': 2 } : { x: x - 14, y: y - 9, width: 28, height: 18, rx: 5, fill: MC.complex, stroke: MC.complexEdge, 'stroke-width': 2 }, g);
  wLabel(g, 'flat membrane: length 1×', { x: 1180, y: 262, size: 26, weight: 700, o: 1 });
  path(g, 'M900 330H1460', { stroke: MC.cristae, 'stroke-width': 8 });
  alongPts([[900, 330], [1460, 330]], 4).forEach(([x, y]) => chip(x, y, false));
  path(g, 'M' + FOLD.map(q => q.join(' ')).join('L'), { stroke: MC.cristae, 'stroke-width': 8, 'stroke-linejoin': 'round' });
  alongPts(FOLD, 15).forEach(([x, y, v]) => chip(x, y, v));
  wLabel(g, 'folded into cristae: about 4× the membrane', { x: 1180, y: 690, size: 26, weight: 700, fill: MC.cristae, o: 1 });
  wLabel(g, 'same width, room for many more chains', { x: 1180, y: 726, size: 22, weight: 500, fill: COL.dim, o: 1 });
  wLabel(g, 'added, not on the slides', { x: 1180, y: 766, size: 18, weight: 600, fill: COL.dim, o: 1 });
  show(g, t0, .5);
  return g;
}

/* ---------- the backed-up chain (lesson-local): no O₂, electrons pile up ---------- */
function backedUp(p, { x = 0, y = 0, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  path(g, 'M-60 30H420', { stroke: MC.cristae, 'stroke-width': 6 });
  const piles = [];
  ['I', 'II', 'III', 'IV'].forEach((nm, i) => {
    const bx = i * 120;
    path(g, `M${bx - 36} 6Q${bx - 36} -22 ${bx - 8} -22H${bx + 8}Q${bx + 36} -22 ${bx + 36} 6V30Q${bx + 36} 52 ${bx + 8} 52H${bx - 8}Q${bx - 36} 52 ${bx - 36} 30Z`, { fill: MC.complex, stroke: MC.complexEdge, 'stroke-width': 3 });
    wLabel(g, nm, { x: bx, y: 24, size: 24, weight: 800, fill: '#fff', o: 1 });
    piles.push([0, 1, 2].map(j => electron(g, { n: 2, r: 7, x: bx, y: -36 - j * 19, o: 0 })));
  });
  o2Molecule(g, { x: 520, y: 14, r: 17 });
  redX(g, 520, 14, 30);
  return Object.assign(g, {
    // k 0 empty … 1 three pairs on every complex, filling from the end (IV first) backwards
    set(k) {
      k = rk(k);
      piles.forEach((col, i) => col.forEach((e, j) => { const idx = j * 4 + (3 - i); mO(e, mRamp(k * 12 - idx, 0, 1)); }));
      return g;
    },
  }).set(0);
}

/* ---------- carriers ---------- */
['carriers', 'NADH and FADH₂ carry the energy', (m, D) => {

  // FADH₂'s own pair, waiting at II until Q takes both pairs

  const cIr = ec.pt('IV');

  // the legend for the redox flashes
  const lg = G(p, { o: 0 }); show(lg, tR + .4, .4);
  mk('circle', { cx: 470, cy: 158, r: 16, fill: 'none', stroke: MC.redu, 'stroke-width': 6 }, lg);

    // the NADH pair: into I, on to Q, III, cyt c, IV; then the whole run again with the redox flashes
    let u = -1;

    else if (t >= tN + 5.9) {
      u = stN.I;
      u = mLerp(u, stN.Q, io(mRamp(t, tQ + .4, tQ + 2.6)));
      u = mLerp(u, stN.III, io(mRamp(t, tQ + 7.4, tQ + 10.6)));

      u = mLerp(u, stN.c1, io(mRamp(t, tCy + 1.4, tCy + 3.4)));

    ec.electron(u, 'NADH', true).iron(mRamp(t, tCy + 4.7, tCy + 5.4));
    // FADH₂'s pair: in II from the hand-in until Q collects it
    const k = io(mRamp(t, tQ + .4, tQ + 2.6)), q = [pII[0] + (pQ[0] - pII[0]) * k, pII[1] + (pQ[1] - pII[1]) * k];

}],

        'FADH₂ does reach the chain and donates its electrons; it just joins lower down, at complex II.'])) },
  { id: 'p-o2', prompt: ['What is the final electron acceptor of the chain, and what does it form?'],
    build: withPic('o2', choice([['CO₂, forming glucose'], ['NAD⁺, forming NADH'], ['O₂, forming H₂O'], ['cytochrome c, forming Q']], 2,
      'Right. At the end of the chain oxygen takes the two electrons and two H⁺ and forms water.',
      ['Making glucose from CO₂ is photosynthesis. At the end of this chain the acceptor is oxygen.',
        'NAD⁺ picks up electrons earlier, from the fuel. The chain ends at oxygen.', null,
        'Cytochrome c and Q are carriers in the middle of the chain. The last acceptor is oxygen.'])) },
  { id: 'p-states', prompt: ['Is each one reduced or oxidized?'],
    build: withPic('states', grid([
      { parts: ['a carrier that has just accepted electrons'], ans: ['r'], why: 'Reduced: it has gained electrons.' },
      { parts: ['a carrier that has just passed its electrons on'], ans: ['o'], why: 'Oxidized: it has lost them again.' },
      { parts: ['NADH, loaded with electrons'], ans: ['r'], why: 'Reduced: NADH is the loaded form.' },
      { parts: ['NAD⁺, empty'], ans: ['o'], why: 'Oxidized: NAD⁺ is the empty form.' },
    ], [['r', 'reduced', null, 'R'], ['o', 'oxidized', null, 'O']], { multi: false, text: true })) },
  { id: 'p-steps', prompt: ['Why is the large energy drop from food to O₂ broken into many small steps?'],
    build: withPic('steps', choice([['so that the chain can make an ATP at every step'], ['so that electrons can move up in free energy'], ['so that energy is released in manageable amounts, not all at once'], ['so that no O₂ is needed']], 2,
      'Right. Like water turning a row of wheels, each small step releases a manageable amount of energy instead of one blast.',
      ['The chain makes no ATP itself; the ATP comes later, from the proton gradient (lesson seven).',
        'Electrons fall in free energy along the chain, step by step down to oxygen.', null,
        'O₂ is still needed: it is the final acceptor at the bottom of the steps.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
