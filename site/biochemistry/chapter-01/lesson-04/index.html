// a forked road to ketone bodies and to glucose (and both, for the mixed); the slide's table filled column by column:

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, weight: 700, ...o, o: 0 }); show(e, t0, .4); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const MIXC = mix(PC.gluco, PC.keto, .5);   // the mixed class: between glucose gold and ketone violet
const frac = v => v - Math.floor(v);
const box5 = (g, x, y, w, h, { fill = '#0b1626', stroke = COL.faint, sw = 3, rx = 22, fo = 1 } = {}) => mk('rect', { x, y, width: w, height: h, rx, fill, 'fill-opacity': fo, stroke, 'stroke-width': sw }, g);
// keyframes [[t, a, b, …], …]: eased (soft) between keys, held before the first and after the last
function keyAt(t, K) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const a = K[i - 1], b = K[i], f = soft((t - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => v + (b[j + 1] - v) * f); }
  return K[K.length - 1].slice(1);
}
// pose x, y, s and o of a wrapper group, rounded, written only when they change
function poseS(e, x, y, s, o) {
  const v = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, s: Math.round(s * 1000) / 1000, o: Math.round(o * 1000) / 1000 }, c = st(e);
  if (c.x !== v.x || c.y !== v.y || c.s !== v.s || c.o !== v.o) put(e, v);
  return e;
}
// one text whose words change at given times [[t, str], …]: it fades out before each change and back in after, so two
// words never share one spot; before the first time it is hidden
function stepText(p, steps, { x = 0, y = 0, size = 28, fill = COL.chalk, anchor = 'middle', weight = 700 } = {}) {
  const e = wChem(p, steps[0][1], { x, y, size, fill, anchor, weight, o: 0 });
  return Object.assign(e, {
    set(t) {
      let i = -1; for (let j = 0; j < steps.length; j++) if (t >= steps[j][0]) i = j;
      wChemSet(e, steps[Math.max(0, i)][1]);
      const nx = steps[i + 1] ? steps[i + 1][0] : null;
      mO(e, i < 0 ? 0 : mRamp(t, steps[i][0], steps[i][0] + .3) * (nx == null ? 1 : 1 - mRamp(t, nx - .3, nx)));
      return e;
    },
  });
}
// a polyline with its length table: .at(k)
function lineOf(pts) {
  const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[L.length - 1];
  return {
    at(k) {
      const want = mClamp(k) * tot; let i = 1; while (i < L.length - 1 && L[i] < want) i++;
      const f = (want - L[i - 1]) / ((L[i] - L[i - 1]) || 1), a = pts[i - 1], b = pts[i];
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
    },
  };
}
// a filled pill with dark text, origin at its centre
function tagPill(p, str, fill, { x = 0, y = 0, size = 28, o = 1, ink = '#0f1e33', split = false } = {}) {
  const g = G(p, { x, y, o }), w = Math.round(uiW(str, size) * 1.08 + 40), h = size + 22;
  if (split) {
    mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: PC.gluco }, g);
    path(g, `M0 ${-h / 2}H${w / 2 - h / 2}A${h / 2} ${h / 2} 0 0 1 ${w / 2 - h / 2} ${h / 2}H0Z`, { fill: PC.keto });
    mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: 'none', stroke: '#0f1e33', 'stroke-width': 2.5 }, g);
  } else mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill, stroke: '#0f1e33', 'stroke-width': 2.5 }, g);
  wLabel(g, str, { y: size * .36, size, fill: ink, weight: 800, o: 1 });
  return Object.assign(g, { w });
}
// a gold glucose hexagon crossed out (never glucose)
function noGlucose(p, { x = 0, y = 0, size = 44, o = 1 } = {}) {
  const g = G(p, { x, y, o });

  const r = size * .42;
  path(g, `M${-r} ${-r}L${r} ${r}M${r} ${-r}L${-r} ${r}`, { stroke: COL.bad, 'stroke-width': 5 });

}
// the carbon skeleton: four grey carbon beads in a zigzag, in two halves (for the split of the mixed ones)
function skeleton(p, { s = 1 } = {}) {
  const g = G(p, { x: 1, y: 1, s, o: 0 });
  const half = sg => {
    const h = G(g);
    path(h, `M${sg * 8} 6L${sg * 26} -8L${sg * 44} 6`, { stroke: PC.stick, 'stroke-width': 5, fill: 'none' });

    return h;
  };
  const L = half(-1), R = half(1);
  return Object.assign(g, { L, R });
}
// the amino acid card shrunk to a corner (the chapter thread), its Metabolic tab lit
function cornerCard(p, { x = 175, y = 800, s = .22, o = 1 } = {}) {

}

  const food = G(g);

  const egg = G(food, { x: -70, y: -6 });
  path(egg, 'M-92 0C-92 -60 -40 -84 8 -80C64 -76 96 -40 92 6C88 50 40 70 -6 66C-56 62 -92 40 -92 0Z', { fill: '#fffdf6', stroke: '#d8d2c0', 'stroke-width': 4 });

  BEANS.forEach(([bx, by, r], i) => {

    mk('ellipse', { cx: -8, cy: -6, rx: 8, ry: 4, fill: '#d98a7a', 'fill-opacity': .5 }, b);

}

/* ---------- the slide's table: three columns (ketogenic, mixed, glucogenic) ---------- */
const COLS = [
  { key: 'keto', x: 300, title: 'Ketogenic', sub: 'ketone bodies only', color: PC.keto, icon: 'ketone' },
  { key: 'both', x: 800, title: 'Mixed', sub: 'glucose and ketone bodies', color: MIXC, icon: 'fork' },
  { key: 'gluco', x: 1300, title: 'Glucogenic', sub: 'carbohydrate (glucose) only', color: PC.gluco, icon: 'glucose' },
];
const COL_TOP = 80, COL_BOT = 840, COL_W = 460;
function sortTable(p) {
  const cols = COLS.map(c => {
    const g = G(p);
    box5(g, c.x - COL_W / 2, COL_TOP, COL_W, COL_BOT - COL_TOP, { stroke: c.color, sw: 3, rx: 26, fo: .85 });
    path(g, `M${c.x - COL_W / 2 + 16} 210H${c.x + COL_W / 2 - 16}`, { stroke: c.color, 'stroke-width': 2, 'stroke-opacity': .5 });
    classIcon(g, c.icon, { x: c.x - 172, y: 145, size: c.icon === 'fork' ? 56 : 66 });
    wLabel(g, c.title, { x: c.x - 112, y: 142, size: 34, fill: c.color, weight: 800, anchor: 'start', o: 1 });
    wLabel(g, c.sub, { x: c.x - 112, y: 180, size: 19, fill: COL.dim, weight: 600, anchor: 'start', o: 1 });
    return Object.assign(g, { c });

}
// chip sliding into place: from 36 px to the right (never across the chip above), fading in over .35 s from t0
const dropAt = (chip, x, y, t, t0) => { const k = mRamp(t, t0, t0 + .35); mPose(chip, x + 36 * (1 - io(k)), y, k); };
// the ketogenic column's content. T: { ll, leu, lys, l1, l2, never, ess, cls1, cls2 } (times; negative = already there)
function ketoContent(g, T) {
  const L1 = wLabel(g, 'L', { x: 255, y: 360, size: 120, fill: PC.keto, weight: 800, o: 0 });
  const L2 = wLabel(g, 'L', { x: 345, y: 360, size: 120, fill: PC.keto, weight: 800, o: 0 });
  const leu = aaChip(g, 'leucine', { code: 'name', size: 28, o: 0 }), lys = aaChip(g, 'lysine', { code: 'name', size: 28, o: 0 });
  const ess = [480, 600].map(y => { const e = G(g, { o: 0 }); classIcon(e, 'star', { x: 344, y: y + 18, size: 26 }); wLabel(e, 'essential', { x: 362, y: y + 26, size: 20, fill: PC.essential, weight: 700, anchor: 'start', o: 1 }); return e; });
  const c1 = wLabel(g, 'branched-chain', { x: 330, y: 472, size: 20, fill: PC.branched, weight: 700, anchor: 'start', o: 0 });
  const c2 = wLabel(g, 'basic', { x: 330, y: 592, size: 20, fill: PC.basic, weight: 700, anchor: 'start', o: 0 });
  const nv = G(g, { o: 0 });
  wLabel(nv, 'ketone bodies only', { x: 300, y: 715, size: 24, fill: PC.keto, weight: 700, o: 1 });
  noGlucose(nv, { x: 200, y: 770, size: 46 });
  wLabel(nv, 'never glucose', { x: 236, y: 779, size: 24, fill: COL.bad, weight: 700, anchor: 'start', o: 1 });
  return {
    leu, lys, L1, L2,
    set(t) {
      mO(L1, mRamp(t, T.ll, T.ll + .4)); mO(L2, mRamp(t, T.ll + .2, T.ll + .6));
      dropAt(leu, 205, 480, t, T.leu); dropAt(lys, 205, 600, t, T.lys);
      const g1 = mBump(t, T.l1, T.l1 + 1.2), g2 = mBump(t, T.l2, T.l2 + 1.2);
      leu.glow(g1); lys.glow(g2);
      mO(nv, mRamp(t, T.never, T.never + .5));
      ess.forEach((e, i) => mO(e, mRamp(t, T.ess + .3 * i, T.ess + .3 * i + .4)));
      mO(c1, mRamp(t, T.cls1, T.cls1 + .4)); mO(c2, mRamp(t, T.cls2, T.cls2 + .4));
    },
  };
}
// the mixed column: FITTT letters, five chips, rings, the split. T: { fit, chips: [5 times], ring, split }
const FITTT = [['F', 'phenylalanine'], ['I', 'isoleucine'], ['T', 'tyrosine'], ['T', 'tryptophan'], ['T', 'threonine']];
function mixedContent(g, T) {
  const lit = FITTT.map((_, i) => { const e = G(g, { x: 800 + (i - 2) * 72, y: 296, o: 0 }); mk('rect', { x: -32, y: -38, width: 64, height: 76, rx: 14, fill: MIXC, 'fill-opacity': .25, stroke: MIXC, 'stroke-width': 3 }, e); return e; });
  const letters = FITTT.map(([c], i) => wLabel(g, c, { x: 800 + (i - 2) * 72, y: 330, size: 92, fill: COL.chalk, weight: 800, o: 0 }));
  const chips = FITTT.map(([, n]) => aaChip(g, n, { code: 'name', size: 26, o: 0 }));
  const rg = G(g, { o: 0 });
  ring(rg, 'benzene', { x: 950, y: 430, b: 16 }); ring(rg, 'benzene', { x: 950, y: 586, b: 16 }); ring(rg, 'indole', { x: 960, y: 664, b: 14 });

  wLabel(nt, 'part → ketone bodies', { x: 800, y: 826, size: 22, fill: PC.keto, weight: 700, o: 1 });
  return {
    chips, letters,
    set(t) {
      letters.forEach((e, i) => mO(e, mRamp(t, T.fit + .25 * i, T.fit + .25 * i + .4)));
      lit.forEach((e, i) => mO(e, mRamp(t, T.chips[i] - .1, T.chips[i] + .2) * (1 - mRamp(t, (T.chips[i + 1] ?? T.chips[4] + 2) - .2, (T.chips[i + 1] ?? T.chips[4] + 2) + .1))));
      chips.forEach((c, i) => { dropAt(c, 770, 430 + i * 78, t, T.chips[i] + .2); c.split(mRamp(t, T.split + .25 * i, T.split + .25 * i + .5)); });

  };
}
// the glucogenic column: "the remaining 13" and thirteen chips in the slide's order. T: { rest, names: [13 times] }
const GLUCO = ['alanine', 'arginine', 'asparagine', 'aspartic acid', 'glutamic acid', 'glutamine', 'glycine', 'cysteine', 'histidine', 'methionine', 'proline', 'serine', 'valine'];
const glucoAt = i => [i < 7 ? 1188 : 1410, 410 + (i < 7 ? i : i - 7) * 58];
function glucoContent(g, T) {

  const n13 = wLabel(g, '13', { x: 1300, y: 345, size: 96, fill: PC.gluco, weight: 800, o: 0 });

  };
}
const ALL_DONE = { ll: -9, leu: -9, lys: -9, l1: -9, l2: -9, never: -9, ess: -9, cls1: -9, cls2: -9, fit: -9, chips: [-9, -9, -9, -9, -9], ring: -9, split: -12, rest: -9, names: GLUCO.map(() => -9) };
// the thirteen names spoken from t0 to t1: start times by syllable count
function nameTimes(t0, t1) {
  const syl = [3, 3, 4, 4, 4, 3, 2, 3, 3, 4, 2, 2, 3], gap = .55, tot = syl.reduce((a, b) => a + b, 0) + gap * 12;
  let a = 0; return syl.map(n => { const v = t0 + (t1 - t0) * a / tot; a += n + gap; return v; });
}

  const IN = ['Ala', 'Gly', 'Ser'].map(n => aaChip(p, n, { size: 24, o: 0 }));
  const hex = Array.from({ length: 5 }, () => classIcon(p, 'glucose', { size: 40, o: 0 }));
  const lg = say(p, 'glucogenic skeletons → new glucose', 620, 330, tF + 6.6, { size: 26, fill: PC.gluco });
  void lg;
  // ketone bodies: flasks from the liver to brain and muscle; leucine and lysine feed them, never glucose
  const fl = Array.from({ length: 6 }, () => classIcon(p, 'ketone', { size: 40, o: 0 }));
  const KIN = ['Leu', 'Lys'].map(n => aaChip(p, n, { size: 24, o: 0 }));
  const kl = say(p, 'ketone bodies: fuel for brain and muscle', 1180, 826, tK + 4.2, { size: 26, fill: PC.keto });
  void kl;
  const ng = G(p, { o: 0 }); show(ng, tK + 8.4, .4);
  noGlucose(ng, { x: 300, y: 780, size: 44 });
  wLabel(ng, 'no glucose from these', { x: 334, y: 789, size: 24, fill: COL.bad, weight: 700, anchor: 'start', o: 1 });
  const lt = say(p, 'how these pathways work: a later course', 800, 880, tL + 1.8, { size: 22, fill: COL.dim, weight: 600 });
  lt.setAttribute('font-style', 'italic');
  const toBlood = lineOf([[LV[0] + 150, LV[1] - 40], [GX - 100, GY0 + GH - 30], [GX, GY0 + GH - 30]]);
  const toBrain = lineOf([[LV[0] + 80, LV[1] + 70], [BR[0] - 60, BR[1] - 30]]);
  const toMuscle = lineOf([[LV[0] + 140, LV[1] + 40], [1190, 560], [MU[0] - 60, MU[1] - 50]]);
  const chipIn = lineOf([[120, 520], [LV[0] - 120, 500]]);
  const kIn = lineOf([[160, 680], [LV[0] - 80, LV[1] + 60]]);
  clockRun(t => {
    const hrs = 12 * mRamp(t, tF, tF + 20) + .5 * mRamp(t, tF + 20, D);
    put(hh, { r: Math.round(hrs * 30 * 10) / 10 }); put(mh, { r: Math.round(hrs * 360 * 10) / 10 % 360 });
    // the level falls, then holds once new glucose arrives
    const L = .8 - .32 * io(mRamp(t, tF + .6, tF + 5.5)) + .08 * io(mRamp(t, tF + 8, tF + 10));
    const hpx = Math.round(L * (GH - 16));
    lev.setAttribute('y', GY0 + GH - 8 - hpx); lev.setAttribute('height', hpx);
    // streams: each item loops along its line with a period, phase-shifted; all from t
    const stream = (items, line, t0, per, t1 = 1e9) => items.forEach((e, i) => {
      const u = (t - t0) / per - i / items.length;
      if (u < 0 || t > t1 + per) { mO(e, 0); return; }
      const f = frac(u), [x, y] = line.at(f);
      mPose(e, x, y, Math.min(mRamp(f, 0, .1), 1 - mRamp(f, .85, 1)) * (t < t1 ? 1 : 1 - mRamp(t, t1, t1 + .5)));
    });
    stream(IN, chipIn, tF + 5.2, 3);
    stream(hex, toBlood, tF + 6.6, 2.6);
    stream(fl.slice(0, 3), toBrain, tK + 2.6, 2.6);
    stream(fl.slice(3), toMuscle, tK + 3.2, 2.6);
    stream(KIN, kIn, tK + 7.2, 2.8);
  }, D);
}],

/* ---------- recap ---------- */
['recap', 'The whole chapter on one card', (m, D) => {
  const p = panel(0), tC = m('card2'), tS = m('s'), tCh = m('c'), tN = m('n'), tM = m('m'), tA = m('all'), tY = m('tyr');
  const cw = G(p, { x: 800, y: 430, s: .95 });
  const card = aminoCard(cw, { x: 0, y: 0, aa: 'lysine' });
  const two = say(p, 'two NH_2, one COOH', 1338, 590, tCh + 1.4, { size: 24, fill: COL.dim, weight: 700 }); hide(two, tY, .4);
  const strip = stepText(p, [[tA + .4, 'lysine: aliphatic basic · basic · essential · ketogenic'], [tY + 1.6, 'tyrosine: aromatic · neutral · non-essential · mixed']], { x: 800, y: 862, size: 30, fill: COL.chalk });
  const tY1 = tY + .2, tSw = tY + .9;   // lysine fades out, tyrosine fades in
  const LYS = { structural: ['aliphatic|basic', PC.basic, tS + 1], chemical: ['basic|+ charge', PC.basic, tCh + 1], nutritional: ['essential|from the diet', PC.essential, tN + 1], metabolic: ['ketogenic', PC.keto, tM + 1.1] };
  const TYR = { structural: ['aromatic', PC.aromatic, tY + 1.8], chemical: ['neutral', PC.neutral, tY + 2.4], nutritional: ['non-essential|made in the body', PC.nonEssential, tY + 3.1], metabolic: ['mixed (FITTT)', MIXC, tY + 4.3] };
  const ORDER = ['structural', 'chemical', 'nutritional', 'metabolic'], LIT = [[tS, 'structural'], [tCh, 'chemical'], [tN, 'nutritional'], [tM, 'metabolic']];
  clockRun(t => {
    card.build(mRamp(t, tC + .1, tC + 3.2));
    const lys = t < tSw;
    card.setAcid(lys ? 'lysine' : 'tyrosine');
    mO(card.aa, 1 - mRamp(t, tY1, tSw) + mRamp(t, tSw, tSw + .5));
    ORDER.forEach(n => {
      const [txt, col, t0] = lys ? LYS[n] : TYR[n];
      const k = lys ? mRamp(t, t0, t0 + .8) * (1 - mRamp(t, tY1, tSw)) : mRamp(t, t0, t0 + .7);
      card.fill(n, k, txt, col);
    });
    // one tab lit at a time while it is filled, then all four glow together; the tyrosine pass lights all
    let lit = null; for (const [t0, n] of LIT) if (t >= t0) lit = n;
    const allK = mRamp(t, tA, tA + .6);
    card.focus(t < tS || allK >= 1 ? null : lit, mRamp(t, tS, tS + .5) * (1 - allK));
    const breathe = t0 => .6 + .4 * (1 - Math.cos(2 * Math.PI * (t - t0) / 2)) / 2;
    const WORD = { structural: tA + 2, chemical: tA + 3, nutritional: tA + 3.7, metabolic: tA + 4.6 };   // "aliphatic basic, basic, essential, ketogenic"
    ORDER.forEach(n => {
      const t0 = LIT.find(q => q[1] === n)[0];
      card.glow(n, allK > 0 ? allK * (1 - mRamp(t, tY, tY + .5)) * (.55 + .45 * mBump(t, WORD[n] - .2, WORD[n] + 1.2)) : (lit === n ? mRamp(t, t0, t0 + .5) * breathe(t0) : 0));
    });
    card.aa.hi('amino', mBump(t, tCh + .8, tCh + 6));
    strip.set(t);
  }, D);
}],

/* ---------- wrap ---------- */
['wrap', 'Summary', (m, D) => {
  const p = panel(0), tW = m('wrap'), tN = m('next');
  wLabel(p, 'Four ways to classify the same twenty', { x: 800, y: 62, size: 34, weight: 700, o: 1 });
  [['Structural', 'the side chain', '#bba8ee', 1.6], ['Chemical', 'the charge', '#ff7aa8', 2.8], ['Nutritional', 'the diet', '#ffd27a', 3.8], ['Metabolic', 'the fate of the skeleton', '#8fd6b0', 4.8]].forEach(([a, b, col, dt], i) => {
    const g = G(p, { o: 0 }), x = 230 + i * 380; show(g, tW + dt, .4);
    mk('rect', { x: x - 170, y: 100, width: 340, height: 104, rx: 20, fill: '#172a45', stroke: col, 'stroke-width': 4 }, g);
    wLabel(g, a, { x, y: 145, size: 30, fill: col, weight: 800, o: 1 });
    wLabel(g, 'by ' + b, { x, y: 182, size: 22, fill: COL.dim, weight: 600, o: 1 });
  });
  say(p, 'the three metabolic lists', 800, 280, tW + 9.4, { size: 30, fill: COL.chalk });
  const lists = [
    [PC.keto, 'ketone', 'LL', 'ketogenic', ['leucine, lysine'], 11.6],
    [MIXC, 'fork', 'FITTT', 'mixed', ['phenylalanine, isoleucine,', 'tyrosine, tryptophan,', 'threonine'], 13.4],
    [PC.gluco, 'glucose', '13', 'glucogenic', ['all the others'], 15.3],
  ];
  lists.forEach(([col, ic, big, name, lines, dt], i) => {
    const g = G(p, { o: 0 }), x = 300 + i * 500; show(g, tW + dt, .45);
    box5(g, x - 220, 320, 440, 380, { stroke: col, rx: 26 });
    classIcon(g, ic, { x: x - 150, y: 384, size: ic === 'fork' ? 56 : 66 });
    wLabel(g, name, { x: x - 96, y: 396, size: 32, fill: col, weight: 800, anchor: 'start', o: 1 });
    wLabel(g, big, { x, y: 535, size: 96, fill: col, weight: 800, o: 1 });
    lines.forEach((s, j) => wLabel(g, s, { x, y: 600 + j * 32, size: 24, fill: COL.chalk, weight: 600, o: 1 }));
  });
  // next: a chain of amino acids slides in
  const nx = G(p, { x: 1900, y: 820, o: 0 }); tw(nx, { x: 1180, o: 1 }, tN, 1.4, out);
  beadChain(nx, { n: 7, sp: 52, r: 20, s: .9 });
  const nt = say(p, 'Chapter 2: proteins, chains of amino acids', 760, 830, tN + 1, { size: 28, fill: COL.chalk, anchor: 'end' });
  void nt;
}],

/* ---------- final1 ---------- */
['final1', 'Chapter practice', () => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  const frame = g => box5(g, 980, 90, 580, 720);
  const cap = (g, s, y = 770) => wLabel(g, s, { x: 1270, y, size: 26, weight: 700, o: 1 });
  at('keto', g => {
    frame(g);
    classIcon(g, 'ketone', { x: 1270, y: 300, size: 160 });
    wLabel(g, 'ketone bodies only', { x: 1270, y: 450, size: 30, fill: PC.keto, weight: 800, o: 1 });
    aaChip(g, '?', { x: 1180, y: 560, color: PC.keto, size: 34, w: 120 }); aaChip(g, '?', { x: 1360, y: 560, color: PC.keto, size: 34, w: 120 });
    cap(g, 'which pair goes only this way?');
  });
  at('phe', g => {
    frame(g);
    FITTT.forEach(([c], i) => wLabel(g, c, { x: 1270 + (i - 2) * 60, y: 230, size: 72, fill: i === 0 ? PC.task : COL.dim, weight: 800, o: 1 }));
    aaChip(g, 'phenylalanine', { x: 1270, y: 340, code: 'name', size: 32 });
    mArrow(g, [1270, 380], [1270, 470], { color: COL.chalk, w: 5 });
    classIcon(g, 'ketone', { x: 1130, y: 560, size: 90 }); classIcon(g, 'glucose', { x: 1410, y: 560, size: 90 });
    wLabel(g, 'ketone bodies', { x: 1130, y: 640, size: 22, fill: PC.keto, weight: 700, o: 1 });
    wLabel(g, 'glucose', { x: 1410, y: 640, size: 22, fill: PC.gluco, weight: 700, o: 1 });
    wLabel(g, '?', { x: 1270, y: 590, size: 80, fill: PC.task, weight: 800, o: 1 });
    cap(g, 'where does its skeleton go?');
  });
  at('sort', g => {
    frame(g);
    [['ketone', PC.keto, 'ketogenic'], ['fork', MIXC, 'mixed'], ['glucose', PC.gluco, 'glucogenic']].forEach(([ic, col, n], i) => {
      const x = 1110 + i * 160;
      classIcon(g, ic, { x, y: 200, size: ic === 'fork' ? 60 : 72 });
      wLabel(g, n, { x, y: 270, size: 24, fill: col, weight: 800, o: 1 });
    });
    ['alanine', 'leucine', 'tryptophan'].forEach((n, i) => aaChip(g, n, { x: 1270, y: 420 + i * 90, code: 'name', size: 32, color: PC.neutral }));   // neutral: no class colour to hint
    cap(g, 'sort each one');
  });
  at('count', g => {
    frame(g);
    [['ketone', PC.keto, '2'], ['fork', MIXC, '5'], ['glucose', PC.gluco, '?']].forEach(([ic, col, n], i) => {
      const x = 1110 + i * 160;
      box5(g, x - 66, 150, 132, 420, { stroke: col, rx: 18 });
      classIcon(g, ic, { x, y: 210, size: ic === 'fork' ? 50 : 60 });
      wLabel(g, n, { x, y: 420, size: 84, fill: n === '?' ? PC.task : col, weight: 800, o: 1 });
    });
    cap(g, '20 standard amino acids in all', 660);
  });
  at('fittt', g => {
    frame(g);
    FITTT.forEach(([c], i) => {
      wLabel(g, c, { x: 1270 + (i - 2) * 92, y: 380, size: 110, fill: MIXC, weight: 800, o: 1 });
      aaChip(g, '?', { x: 1270 + (i - 2) * 92, y: 470, color: MIXC, size: 26, w: 70 });
    });
    classIcon(g, 'fork', { x: 1270, y: 210, size: 80 });
    cap(g, 'the mixed five: which is NOT here?');
  });
  const ROWS6 = [['Structural', 'aliphatic basic', '#bba8ee'], ['Chemical', 'basic (+)', '#ff7aa8'], ['Nutritional', 'essential', '#ffd27a'], ['Metabolic', 'glucogenic', '#8fd6b0']];
  const rows6 = [];
  at('card', g => {
    frame(g);
    aaChip(g, 'lysine', { x: 1270, y: 170, code: 'name', size: 36 });
    ROWS6.forEach(([a, b, col], i) => {
      const r = G(g, { x: 1270, y: 290 + i * 120 });
      mk('rect', { x: -250, y: -46, width: 500, height: 92, rx: 18, fill: '#172a45', stroke: col, 'stroke-width': 4 }, r);
      wLabel(r, a, { x: -226, y: 10, size: 30, fill: col, weight: 800, anchor: 'start', o: 1 });
      wLabel(r, b, { x: 226, y: 10, size: 30, fill: COL.chalk, weight: 700, anchor: 'end', o: 1 });
      rows6.push(r);
    });
    cap(g, 'one tab is wrong: click it', 790);
  });
  at('arom', g => {
    frame(g);
    [['ring', 'aromatic (benzene ring)', PC.aromatic], ['star', 'essential', PC.essential], ['fork', 'glucose and ketone bodies', MIXC]].forEach(([ic, s, col], i) => {
      const y = 210 + i * 130;
      classIcon(g, ic, { x: 1070, y, size: ic === 'fork' ? 60 : 66 });
      wLabel(g, s, { x: 1130, y: y + 10, size: 28, fill: col, weight: 800, anchor: 'start', o: 1 });
    });
    aaChip(g, '?', { x: 1270, y: 620, color: PC.aromatic, size: 40, w: 160 });
    cap(g, 'which amino acid is all three?');
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.rows6 = rows6;
  S.pics('keto');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-keto', prompt: ['Which pair is purely ketogenic?'],
    build: withPic('keto', choice([['phenylalanine and isoleucine'], ['alanine and glycine'], ['leucine and lysine'], ['serine and threonine']], 2,
      'Right. LL: leucine and lysine give ketone bodies only.',
      ['Phenylalanine and isoleucine are the F and the I of FITTT: mixed, they give glucose too.',
        'Alanine and glycine are glucogenic: their skeletons become glucose.', null,
        'Serine is glucogenic and threonine is mixed (a T in FITTT). Neither is ketogenic only.'])) },
  { id: 'p-phe', prompt: ['Phenylalanine is the F in FITTT. What does its skeleton give?'],
    build: withPic('phe', choice([['glucose only'], ['ketone bodies only'], ['both glucose and ketone bodies'], ['neither']], 2,
      'Right. FITTT is the mixed group: part of the skeleton goes to glucose and part to ketone bodies.',
      ['Glucose only is the long list of thirteen. FITTT gives ketone bodies as well.',
        'Ketone bodies only is just leucine and lysine (LL).', null,
        'Every one of the twenty goes somewhere: ketogenic, mixed or glucogenic.'])) },
  { id: 'p-sort', prompt: ['Sort each amino acid by its metabolic fate.'],
    build: withPic('sort', grid([
      { parts: ['alanine'], ans: ['g'], why: 'Glucogenic: not LL, not FITTT.' },
      { parts: ['leucine'], ans: ['k'], why: 'Ketogenic: an L in LL.' },
      { parts: ['tryptophan'], ans: ['m'], why: 'Mixed: a T in FITTT.' },
    ], [['g', 'glucogenic', PC.gluco, 'G'], ['k', 'ketogenic', PC.keto, 'K'], ['m', 'mixed', MIXC, 'M']], { multi: false, text: true })) },
  { id: 'p-count', prompt: ['Two are ketogenic and five are mixed. How many are purely glucogenic?'],
    build: withPic('count', choice([['12'], ['13'], ['15'], ['18']], 1,
      'Right. 20 − 2 − 5 = 13.',
      ['Count again: 20 − 2 − 5 leaves one more than that.', null,
        '15 would leave out only the five mixed ones. Take away the two ketogenic ones as well.',
        '18 is how many can make glucose (13 + 5), not how many are purely glucogenic.'])) },
  { id: 'p-fittt', prompt: ['Which of these is NOT one of the mixed five (fit, with three T’s)?'],
    build: withPic('fittt', choice([['threonine'], ['lysine'], ['isoleucine'], ['tyrosine']], 1,
      'Right. Lysine is an L of LL: purely ketogenic, not mixed.',
      ['Threonine is the last T of FITTT: mixed.', null, 'Isoleucine is the I of FITTT: mixed.', 'Tyrosine is the first T of FITTT: mixed.'])) },
  { id: 'p-card', prompt: ['This card files lysine under all four classifications, but one tab is wrong. Click it.'],
    build: withPic('card', (body, api) => pickEls(S.rows6.map((el, i) => ({ el, box: [1015, 240 + i * 120, 510, 100], label: ['Structural', 'Chemical', 'Nutritional', 'Metabolic'][i] })), 3,
      'Right. Lysine is ketogenic (an L in LL), not glucogenic. The other three tabs are right.',
      i => ['Structural is right: lysine’s side chain ends in an amino group, so it is aliphatic basic.',
        'Chemical is right: two amino groups and one carboxyl group make lysine basic.',
        'Nutritional is right: lysine is essential and must come from the diet.'][i])(body, api)) },
  { id: 'p-arom', prompt: ['Which amino acid is aromatic, essential, and gives both glucose and ketone bodies?'],
    build: withPic('arom', choice([['tyrosine'], ['tryptophan'], ['phenylalanine'], ['leucine']], 2,
      'Right. Phenylalanine: a benzene ring, essential, and the F in FITTT.',
      ['Tyrosine is aromatic and mixed, but non-essential: the body makes it.',
        'Tryptophan is essential and mixed, but its indole ring makes it heterocyclic, not aromatic in the lecture’s grouping.', null,
        'Leucine is essential, but it is branched-chain (no ring) and purely ketogenic.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
