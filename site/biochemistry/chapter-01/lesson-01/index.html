<script>
'use strict';
// Biochemistry, Chapter 1 (Amino Acids), lesson 1: a dinner plate (egg, milk, beans) whose egg resolves into a bead
// chain, the protein; bricks and a tower (building blocks); hydrolysis by acid, alkali and enzyme frees the units; a shelf
// of 20 chips plus selenocysteine (21); the general structure built on the α-carbon (amino group, carboxyl group, H, R);
// glycine, alanine and serine as twins under the R; the charged form (NH₃⁺, COO⁻) as an aside; the chapter's amino acid
// card with its four classification tabs (the thread lessons two to four open on); a summary; practice.
// Plan, errata and beats: books/biochemistry/chapters/chapter-01/lesson-01.md.
const CHAPTER = { number: 101, label: '1, lesson 1', title: 'What Amino Acids Are: the General Structure', minutes: 7, language: 'en', lead: false, next: '../lesson-02/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, weight: 700, ...o, o: 0 }); show(e, t0, .4); return e; };
const HI = '#ffd27a';   // the accent (highlights, counters)
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const box5 = (g, x, y, w, h, { fill = '#0b1626', stroke = COL.faint, sw = 3, rx = 22, fo = 1 } = {}) => mk('rect', { x, y, width: w, height: h, rx, fill, 'fill-opacity': fo, stroke, 'stroke-width': sw }, g);
// keyframes [[t, a, b, …], …]: eased (soft) between keys, held before the first and after the last
function keyAt(t, K) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const a = K[i - 1], b = K[i], f = soft((t - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => v + (b[j + 1] - v) * f); }
  return K[K.length - 1].slice(1);
}
// one text whose words change at given times [[t, str], …]: it fades out before each change and back in after, so two
// texts never share one spot; before the first time it is hidden
function stepText(p, steps, { x = 0, y = 0, size = 28, fill = COL.chalk, anchor = 'middle', weight = 700 } = {}) {
  const e = wChem(p, steps[0][1], { x, y, size, fill, anchor, weight, o: 0 });
  return Object.assign(e, {
    set(t) {
      let i = -1; for (let j = 0; j < steps.length; j++) if (t >= steps[j][0]) i = j;
      wChemSet(e, steps[Math.max(0, i)][1]);
      const nx = steps[i + 1] ? steps[i + 1][0] : null;
      mO(e, i < 0 ? 0 : mRamp(t, steps[i][0], steps[i][0] + .3) * (nx == null ? 1 : 1 - mRamp(t, nx - .3, nx)));
      return e;
    },
  });
}
// a small round tag with a number (the "three named parts")
function numTag(p, n, x, y, color = HI) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r: 22, fill: color, stroke: '#0f1e33', 'stroke-width': 3 }, g);
  wLabel(g, String(n), { y: 9, size: 26, fill: '#0f1e33', weight: 900, o: 1 });
  return g;
}
// a rounded pill with a word (acid, alkali tags)
function tagPill(p, str, color, { size = 26 } = {}) {
  const g = G(p, { x: 1, y: 1, o: 0 }), w = Math.round(uiW(str, size) * 1.08 + 34), h = size + 18;
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: '#0b1626', stroke: color, 'stroke-width': 3 }, g);
  wLabel(g, str, { y: size * .36, size, fill: color, weight: 800, o: 1 });
  return g;
}
// a straight leader from a to b with a dot at b
function leader(p, [ax, ay], [bx, by], color = COL.dim) {
  const g = G(p);
  path(g, `M${ax} ${ay}L${bx} ${by}`, { stroke: color, 'stroke-width': 2.5 });
  mk('circle', { cx: bx, cy: by, r: 4.5, fill: color }, g);
  return g;
}
// a bracket ⎵ from x1 to x2 at y (ticks point up)
const bracket = (p, x1, x2, y, color = COL.dim) => path(p, `M${x1} ${y - 14}V${y}H${x2}V${y - 14}`, { stroke: color, 'stroke-width': 3, fill: 'none' });

/* ---------- foods and bricks ---------- */
function friedEgg(p, { x = 0, y = 0, s = 1 } = {}) {
  const g = G(p, { x, y, s });
  path(g, 'M-122 4C-126 -36 -52 -54 0 -46C62 -58 128 -34 120 4C114 42 44 52 -8 46C-70 54 -118 38 -122 4Z', { fill: '#fbfaf4', stroke: '#d8d4c4', 'stroke-width': 3 });
  mk('ellipse', { cx: 10, cy: -4, rx: 42, ry: 26, fill: '#f7c531', stroke: '#d9a21a', 'stroke-width': 3 }, g);
  mk('ellipse', { cx: -4, cy: -13, rx: 13, ry: 7, fill: '#fff', 'fill-opacity': .55 }, g);
  return g;
}
function milkGlass(p, { x = 0, y = 0, s = 1 } = {}) {
  const g = G(p, { x, y, s });
  path(g, 'M-54 -96L54 -96L46 132Q44 142 34 142L-34 142Q-44 142 -46 132Z', { fill: '#f6f4ec' });
  mk('ellipse', { cx: 0, cy: -96, rx: 54, ry: 10, fill: '#ffffff', stroke: '#e2dfd2', 'stroke-width': 2 }, g);
  path(g, 'M-62 -150L62 -150L52 140Q50 150 38 150L-38 150Q-50 150 -52 140Z', { fill: '#cfe8f5', 'fill-opacity': .14, stroke: '#cfe8f5', 'stroke-width': 4 });
  path(g, 'M-44 -130L-36 120', { stroke: '#ffffff', 'stroke-width': 6, 'stroke-opacity': .35 });
  return g;
}
function beanPile(p, { x = 0, y = 0, s = 1 } = {}) {
  const g = G(p, { x, y, s });
  [[-44, 8, 20], [-14, 12, -15], [16, 10, 30], [44, 6, -10], [-30, -8, -30], [0, -6, 12], [30, -10, -25], [-12, -22, 35], [16, -24, -5]].forEach(([bx, by, r], i) =>
    mk('ellipse', { cx: bx, cy: by, rx: 17, ry: 10, fill: i % 2 ? '#8a3f25' : '#a4532f', stroke: '#5e2a17', 'stroke-width': 2, transform: `rotate(${r} ${bx} ${by})` }, g));
  return g;
}
// the three foods side by side, small (bricks' scatter and the practice)
function foodRow(p, x, y, s = .4, gap = 150) {
  const g = G(p, { x, y });
  friedEgg(g, { x: -gap, s });
  milkGlass(g, { x: 0, y: -8, s: s * .75 });
  beanPile(g, { x: gap, s: s * 1.6 });
  return g;
}
// a toy brick with two studs, origin = its centre
function brick(p, color, { w = 170, h = 60 } = {}) {
  const g = G(p, { x: 1, y: 1 });
  const edge = mix(color, '#000000', .45);
  [-w / 4, w / 4].forEach(sx => mk('rect', { x: sx - 18, y: -h / 2 - 13, width: 36, height: 16, rx: 5, fill: color, stroke: edge, 'stroke-width': 2.5 }, g));
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 8, fill: color, stroke: edge, 'stroke-width': 3 }, g);
  mk('rect', { x: -w / 2 + 8, y: -h / 2 + 6, width: w - 16, height: 8, rx: 4, fill: '#fff', 'fill-opacity': .3 }, g);
  return g;
}
const CH_COLS = [PC.simple, PC.basic, PC.hydroxy, PC.acidic, PC.aromatic, PC.branched, PC.hetero];
// a free amino acid bead (the same look as the kit's chain beads), origin = its centre
function freeBead(p, color, r = 34) {
  const g = G(p, { x: 1, y: 1, o: 0 });
  mk('circle', { r, fill: color, stroke: PC.ink, 'stroke-width': 2.5 }, g);
  mk('ellipse', { cx: -r * .35, cy: -r * .4, rx: r * .3, ry: r * .18, fill: '#fff', 'fill-opacity': .4 }, g);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'A plate of protein', (m, D) => {
  const p = panel(0), tP = m('plate'), tZ = m('zoom'), tU = m('units');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const back = G(W, { o: 0 }); show(back, .1, .6);
  mk('rect', { x: -200, y: 700, width: 2000, height: 400, fill: '#4a3426' }, back);
  mk('rect', { x: -200, y: 700, width: 2000, height: 16, fill: '#6b4a35' }, back);
  mk('ellipse', { cx: 470, cy: 650, rx: 300, ry: 90, fill: '#eeece4', stroke: '#bdb8aa', 'stroke-width': 4 }, back);
  mk('ellipse', { cx: 470, cy: 650, rx: 220, ry: 60, fill: 'none', stroke: '#d6d2c6', 'stroke-width': 3 }, back);
  const eggG = G(back), milkG = G(back), beanG = G(back);
  friedEgg(eggG, { x: 380, y: 640 });
  milkGlass(milkG, { x: 870, y: 560 });
  beanPile(beanG, { x: 610, y: 646 });
  const names = [['egg', 380, 548], ['beans', 610, 548], ['milk', 870, 385]].map(([s, x, y], i) => say(back, s, x, y - 18, tP + .5 + .9 * i, { size: 28, fill: COL.chalk }));
  names.forEach(e => hide(e, tZ - .2, .3));
  const prot = say(back, 'all full of protein', 620, 300, tZ + .2, { size: 34, fill: HI });
  hide(prot, tZ + 1.3, .3);
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOCHEMISTRY · CHAPTER 1 · LESSON 1', { x: 1270, y: 210, size: 24, fill: COL.dim, o: 1 });
  ['What amino', 'acids are'].forEach((s, i) => wLabel(ttl, s, { x: 1270, y: 300 + i * 66, size: 56, o: 1 }));
  wLabel(ttl, 'the one shape they all share', { x: 1270, y: 470, size: 28, fill: COL.dim, weight: 500, o: 1 });
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tZ - .4, .5);
  // the push into the yolk, then the chain
  cam.to({ x: 390, y: 636, z: 7 }, tZ + 1.2, 2.4);
  hide(cam.el, tZ + 3, .6);
  const chG = G(p, { o: 0 }); show(chG, tZ + 2.9, .7);
  const ch = beadChain(chG, { x: 800, y: 470, n: 12, sp: 96, r: 32, chips: false, ends: false, endText: false, seed: 4 });
  const pl = say(chG, 'protein: a long chain of small, repeating pieces', 800, 600, tZ + 4.6, { size: 30, fill: COL.chalk });
  const aaL = say(chG, 'one amino acid', 752 + 50, 362, tU + .9, { size: 30, fill: HI, anchor: 'start' });
  const today = G(p, { o: 0 }); show(today, tU + 2.7, .5);
  wLabel(today, 'today: what they are · their general structure · the chapter’s map', { x: 800, y: 790, size: 28, fill: COL.dim, weight: 600, o: 1 });
  void pl; void aaL;
  clockRun(t => {
    // the foods lift and settle in turn as the plate is named
    [eggG, beanG, milkG].forEach((e, i) => mPose(e, 0, -18 * mBump(t, tP + .5 + .9 * i, tP + 1.5 + .9 * i), 1));
    ch.tangle(1 - io(mRamp(t, tZ + 3.6, tZ + 6.6)));
    ch.lift(5, mRamp(t, tU + .2, tU + 1.1)).glow(5, mRamp(t, tU + .2, tU + .8));
    ch.glow('all', mBump(t, tZ + 7, tZ + 8.4) * .8);
  }, D);
}],

/* ---------- bricks ---------- */
['bricks', 'Building blocks and hydrolysis', (m, D) => {
  const p = panel(0), tC = m('chain'), tA = m('acid'), tK = m('alkali'), tE = m('enzyme'), tF = m('free');
  const head = stepText(p, [[.3, 'an amino acid: a structural unit of protein'], [tA + 1.5, 'hydrolysis: breaking bonds with water']], { x: 800, y: 90, size: 36 });
  // the gut tube behind the enzyme's cut
  const gut = G(p, { o: 0 }); show(gut, tE + .3, .6); hide(gut, tF + 1, .6);
  mk('rect', { x: 60, y: 290, width: 1480, height: 300, rx: 150, fill: '#e48aa0', 'fill-opacity': .08, stroke: '#e48aa0', 'stroke-width': 5, 'stroke-opacity': .5 }, gut);
  wLabel(gut, 'the gut, after a meal', { x: 120, y: 630, size: 24, fill: '#e48aa0', weight: 700, anchor: 'start', o: 1 });
  // the tower: seven bricks; at "chain" they fly into a row and become the chain's beads
  const X0 = 600, Y0 = 430, SP = 130, R = 34;
  const bx = i => X0 + (i - 3) * SP;
  const towerY = i => 700 - i * 68;
  const bricks = CH_COLS.map(c => brick(p, c));
  const tl = G(p, { o: 0 }); show(tl, 1, .5); hide(tl, tC - .4, .4);
  wLabel(tl, 'protein = the tower', { x: 520, y: 236, size: 30, fill: COL.chalk, weight: 700, o: 1 });
  const bt = G(p, { o: 0 }); show(bt, 6.6, .5); hide(bt, tC - .4, .4);
  leader(bt, [760, 498], [612, 498]);
  wLabel(bt, 'amino acid = one brick', { x: 774, y: 507, size: 30, fill: HI, weight: 700, anchor: 'start', o: 1 });
  wLabel(bt, 'a building block', { x: 774, y: 545, size: 24, fill: COL.dim, weight: 600, anchor: 'start', o: 1 });
  const ch = beadChain(p, { x: X0, y: Y0, n: 7, colors: CH_COLS, sp: SP, r: R, chips: false, ends: false, endText: false, o: 0 });
  const chL = say(p, 'the protein: a chain of amino acids', 800, 560, tC + .9, { size: 28, fill: COL.chalk });
  hide(chL, tA + 1.2, .4);
  // the three cuts: acid (link 1), alkali (link 3), enzyme (link 5)
  const CUTS = [[1, tA + 5.4, 'acid', PC.acid], [3, tK + .2, 'alkali', PC.basic], [5, tE + 1.4, 'enzyme', '#8fd17a']];
  const tags = CUTS.map(([, , s, c]) => tagPill(p, s, c));
  const enz = G(p, { x: 1, y: 1, o: 0 }); enzymeBlob(enz, { R: 52 });
  const wtr = G(p, { o: 0 }); show(wtr, tA + 1.9, .4); hide(wtr, tA + 4.6, .4);
  waterMolecule(wtr, { x: 1210, y: 150, s: .6 });
  // free: the pieces drift apart into a small cloud; the three foods all end up as the same set
  const endX = i => bx(i) + 1.2 * SP * [1, 3, 5].filter(j => j < i).length;
  const CLOUD = [[560, 470], [700, 400], [840, 470], [980, 410], [1110, 480], [770, 540], [930, 560]];
  const free = CH_COLS.map(c => freeBead(p, c, R));
  const fl = say(p, 'free amino acids', 840, 660, tF + 1.4, { size: 30, fill: HI });
  void fl;
  const fr = G(p, { o: 0 }); show(fr, tF + 4, .6);
  foodRow(fr, 840, 170, .42, 220);
  [-220, 0, 220].forEach(dx => mArrow(fr, [840 + dx * .9, 220], [840 + dx * .3, 330], { color: COL.dim, w: 4, head: 14 }));
  wLabel(fr, 'egg, milk, beans: the same small set', { x: 840, y: 720, size: 26, fill: COL.dim, weight: 600, o: 1 });
  clockRun(t => {
    bricks.forEach((b, i) => {
      const k = io(mRamp(t, tC + .1 + .08 * i, tC + 1.3 + .08 * i));
      mPose(b, mLerp(520, bx(i), k), mLerp(towerY(i), Y0, k), mRamp(t, .1 + .12 * i, .4 + .12 * i) * (1 - mRamp(t, tC + 1.3, tC + 1.7)));
      cSet(b, { s: mLerp(1, .45, k) });
    });
    mO(ch, mRamp(t, tC + 1.2, tC + 1.7) * (1 - mRamp(t, tF, tF + .3)));
    CUTS.forEach(([i, t0], j) => {
      ch.cut(i, mRamp(t, t0, t0 + 2.1));
      const tag = tags[j], [lx, ly] = ch.linkPt(i);
      mPose(tag, lx, ly - (j === 2 ? 200 : 92), mRamp(t, t0 - .6, t0 - .2) * (1 - mRamp(t, tF, tF + .4)));
    });
    // the enzyme comes down onto link 5, cuts, and leaves
    const [ex, ey] = ch.linkPt(5);
    const [, dy, eo] = keyAt(t, [[tE + .2, 0, -190, 0], [tE + .5, 0, -190, 1], [tE + 1.3, 0, -96, 1], [tE + 3.6, 0, -96, 1], [tE + 4.2, 0, -160, 0]]);
    mPose(enz, ex, ey + dy, eo);
    // free beads take over from the chain where it left off
    free.forEach((b, i) => {
      const [x, y] = keyAt(t, [[tF + .1, endX(i), Y0], [tF + 2.6, ...CLOUD[i]]]);
      const bob = 6 * Math.sin(2 * Math.PI * (t / 2.4 + i / 7)) * mRamp(t, tF + 2.6, tF + 3.4);
      mPose(b, x, y + bob, mRamp(t, tF, tF + .3));
    });
    head.set(t);
  }, D);
}],

/* ---------- count ---------- */
['count', 'Twenty, and twenty-one', (m, D) => {
  const p = panel(0), tS = m('sel'), tH = m('shelf');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const CX = i => 200 + (i % 10) * 124, CY = i => 380 + Math.floor(i / 10) * 100;
  const chips = P_STANDARD.map((nm, i) => { const g = G(W, { x: CX(i), y: CY(i), o: 0 }); aaChip(g, nm, { size: 26 }); return g; });
  const secG = G(W, { x: 1440, y: 480, o: 0 }); const sec = aaChip(secG, 'selenocysteine', { size: 26 }); sec.edge('#ffd27a');
  const secL = say(W, 'selenocysteine', 1440, 548, tS + 1, { size: 24, fill: '#ffd27a' });
  void secL;
  const num = wLabel(W, '0', { x: 1440, y: 236, size: 96, fill: HI, weight: 800, o: 0 }); show(num, .2, .4);
  wLabel(W, 'amino acids', { x: 1440, y: 274, size: 24, fill: COL.dim, weight: 600, o: 1 });
  const br = G(W, { o: 0 }); show(br, tH + .3, .5);
  path(br, 'M140 318V302H1376V318', { stroke: COL.dim, 'stroke-width': 3, fill: 'none' });
  wLabel(br, 'twenty to remember · one plan', { x: 758, y: 282, size: 28, fill: COL.chalk, weight: 700, o: 1 });
  const tiny = say(W, 'tiny', 128, 389, tH + 2.3, { size: 24, fill: HI, anchor: 'end' });
  const rings = say(W, 'rings', 1068, 548, tH + 3.4, { size: 24, fill: HI });
  hide(tiny, tH + 5.4, .3); hide(rings, tH + 5.4, .3);
  const glow = (i, t0) => { const h = mk('rect', { x: CX(i) - 46, y: CY(i) - 30, width: 92, height: 60, rx: 30, fill: 'none', stroke: HI, 'stroke-width': 4 }, W); put(h, { o: 0 }); show(h, t0, .3); hide(h, tH + 5.4, .3); };
  glow(0, tH + 2.1); [15, 16, 17, 18].forEach(i => glow(i, tH + 3.2));
  clockRun(t => {
    let n = 0;
    chips.forEach((g, i) => { const t0 = .3 + .2 * i, k = mRamp(t, t0, t0 + .25); if (t >= t0 + .12) n++; cSet(g, { o: k, s: .6 + .4 * out(k) }); });
    const [sy, so] = keyAt(t, [[tS + .2, 330, 0], [tS + .4, 340, 1], [tS + 1, 480, 1]]);
    cSet(secG, { y: sy, o: so });
    if (t >= tS + .9) n = 21;
    wChemSet(num, String(n));
  }, D);
  // every one built to the same plan: push in on glycine, the chip that becomes the next beat's amino acid
  cam.to({ x: 200, y: 380, z: 4 }, D - 3.2, 2.6);
}],

/* ---------- plan ---------- */
['plan', 'The general structure', (m, D) => {
  const p = panel(0), tN = m('amino'), tB = m('carboxyl'), tH = m('h'), tR = m('r'), t3 = m('three'), tC = m('char');
  const AX = 800, AY = 500, AS = 1.6;
  const wrap = G(p, { x: AX, y: AY });
  const aa = aminoAcid(wrap, { r: 'R', rClass: 'simple', s: AS });
  const P = n => [AX + AS * { ca: [0, 0], amino: [-142, 0], carboxyl: [150, 0], h: [0, 88], r: [0, -112] }[n][0], AY + AS * { ca: [0, 0], amino: [-142, 0], carboxyl: [150, 0], h: [0, 88], r: [0, -112] }[n][1]];
  const head = stepText(p, [[4.4, 'an α-amino acid: everything hangs on the α-carbon'], [t3, 'three named parts'], [33.2, 'R is characteristic of each amino acid']], { x: 800, y: 96, size: 36 });
  // labels beside each part as it arrives
  const lab = (str, x, y, t0, anchor = 'middle', fill = COL.chalk) => say(p, str, x, y, t0, { size: 30, fill, anchor });
  lab('α-carbon', 690, 404, 1.3, 'end');
  const arc = G(p, { o: 0 }); show(arc, 1.5, .4);
  path(arc, 'M700 396Q760 380 770 448', { stroke: COL.chalk, 'stroke-width': 3, fill: 'none' });
  path(arc, 'M760 438L771 458L781 437Z', { fill: COL.chalk });
  lab('amino group', P('amino')[0], 600, tN + .7, 'middle', PC.amino);
  lab('carboxyl group', P('carboxyl')[0], 600, tB + .7, 'middle', PC.carboxyl);
  lab('hydrogen', 850, 652, tH + .6, 'start');
  lab('side chain (R)', 1000, 332, tR + .7, 'start', PC.simple);
  // the three named parts
  const tags = [numTag(p, 1, P('amino')[0] - 110, 448), numTag(p, 2, P('carboxyl')[0] + 128, 448), numTag(p, 3, 715, P('r')[1])];

  { id: 'p-ways', prompt: ['Which of these is one of the four ways to classify amino acids?'],
    build: withPic('ways', choice([['by weight'], ['by season'], ['by solubility in oil'], ['metabolic: by the fate of the carbon skeleton']], 3,
      'Right. The four ways are structural, chemical, nutritional and metabolic.',
      ['There is no class by weight. The four are structural, chemical, nutritional and metabolic.',
        'There is no seasonal class. The four are structural, chemical, nutritional and metabolic.',
        'Not one of the four. They are structural, chemical, nutritional and metabolic.', null])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
