<script>
'use strict';
// Biochemistry, Chapter 1 (Amino Acids), lesson 3: a supermarket shelf, then the amino acid card with its Chemical and
// Nutritional tabs lit; the chemical classification by counting amino and carboxyl groups (alanine neutral and the
// lecture's twelve, cystine as two cysteines, methionine and proline also neutral; aspartic acid acidic and negative
// at body pH, glutamic acid; lysine basic and positive, A H L, arginine's and histidine's extra basic groups, histidine's
// two labels); a three-bin sort; the nutritional classification (essential from the diet, non-essential made in the
// body, a missing essential one stalls the chain); Try This VIP Mall; arginine and histidine semi-essential; the rest,
// tyrosine from phenylalanine, asparagine and glutamine, foods that complete each other; the card filled; practice.
// Plan, errata and beats: books/biochemistry/chapters/chapter-01/lesson-03.md.
const CHAPTER = { number: 103, label: '1, lesson 3', title: 'Chemical and Nutritional Classification', minutes: 8, language: 'en', lead: false, next: '../lesson-04/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, weight: 700, ...o, o: 0 }); show(e, t0, .4); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const box5 = (g, x, y, w, h, { fill = '#0b1626', stroke = COL.faint, sw = 3, rx = 22, fo = 1 } = {}) => mk('rect', { x, y, width: w, height: h, rx, fill, 'fill-opacity': fo, stroke, 'stroke-width': sw }, g);
// keyframes [[t, a, b, …], …]: eased (soft) between keys, held before the first and after the last
function keyAt(t, K) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const a = K[i - 1], b = K[i], f = soft((t - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => v + (b[j + 1] - v) * f); }
  return K[K.length - 1].slice(1);
}
// one text whose words change at given times [[t, str], …]: it fades out before each change and back in after, so two
// words never share one spot; before the first time it is hidden
function stepText(p, steps, { x = 0, y = 0, size = 28, fill = COL.chalk, anchor = 'middle', weight = 700 } = {}) {
  const e = wChem(p, steps[0][1], { x, y, size, fill, anchor, weight, o: 0 });
  return Object.assign(e, {
    set(t) {
      let i = -1; for (let j = 0; j < steps.length; j++) if (t >= steps[j][0]) i = j;
      wChemSet(e, steps[Math.max(0, i)][1]);
      const nx = steps[i + 1] ? steps[i + 1][0] : null;
      mO(e, i < 0 ? 0 : mRamp(t, steps[i][0], steps[i][0] + .3) * (nx == null ? 1 : 1 - mRamp(t, nx - .3, nx)));
      return e;
    },
  });
}
// the moments a spoken list reaches each name: [t0, t1] shared out by the names' lengths
const spread = (names, t0, t1) => { const L = names.map(n => n.length + 4), tot = L.reduce((a, b) => a + b, 0); let acc = 0; return L.map(l => { const t = t0 + (t1 - t0) * acc / tot; acc += l; return t; }); };
// a hold window: 0 before a, up over .4 s, 1 until b, down over .4 s
const setS = (e, s) => { const v = Math.round(s * 1000) / 1000; if (st(e).s !== v) put(e, { s: v }); return e; };
const hold = (t, a, b, f = .4) => mRamp(t, a, a + f) * (1 - mRamp(t, b - f, b));
// a white hydrogen atom (with a small "+" for a hydrogen ion), origin at its centre, o 0
function hAtom(p, plus = false, r = 15) {
  const g = G(p, { x: 1, y: 1, o: 0 });
  mk('circle', { r, fill: PC.h, stroke: PC.hEdge, 'stroke-width': 2.5 }, g);
  wLabel(g, 'H', { y: r * .4, size: r * 1.1, fill: PC.ink, weight: 800, o: 1 });
  if (plus) wLabel(g, '+', { x: r + 8, y: -r * .3, size: 24, fill: PC.h, weight: 800, o: 1 });
  return g;
}
const redCross = (p, x, y, r = 16) => { const g = G(p, { x, y, o: 0 }); path(g, `M${-r} ${-r}L${r} ${r}M${r} ${-r}L${-r} ${r}`, { stroke: '#e5533d', 'stroke-width': 7 }); return g; };
// a counter: a label over a big number that changes at given times
function counterBox(p, { x, y, label, color, steps }) {
  const g = G(p, { x, y, o: 0 });
  box5(g, -110, -80, 220, 160, { stroke: color, sw: 3 });
  wChem(g, label, { y: -42, size: 24, fill: color, weight: 700, o: 1 });
  const n = stepText(g, steps, { y: 52, size: 68, fill: color, weight: 800 });
  return Object.assign(g, { n });
}
// a small green pentagon (heterocyclic ring) badge
function pentaBadge(p, x, y, r = 13) {
  const g = G(p, { x, y, o: 0 });
  const pts = [0, 1, 2, 3, 4].map(i => { const a = (-90 + 72 * i) * Math.PI / 180; return `${(r * Math.cos(a)).toFixed(1)} ${(r * Math.sin(a)).toFixed(1)}`; });
  mk('circle', { r: r + 5, fill: PC.ink, stroke: PC.hetero, 'stroke-width': 2 }, g);
  path(g, 'M' + pts.join('L') + 'Z', { fill: PC.hetero, 'fill-opacity': .35, stroke: PC.hetero, 'stroke-width': 3 });
  return g;
}

/* ---------- everyday things: foods, a shelf, a sprout and a tree ---------- */
function food(p, kind, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o }), E = a => mk('ellipse', a, g), R = a => mk('rect', a, g);
  if (kind === 'egg') {
    R({ x: -72, y: 2, width: 144, height: 44, rx: 8, fill: '#c9a26b', stroke: '#8a6a3a', 'stroke-width': 3 });
    [-46, 0, 46].forEach(cx => E({ cx, cy: -16, rx: 21, ry: 28, fill: '#f6eedc', stroke: '#bfb39a', 'stroke-width': 2.5 }));
    R({ x: -72, y: 2, width: 144, height: 14, rx: 6, fill: '#d8b47c', stroke: '#8a6a3a', 'stroke-width': 3 });
  } else if (kind === 'milk') {
    const body = 'M-34 52V-18L-18 -38V-58H18V-38L34 -18V52Z';
    path(g, body, { fill: '#f4f4f0' });
    R({ x: -34, y: 2, width: 68, height: 30, fill: '#6c8cff' });
    path(g, body, { stroke: '#b9b9b0', 'stroke-width': 3 });
    R({ x: -20, y: -70, width: 40, height: 16, rx: 4, fill: '#6c8cff', stroke: '#3d56b8', 'stroke-width': 2.5 });
  } else if (kind === 'beans') {
    R({ x: -42, y: -50, width: 84, height: 102, rx: 8, fill: '#b8c0c8', stroke: '#6f7882', 'stroke-width': 3 });
    R({ x: -42, y: -24, width: 84, height: 50, fill: '#d9534f' });
    [[-18, -2], [0, 8], [18, -4], [-4, -12]].forEach(([cx, cy]) => E({ cx, cy, rx: 10, ry: 7, fill: '#8a4a2a', stroke: '#5a2a14', 'stroke-width': 1.5 }));
    path(g, 'M-42 -38H42M-42 40H42', { stroke: '#6f7882', 'stroke-width': 3 });
  } else if (kind === 'rice') {
    path(g, 'M-46 52Q-58 0 -34 -36L-22 -48H22L34 -36Q58 0 46 52Z', { fill: '#e9dcc0', stroke: '#a89a78', 'stroke-width': 3 });
    path(g, 'M-26 -48L-34 -64M26 -48L34 -64M-6 -48L-8 -66M8 -48L10 -66', { stroke: '#a89a78', 'stroke-width': 3 });
    path(g, 'M-24 -40H24', { stroke: '#8a6a48', 'stroke-width': 6 });
    [[-14, 10], [6, 20], [16, 0], [-4, -6], [-20, 28], [20, 32]].forEach(([cx, cy]) => E({ cx, cy, rx: 6, ry: 3.5, fill: '#fffaf0', stroke: '#c8bca0', 'stroke-width': 1 }));
  } else if (kind === 'meat') {
    E({ cx: 0, cy: 34, rx: 66, ry: 16, fill: '#cfd3d8', stroke: '#8f969e', 'stroke-width': 3 });
    path(g, 'M-52 20Q-62 -20 -24 -34Q10 -46 40 -26Q64 -8 50 16Q30 34 -10 32Q-40 32 -52 20Z', { fill: '#f2d6c9', stroke: '#b88a7a', 'stroke-width': 3 });
    path(g, 'M-42 14Q-50 -16 -20 -26Q8 -36 32 -20Q50 -6 40 10Q24 24 -8 24Q-32 24 -42 14Z', { fill: '#c8505a' });
  }
  return g;
}
function shelfBack(p, { x = 80, y = 120, w = 920, h = 710, boards = [450, 790] } = {}) {
  const g = G(p);
  mk('rect', { x, y, width: w, height: h, rx: 14, fill: '#1a2c47', stroke: '#2c4568', 'stroke-width': 4 }, g);
  boards.forEach(by => mk('rect', { x: x - 10, y: by, width: w + 20, height: 22, rx: 5, fill: '#8a6a48', stroke: '#5e4630', 'stroke-width': 3 }, g));
  return g;
}
const priceTag = (p, x, y) => mk('rect', { x: x - 22, y: y + 4, width: 44, height: 14, rx: 3, fill: '#f2efe6', stroke: '#a8a498', 'stroke-width': 1.5 }, p);
function sprout(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  mk('ellipse', { cy: 40, rx: 52, ry: 14, fill: '#6a4a30', stroke: '#4a3220', 'stroke-width': 3 }, g);
  path(g, 'M0 40V-6', { stroke: '#5bbf5b', 'stroke-width': 7 });
  path(g, 'M0 -2Q-34 -34 -52 -10Q-28 6 0 -2Z', { fill: '#7fd17f', stroke: '#3f8f3f', 'stroke-width': 3 });
  path(g, 'M0 -10Q30 -46 50 -22Q28 -2 0 -10Z', { fill: '#7fd17f', stroke: '#3f8f3f', 'stroke-width': 3 });
  return g;
}
function tree(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  mk('rect', { x: -12, y: -6, width: 24, height: 56, rx: 4, fill: '#8a6a48', stroke: '#5e4630', 'stroke-width': 3 }, g);
  [[-26, -22, 30], [24, -22, 30], [0, -48, 36]].forEach(([cx, cy, r]) => mk('circle', { cx, cy, r, fill: '#4f9a5a', stroke: '#2f6a3c', 'stroke-width': 3 }, g));
  mk('ellipse', { cy: 50, rx: 50, ry: 10, fill: '#2f4a2a' }, g);
  return g;
}
// ten nutrition dots in two rows (one set per food); gaps are dashed empty dots; .dot(i) the element
function dotSet(p, { x, y, gaps = [], r = 9, sp = 24 } = {}) {
  const g = G(p, { x, y, o: 0 }), dots = [];
  for (let i = 0; i < 10; i++) {
    const cx = (i % 5 - 2) * sp, cy = Math.floor(i / 5) * sp;
    dots.push(gaps.includes(i) ? mk('circle', { cx, cy, r, fill: 'none', stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '4 4' }, g)
      : mk('circle', { cx, cy, r, fill: PC.essential, stroke: '#b8902e', 'stroke-width': 2 }, g));
  }
  return Object.assign(g, { dots });
}

/* ---------- the ten essential names on a shelf (mnem, semi) ---------- */
const TEN = [['Try', 230, [['Try', 'tryptophan']]], ['This', 590, [['Th', 'threonine'], ['H', 'histidine']]],
  ['VIP', 960, [['V', 'valine'], ['I', 'isoleucine'], ['P', 'phenylalanine']]],
  ['Mall', 1330, [['M', 'methionine'], ['A', 'arginine'], ['L', 'leucine'], ['L', 'lysine']]]];
function tenShelf(p) {
  const g = G(p);
  mk('rect', { x: 70, y: 180, width: 1460, height: 420, rx: 16, fill: '#1a2c47', stroke: '#2c4568', 'stroke-width': 4 }, g);
  mk('rect', { x: 60, y: 600, width: 1480, height: 22, rx: 5, fill: '#8a6a48', stroke: '#5e4630', 'stroke-width': 3 }, g);
  const words = [], items = [];
  TEN.forEach(([w, x, list], ci) => {
    words.push(wLabel(g, w, { x, y: 262, size: 64, fill: PC.essential, weight: 800, o: 1 }));
    list.forEach(([l, name], i) => {
      const y = 350 + i * 64, ig = G(g, { o: 1 });
      const c = aaChip(ig, name, { x, y, code: 'name', size: 24, color: PC.essential });
      wLabel(ig, l, { x: x - c.w / 2 - 14, y: y + 9, size: 26, fill: PC.essential, weight: 800, anchor: 'end', o: 1 });
      const sx = x + c.w / 2 - 2, sy = y - c.h / 2 + 2;
      const star = classIcon(ig, 'star', { x: sx, y: sy, size: 30 }), half = classIcon(ig, 'halfStar', { x: sx, y: sy, size: 30, o: 0 });
      items.push({ ci, i, name, g: ig, c, star, half });
    });
  });
  const by = n => items.find(it => it.name === n);
  return { g, words, items, by };
}

/* ---------- the three chemical bins (sort; practice) ---------- */
const BINS = [['neutral', PC.neutral, 'NH_2 = COOH', ''], ['acidic', PC.acidic, 'COOH > NH_2', '−'], ['basic', PC.basic, 'NH_2 > COOH', '+']];

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'A supermarket shelf and the amino acid card', (m, D) => {
  const p = panel(0), tS = m('shelf'), tC = m('card'), tT = m('tabs');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const back = G(W, { o: 0 }); show(back, .2, .6);
  shelfBack(back);
  // bottom shelf stocked from the start; the top shelf's four foods arrive as they are named
  [['meat', 210], ['beans', 420], ['rice', 620], ['egg', 840]].forEach(([k, x]) => { food(back, k, { x, y: 735 }); priceTag(back, x, 790); });
  const TOP = [['egg', 210], ['milk', 420], ['beans', 620], ['rice', 840]], tops = TOP.map(([k, x], i) => { priceTag(back, x, 450); return { e: food(back, k, { x, y: 395, o: 0 }), x, t0: tS + 2.1 + .65 * i }; });
  // every food is protein, and protein is a chain of amino acids
  const chain = beadChain(W, { x: 525, y: 215, n: 7, sp: 58, r: 21, o: 0 }); show(chain, tS + 7.6, .4);
  const pl = say(W, 'protein = a chain of amino acids', 525, 300, tS + 8.4, { size: 26, fill: COL.dim, weight: 600 }); hide(pl, tC + .3, .4);
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOCHEMISTRY · CHAPTER 1 · LESSON 3', { x: 1290, y: 250, size: 22, fill: COL.dim, o: 1 });
  ['Chemical and', 'nutritional', 'classification'].forEach((s, i) => wLabel(ttl, s, { x: 1290, y: 335 + i * 64, size: 50, o: 1 }));
  wLabel(ttl, 'Amino acids', { x: 1290, y: 540, size: 26, fill: COL.dim, weight: 500, o: 1 });
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tC - .6, .5);
  // push into one bead of the chain: the amino acid card
  cam.to({ x: 525, y: 215, z: 3 }, tC - .2, 1.6);
  hide(back, tC + .5, .6); hide(chain, tC + .8, .5);
  const cw = G(p, { x: 800, y: 470, s: .8, o: 0 }); tw(cw, { s: .95, o: 1 }, tC + .4, 1.2, out);
  const card = aminoCard(cw, { x: 0, y: 0 });
  clockRun(t => {
    tops.forEach(({ e, x, t0 }) => mPose(e, x, 395 - 34 * (1 - out(mRamp(t, t0, t0 + .45))) - 10 * mBump(t, t0 + .45, t0 + .95), mRamp(t, t0, t0 + .3)));
    chain.reveal(mRamp(t, tS + 7.6, tS + 9.6));
    card.build(mRamp(t, tC + .5, tC + 3.7));
    card.focus(['chemical', 'nutritional'], io(mRamp(t, tT, tT + .8)));
    card.glow('chemical', hold(t, tT + 1.9, tT + 5.2));
    card.glow('nutritional', mRamp(t, tT + 5.3, tT + 5.7));
  }, D);
}],

/* ---------- count ---------- */
['count', 'Chemical classification: count the groups', (m, D) => {
  const p = panel(0), tA = m('ala'), tW = m('twelve'), tC = m('cystine'), tM = m('more');
  // the card shrinks to the corner
  const cw = G(p, { x: 800, y: 470, s: .95 }); tw(cw, { x: 190, y: 118, s: .22 }, .1, 1.2);
  const card = aminoCard(cw, { x: 0, y: 0 });
  card.build(1).focus(['chemical', 'nutritional'], 1).glow('nutritional', 1);
  say(p, 'Chemical classification: count the groups', 880, 70, 1.2, { size: 34 });
  // the counting picture: alanine, two counters, the verdict
  const A = G(p); hide(A, tC - .4, .4);
  const ala = aaFormula(A, 'alanine', { x: 460, y: 410 });
  const cA = counterBox(A, { x: 960, y: 320, label: 'amino · NH_2', color: PC.amino, steps: [[2.4, '0'], [tA + 1.4, '1']] });
  const cC = counterBox(A, { x: 1350, y: 320, label: 'carboxyl · COOH', color: PC.carboxyl, steps: [[2.4, '0'], [tA + 2.7, '1']] });
  show(cA, 2.2, .4); show(cC, 2.2, .4);
  const sg = stepText(A, [[tA + 3.9, '=']], { x: 1155, y: 345, size: 64, fill: PC.neutral });
  say(A, 'equal → neutral', 1155, 470, tA + 4.1, { size: 36, fill: PC.neutral, weight: 800 });
  const rl = say(A, 'check the side chain too', 570, 285, 10.2, { size: 22, fill: COL.dim, weight: 600, anchor: 'start' }); hide(rl, tA + .2, .3);
  // the neutral bin and the twelve names
  const bin = G(p, { o: 0 }); show(bin, tW + .2, .5);
  box5(bin, 110, 600, 1380, 262, { stroke: PC.neutral, sw: 3 });
  wLabel(bin, 'neutral', { x: 140, y: 646, size: 30, fill: PC.neutral, weight: 800, anchor: 'start', o: 1 });
  wChem(bin, 'NH_2 = COOH: one of each', { x: 285, y: 644, size: 24, fill: COL.dim, weight: 600, anchor: 'start', o: 1 });
  const X = [250, 470, 690, 910, 1130, 1350], RY = [700, 756, 812];
  const NAMES = ['glycine', 'alanine', 'serine', 'threonine', 'cysteine', 'cystine', 'valine', 'leucine', 'isoleucine', 'phenylalanine', 'tyrosine', 'tryptophan'];
  const TT = spread(NAMES, tW + 3.8, tC - .9);
  const chips = NAMES.map((n, i) => ({ c: aaChip(bin, n, { code: 'name', size: 22, color: PC.neutral, o: 0 }), x: X[i % 6], y: RY[Math.floor(i / 6)], t0: TT[i] }));
  const more = [['methionine', tM + 1.0], ['proline', tM + 1.8]].map(([n, t0], i) => ({ c: aaChip(bin, n, { code: 'name', size: 22, color: PC.neutral, dashed: true, o: 0 }), x: X[i], y: RY[2], t0 }));
  say(bin, 'also neutral (not on the slide’s list)', 590, 820, tM + 2.4, { size: 24, fill: COL.dim, weight: 600, anchor: 'start' });
  say(bin, 'one NH_2, one COOH', 1180, 820, tM + 4.9, { size: 24, fill: PC.neutral, anchor: 'start' });
  // methionine and proline: one of each too
  const MP = G(p, { o: 0 }); show(MP, tM + .6, .5);
  aaFormula(MP, 'methionine', { x: 560, y: 470, s: .7 }).counts(1);
  aaFormula(MP, 'proline', { x: 1060, y: 470, s: .7 }).counts(1);
  // cystine: two cysteines joined by a disulfide bridge
  const Cy = G(p, { o: 0 }); show(Cy, tC + .2, .4); hide(Cy, tM - .5, .4);
  aaChip(Cy, 'cysteine', { x: 520, y: 330, code: 'name', size: 30, color: PC.neutral });
  aaChip(Cy, 'cysteine', { x: 1080, y: 330, code: 'name', size: 30, color: PC.neutral });
  const ss = disulfideMark(Cy);
  say(Cy, 'cystine = two cysteines joined by S–S', 800, 440, tC + 2.4, { size: 32 });
  say(Cy, 'the oxidized form of cysteine', 800, 490, tC + 4.6, { size: 26, fill: COL.dim, weight: 600 });
  clockRun(t => {
    ala.parts({ ca: mRamp(t, .4, .9), amino: mRamp(t, .7, 1.3), carboxyl: mRamp(t, 1, 1.6), h: mRamp(t, 1.3, 1.8), r: mRamp(t, 1.6, 2.2) });
    ala.name(mRamp(t, tA, tA + .4)).counts(mRamp(t, tA + 1.1, tA + 1.5));
    ala.glow('amino', hold(t, 5.2, 9.8)).glow('carboxyl', hold(t, 5.2, 9.8)).glow('r', hold(t, 10.2, tA));
    cA.n.set(t); cC.n.set(t); sg.set(t);
    chips.forEach(({ c, x, y, t0 }) => { const k = out(mRamp(t, t0, t0 + .4)); mPose(c, x, y - 44 * (1 - k), mRamp(t, t0, t0 + .25)); });
    chips[5].c.glow(hold(t, tC + .2, tM - .4));
    more.forEach(({ c, x, y, t0 }) => { const k = out(mRamp(t, t0, t0 + .4)); mPose(c, x, y - 44 * (1 - k), mRamp(t, t0, t0 + .25)); });
    ss.set([640, 330], [960, 330], io(mRamp(t, tC + 1.2, tC + 2.4)));
  }, D);
}],

/* ---------- acid ---------- */
['acid', 'Acidic: more carboxyl groups', (m, D) => {
  const p = panel(0), tA = m('acid'), tM = m('minus'), tG = m('glu');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const fg = G(W, { x: 470, y: 540 }); tw(fg, { x: 330, s: .85 }, tG + .2, 1);
  const asp = aaFormula(fg, 'aspartic acid');

  const T = G(p, { o: 0 }); show(T, tY + .3, .5); hide(T, tF + .4, .5);
  const phe = aaFormula(T, 'phenylalanine', { x: 430, y: 700, s: .75, name: false });
  const tyr = aaFormula(T, 'tyrosine', { x: 1170, y: 700, s: .75, name: false });
  wLabel(T, 'phenylalanine', { x: 430, y: 812, size: 28, fill: PC.essential, weight: 800, o: 1 });
  wLabel(T, 'essential', { x: 430, y: 848, size: 22, fill: PC.essential, weight: 600, o: 1 });
  wLabel(T, 'tyrosine', { x: 1170, y: 812, size: 28, fill: PC.nonEssential, weight: 800, o: 1 });
  wLabel(T, 'non-essential', { x: 1170, y: 848, size: 22, fill: PC.nonEssential, weight: 600, o: 1 });
  const ar = G(T, { o: 0 }); show(ar, tY + 1.6, .4);
  mArrow(ar, [650, 520], [950, 520], { color: COL.chalk, w: 5, head: 18 });
  classIcon(ar, 'cell', { x: 800, y: 440, size: 100 });
  say(T, 'the body adds an OH', 800, 585, tY + 2.4, { size: 24 });
  say(T, 'made from phenylalanine', 800, 622, tY + 3.2, { size: 24, fill: PC.nonEssential });
  void phe;
  // foods: complete and complementary
  const F = G(p, { o: 0 }); show(F, tF, .5);
  mk('rect', { x: 70, y: 590, width: 1460, height: 20, rx: 5, fill: '#8a6a48', stroke: '#5e4630', 'stroke-width': 3 }, F);
  const full = [['egg', 200], ['milk', 400], ['meat', 600]].map(([k, x], i) => ({ f: food(F, k, { x, y: 525, o: 0 }), d: dotSet(F, { x, y: 655 }), t0: tF + .5 + .55 * i }));
  say(F, 'all the essential ones', 400, 735, tF + 2.6, { size: 26, fill: PC.essential });
  const plant = [['rice', 880, [9]], ['beans', 1120, [4]]].map(([k, x, gaps], i) => ({ f: food(F, k, { x, y: 525, o: 0 }), d: dotSet(F, { x, y: 655, gaps }), t0: tF + 4.6 + .6 * i }));
  const plus = say(F, '+', 1000, 540, tF + 5.4, { size: 48 }); void plus;
  say(F, 'each short of one', 1000, 735, tF + 5.6, { size: 24, fill: COL.dim, weight: 600 });
  const eq = say(F, '=', 1250, 540, tF + 7.2, { size: 48 }); void eq;
  const both = dotSet(F, { x: 1390, y: 655 });
  const both2 = G(F, { o: 0 }); show(both2, tF + 7.4, .4);
  food(both2, 'rice', { x: 1350, y: 525, s: .7 }); food(both2, 'beans', { x: 1440, y: 525, s: .7 });
  say(F, 'together: all ten', 1390, 735, tF + 8.2, { size: 26, fill: PC.essential });
  clockRun(t => {
    chips.forEach(({ c, x, y, t0 }) => { const k = out(mRamp(t, t0, t0 + .4)); mPose(c, x, y - 34 * (1 - k), mRamp(t, t0, t0 + .25)); });
    chips[3].c.glow(hold(t, tY + .2, t2 - .2));
    tyr.side.hi('OH', hold(t, tY + 2.2, t2 - .4));
    [...full, ...plant].forEach(({ f, d, t0 }) => { mO(f, mRamp(t, t0, t0 + .4)); mO(d, mRamp(t, t0 + .4, t0 + .8)); });
    mO(both, mRamp(t, tF + 7.6, tF + 8));
    setS(both, 1 + .08 * mBump(t, tF + 8, tF + 9));
  }, D);
}],

/* ---------- wrap ---------- */
['wrap', 'Summary', (m, D) => {
  const p = panel(0), t1 = m('w1'), t2 = m('w2'), t3 = m('w3'), t4 = m('w4');
  say(p, 'Summary: chemical and nutritional', 800, 52, .2, { size: 32 });
  const cw = G(p, { x: 800, y: 395, s: .8 });
  const card = aminoCard(cw, { x: 0, y: 0 });
  // the bottom row: the three chemical rules, then the ten essential names, then the two labels of one amino acid
  const rules = G(p); hide(rules, t2 - .4, .4);
  const RX = [320, 800, 1280], RL = [['NH_2 = COOH → neutral', PC.neutral, t1 + 3.9], ['COOH > NH_2 → acidic (−)', PC.acidic, t1 + 5.35], ['NH_2 > COOH → basic (+)', PC.basic, t1 + 8.2]];
  RL.forEach(([s, c, t0], i) => { const g = G(rules, { o: 0 }); show(g, t0, .4); box5(g, RX[i] - 220, 750, 440, 72, { stroke: c, sw: 3, rx: 36 }); wChem(g, s, { x: RX[i], y: 796, size: 26, fill: c, weight: 800, o: 1 }); });
  const tenG = G(p); hide(tenG, t4 - .4, .4);
  const TEN3 = ['Trp', 'Thr', 'His', 'Val', 'Ile', 'Phe', 'Met', 'Arg', 'Leu', 'Lys'];
  const ten = TEN3.map((n, i) => ({ c: aaChip(tenG, n, { x: 440 + i * 80, y: 786, size: 22, color: PC.essential, o: 0 }), t0: t2 + .8 + .22 * i, semi: n === 'His' || n === 'Arg' }));
  say(tenG, 'the rest: made in the body', 800, 850, t3 + 4.5, { size: 24, fill: PC.nonEssential });
  const two = stepText(p, [[t4 + .6, 'lysine: basic and essential'], [t4 + 4.9, 'glutamic acid: acidic and non-essential']], { x: 800, y: 800, size: 34, weight: 800 });
  const CH = [[t1 + 1.9, 'count the|groups', COL.chalk], [t4 + .6, 'basic (+)', PC.basic], [t4 + 4.9, 'acidic (−)', PC.acidic]];
  const NU = [[t2 + .4, 'ten essential:|Try This VIP Mall', PC.essential], [t4 + .6, 'essential', PC.essential], [t4 + 4.9, 'non-essential', PC.nonEssential]];
  const AA = [[t4 + .6, 'lysine'], [t4 + 4.9, 'glutamic acid']];
  // the value shown at t from a list [[t, text, colour], …], with how far it is filled (out before each change)
  const seg = (t, L) => { let i = -1; L.forEach((s, j) => { if (t >= s[0]) i = j; }); if (i < 0) return [0, L[0][1], L[0][2]]; const nx = L[i + 1]; return [mRamp(t, L[i][0], L[i][0] + .6) * (nx ? 1 - mRamp(t, nx[0] - .7, nx[0] - .1) : 1), L[i][1], L[i][2]]; };
  let cur = null;
  clockRun(t => {
    card.focus(['chemical', 'nutritional'], 1);
    card.glow('chemical', hold(t, t1 + .2, t2 - .2) + hold(t, t4 + .3, D + 1)).glow('nutritional', hold(t, t2 + .2, t4) + hold(t, t4 + .3, D + 1));
    const [kc, sc, cc] = seg(t, CH), [kn, sn, cn] = seg(t, NU);
    card.fill('chemical', kc, sc, cc).fill('nutritional', kn, sn, cn);
    // the centre: a general amino acid, then lysine, then glutamic acid (it fades out and in round each change)
    let o = 1, nm = null;
    AA.forEach(([ts, n]) => { o *= t < ts ? 1 - mRamp(t, ts - .5, ts - .05) : mRamp(t, ts + .05, ts + .5); if (t >= ts) nm = n; });
    if (nm && nm !== cur) { card.setAcid(nm); cur = nm; }
    mO(card.aa, o);
    ten.forEach(({ c, t0, semi }, i) => { const k = out(mRamp(t, t0, t0 + .35)); mPose(c, 440 + i * 80, 786 - 24 * (1 - k), mRamp(t, t0, t0 + .2)); c.half(semi ? mRamp(t, t3 + .3, t3 + .9) : 0).glow(semi ? hold(t, t3 + .3, t3 + 3.4) : 0); });
    two.set(t);
  }, D);
}],

/* ---------- final1 ---------- */
['final1', 'Chapter practice', (m, D) => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  const frame = g => box5(g, 980, 90, 580, 720);
  const cap = (g, s, c = COL.chalk) => wChem(g, s, { x: 1270, y: 770, size: 26, weight: 700, fill: c, o: 1 });
  at('count', g => {
    frame(g);
    aaFormula(g, 'glutamic acid', { x: 1270, y: 560, s: .75 }).counts(1);
    cap(g, 'count the groups');
  });
  at('sort', g => {
    frame(g);
    [['Val', 1130], ['Asp', 1270], ['His', 1410]].forEach(([n, x]) => { aaChip(g, n, { x, y: 170, size: 26, color: COL.chalk }); wLabel(g, '?', { x, y: 232, size: 34, weight: 800, fill: PC.essential, o: 1 }); });
    BINS.forEach(([name, col, rule, sign], i) => {
      const x = 1100 + i * 170;
      box5(g, x - 75, 280, 150, 330, { stroke: col, sw: 3 });
      wLabel(g, name, { x, y: 330, size: 24, fill: col, weight: 800, o: 1 });
      if (sign) wLabel(g, sign, { x, y: 380, size: 36, fill: col, weight: 800, o: 1 });
      wChem(g, rule, { x, y: 650, size: 18, fill: col, weight: 700, o: 1 });
    });
    cap(g, 'which bin?');
  });
  at('charge', g => {
    frame(g);
    aminoAcid(g, { x: 1270, y: 440, s: .9 }).ionise(1);
    wLabel(g, 'at body pH', { x: 1270, y: 190, size: 28, weight: 700, fill: COL.dim, o: 1 });
    wChem(g, 'every amino acid: NH_3^+ and COO^−', { x: 1270, y: 640, size: 24, weight: 700, o: 1 });
    cap(g, 'an extra group in R sets the charge', COL.dim);
  });
  at('mnem', g => {
    frame(g);
    wLabel(g, 'Try This VIP Mall', { x: 1270, y: 190, size: 40, weight: 800, fill: PC.essential, o: 1 });
    aaFormula(g, 'phenylalanine', { x: 1135, y: 560, s: .5, name: false });
    aaFormula(g, 'tyrosine', { x: 1405, y: 560, s: .5, name: false });
    wLabel(g, 'phenylalanine', { x: 1135, y: 640, size: 22, weight: 700, o: 1 });
    wLabel(g, 'tyrosine', { x: 1405, y: 640, size: 22, weight: 700, o: 1 });
    cap(g, 'which one is not in the trick?');
  });
  at('diet', g => {
    frame(g);
    box5(g, 1005, 190, 250, 460, { stroke: PC.essential, sw: 3 });
    box5(g, 1285, 190, 250, 460, { stroke: PC.nonEssential, sw: 3 });
    classIcon(g, 'plate', { x: 1130, y: 330, size: 110 });
    classIcon(g, 'cell', { x: 1410, y: 330, size: 110 });
    wLabel(g, 'from the diet', { x: 1130, y: 470, size: 24, weight: 800, fill: PC.essential, o: 1 });
    wLabel(g, 'made in', { x: 1410, y: 470, size: 24, weight: 800, fill: PC.nonEssential, o: 1 });
    wLabel(g, 'the body', { x: 1410, y: 502, size: 24, weight: 800, fill: PC.nonEssential, o: 1 });
    cap(g, 'diet or body?');
  });
  at('semi', g => {
    frame(g);
    ['arginine', 'histidine'].forEach((n, i) => { const c = aaChip(g, n, { x: 1270, y: 200 + i * 66, code: 'name', size: 28, color: PC.essential }); c.half(1); classIcon(g, 'halfStar', { x: 1270 + c.w / 2, y: 200 + i * 66 - c.h / 2, size: 32 }); });
    sprout(g, { x: 1130, y: 500 }); tree(g, { x: 1410, y: 500 });
    wLabel(g, 'growing', { x: 1130, y: 600, size: 24, weight: 700, o: 1 });
    wLabel(g, 'adult', { x: 1410, y: 600, size: 24, weight: 700, o: 1 });
    cap(g, 'who needs them in food?');
  });
  at('why', g => {
    frame(g);
    const ch = beadChain(g, { x: 1270, y: 300, aa: ['Gly', 'Leu', 'Ser', 'Lys', 'Ala', 'Val'], labels: ['Gly', 'Leu', 'Ser', 'Lys', '', 'Val'], gap: [4], sp: 70, r: 25 });
    ch.reveal(5 / 6.6);
    put(redCross(g, 1270 + 70 * 1.5, 300, 13), { o: 1 });
    classIcon(g, 'cell', { x: 1270, y: 500, size: 130 });
    put(redCross(g, 1330, 460, 16), { o: 1 });
    cap(g, 'why must they come from food?');
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('count');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-count', prompt: ['Glutamic acid has one amino group and two carboxyl groups. Which chemical class is it?'],
    build: withPic('count', choice([['neutral'], ['acidic'], ['basic'], ['essential']], 1,
      'Right. More carboxyl groups than amino groups: acidic, and negative at body pH.',
      ['Neutral needs one of each. Glutamic acid has an extra carboxyl group.', null,
        'Basic needs extra amino groups, like lysine. Here the extra group is a carboxyl group.',
        'Essential is a nutritional label (and glutamic acid is non-essential). The question asks for the chemical class.'])) },
  { id: 'p-sort', prompt: ['Sort each amino acid by its groups.'],
    build: withPic('sort', grid([
      { parts: ['valine'], ans: ['n'], why: 'One NH₂, one COOH.' },
      { parts: ['aspartic acid'], ans: ['a'], why: 'An extra COOH.' },
      { parts: ['histidine'], ans: ['b'], why: 'Basic: A H L.' },
    ], [['n', 'neutral', null, 'N'], ['a', 'acidic', null, 'A'], ['b', 'basic', null, 'B']], { multi: false, text: true })) },
  { id: 'p-charge', prompt: ['At body pH, which of these carries a positive charge?'],
    build: withPic('charge', choice([['glutamic acid'], ['alanine'], ['lysine'], ['aspartic acid']], 2,
      'Right. Lysine’s extra amino group picks up a hydrogen and turns positive: it is basic.',
      ['Glutamic acid is acidic: its extra carboxyl group gives away a hydrogen, so it is negative.',
        'Alanine is neutral: one amino group and one carboxyl group, no net charge.', null,
        'Aspartic acid is acidic, so it carries a negative charge, not a positive one.'])) },
  { id: 'p-mnem', prompt: ['Which of these is NOT one of the ten in “Try This VIP Mall”?'],
    build: withPic('mnem', choice([['tyrosine'], ['threonine'], ['methionine'], ['phenylalanine']], 0,
      'Right. Tyrosine is non-essential: the body makes it from phenylalanine.',
      [null, 'Threonine is in This: threonine and histidine.',
        'Methionine is the M of Mall.',
        'Phenylalanine is the P of VIP. The body makes tyrosine from it, not the other way round.'])) },
  { id: 'p-diet', prompt: ['Must it come from the diet, or does the body make it?'],
    build: withPic('diet', grid([
      { parts: ['tryptophan'], ans: ['e'], why: 'Try: must eat it.' },
      { parts: ['glycine'], ans: ['n'], why: 'The body makes it.' },
      { parts: ['leucine'], ans: ['e'], why: 'Mall: must eat it.' },
      { parts: ['serine'], ans: ['n'], why: 'The body makes it.' },
    ], [['e', 'essential (diet)', null, 'E'], ['n', 'non-essential', null, 'N']], { multi: false, text: true })) },
  { id: 'p-semi', prompt: ['Who must get arginine and histidine from food?'],
    build: withPic('semi', choice([['adults only'], ['growing children'], ['nobody: the body always makes enough'], ['everyone, at every age']], 1,
      'Right. They are semi-essential: a growing body cannot make enough, an adult can.',
      ['It is the other way round: adults make enough, growing children do not.', null,
        'A growing child cannot make enough, so children need them in food.',
        'That describes the eight strict essentials. Adults make enough arginine and histidine.'])) },
  { id: 'p-why', prompt: ['Why must essential amino acids come in the diet?'],
    build: withPic('why', choice([['they are the only amino acids that build proteins'], ['they are the acidic amino acids'], ['cooking destroys them'], ['the body cannot synthesize them']], 3,
      'Right. The body cannot make them, so a missing one stalls protein building.',
      ['All twenty amino acids build proteins, essential or not.',
        'Acidic is the chemical scheme (aspartic and glutamic acid, both non-essential).',
        'Cooking is not the reason: the body simply cannot make them.', null])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
