<script>
'use strict';
// Biochemistry, Chapter 3 (Protein Structure), lesson 2: a telephone cord and a paper fan on a desk; the four-levels
// strip with primary and secondary lit; primary structure (a numbered 20-bead chain, peptide links, N and C ends,
// counting from the N end); the sickle-cell swap at position 6; secondary structure (backbone C=O and N–H, the chain
// folding on backbone hydrogen bonds); the α-helix (right-handed, 3.6 per turn, 0.54 nm per turn, n → n + 4); the
// β-sheet (pleat, strands, intrachain and interchain, parallel and antiparallel); a comparison card; summary; practice.
// Plan, errata and beats: books/biochemistry/chapters/chapter-03/lesson-02.md.
const CHAPTER = { number: 302, label: '3, lesson 2', title: 'Primary and Secondary Structure', minutes: 7, language: 'en', lead: false, next: '../lesson-03/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, weight: 700, ...o, o: 0 }); show(e, t0, .4); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const dg = a => a * Math.PI / 180;
const r1 = v => Math.round(v * 10) / 10;
const box = (g, x, y, w, h, { fill = '#0b1626', stroke = COL.faint, sw = 3, rx = 22, fo = 1 } = {}) => mk('rect', { x, y, width: w, height: h, rx, fill, 'fill-opacity': fo, stroke, 'stroke-width': sw }, g);
// keyframes [[t, a, b, …], …]: eased between keys, held before the first and after the last
function keyAt(t, K) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const a = K[i - 1], b = K[i], f = soft((t - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => v + (b[j + 1] - v) * f); }
  return K[K.length - 1].slice(1);
}
// one text whose words change at given times [[t, str], …]: it fades out before each change and back in after, so two
// words never share one spot; before the first time it is hidden
function stepText(p, steps, { x = 0, y = 0, size = 28, fill = COL.chalk, anchor = 'middle', weight = 700 } = {}) {
  const e = wChem(p, steps[0][1], { x, y, size, fill, anchor, weight, o: 0 });
  return Object.assign(e, {
    set(t) {
      let i = -1; for (let j = 0; j < steps.length; j++) if (t >= steps[j][0]) i = j;
      wChemSet(e, steps[Math.max(0, i)][1]);
      const nx = steps[i + 1] ? steps[i + 1][0] : null;
      mO(e, i < 0 ? 0 : mRamp(t, steps[i][0], steps[i][0] + .3) * (nx == null ? 1 : 1 - mRamp(t, nx - .3, nx)));
      return e;
    },
  });
}
// a label with a leader line to the point it names: text at (lx, ly), the line from near the text to (ax, ay)
function callout(p, [ax, ay], [lx, ly], str, { size = 24, fill = COL.chalk, anchor = 'middle', o = 0, line = COL.dim } = {}) {
  const g = G(p, { o });
  const sy = ly < ay ? ly + 10 : ly - size - 4, dx = ax - lx, dy = ay - sy, L = Math.hypot(dx, dy) || 1;
  path(g, `M${r1(lx)} ${r1(sy)}L${r1(ax - dx / L * 14)} ${r1(ay - dy / L * 14)}`, { stroke: line, 'stroke-width': 2.5 });
  wChem(g, str, { x: lx, y: ly, size, fill, anchor, weight: 700, o: 1 });
  return g;
}
// coloured runs of text in one line: parts [[str, colour], …]
function runs(p, parts, { x = 0, y = 0, size = 30, anchor = 'middle', weight = 800, o = 1 } = {}) {
  const t = T(p, '', { x, y, size, anchor, weight, o });
  for (const [s, c] of parts) { const ts = mk('tspan', { fill: c }, t); ts.textContent = s; }
  return t;
}
const halo = (p, x, y, r, color = PC.peptide) => { const g = G(p, { x, y, o: 0 }); mk('circle', { r, fill: 'none', stroke: color, 'stroke-width': 4 }, g); return g; };

/* ---------- intro backdrop: a desk with a coiled telephone cord and a pleated paper fan ---------- */
// the cord as a coil seen side-on: loops along x (pitch 36 px), drawn with a sag and a travelling wiggle of amplitude a
function cordPath(a, t) {
  let d = '';
  const N = 12 * 24;
  for (let i = 0; i <= N; i++) {
    const th = i / 24 * 2 * Math.PI, u = i / N;
    const x = 196 + 36 * i / 24 + 18 * Math.sin(th), y = 676 + 26 * Math.cos(th) + 18 * Math.sin(Math.PI * u) + a * Math.sin(2 * Math.PI * (u * 1.5 - t / 1.4)) * Math.sin(Math.PI * u);
    d += (i ? 'L' : 'M') + r1(x) + ' ' + r1(y);
  }
  return d;
}
function desk(p) {
  const g = G(p);
  mk('rect', { x: 0, y: 0, width: 1600, height: 620, fill: '#162c49' }, g);
  mk('rect', { x: 0, y: 600, width: 1600, height: 300, fill: '#6b4a2e' }, g);
  mk('rect', { x: 0, y: 600, width: 1600, height: 12, fill: '#8a6340' }, g);
  [660, 740, 820].forEach(y => path(g, `M0 ${y}C400 ${y - 8} 1000 ${y + 10} 1600 ${y}`, { stroke: '#5c3f27', 'stroke-width': 3 }));
  // the telephone: body, dial and the handset at the cord's far end
  mk('rect', { x: 40, y: 560, width: 150, height: 110, rx: 26, fill: '#c94c4c', stroke: '#7c2a2a', 'stroke-width': 4 }, g);
  mk('circle', { cx: 115, cy: 612, r: 32, fill: '#f2efe6', stroke: '#7c2a2a', 'stroke-width': 3 }, g);
  for (let i = 0; i < 8; i++) mk('circle', { cx: r1(115 + 21 * Math.cos(dg(45 * i))), cy: r1(612 + 21 * Math.sin(dg(45 * i))), r: 5, fill: '#7c2a2a' }, g);
  path(g, 'M650 700C650 660 690 652 700 676L790 676C800 652 840 660 840 700C840 728 812 734 800 718L690 718C678 734 650 728 650 700Z', { fill: '#c94c4c', stroke: '#7c2a2a', 'stroke-width': 4 });
  const cord = path(g, cordPath(0, 0), { stroke: '#e3dccb', 'stroke-width': 6 });
  const trace = path(g, cordPath(0, 0), { stroke: PC.helix, 'stroke-width': 7 }, { d: 0 });
  return Object.assign(g, { cord, trace });
}
// a pleated paper fan on its pivot; .set(open, edge) opens it (0 shut … 1 open) and shows the cyan zigzag edge
function paperFan(p, { x = 1190, y = 790, R = 210, n = 14 } = {}) {
  const g = G(p, { x, y });
  const panels = Array.from({ length: n }, (_, i) => path(g, 'M0 0', { fill: i % 2 ? '#d8d0bc' : '#f2efe6', stroke: '#a89a78', 'stroke-width': 2 }));
  const edge = path(g, 'M0 0', { stroke: PC.sheet, 'stroke-width': 6 }), hub = mk('circle', { r: 12, fill: '#8a6340', stroke: '#4a3220', 'stroke-width': 3 }, g);
  void hub;
  let key = '';
  return Object.assign(g, {
    set(open, ek) {
      const span = 14 + 136 * mClamp(open), k = r1(span) + '|' + Math.round(ek * 1000);
      if (k === key) return g; key = k;
      const a0 = -90 - span / 2, step = span / n, pt = (a, rr) => r1(rr * Math.cos(dg(a))) + ' ' + r1(rr * Math.sin(dg(a)));
      let ed = '';
      panels.forEach((e, i) => {
        const a = a0 + step * i, b = a + step, rA = i % 2 ? R - 18 : R, rB = i % 2 ? R : R - 18;
        mD(e, `M0 0L${pt(a, rA)}L${pt(b, rB)}Z`);
        ed += (i ? 'L' : 'M') + pt(a, rA);
        if (i === n - 1) ed += 'L' + pt(b, rB);
      });
      mD(edge, ed); mO(edge, ek);
      return g;
    },
  });
}

/* ---------- a red blood cell: round (0) to sickle (1); hemoglobin dots scattered (0) or clumped in a rod (1) ---------- */
function redCell(p, { x = 0, y = 0, R = 130 } = {}) {
  const g = G(p, { x, y, o: 0 });
  const N = 60, A = dg(55), c = .5 * R, rho = Math.hypot(Math.cos(A) * R - c, Math.sin(A) * R);
  const beta = Math.atan2(Math.sin(A) * R, Math.cos(A) * R - c);   // the inner arc's bottom end, seen from its centre
  // round: the outer arc from top right over the left side to bottom right, then back up the right side; sickle: the
  // same outer arc, then an inner arc centred right of the middle, so the cell bows into a crescent
  const round = [], sick = [];
  for (let i = 0; i < N; i++) {
    const u = i / (N - 1), a = A + u * (2 * Math.PI - 2 * A);
    round.push([R * Math.cos(-a), R * Math.sin(-a)]); sick.push(round[i].slice());
  }
  for (let i = 0; i < N; i++) {
    const u = i / (N - 1), a = A - u * 2 * A, b = beta + u * (2 * Math.PI - 2 * beta);
    round.push([R * Math.cos(a), R * Math.sin(a)]);
    sick.push([c + rho * Math.cos(b), rho * Math.sin(b)]);
  }
  const body = path(g, 'M0 0', { fill: '#c8323a', stroke: '#f08c7a', 'stroke-width': 4 });
  const dimple = mk('ellipse', { rx: R * .45, ry: R * .4, fill: '#a5232c' }, g);
  const dots = Array.from({ length: 7 }, (_, i) => {
    const e = mk('circle', { r: 9, fill: '#5a0d14', stroke: '#e8a0a0', 'stroke-width': 1.5 }, g);
    return { e, a: [R * .5 * Math.cos(dg(i * 103 + 20)), R * .5 * Math.sin(dg(i * 103 + 20))], b: [-.62 * R, (i - 3) * .14 * R] };
  });
  let key = -1;
  return Object.assign(g, {
    set(k, clump) {
      const kk = Math.round(k * 500) / 500, ck = Math.round(clump * 500) / 500, id = kk * 10 + ck;
      if (id === key) return g; key = id;
      mD(body, round.map((q, i) => (i ? 'L' : 'M') + r1(q[0] + (sick[i][0] - q[0]) * kk) + ' ' + r1(q[1] + (sick[i][1] - q[1]) * kk)).join('') + 'Z');
      put(dimple, { o: Math.round((1 - kk) * 1000) / 1000 });
      dots.forEach(({ e, a, b }) => { e.setAttribute('cx', r1(a[0] + (b[0] - a[0]) * ck)); e.setAttribute('cy', r1(a[1] + (b[1] - a[1]) * ck)); });
      return g;
    },
  });
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'A cord, a fan and the four levels', (m, D) => {
  const p = panel(0), tC = m('cord'), tF = m('fan'), tS = m('strip');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const back = G(W, { o: 0 }); show(back, .1, .6);
  const dk = desk(back), fan = paperFan(back);
  const lc = G(back, { o: 0 }); show(lc, tC + 1.2, .4);
  wLabel(lc, 'coiled: a helix', { x: 440, y: 790, size: 30, fill: PC.helix, weight: 800, o: 1 });
  const lf = G(back, { o: 0 }); show(lf, tF + 2.6, .4);
  wLabel(lf, 'pleated: a zigzag', { x: 1190, y: 850, size: 30, fill: PC.sheet, weight: 800, o: 1 });
  const both = say(back, 'a long strip, folded in a regular way', 800, 500, 10.6, { size: 28, fill: COL.chalk });
  void both;
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOCHEMISTRY · CHAPTER 3 · LESSON 2', { x: 1200, y: 110, size: 24, fill: COL.dim, o: 1 });
  ['Primary and', 'secondary structure'].forEach((s, i) => wLabel(ttl, s, { x: 1200, y: 185 + i * 64, size: 54, o: 1 }));
  wLabel(ttl, 'Protein structure', { x: 1200, y: 300, size: 26, fill: COL.dim, weight: 500, o: 1 });
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tS - .6, .5);
  hide(back, tS - .2, .6);
  // the strip: primary and secondary lit
  const sg = G(W, { x: 800, y: 420, s: .8, o: 0 });
  tw(sg, { s: 1, o: 1 }, tS + .1, 1.2, out);
  const ls = levelsStrip(sg, { x: 0, y: 0 });
  const today = G(p, { o: 0 }); show(today, 19.3, .5);
  wLabel(today, 'today:', { x: 800, y: 680, size: 26, fill: COL.dim, weight: 600, o: 1 });
  runs(today, [['primary', PC.primary], ['  and  ', COL.chalk], ['secondary', PC.secondary]], { x: 800, y: 728, size: 36, o: 1 });
  hide(today, D - 2.4, .4);
  clockRun(t => {
    const wig = 3 + 12 * mBump(t, tC, tC + 3.2);
    mD(dk.cord, cordPath(wig, t)); mD(dk.trace, cordPath(wig, t));
    const tk = Math.round(mRamp(t, tC + .3, tC + 2.6) * 500) / 500;
    if (st(dk.trace).d !== tk) put(dk.trace, { d: tk });
    mO(dk.trace, 1 - .6 * mRamp(t, tC + 4, tC + 5));
    fan.set(1 - .9 * mBump(t, tF + .2, tF + 2.4), mRamp(t, tF + 2.4, tF + 3));
    ls.build(mRamp(t, tS + .2, tS + 2.6)).tags(mRamp(t, tS + 3, tS + 4))
      .focus(['primary', 'secondary'], mRamp(t, 19.4, 20.4))
      .glow('primary', mRamp(t, 20.6, 21.2)).glow('secondary', mRamp(t, 22.2, 22.8));
  }, D);
  // the push into the primary frame as the narration ends
  cam.to({ x: 260, y: 420, z: 1.9 }, D - 2.2, 2);
}],

/* ---------- primary ---------- */
['primary', 'Primary structure', (m, D) => {
  const p = panel(0), tB = m('bond'), tN = m('nend'), tC = m('cend'), tK = m('count');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const ttl = G(p, { o: 0 }); show(ttl, .2, .5);
  wLabel(ttl, 'primary structure', { x: 800, y: 92, size: 44, fill: PC.primary, weight: 800, o: 1 });
  say(p, 'the number, type and sequence of amino acids', 800, 146, 1.6, { size: 28 });
  const ch = beadChain(W, { x: 800, y: 430, n: 20, sp: 64, r: 20, chips: false, numbers: [1, 5, 10, 15, 20] });
  const bd = say(W, 'like beads on a string: the order matters', 800, 300, 6.2, { size: 26, fill: COL.dim, weight: 600 }); hide(bd, tB - .2, .3);
  // the peptide bond
  const [lx, ly] = ch.linkPt(9);
  const pb = G(W, { o: 0 }); show(pb, tB + .3, .4); hide(pb, tN - .4, .4);
  path(pb, `M${lx} ${ly - 26}L${lx} ${ly - 84}`, { stroke: PC.peptide, 'stroke-width': 3 });
  wLabel(pb, 'peptide bond', { x: lx, y: ly - 128, size: 30, fill: PC.peptide, weight: 800, o: 1 });
  wChem(pb, '–CO–NH–', { x: lx, y: ly - 94, size: 28, fill: COL.chalk, weight: 700, o: 1 });
  // the two ends
  const [nx, ny] = ch.endPt('N'), [cx, cy] = ch.endPt('C');
  const hn = halo(W, nx, ny, 24, PC.nTerm), hc = halo(W, cx, cy, 24, PC.cTerm);   // inside the end-group text above the tag
  const ln = G(W, { o: 0 }); show(ln, tN + .6, .4); hide(ln, tC - .3, .3); show(ln, tK, .4);   // off while the camera is on the C end
  wLabel(ln, 'N-terminal end', { x: nx - 30, y: 580, size: 30, fill: PC.nTerm, weight: 800, anchor: 'start', o: 1 });
  wChem(ln, 'free amino group (NH_2) of the first', { x: nx - 30, y: 618, size: 24, fill: COL.chalk, weight: 600, anchor: 'start', o: 1 });
  const lcG = G(W, { o: 0 }); show(lcG, tC + .6, .4);
  wLabel(lcG, 'C-terminal end', { x: cx + 30, y: 580, size: 30, fill: PC.cTerm, weight: 800, anchor: 'end', o: 1 });
  wChem(lcG, 'free carboxyl group (COOH) of the last', { x: cx + 30, y: 618, size: 24, fill: COL.chalk, weight: 600, anchor: 'end', o: 1 });
  say(p, 'at body pH the ends are ionised: H_3N^+ … COO^−', 800, 860, tC + 5.4, { size: 20, fill: COL.dim, weight: 500 });
  // counting
  say(W, 'counted from the N-terminal end', 800, 690, tK + .8, { size: 30, fill: PC.primary });
  clockRun(t => {
    ch.reveal(mRamp(t, .4, 6)).bond(9, mRamp(t, tB, tB + .6) * (1 - mRamp(t, tN - .4, tN)))
      .numbers(mRamp(t, tK + .4, tK + 2.4)).readArrow(mRamp(t, tK + .4, tK + 3))
      .glow(0, mBump(t, tK + 3.5, tK + 5.6)).glow(19, mBump(t, tK + 5, tK + 7));
    mO(hn, mRamp(t, tN + .3, tN + .7) * (1 - mRamp(t, tC, tC + .4)));
    mO(hc, mRamp(t, tC + .3, tC + .7) * (1 - mRamp(t, tK, tK + .4)));
  }, D);
  cam.to({ x: 560, y: 470, z: 1.3 }, tN - .2, 1.4);
  cam.to({ x: 1040, y: 470, z: 1.3 }, tC - .2, 1.4);
  cam.to({ x: 800, y: 450, z: 1 }, tK - .2, 1.4);
}],

/* ---------- change ---------- */
['change', 'One bead changed', (m, D) => {
  const p = panel(0), tS = m('swap'), tD = m('defect');
  const g = G(p, { x: -80, s: .95, o: 0 }); tw(g, { x: 0, s: 1, o: 1 }, .1, 1);
  const AA = ['Val', 'His', 'Leu', 'Thr', 'Pro', 'Glu', 'Glu', 'Lys'];
  wLabel(g, 'hemoglobin β chain: the first 8 amino acids', { x: 520, y: 200, size: 30, weight: 800, o: 1 });
  say(g, 'counted from the N-terminal end', 520, 244, 5.5, { size: 24, fill: COL.dim, weight: 600 });
  const ch = beadChain(g, { x: 520, y: 380, aa: AA, numbers: true, s: 1.3 });
  const [bx, by] = ch.pt(5);
  const sw = G(g, { o: 0 }); show(sw, tS + 3.9, .4);
  mArrow(sw, [bx, 560], [bx, 488], { color: COL.chalk, w: 4, head: 14 });
  runs(sw, [['Glu', PC.acidic], [' → ', COL.chalk], ['Val', PC.branched]], { x: bx, y: 600, size: 34 });
  wLabel(sw, 'glutamic acid → valine, at position 6', { x: bx, y: 640, size: 24, fill: COL.dim, weight: 600, o: 1 });
  say(g, 'one bead out of 146', 520, 700, 16.1, { size: 26, fill: COL.chalk });
  // the red blood cell
  const cell = redCell(g, { x: 1230, y: 390, R: 130 }); show(cell, 4.2, .6);
  const cl = stepText(g, [[4.4, 'red blood cell'], [tD + 2.6, 'sickle cell']], { x: 1230, y: 580, size: 28, fill: '#f08c7a' });
  say(g, 'hemoglobin clumps', 1230, 225, tD + 1, { size: 24, fill: '#e8a0a0' });
  const cap = G(p, { o: 0 }); show(cap, tD + 5, .5);
  box(cap, 260, 750, 1080, 110, { stroke: PC.primary, sw: 3 });
  wLabel(cap, 'one changed amino acid → a physiological defect', { x: 800, y: 800, size: 34, weight: 800, fill: PC.primary, o: 1 });
  say(cap, '(not every change does this)', 800, 840, 27.2, { size: 22, fill: COL.dim, weight: 600 });
  clockRun(t => {
    ch.reveal(mRamp(t, .3, 3)).numbers(mRamp(t, 3.8, 5.6)).swap(5, 'branched', mRamp(t, tS + 3.9, tS + 5), 'Val').glow(5, mRamp(t, tS + .3, tS + .9));
    cell.set(io(mRamp(t, tD + .6, tD + 2.6)), io(mRamp(t, tD + .2, tD + 1.6)));
    cl.set(t);
  }, D);
}],

/* ---------- q1 ---------- */
['q1', 'Quick check', (m, D) => {
  const p = panel(0);
  wLabel(p, 'which one is number 1?', { x: 320, y: 220, size: 30, weight: 800, fill: PC.primary, o: 1 });
  const ch = beadChain(p, { x: 320, y: 430, aa: ['Val', 'His', 'Leu', 'Thr', 'Pro', 'Val', 'Glu', 'Lys'], s: .85 });
  const [nx, ny] = ch.endPt('N'), [cx, cy] = ch.endPt('C');
  wLabel(p, '?', { x: nx, y: ny + 80, size: 48, weight: 800, fill: PC.nTerm, o: 1 });
  wLabel(p, '?', { x: cx, y: cy + 80, size: 48, weight: 800, fill: PC.cTerm, o: 1 });
}, { ask: done => quiz(SIDE, [{
  id: 'c-end', prompt: ['Which end of the chain is amino acid number one?'],
  build: choice([['the C-terminal end (free carboxyl group)'], ['the N-terminal end (free amino group)'], ['the middle of the chain'], ['either end: it does not matter']], 1,
    'Right. Amino acids are counted from the N-terminal end, the one with the free amino group.',
    ['The C-terminal end is where the counting stops: it holds the last amino acid, with the free carboxyl group.', null,
      'The middle has no free group at all. Counting starts at an end: the one with the free NH₂.',
      'It matters: the sequence is always read and numbered from the N-terminal end, so "position 6" means one bead.']),
}], done) }],

/* ---------- secondary ---------- */
['secondary', 'Secondary structure', (m, D) => {
  const p = panel(0), tF = m('fold');
  wLabel(p, 'secondary structure', { x: 800, y: 80, size: 44, fill: PC.secondary, weight: 800, o: 1 });
  const sub = say(p, 'the chain does not stay stretched out', 800, 128, 2, { size: 26, fill: COL.dim, weight: 600 }); hide(sub, tF - .4, .4);
  // the backbone, stretched
  const A = G(p, { o: 1 }); hide(A, tF - .1, .6);
  const bb = backbone(A, { x: 800, y: 420, units: 6, s: 1.5 });
  const [ox, oy] = bb.pt(0, 1, 'O'), [hx, hy] = bb.pt(0, 2, 'H');

    wChem(g, a, { x: 500, y: y - 6, size: 32, weight: 700, fill: col, anchor: 'start', o: 1 });

  say(p, 'Now try the practice.', 800, 868, tE, { size: 30, fill: PC.hbond });

], done, 'Chapter practice') }],

].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
