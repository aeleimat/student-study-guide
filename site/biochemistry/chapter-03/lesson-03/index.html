<script>
'use strict';
// Biochemistry, Chapter 3 (Protein structure), lesson 3: a ball of yarn (one thread, folded); the chapter's four-levels
// strip with tertiary and quaternary lit; one chain of helices, sheets and loops folding into a globule (tertiary
// structure; the slide's "domain" handled); shape = function; the four side-chain bonds in a lens (hydrophobic,
// hydrogen, ionic, disulfide) and the core / surface rule; globular and fibrous proteins by axial ratio; quaternary
// structure (subunits packing, their bonds); creatine kinase, lactate dehydrogenase and hemoglobin; which bond acts at
// which level; the strip again with all four levels; practice.
// Plan, errata and beats: books/biochemistry/chapters/chapter-03/lesson-03.md.
const CHAPTER = { number: 303, label: '3, lesson 3', title: 'Tertiary and Quaternary Structure', minutes: 7, language: 'en', lead: false, next: '../lesson-04/' };

/* ---------- small helpers ---------- */
const say = (p, str, x, y, t0, o = {}) => { const e = wChem(p, str, { x, y, weight: 700, ...o, o: 0 }); show(e, t0, .4); return e; };
const SIDE = { x: 650, y: 60, w: 900, cls: 'side' };
const PRACTICE = { x: 0, y: 0, w: 940, cls: 'screen' };
const FIB = '#e8a87c';   // fibrous proteins (the globular ones take the tertiary green)
const COV = '#f08c7a';   // "shape lost"
const box5 = (g, x, y, w, h, { fill = '#0b1626', stroke = COL.faint, sw = 3, rx = 22, fo = 1 } = {}) => mk('rect', { x, y, width: w, height: h, rx, fill, 'fill-opacity': fo, stroke, 'stroke-width': sw }, g);
// scale a group only when the rounded value changes
function setS(e, s) { const v = Math.round(s * 1000) / 1000; if (st(e).s !== v) put(e, { s: v }); return e; }
// one text whose words change at given times [[t, str], …]: it fades fully out before each change and back in after
function stepText(p, steps, { x = 0, y = 0, size = 28, fill = COL.chalk, anchor = 'middle', weight = 700 } = {}) {
  const e = wChem(p, steps[0][1], { x, y, size, fill, anchor, weight, o: 0 });
  return Object.assign(e, {
    set(t) {
      let i = -1; for (let j = 0; j < steps.length; j++) if (t >= steps[j][0]) i = j;
      wChemSet(e, steps[Math.max(0, i)][1]);
      const nx = steps[i + 1] ? steps[i + 1][0] : null;
      mO(e, i < 0 ? 0 : mRamp(t, steps[i][0], steps[i][0] + .3) * (nx == null ? 1 : 1 - mRamp(t, nx - .3, nx)));
      return e;
    },
  });
}
// a coloured pill with dark text (a side-chain group), origin = its centre
function badge(p, str, { x = 0, y = 0, fill = PC.neutral, size = 24, w } = {}) {
  const g = G(p, { x, y }), ww = w ?? Math.round(uiW(str.replace(/[_^]/g, ''), size) * 1.1 + 26), hh = size + 16;
  mk('rect', { x: -ww / 2, y: -hh / 2, width: ww, height: hh, rx: hh / 2, fill, stroke: PC.ink, 'stroke-width': 2.5 }, g);
  wChem(g, str, { y: size * .36, size, fill: PC.ink, weight: 800, o: 1 });
  return g;
}
// a grey-gold non-polar bead
const npBead = (g, cx, cy, r = 15) => { mk('circle', { cx, cy, r, fill: PC.hydrophobic, stroke: PC.hydrophobicEdge, 'stroke-width': 2.5 }, g); mk('circle', { cx: cx - r * .3, cy: cy - r * .35, r: r * .3, fill: '#fff', 'fill-opacity': .4 }, g); };
// a measuring ruler: a line with end bars, drawn k of the way from its first end
function ruler(p, { color = COL.chalk } = {}) {
  const g = G(p, { o: 0 }), e = path(g, 'M0 0', { stroke: color, 'stroke-width': 3.5, fill: 'none' });
  return Object.assign(g, {
    set(x1, y1, x2, y2, k) {
      const L = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / L * 12, ny = (x2 - x1) / L * 12;
      const ex = x1 + (x2 - x1) * k, ey = y1 + (y2 - y1) * k, f = v => v.toFixed(1);
      mD(e, `M${f(x1 + nx)} ${f(y1 + ny)}L${f(x1 - nx)} ${f(y1 - ny)}M${f(x1)} ${f(y1)}L${f(ex)} ${f(ey)}M${f(ex + nx)} ${f(ey + ny)}L${f(ex - nx)} ${f(ey - ny)}`);
      mO(g, mRamp(k, .12, .25));
      return g;
    },
  });
}
// a compact globular protein drawn as a slightly long ellipsoid (length 2rx, width 2ry) with a folded chain inside
function globShape(p, { x = 0, y = 0, rx = 175, ry = 50, s = 1 } = {}) {
  const g = G(p, { x, y, s });
  mk('ellipse', { rx, ry, fill: PC.tertiary, 'fill-opacity': .16, stroke: PC.tertiary, 'stroke-width': 4 }, g);
  const rows = 4; let d = '';
  for (let j = 0; j < rows; j++) {
    const yy = -ry * .6 + j * ry * 1.2 / (rows - 1), half = rx * Math.sqrt(1 - (yy / ry) ** 2) * .82, dir = j % 2 ? -1 : 1;
    for (let i = 0; i <= 16; i++) {
      const f = i / 16, xx = dir * (-half + 2 * half * f), wy = yy + ry * .09 * Math.sin(f * 14);
      d += (d ? 'L' : 'M') + xx.toFixed(1) + ' ' + wy.toFixed(1);
    }
  }
  path(g, d, { stroke: PC.ribbon, 'stroke-width': 5, fill: 'none', 'stroke-linejoin': 'round' });
  return g;
}

/* ---------- intro backdrop: a ball of yarn on a cloth ---------- */
const YB = { x: 430, y: 450, R: 150 };
function yarnBall(p) {
  const g = G(p);
  mk('rect', { x: 90, y: 150, width: 820, height: 640, rx: 30, fill: '#e9dfc7', stroke: '#cdbb93', 'stroke-width': 4 }, g);
  for (let i = 1; i < 10; i++) path(g, `M${90 + i * 82} 154V786`, { stroke: '#d6c59d', 'stroke-width': 10, 'stroke-opacity': .55 });
  for (let i = 1; i < 8; i++) path(g, `M94 ${150 + i * 80}H906`, { stroke: '#d6c59d', 'stroke-width': 10, 'stroke-opacity': .55 });
  mk('ellipse', { cx: YB.x + 10, cy: YB.y + YB.R - 4, rx: YB.R * .95, ry: 26, fill: '#000', 'fill-opacity': .16 }, g);
  const ball = G(g, { x: YB.x, y: YB.y });
  mk('circle', { r: YB.R, fill: '#d9735a', stroke: '#8f3f2c', 'stroke-width': 5 }, ball);
  [[0, .32], [36, .5], [72, .26], [108, .44], [144, .3], [20, .7], [128, .62], [90, .82]].forEach(([a, k]) =>
    mk('ellipse', { rx: YB.R * .93, ry: YB.R * k, transform: `rotate(${a})`, fill: 'none', stroke: '#f2a68c', 'stroke-width': 5, 'stroke-opacity': .75 }, ball));
  mk('circle', { r: YB.R, fill: 'none', stroke: '#8f3f2c', 'stroke-width': 5 }, ball);
  // the loose thread: from the ball's lower right across the cloth; .set(u) shows u of it
  const P0 = [YB.x + YB.R * Math.cos(.45), YB.y + YB.R * Math.sin(.45)], N = 48, pts = [];
  for (let i = 0; i <= N; i++) { const f = i / N; pts.push([P0[0] + f * 360, P0[1] + f * 110 + 22 * Math.sin(f * 9) * f]); }
  const thread = path(g, 'M0 0', { stroke: '#d9735a', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' });
  return Object.assign(g, {
    ball,
    set(u) {
      const m = Math.max(1, u * N), n = Math.floor(m), fr = m - n; let d = '';
      for (let i = 0; i <= Math.min(n, N); i++) d += (i ? 'L' : 'M') + pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1);
      if (n < N && fr > 0) { const a = pts[n], b = pts[n + 1]; d += `L${(a[0] + (b[0] - a[0]) * fr).toFixed(1)} ${(a[1] + (b[1] - a[1]) * fr).toFixed(1)}`; }
      mD(thread, d); return g;
    },
  });
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- intro ---------- */
['intro', 'A ball of yarn and the four levels', (m, D) => {
  const p = panel(0), tY = m('yarn'), tS = m('strip'), tL = m('lit');
  const cam = camera(p, D, { x: 800, y: 450, z: 1 }), W = cam.world;
  const back = G(W, { o: 0 }); show(back, .2, .6);
  const yb = yarnBall(back);
  const yl = G(back, { o: 0 }); show(yl, tY + .4, .4);
  wLabel(yl, 'one long thread, folded into a shape', { x: 500, y: 850, size: 30, weight: 700, o: 1 });
  const ttl = G(p, { o: 0, y: 24 });
  wLabel(ttl, 'BIOCHEMISTRY · CHAPTER 3 · LESSON 3', { x: 1250, y: 270, size: 24, fill: COL.dim, o: 1 });
  ['Tertiary and', 'quaternary', 'structure'].forEach((s, i) => wLabel(ttl, s, { x: 1250, y: 350 + i * 64, size: 52, o: 1 }));
  wLabel(ttl, 'how a protein takes its final shape', { x: 1250, y: 560, size: 26, fill: COL.dim, weight: 500, o: 1 });
  tw(ttl, { o: 1, y: 0 }, .2, 1.1, out); hide(ttl, tS - .5, .5);
  cam.to({ x: YB.x, y: YB.y, z: 2.2 }, tS - .3, 1.3);
  hide(cam.el, tS + .4, .6);
  // the chapter strip, pushed in from the yarn; at the end the camera moves into the tertiary panel
  const wrap = G(p, { x: 800, y: 450, s: .85, o: 0 }), I = G(wrap, { x: -800, y: -450 });
  tw(wrap, { s: 1, o: 1 }, tS + .4, 1, out);
  const strip = levelsStrip(I, { x: 800, y: 420 });
  const recap = G(I, { o: 0 }); show(recap, tS + 2.4, .5); hide(recap, tL - .4, .4);
  wLabel(recap, 'lesson two: the first two levels', { x: 800, y: 680, size: 28, fill: COL.dim, weight: 700, o: 1 });
  const today = G(I, { o: 0 }); show(today, tL + 1.2, .5);
  wLabel(today, 'today:', { x: 800, y: 660, size: 26, fill: COL.dim, weight: 600, o: 1 });
  wLabel(today, 'tertiary', { x: 780, y: 706, size: 36, fill: PC.tertiary, weight: 800, anchor: 'end', o: 1 });
  wLabel(today, '+', { x: 800, y: 706, size: 36, weight: 800, o: 1 });
  wLabel(today, 'quaternary', { x: 820, y: 706, size: 36, fill: PC.quaternary, weight: 800, anchor: 'start', o: 1 });
  hide(today, D - 2.6, .4);
  tw(wrap, { x: 800 - 1.7 * 180, y: 450 - 1.7 * -64, s: 1.7 }, D - 2.4, 2.2, soft);
  clockRun(t => {
    // the thread end pulls out and winds back; the ball gives one small pulse as it winds in
    yb.set(.35 + .65 * io(mRamp(t, tY + .2, tY + 1.4)) * (1 - io(mRamp(t, tY + 1.8, tY + 3))));
    setS(yb.ball, 1 + .05 * mBump(t, tY + 2.6, tY + 3.4));
    const rk = mRamp(t, tS + 2.6, tS + 3.4) * (1 - mRamp(t, tL - .5, tL));
    strip.tick('primary', rk).tick('secondary', rk);
    strip.focus(['tertiary', 'quaternary'], io(mRamp(t, tL, tL + .9)));
    const gk = mRamp(t, tL + .3, tL + 1) * (1 - mRamp(t, D - 2.6, D - 2));
    strip.glow('tertiary', gk).glow('quaternary', gk);
  }, D);
}],

/* ---------- tert ---------- */
['tert', 'Tertiary structure: one chain folded', (m, D) => {
  const p = panel(0), tP = m('parts'), tF = m('fold'), tD = m('domain'), tN = m('fn');
  say(p, 'one polypeptide chain', 800, 110, .3, { size: 32, fill: COL.dim });
  const wrap = G(p, { x: 800, y: 420, s: .9, o: 0 }); tw(wrap, { s: 1, o: 1 }, .1, 1, out);
  const gl = globule(wrap, { R: 150, s: 1.25, pocket: true, pa: -40, beads: 10 });
  const tl = G(p, { o: 0 }); show(tl, tF + 5.1, .5); tw(tl, { o: .3 }, tN + 5.6, .5);
  wLabel(tl, 'tertiary structure', { x: 800, y: 690, size: 44, fill: PC.tertiary, weight: 800, o: 1 });
  wLabel(tl, 'the final 3D shape of one chain', { x: 800, y: 735, size: 28, fill: COL.chalk, weight: 600, o: 1 });
  // domain: the slide's word, then what a domain strictly is
  const sl = G(p, { o: 0 }); show(sl, tD + .4, .4); hide(sl, tN - .5, .5);
  wLabel(sl, 'slide 15 calls it', { x: 1300, y: 300, size: 26, fill: COL.dim, weight: 600, o: 1 });
  wLabel(sl, '“domain”', { x: 1300, y: 345, size: 36, fill: COL.chalk, weight: 800, o: 1 });
  const q = wLabel(sl, '?', { x: 1300, y: 420, size: 60, fill: PC.glow, weight: 800, o: 0 });
  show(q, tD + 2.8, .3); hide(q, tD + 6, .5);
  const dm = G(p, { o: 0 }); show(dm, tD + 3.2, .4); hide(dm, tN - .5, .5);
  wLabel(dm, 'a domain:', { x: 270, y: 300, size: 30, fill: COL.chalk, weight: 800, o: 1 });
  wLabel(dm, 'a compact region', { x: 270, y: 340, size: 26, fill: COL.chalk, weight: 600, o: 1 });
  wLabel(dm, 'inside the fold', { x: 270, y: 374, size: 26, fill: COL.chalk, weight: 600, o: 1 });
  mArrow(dm, [380, 380], [600, 440], { color: COL.chalk, w: 4, head: 14 });
  const sv = say(p, 'a long chain may fold into several', 270, 470, tD + 6.4, { size: 22, fill: COL.dim, weight: 600 }); hide(sv, tN - .5, .5);
  // function: the pocket and its partner; then the shape loosens and the partner can no longer fit
  const fn = say(p, 'shape = function', 1300, 380, tN + 2.4, { size: 36, fill: PC.glow });
  const lost = G(p, { o: 0 }); show(lost, tN + 5.6, .4);
  wLabel(lost, 'shape lost', { x: 1300, y: 470, size: 32, fill: COV, weight: 800, o: 1 });
  wLabel(lost, 'activity lost', { x: 1300, y: 512, size: 32, fill: COV, weight: 800, o: 1 });
  void fn;
  clockRun(t => {
    gl.fold(io(mRamp(t, tF + .2, tF + 3.6)));
    gl.labels(mRamp(t, tP + .3, tP + 1) * (1 - mRamp(t, tF - .4, tF + .1)));
    gl.lobe(0, mRamp(t, tD + 3, tD + 3.5) * (1 - mRamp(t, tN - .6, tN)));
    gl.lobe(1, mRamp(t, tD + 6.4, tD + 6.9) * (1 - mRamp(t, tN - .6, tN)));
    const loose = io(mRamp(t, tN + 5.4, tN + 7));
    gl.pocket(mRamp(t, tN + 2.2, tN + 2.8) * (1 - loose));
    gl.partner(io(mRamp(t, tN + 2.6, tN + 4.2)) * (1 - mRamp(t, tN + 5.2, tN + 5.8)));
    gl.tangle(.55 * loose);
  }, D);
}],

/* ---------- bonds ---------- */
['bonds', 'The bonds that hold the fold', (m, D) => {
  const p = panel(0), tSd = m('side'), tHy = m('hyd'), tHb = m('hb'), tIo = m('ion'), tSs = m('ss'), tA = m('all'), tO = m('out');
  // the globule at left with a lens ring on it; the lens box at right
  const gl = globule(p, { x: 270, y: 420, R: 110, seed: 3 });
  const lens = G(p, { o: 0 }); show(lens, tSd - .2, .5);
  mk('circle', { cx: 330, cy: 470, r: 42, fill: 'none', stroke: PC.glow, 'stroke-width': 4 }, lens);
  path(lens, 'M360 440L540 150M360 500L540 730', { stroke: PC.glow, 'stroke-width': 2.5, 'stroke-dasharray': '8 8', 'stroke-opacity': .7 });
  box5(lens, 540, 140, 1020, 590, { fill: '#0b1626', stroke: PC.glow, sw: 3 });
  const inner = G(lens);
  wLabel(inner, 'between side chains (R), not the backbone', { x: 1050, y: 190, size: 28, fill: COL.chalk, weight: 700, o: 1 });
  const strand = y => { let d = ''; for (let i = 0; i <= 40; i++) { const f = i / 40; d += (i ? 'L' : 'M') + (570 + f * 960).toFixed(1) + ' ' + (y + 10 * Math.sin(f * 15)).toFixed(1); } return d; };
  path(inner, strand(262), { stroke: PC.ribbon, 'stroke-width': 10, fill: 'none' });
  path(inner, strand(598), { stroke: PC.ribbon, 'stroke-width': 10, fill: 'none' });
  const PX = [690, 930, 1170, 1410], YT = 352, YB2 = 508;
  // stalks from the backbones to the side chains
  const yS = x => 262 + 10 * Math.sin((x - 570) / 960 * 15), yS2 = x => 598 + 10 * Math.sin((x - 570) / 960 * 15);
  const st0 = path(inner, 'M0 0', { stroke: PC.stick, 'stroke-width': 5 });
  PX.slice(1).forEach(x => path(inner, `M${x} ${262 + 10 * Math.sin((x - 570) / 960 * 15)}V${YT}M${x} ${598 + 10 * Math.sin((x - 570) / 960 * 15)}V${YB2}`, { stroke: PC.stick, 'stroke-width': 5 }));
  // 1 hydrophobic: grey-gold clusters that close the gap; water leaves
  const npT = G(inner, { x: PX[0], y: YT }), npB = G(inner, { x: PX[0], y: YB2 });
  [[-15, 0], [15, 0], [0, 22]].forEach(([a, b]) => npBead(npT, a, b));
  [[-15, 0], [15, 0], [0, -22]].forEach(([a, b]) => npBead(npB, a, b));
  const wat = [[-40, 426, -120, 400], [38, 418, 115, 440], [0, 446, -105, 500]].map(([dx, y, ex, ey]) => ({ w: waterMolecule(inner, { s: .32, face: false, o: 0 }), a: [PX[0] + dx, y], b: [PX[0] + ex, ey] }));
  // 2 hydrogen bond: hydroxy O–H above, amide C=O below
  const hbT = badge(inner, 'O–H', { x: PX[1], y: YT + 18, fill: PC.hydroxy }); void hbT;
  badge(inner, 'C=O', { x: PX[1], y: YB2 - 18, fill: PC.amide });
  const hb = hBondMark(inner);
  // 3 ionic: COO⁻ above, NH₃⁺ below
  badge(inner, 'COO^−', { x: PX[2], y: YT + 18, fill: PC.acidic });
  badge(inner, 'NH_3^+', { x: PX[2], y: YB2 - 18, fill: PC.basic });
  const sb = saltBridge(inner, { r: 14, arrows: false });
  // 4 disulfide: two SH; the H atoms leave and S–S forms
  const ss = disulfideMark(inner, { w: 12, r: 18, labels: false });
  const sT = G(inner, { x: PX[3], y: YT + 10 }), sB = G(inner, { x: PX[3], y: YB2 - 10 });
  [sT, sB].forEach(g => { mk('circle', { r: 18, fill: PC.S, stroke: PC.SEdge, 'stroke-width': 3 }, g); wLabel(g, 'S', { y: 8, size: 20, fill: PC.ink, weight: 800, o: 1 }); });
  const hs = [[PX[3] + 34, YT + 32], [PX[3] + 34, YB2 - 32]].map(([x, y]) => { const g = G(inner, { x, y }); mk('circle', { r: 12, fill: PC.h, stroke: PC.hEdge, 'stroke-width': 2 }, g); wLabel(g, 'H', { y: 5, size: 14, fill: PC.ink, weight: 800, o: 1 }); return { g, x, y }; });
  const twoH = say(inner, '2 H leave', PX[3] - 36, 438, tSs + 2.4, { size: 20, fill: COL.dim, anchor: 'end' }); hide(twoH, tSs + 5, .4);
  // labels under the pairs, as each bond is named
  const LB = [['hydrophobic', 'interactions', PC.hydrophobic, tHy + .3], ['hydrogen', 'bond', PC.hbond, tHb + .3], ['ionic bond', '(salt bridge)', PC.acidic, tIo + .4], ['disulfide', 'bridge', PC.ss, tSs + .5]];
  LB.forEach(([a, b, c, t0], i) => { const g = G(inner, { o: 0 }); show(g, t0, .4); wLabel(g, a, { x: PX[i], y: 650, size: 26, fill: c, weight: 800, o: 1 }); wLabel(g, b, { x: PX[i], y: 682, size: 26, fill: c, weight: 800, o: 1 }); });
  const cov = G(inner, { o: 0 }); show(cov, tSs + 3.6, .4);
  wLabel(cov, 'covalent: strong', { x: PX[3], y: 716, size: 20, fill: PC.ss, weight: 700, o: 1 });
  const ic = G(p, { o: 0 }); show(ic, tIo + 6.6, .4); hide(ic, tSs - .2, .4);
  const IX = 1000, w1 = uiW('slide 16: “', 24), w2 = uiW('iconic', 24);
  wLabel(ic, 'slide 16: “iconic” bond', { x: IX, y: 790, size: 24, fill: COL.dim, weight: 600, anchor: 'start', o: 1 });
  path(ic, `M${IX + w1 - 2} 782H${IX + w1 + w2 + 2}`, { stroke: COV, 'stroke-width': 3.5 });
  wLabel(ic, '→ ionic bond', { x: IX + uiW('slide 16: “iconic” bond', 24) + 24, y: 790, size: 24, fill: PC.acidic, weight: 800, anchor: 'start', o: 1 });
  // all: the four bonds on the globule at once
  const al = G(p, { o: 0 }); show(al, tA + .4, .4);
  wLabel(al, 'most are weak,', { x: 270, y: 640, size: 26, fill: COL.chalk, weight: 700, o: 1 });
  wLabel(al, 'together they', { x: 270, y: 674, size: 26, fill: COL.chalk, weight: 700, o: 1 });
  wLabel(al, 'lock the shape', { x: 270, y: 708, size: 26, fill: COL.chalk, weight: 700, o: 1 });
  // out: a cut-away of the fold, core and surface
  hide(inner, tO + .1, .5);
  const cut = G(lens, { o: 0 }); show(cut, tO + .5, .5);
  const hc = hydrophobicCore(cut, { x: 1000, y: 455, R: 200, labels: false });
  wLabel(cut, 'a cut through the fold', { x: 1050, y: 190, size: 28, fill: COL.chalk, weight: 700, o: 1 });
  const cl = G(cut, { o: 0 }); show(cl, tO + 3.2, .5);
  wLabel(cl, 'non-polar:', { x: 1300, y: 360, size: 26, fill: PC.hydrophobic, weight: 800, anchor: 'start', o: 1 });

  // end: an arrow back from quaternary to primary, "each level rests on the one below"
  const ar = G(p, { o: 0 });
  path(ar, 'M1340 730C1100 790 500 790 290 730', { stroke: PC.glow, 'stroke-width': 4, fill: 'none', 'stroke-dasharray': '10 8' });
  path(ar, 'M306 716L284 728L308 744', { stroke: PC.glow, 'stroke-width': 4, fill: 'none' });
  wLabel(ar, 'each level rests on the one below', { x: 800, y: 820, size: 28, fill: PC.glow, weight: 700, o: 1 });
  say(p, 'Now try the practice.', 800, 870, tE + 2.1, { size: 30, fill: PC.hbond });
  clockRun(t => {
    let lit = []; TL.forEach((t0, i) => { if (t >= t0) lit.push(LV[i]); });
    strip.focus(lit.length ? lit : ['primary'], mRamp(t, TL[0] - .4, TL[0]) * (1 - mRamp(t, tE, tE + .6)));
    strip.tags(mRamp(t, TL[0], TL[0] + .5));
    LV.forEach((lv, i) => strip.glow(lv, mBump(t, TL[i], TL[i] + 2.4)).tick(lv, mRamp(t, TL[i] + 1.6, TL[i] + 2)));
    mO(ar, mRamp(t, tE + .2, tE + .6) * (.55 + .45 * Math.cos(Math.PI * Math.max(0, t - tE - .6) / 1.6) ** 2));
  }, D);
}],

/* ---------- final1 ---------- */
['final1', 'Chapter practice', (m, D) => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  const frame = g => box5(g, 980, 90, 580, 720);
  const XC = 1270;
  at('tert', g => {
    frame(g);
    globule(g, { x: XC, y: 400, R: 140, seed: 2 });
    wLabel(g, '?', { x: XC + 190, y: 260, size: 60, fill: PC.glow, weight: 800, o: 1 });
    wLabel(g, 'one chain, fully folded', { x: XC, y: 700, size: 26, weight: 700, o: 1 });
  });
  at('bondlevel', g => {
    frame(g);
    [['peptide', 220], ['hydrogen', 420], ['disulfide', 620]].forEach(([k, y]) => bondChip(g, k, { x: XC, y, w: 260 }));
  });
  at('ratio', g => {
    frame(g);
    globShape(g, { x: XC, y: 280, rx: 140, ry: 40 });
    collagenRope(g, { x: XC, y: 560, len: 480, amp: 16, w: 7 });
    const r1 = ruler(g), r2 = ruler(g);
    r1.set(XC - 140, 345, XC + 140, 345, 1); r2.set(XC - 240, 610, XC + 240, 610, 1);
    wLabel(g, 'length ÷ width = ?', { x: XC, y: 740, size: 26, weight: 700, o: 1 });
  });
  at('quat', g => {
    frame(g);
    subunitComplex(g, { x: XC, y: 420, n: 4, R: 90 }).pack(.75);
    wLabel(g, '?', { x: XC, y: 440, size: 60, fill: PC.glow, weight: 800, o: 1 });
  });
  at('counts', g => {
    frame(g);
    [['creatine kinase', 230], ['lactate dehydrogenase', 440], ['hemoglobin', 650]].forEach(([n, y]) => {
      box5(g, 1020, y - 80, 500, 160, { stroke: COL.faint, sw: 2.5 });
      wLabel(g, n, { x: XC, y: y - 22, size: 28, weight: 800, o: 1 });
      wLabel(g, '? subunits', { x: XC, y: y + 34, size: 26, fill: PC.quaternary, weight: 700, o: 1 });
    });
  });
  at('hb', g => {
    frame(g);
    hemoglobin(g, { x: XC, y: 420, R: 100 }).labels(0);
    wLabel(g, 'hemoglobin', { x: XC, y: 720, size: 28, weight: 800, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('tert');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-tert', prompt: ['What is the tertiary structure of a protein?'],
    build: withPic('tert', choice([['the order of amino acids in the chain'], ['the helices and sheets on their own'], ['the final 3D shape of one folded chain'], ['the way several chains pack together']], 2,
      'Right. Tertiary structure is the whole chain folded into its final, working 3D shape.',
      ['That is the primary structure: the sequence, held by peptide bonds.',
        'Helices and sheets are the secondary structure. Tertiary structure packs them into one shape.', null,
        'Several chains packing together is the quaternary structure.'])) },
  { id: 'p-bondlevel', prompt: ['Which level does each bond belong to?'],
    build: withPic('bondlevel', grid([
      { parts: ['peptide bond'], ans: ['p'], why: 'Joins the amino acids.' },
      { parts: ['H-bond, backbone to backbone'], ans: ['s'], why: 'Helix and sheet.' },
      { parts: ['S–S, side chain to side chain'], ans: ['t'], why: 'Holds the fold.' },
    ], [['p', 'primary', null, 'P'], ['s', 'secondary', null, 'S'], ['t', 'tertiary', null, 'T']], { multi: false, text: true })) },
  { id: 'p-ratio', prompt: ['Globular or fibrous?'],
    build: withPic('ratio', grid([
      { parts: ['axial ratio about 3 to 4'], ans: ['g'], why: 'Under 10: compact.' },
      { parts: ['axial ratio over 10'], ans: ['f'], why: 'A long rod.' },
      { parts: ['keratin'], ans: ['f'], why: 'Hair and nail.' },
    ], [['g', 'globular', null, 'G'], ['f', 'fibrous', null, 'F']], { multi: false, text: true })) },
  { id: 'p-quat', prompt: ['What does quaternary structure describe?'],
    build: withPic('quat', choice([['the shape of a single chain'], ['how several folded subunits pack together'], ['the helices and sheets in a chain'], ['the sequence of amino acids']], 1,
      'Right. Quaternary structure is the packing of two or more subunits, each folded in its own right.',
      ['The shape of a single chain is its tertiary structure.', null,
        'Helices and sheets are secondary structure, inside one chain.',
        'The sequence is the primary structure.'])) },
  { id: 'p-blanks', prompt: ['How many subunits does each protein have?'],
    build: withPic('counts', blanks([
      { parts: ['creatine kinase: ', { box: '2' }, ' subunits'], why: 'A dimer.', hint: 'It is a dimer.' },
      { parts: ['lactate dehydrogenase: ', { box: '4' }, ' subunits'], why: 'A tetramer.', hint: 'It is a tetramer.' },
      { parts: ['hemoglobin: ', { box: '4' }, ' subunits'], why: 'Two alpha and two beta.', hint: 'Count the alpha and beta chains.' },
    ])) },
  { id: 'p-hb', prompt: ['Which describes hemoglobin?'],
    build: withPic('hb', choice([['four identical alpha chains'], ['two alpha and two beta chains, each with a heme group'], ['one long chain with four hemes'], ['four beta chains']], 1,
      'Right. Hemoglobin is a tetramer of two alpha and two beta chains, and each holds a heme with an iron ion.',
      ['It has two kinds of chain, not one: two alpha and two beta.', null,
        'One chain could have no quaternary structure. Hemoglobin has four separate chains.',
        'Only two of the four are beta chains. The other two are alpha.'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
