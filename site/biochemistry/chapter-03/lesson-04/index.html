const R1 = v => Math.round(v * 10) / 10;

// pose transform keys (rounded) only when they change
function pose(e, o) {

// an attribute written only when it changes
function attr(e, k, v) { if (e['_l' + k] !== v) { e.setAttribute(k, v); e['_l' + k] = v; } return e; }

// keyframes [[t, a, b, …], …]: eased between keys, held before the first and after the last
function keyAt(t, K) {

  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const a = K[i - 1], b = K[i], f = soft((t - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => v + (b[j + 1] - v) * f); }

}
// a smooth path through points (Catmull-Rom)
function smooth(pts, closed = false) {
  const n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const a = P(i - 1), b = P(i), c = P(i + 1), e = P(i + 2);
    d += `C${f1(b[0] + (c[0] - a[0]) / 6)} ${f1(b[1] + (c[1] - a[1]) / 6)} ${f1(c[0] - (e[0] - b[0]) / 6)} ${f1(c[1] - (e[1] - b[1]) / 6)} ${f1(c[0])} ${f1(c[1])}`;

}
function blob(rx, ry, seed = 1, wob = .07, n = 36, cx = 0, cy = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI, k = 1 + wob * (Math.sin(3 * a + seed) + .6 * Math.sin(5 * a + 2.1 * seed)); pts.push([cx + rx * k * Math.cos(a), cy + ry * k * Math.sin(a)]); }
  return smooth(pts, true);
}
// a dark pill with text, origin at its centre; .w its width
function pill(p, str, { x = 0, y = 0, size = 24, fill = COL.chalk, edge = COL.chalk, o = 1, w } = {}) {

  wChem(g, str, { y: size * .36, size, fill, weight: 700, o: 1 });

}

function arrowLine(p, [x1, y1], [x2, y2], { color = COL.chalk, w = 6, head = 18 } = {}) {

    set(k) {
      const e = mClamp(k), ex = x1 + (x2 - x1) * e, ey = y1 + (y2 - y1) * e;

/* ---------- the egg in the pan (intro) ---------- */

/* ---------- the six causes ---------- */
const CAUSES = [

const GROUPS = [['heat and pressure', '#f39a2b', '1 · 2'], ['shaking', '#7fd1b9', '3'], ['chemicals', '#ff7aa8', '4'], ['radiation', '#9a6cd0', '5 · 6']];

    for (let i = 0; i <= 6; i++) { const a = dg(-210 + i * 40); path(g, `M${f1(36 * Math.cos(a))} ${f1(36 * Math.sin(a))}L${f1(46 * Math.cos(a))} ${f1(46 * Math.sin(a))}`, { stroke: COL.dim, 'stroke-width': 3 }); }

function iconDig(p, { x = 0, y = 0, s = 1 } = {}) {

const EFFECTS = [
  ['enz', 'enzymes lose catalytic activity', 'the active site needs the folded shape', 'lost'],

/* ---------- enzymes that cut (cooking) ---------- */
function chomper(p, { r = 22 } = {}) {
  const g = G(p, { o: 0 });
  const b = path(g, 'M0 0', { fill: '#8fd6b0', stroke: '#4f9a78', 'stroke-width': 2.5 });
  return Object.assign(g, {

    const v = vsRows(g, { x: 1140, y: 280, s: .9, names: false }); put(v.r1, { o: 1 }); put(v.r2, { o: 1 }); v.set(1, 1);
    put(v.r2, { y: 165 });
    wLabel(g, 'how do they differ?', { x: 1270, y: 770, size: 26, weight: 700, o: 1 });
  });
  at('levels', g => {
    frame(g);
    levelsStrip(g, { x: 1225, y: 420, s: .64, vertical: true });
    path(g, 'M1445 162H1462V505H1445M1445 560H1462V694H1445', { stroke: '#ffd27a', 'stroke-width': 4 });
    wLabel(g, '?', { x: 1500, y: 350, size: 40, weight: 800, fill: '#ffd27a', o: 1 });
    wLabel(g, '?', { x: 1500, y: 642, size: 40, weight: 800, fill: '#ffd27a', o: 1 });
    wLabel(g, 'count the levels', { x: 1270, y: 770, size: 26, weight: 700, o: 1 });
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('keep');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-keep', prompt: ['Which structure survives denaturation?'],
    build: withPic('keep', choice([['the α-helices and β-sheets'], ['the primary structure: the sequence and its peptide bonds'], ['the folded globule'], ['the packing of the subunits']], 1,
      'Right. Denaturation breaks the weak bonds of the fold. The sequence and its peptide bonds stay.',
      ['Helices and sheets are the secondary structure. Their hydrogen bonds break, and they unwind.', null,
        'The folded globule is the tertiary structure, held by weak side-chain bonds. It opens.',
        'Packed subunits are the quaternary structure. They are the first to come apart.'])) },
  { id: 'p-sort', prompt: ['Which kind of cause is each?'],
    build: withPic('sort', grid([
      { parts: ['whisking egg white'], ans: ['p'], why: 'Physical: shaking.' },
      { parts: ['curdling milk with acid'], ans: ['c'], why: 'Chemical: an acid.' },
      { parts: ['a pressure cooker'], ans: ['p'], why: 'Physical: pressure.' },
      { parts: ['strong alkali on egg white'], ans: ['c'], why: 'Chemical: an alkali.' },
    ], [['p', 'physical', null, 'P'], ['c', 'chemical', null, 'C']], { multi: false, text: true })) },
  { id: 'p-effect', prompt: ['On denaturation, does each fall or rise?'],
    build: withPic('effect', grid([
      { parts: ['solubility'], ans: ['f'], why: 'Falls: the chains clump.' },
      { parts: ['viscosity'], ans: ['r'], why: 'Rises: it thickens.' },
      { parts: ['digestibility'], ans: ['r'], why: 'Rises: the chain is open.' },
      { parts: ['enzyme activity'], ans: ['f'], why: 'Falls: the shape is lost.' },
    ], [['f', 'falls', null, 'F'], ['r', 'rises', null, 'R']], { multi: false, text: true })) },
  { id: 'p-egg', prompt: ['Why is a boiled egg easier to digest than a raw one?'],
    build: withPic('egg', choice([['heat unfolds the protein, so enzymes reach its peptide bonds'], ['heat breaks every peptide bond already'], ['heat adds amino acids to the protein'], ['heat folds the protein into a tighter shape']], 0,
      'Right. The unfolded chain lies open, and digestive enzymes can reach its peptide bonds.',
      [null, 'Heat breaks weak bonds, not peptide bonds: the chain stays whole. Digestion still has to cut it.',
        'Nothing is added: denaturation changes the shape, not the sequence.',
        'Heat does the opposite: it unfolds the protein.'])) },
  { id: 'p-vs', prompt: ['How does a misfolded protein differ from a denatured one?'],
    build: withPic('vs', choice([['its peptide bonds are broken'], ['its amino acid sequence must be different'], ['it never reached a stable fold, and it clumps into insoluble aggregates'], ['there is no difference']], 2,
      'Right. A denatured protein was folded until something unfolded it; a misfolded one never reached a stable fold, and it aggregates.',
      ['Neither breaks peptide bonds: both keep their chain whole.',
        'A misfolded protein need not have a different sequence. The problem is the fold it fails to reach.', null,
        'They differ: one was folded and then unfolded, the other never folded well and clumps.'])) },
  { id: 'p-levels', prompt: ['Count the levels of structure:'],
    build: withPic('levels', blanks([
      { parts: ['denaturation destroys ', { box: '3' }, ' of the four levels'], why: 'Secondary, tertiary and quaternary.', hint: 'Count the levels held by weak bonds.' },
      { parts: ['and keeps ', { box: '1' }, ', the primary structure'], why: 'The sequence and its peptide bonds stay.', hint: 'Only one level survives.' },
    ])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
