    ['An immunoglobulin is an antibody: it defends against germs.', 'An enzyme speeds up a reaction, such as digestion. It does not carry oxygen.', null,
      'Collagen is a supporting protein, in skin and bone. The oxygen carrier is in the red blood cells.']),
}], done) }],

/* ---------- tree ---------- */
['tree', 'The protein family tree', (m, D) => {
  const p = panel(0), tR = m('root'), tB = m('branch'), tD = m('dim');
  const TREE_COLS = [PC.simple, PC.basic, PC.hydroxy, PC.acidic, PC.aromatic, PC.branched, PC.hetero, PC.imino];
  const S0 = 46 / 110;
  const wc = G(p, { x: 800, y: 420 });
  const ch = beadChain(wc, { n: 8, sp: 110, r: 17 / S0, chips: false, endText: false, colors: TREE_COLS });
  const el = G(p, { o: 0 }); show(el, 2.6, .5); hide(el, tR - .2, .4);
  wLabel(el, 'N-terminal end', { x: 345, y: 520, size: 28, fill: PC.nTerm, weight: 800, o: 1 });
  wLabel(el, 'C-terminal end', { x: 1255, y: 520, size: 28, fill: PC.cTerm, weight: 800, o: 1 });
  tw(wc, { y: 720, s: S0 }, tR + .1, 1.5);
  const tree = proteinTree(p, { x: 800, y: 450, o: 0 });
  // the branch captions, one as each class is named (the kit shows its own three at once; they stay off here)
  const capT = { simple: tB + 3.3, conjugated: tB + 6.5, derived: tB + 10.4 };
  const caps = Object.fromEntries(['simple', 'conjugated', 'derived'].map(nm => [nm, wLabel(p, { simple: 'amino acids only', conjugated: 'protein + non-protein part', derived: 'products of breakdown' }[nm], { x: 800 + { simple: -470, conjugated: 0, derived: 470 }[nm], y: 524, size: 20, fill: COL.dim, weight: 600, o: 0 })]));
  const nxt = say(p, 'next lesson: simple proteins', 330, 400, tD + 1.4, { size: 28, fill: PC.simpleP });
  void nxt;
  const gk = t => keyAt(t, [[tR + 1.6, .15], [tR + 2.4, .32], [tR + 5.4, .8]])[0];
  clockRun(t => {
    ch.reveal(ramp(t, .2, 2));
    const handed = t >= tR + 1.6 ? 1 : 0;   // the chain becomes the tree's root in one frame (same place, same size)
    mO(tree, handed); mO(wc, 1 - handed);
    tree.grow(gk(t)).captions(0).focus(['simple'], ramp(t, tD + .4, tD + 1.4));
    for (const nm in caps) mO(caps[nm], ramp(t, capT[nm] - .2, capT[nm] + .3) * (nm === 'simple' ? 1 : 1 - .75 * ramp(t, tD + .4, tD + 1.4)));
  }, D);
}],

/* ---------- wrap ---------- */
['wrap', 'Summary', (m, D) => {
  const p = panel(0), tE = m('end');
  wLabel(p, 'Summary: what proteins are and what they do', { x: 800, y: 62, size: 34, weight: 700, o: 1 });
  const ROWS = [
    ['s1', 'Protein: C, H, O, N (sometimes S)', 'a polymer of amino acids: a polypeptide', PC.simple],
    ['s2', 'Peptide link –CO–NH–', 'COOH of one + NH_2 of the next; water released', PC.peptide],
    ['s3', 'N-terminal (free NH_2) … C-terminal (free COOH)', 'a chain is read from N to C', COL.chalk],
    ['s4', 'Order makes each protein different', 'jobs: enzymes, hormones, hemoglobin, plasma proteins, lipoproteins, antibodies, support', PC.simpleP],
  ];
  const live = [];
  ROWS.forEach(([k, a, b, col], i) => {
    const y = 180 + i * 172, g = G(p, { o: 0 });
    box5(g, 110, y - 74, 1380, 152);
    wChem(g, a, { x: 500, y: y - 6, size: 32, weight: 700, fill: col, anchor: 'start', o: 1 });
    wChem(g, b, { x: 500, y: y + 38, size: i === 3 ? 21 : 25, weight: 500, fill: COL.dim, anchor: 'start', o: 1 });
    if (i === 0) ['C', 'H', 'O', 'N'].forEach((s2, j) => elemChip(g, s2, { x: 170 + j * 70, y, s: .6, name: false }));
    if (i === 1) {
      const w = waterMolecule(g, { x: 300, y: y + 40, s: .4, face: false });
      beadChain(g, { x: 300, y: y - 14, n: 2, sp: 120, r: 26, chips: false, ends: false, colors: [PC.simple, PC.hydroxy] });
      live.push([1, (t, kk) => mPose(w, 300, y + 40 + 8 * kk * Math.sin(2 * Math.PI * t / 2.2), 1)]);
    }
    if (i === 2) { const c = beadChain(g, { x: 300, y, n: 5, sp: 54, r: 18, chips: false, endText: false }); live.push([2, (t, kk) => c.readArrow(1 - kk * (1 - fr(t / 2.6)))]); }
    if (i === 3) ['enz', 'hb', 'ig', 'struct'].forEach((rk, j) => { const ic = roleIcon(g, rk, { x: 160 + j * 88, y: y + 2, s: .32 }); live.push([3, t => ic.set(fr(t / 3 + j * .2))]); });
    show(g, m(k) + .1, .5);
  });
  say(p, 'Now try the practice.', 800, 868, tE, { size: 30, fill: PC.simple });
  const env = (t, i) => { const a = m(ROWS[i][0]) + .8, b = i < 3 ? m(ROWS[i + 1][0]) : D + 1; return ramp(t, a, a + .6) * (1 - ramp(t, b - .6, b)); };
  clockRun(t => live.forEach(([i, f]) => f(t, env(t, i))), D);
}],

/* ---------- final1 ---------- */
['final1', 'Chapter practice', (m, D) => {
  const p = panel(0), pics = {}, at = (k, f) => { const g = G(p, { o: 0 }); f(g); pics[k] = g; };
  const frame = g => box5(g, 980, 90, 580, 720);
  const lab = (g, s, y = 760, fill = COL.chalk) => wChem(g, s, { x: 1270, y, size: 26, weight: 700, fill, o: 1 });
  at('elem', g => {
    frame(g);
    ['C', 'H', 'O'].forEach((s, j) => elemChip(g, s, { x: 1090 + j * 120, y: 300 }));
    const n = elemChip(g, 'N', { x: 1150, y: 520 }); put(n.glow, { o: 1 });
    elemChip(g, 'S', { x: 1390, y: 520, dashed: true, label: 'sometimes' });
    lab(g, 'the elements of a protein');
  });
  at('count', g => {
    frame(g);
    beadChain(g, { x: 1270, y: 420, n: 5, sp: 100, r: 32, chips: false, endText: false });
    lab(g, '5 amino acids · how many links?');
  });
  at('ends', g => {
    frame(g);
    const c = beadChain(g, { x: 1270, y: 420, aa: ['Gly', 'Ala', 'Ser', 'Leu', 'Lys', 'Val'], sp: 74, r: 27, ends: false });
    [c.pt(0)[0] - 60, c.pt(5)[0] + 60].forEach(x => { mk('circle', { cx: x, cy: 420, r: 24, fill: '#0b1626', stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '6 5' }, g); wLabel(g, '?', { x, y: 432, size: 32, weight: 800, fill: PC.peptide, o: 1 }); });
    lab(g, 'which end is which?');
  });
  at('link', g => {
    frame(g);
    const pb = peptideBond(g, { x: 1270, y: 420, s: .58, labels: false }).form(1);
    void pb;
    mk('rect', { x: 1270 + 4 * .58 - 80, y: 420 - 26, width: 160, height: 52, rx: 26, fill: '#0b1626', stroke: COL.chalk, 'stroke-width': 3 }, g);
    wLabel(g, '?', { x: 1272, y: 433, size: 36, weight: 800, fill: PC.peptide, o: 1 });
    lab(g, 'the link between them?');
  });
  at('order', g => {
    frame(g);
    beadChain(g, { x: 1270, y: 330, aa: ['Gly', 'Ala', 'Ser', 'Cys'], sp: 92, r: 32, endText: false });
    beadChain(g, { x: 1270, y: 520, aa: ['Cys', 'Ser', 'Ala', 'Gly'], sp: 92, r: 32, endText: false });
    wLabel(g, 'the same four, a new order', { x: 1270, y: 430, size: 22, fill: COL.dim, weight: 600, o: 1 });
    lab(g, 'two different proteins');
  });
  at('role', g => {
    frame(g);
    const KS = ['enz', 'hor', 'hb', 'plasma', 'lipo', 'ig'];
    KS.forEach((k, j) => roleIcon(g, k, { x: 1110 + (j % 3) * 160, y: 210 + Math.floor(j / 3) * 170, s: .55 }).set(.35));
    mk('rect', { x: 1190, y: 500, width: 160, height: 160, rx: 22, fill: '#0b1626', stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '9 7' }, g);
    wLabel(g, '?', { x: 1270, y: 604, size: 64, weight: 800, fill: PC.peptide, o: 1 });
    lab(g, 'the seventh job: supporting structures');
  });
  at('branch', g => {
    frame(g);
    beadChain(g, { x: 1270, y: 620, n: 6, sp: 38, r: 13, chips: false, endText: false });
    wLabel(g, 'Proteins', { x: 1270, y: 586, size: 28, weight: 800, o: 1 });
    path(g, 'M1270 548V500', { stroke: COL.chalk, 'stroke-width': 6 });
    [[1110, PC.simpleP], [1270, PC.conjugated], [1430, PC.derived]].forEach(([x, c]) => {
      path(g, `M1270 500C1270 470 ${x} 480 ${x} 440`, { stroke: c, 'stroke-width': 6 });
      mk('rect', { x: x - 68, y: 360, width: 136, height: 76, rx: 16, fill: '#0b1626', stroke: c, 'stroke-width': 4 }, g);
      wLabel(g, '?', { x, y: 412, size: 40, weight: 800, fill: c, o: 1 });
    });
    lab(g, 'the three branches?');
  });
  S.pics = key => Object.entries(pics).forEach(([k, g]) => put(g, { o: k === key ? 1 : 0 }));
  S.pics('elem');
}, { ask: done => quiz(PRACTICE, [
  { id: 'p-elem', prompt: ['Which element makes a protein nitrogenous?'],
    build: withPic('elem', choice([['sulfur'], ['nitrogen'], ['calcium'], ['carbon']], 1,
      'Right. Nitrogen, from the amino group of every amino acid.',
      ['Only some proteins contain sulfur. Every protein contains nitrogen.', null,
        'Calcium is not one of a protein’s core elements: carbon, hydrogen, oxygen and nitrogen.',
        'Every organic compound contains carbon. Nitrogen is what makes a protein nitrogenous.'])) },
  { id: 'p-count', prompt: ['A chain of five amino acids has how many peptide links?'],
    build: withPic('count', choice([['5'], ['3'], ['4'], ['6']], 2,
      'Right. Links = amino acids − 1: 5 − 1 = 4 (our own arithmetic).',
      ['One per amino acid would need a link after the last bead. Count the gaps between beads.',
        'Too few: five beads have four gaps between them.', null,
        'Too many: five beads have only four gaps between them.'])) },
  { id: 'p-ends', prompt: ['Which end is it?'],
    build: withPic('ends', grid([
      { parts: ['free amino group'], ans: ['n'], why: 'the NH₂ end' },
      { parts: ['free carboxyl group'], ans: ['c'], why: 'the COOH end' },
      { parts: ['where reading starts'], ans: ['n'], why: 'read N to C' },
      { parts: ['the last amino acid’s end'], ans: ['c'], why: 'the chain ends at C' },
    ], [['n', 'N-terminal', null, 'N'], ['c', 'C-terminal', null, 'C']], { multi: false, text: true })) },
  { id: 'p-link', prompt: ['Which group is the peptide link?'],
    build: withPic('link', choice([['–S–S–'], ['–COOH'], ['–CO–NH–'], ['–CH₂–OH']], 2,
      'Right. –CO–NH–: the carbon of one carboxyl group bonded to the nitrogen of the next amino group.',
      ['That is a disulfide bridge between two cysteines (chapter three), not the link along the chain.',
        'That is a free carboxyl group. In a link it has lost its OH.', null,
        'That is a side-chain group (serine’s), not the link between amino acids.'])) },
  { id: 'p-order', prompt: ['What makes one protein different from another?'],
    build: withPic('order', choice([['only how long the chain is'], ['which amino acids it has, how many, and in what order'], ['only its first amino acid'], ['only the water it holds']], 1,
      'Right. Which amino acids, how many and in what order: the same four in a new order make a different protein.',
      ['Two chains of the same length can still differ in their amino acids or their order.', null,
        'The whole order counts, not only the start.',
        'The chain itself is the protein. Water is released when the chain forms.'])) },
  { id: 'p-role', prompt: ['Which two are both supporting structures?'],
    build: withPic('role', choice([['hemoglobin and skin'], ['an antibody and hair'], ['cartilage and nail'], ['insulin and bone']], 2,
      'Right. Cartilage, bone, skin, nail and hair are the supporting structures.',
      ['Hemoglobin carries oxygen. It is not a supporting structure.',
        'An antibody defends against germs. It is not a supporting structure.', null,
        'Insulin is a protein hormone. It carries a message.'])) },
  { id: 'p-branch', prompt: ['Which three branches grow from the protein family tree?'],
    build: withPic('branch', choice([['essential, non-essential, semi-essential'], ['primary, secondary, tertiary'], ['simple, conjugated, derived'], ['acidic, basic, neutral']], 2,
      'Right. Simple (amino acids only), conjugated (with a non-protein part) and derived (products of breakdown).',
      ['Those classify amino acids by diet (chapter one).',
        'Those are levels of protein structure (chapter three).', null,
        'Those classify amino acids by charge (chapter one).'])) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }

boot();
</script>
