// a row of the essential amino acids as small gold beads (the lecture's ten); gap: indices drawn as empty dashed slots,
// named under them. Order: Trp Thr His Val Ile Phe Met Arg Leu Lys
const ESS = ['Trp', 'Thr', 'His', 'Val', 'Ile', 'Phe', 'Met', 'Arg', 'Leu', 'Lys'];
function essChain(p, { x = 0, y = 0, s = 1, o = 1, gap = [], sp = 28, r = 11, names = true, size = 18 } = {}) {
  const g = G(p, { x, y, s, o });
  const c = beadChain(g, { x: 1, y: 1, n: 10, sp, r, chips: false, ends: false, colors: ESS.map(() => PC.essential), gap });
  if (names) gap.forEach(i => wLabel(g, ESS[i], { x: 1 + (i - 4.5) * sp, y: 1 + r + size + 4, size, fill: PC.essential, weight: 700, o: 1 }));
  return Object.assign(g, { chain: c, slotX: i => (i - 4.5) * sp });
}
// a grey "named, not drilled" chip
function greyChip(p, str, { x = 0, y = 0, size = 22, o = 1 } = {}) {
  const g = G(p, { x, y, o }), w = Math.round(uiW(str, size) * 1.08 + 28), h = size + 16;
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: PC.tab, stroke: COL.dim, 'stroke-width': 2.5, 'stroke-dasharray': '7 6' }, g);
  wLabel(g, str, { y: size * .36, size, fill: COL.dim, weight: 700, o: 1 });
  return Object.assign(g, { w });
}
// a rice grain heap and a bean (small icons, origin at the centre)
function riceIcon(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {

  return g;
}
function beanIcon(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {

        'Where it is found does not decide the class. Egg holds simple and conjugated proteins alike. Ask what hydrolysis gives.', null])) },
  { id: 'p-heat', prompt: ['Does heat coagulate it?'],
    build: withPic('heat', grid([
      { parts: ['egg albumin'], ans: ['c'], why: 'Albumin: yes.' },
      { parts: ['serum globulin'], ans: ['c'], why: 'Globulin: yes.' },
      { parts: ['histone'], ans: ['n'], why: 'Histone: no.' },
      { parts: ['keratin'], ans: ['n'], why: 'An albuminoid: no.' },
    ], [['c', 'Coagulated', null, 'C'], ['n', 'Not coagulated', null, 'N']], { multi: false, text: true })) },
  { id: 'p-histone', prompt: ['What do histones do, and why are they suited to it?'],
    build: withPic('histone', choice([['they pack DNA into nucleosomes, held by charge'], ['they carry oxygen in the blood, bound to iron'], ['they strengthen hair and nail as tough fibres'], ['they coagulate on heating, like egg albumin']], 0,
      'Right. Histones are rich in basic amino acids (arginine, histidine, lysine), so they are positive and hold DNA, which is negative, wound into nucleosomes.',

        'Histones are not coagulated by heat. Only albumin and globulin are, of the simple proteins.'])) },
  { id: 'p-albuminoid', prompt: ['Which statement fits the albuminoids, keratin and collagen?'],

      'Right. Two of the four NOTs: not coagulated by heat, not digested by the usual enzymes, not soluble in water, not found in plants.',
      ['Boil a fingernail and nothing happens: albuminoids are not coagulated by heat.',

        'They are not soluble in water. That is one of the four NOTs.'])) },
  { id: 'p-bv', prompt: ['Which biological value?'],
    build: withPic('bv', grid([
      { parts: ['casein of milk'], ans: ['h'], why: 'All the essential ones.' },
      { parts: ['egg albumin'], ans: ['h'], why: 'All the essential ones.' },
      { parts: ['gelatin'], ans: ['l'], why: 'No tryptophan.' },
      { parts: ['gliadin of wheat'], ans: ['l'], why: 'Short of some.' },
    ], [['h', 'High', null, 'H'], ['l', 'Low', null, 'L']], { multi: false, text: true })) },
  { id: 'p-lysine', prompt: ['A protein lacks lysine, an essential amino acid. What is its biological value?'],
    build: withPic('lysine', choice([['high, because it has all the others'], ['low, because it lacks an essential amino acid'], ['it depends only on how much is eaten'], ['it becomes high when it is boiled']], 1,
      'Right. Lacking even one essential amino acid makes a protein low in biological value: the body cannot make lysine for itself.',

      { parts: ['biological value has ', { box: '2' }, ' levels'], why: 'High and low.', hint: 'One shelf for complete proteins, one for the rest.' },

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],

// The practice screen: the card on the left, the question's picture on the right (final1 draws it).
function withPic(key, build) { return (body, api) => { S.pics?.(key); return build(body, api); }; }
