  ['sheet', r => {

    globule(r, { x: 200, y: 800, beads: 10, R: 90 }).tangle(1);
    globule(r, { x: 1400, y: 660, R: 100 }).fold(.5);

    subunitComplex(r, { x: 700, y: 260, n: 4 }).contacts(1);
    hemoglobin(r, { x: 1200, y: 260 });

    hemoglobin(r, { x: 800, y: 680 }).apart(.5).focus([0], 1);
    misfoldedChain(r, { x: 1150, y: 600 }); misfoldedChain(r, { x: 1150, y: 800 }).set(.3);
    aggregate(r, { x: 1420, y: 700, s: .6 }).clump(1).plaque(1);
  }],
  ['aggregate', r => { aggregate(r, { x: 400, y: 450 }); aggregate(r, { x: 1100, y: 450 }).clump(1); }],
  ['levels-strip', r => { levelsStrip(r, { y: 230 }).tags(1).tick(1, 1); levelsStrip(r, { y: 660 }).focus([3, 4], 1).glow(3, 1); }],
  ['levels-strip-unfold', r => { levelsStrip(r, { y: 230 }).unfold(4, 1).unfold(3, 1).unfold(2, .7); levelsStrip(r, { y: 660 }).build(.6); }],
  ['levels-vertical', r => { levelsStrip(r, { vertical: true, x: 450 }).unfold(4, .5); levelsStrip(r, { vertical: true, x: 1150 }).contents(0); }],
  ['tree', r => { const t = proteinTree(r, { y: 470 }); t.leaves('all', 1).focus('conjugated', 1).tick('simple', 1).leafGlow('conjugated', 1, 1); }],
  ['tree-growing', r => { proteinTree(r, { x: 440, y: 470, s: .52 }).grow(.55); proteinTree(r, { x: 1180, y: 470, s: .52 }).leaves('simple', .6).focus(['simple'], 1); }],
  ['prosthetic', r => {

    ['sugar', 'lipid', 'phosphate', 'metal', 'heme', 'flavin', 'nucleic'].forEach((k, i) => prosthetic(r, k, { x: 120 + i * 200, y: 120, symbol: 'Cu' }).label(1));
    prosthetic(r, 'heme', { x: 1000, y: 700 }).toward(gl.slotPt(1), 1);
    prosthetic(r, 'sugar', { x: 300, y: 800 }).toward(gl.slotPt(2), .5);
    lipoprotein(r, { x: 1300, y: 450, label: 'LDL' }).shell(1);
    collagenRope(r, { x: 1250, y: 720, len: 500 }); collagenRope(r, { x: 1250, y: 840, len: 500 }).loosen(1);
  }],
];
window.KIT_CASES = [
  ['aminoAcid', r => aminoAcid(r, { aa: 'lysine', shape: true }), (m, t) => m.parts({ ca: t / 2, amino: t / 3, r: t / 4 }).ionise(t / 4).focus(t > 2 ? ['amino'] : [], t / 5).glow('carboxyl', t / 3).labels(t / 3).counts(t / 5).hi('amino', t / 4)],
  ['aminoAcid-badge', r => aminoAcid(r, { aa: 'glycine' }), (m, t) => m.rSwap('H', 'CH_3', t / 4, 'simple', 'hydroxy').ionise(t / 3).name(t / 2)],
  ['sideChain', r => sideChain(r, 'histidine'), (m, t) => m.ion(t / 3).hi('ring', t / 4)],
  ['aaChip', r => aaChip(r, 'Phe', { badge: 'star' }), (m, t) => m.badge(t / 2).split(t / 3).half(t / 4).dash(t / 5).glow(t / 3)],
  ['aminoCard', r => aminoCard(r, { aa: 'lysine' }), (m, t) => m.build(t / 3).focus(t > 2 ? 'chemical' : null, t / 4).fill('structural', t / 4, 'aliphatic|basic', PC.basic).glow('metabolic', t / 5)],
  ['peptideBond', r => peptideBond(r), (m, t) => m.form(t / 5)],
  ['beadChain', r => beadChain(r, { n: 10, numbers: true, marks: { 2: '+' } }), (m, t) => m.reveal(t / 3).numbers(t / 4).curl(t / 6).cut(4, t / 5).swap(2, 'acidic', t / 4, 'Glu').glow(1, t / 3).lift(7, t / 5).readArrow(t / 4).focus(t > 3 ? [1, 2] : [], t / 6)],
  ['beadChain-tangle', r => beadChain(r, { n: 10 }), (m, t) => m.tangle(t / 4).straighten(t / 6).cut(2, t / 3).cut(6, t / 4)],
  ['backbone', r => backbone(r, { strands: 2, units: 4 }), (m, t) => m.draw(t / 2).atoms(t / 3).hbonds(t / 4).deltas(t / 5).rDim(t / 3).ends(t / 2)],
  ['cysPair', r => cysPair(r), (m, t) => m.near(t / 3).bridge(t / 5).name(t / 4).glow(t / 5)],
  ['hydrophobicCore', r => hydrophobicCore(r), (m, t) => m.fold(t / 4)],
  ['alphaHelix', r => alphaHelix(r), (m, t) => m.draw(t / 2).bonds(t / 4).turnBracket(t / 3).tilt(t * 15).unwind(t > 4 ? t - 4 : 0).glow(2, t / 3)],
  ['betaSheet', r => betaSheet(r), (m, t) => m.strands(t / 2).hbonds(t / 3).anti(t / 4).hairpin(t / 5).tags(t / 3)],
  ['pleatSide', r => pleatSide(r), (m, t) => m.draw(t / 2).hbonds(t / 4)],

window.replayCheck = () => {
  const box = document.createElementNS(NSV, 'svg'), out = [];
  document.body.append(box);
  for (const [name, make, pose] of KIT_CASES) {
    for (const [t1, t2] of [[.7, 2.2], [3.1, 1.4], [4.6, 4.9], [0, 5.5], [2.37, 2.37]]) {
      const a = G(box), pa = make(a); pose(pa, t1); pose(pa, t2);
      const b = G(box), pb = make(b); pose(pb, t2);
      const c = G(box), pc = make(c); for (let u = 0; u < t2; u += 1 / 60) pose(pc, u); pose(pc, t2);
      const A = a.innerHTML, B = b.innerHTML, C = c.innerHTML;
      if (A !== B || C !== B) {
        let i = 0; const X2 = A !== B ? A : C; while (i < B.length && X2[i] === B[i]) i++;
        out.push(`${name} ${t1}→${t2} (${A !== B ? 't1,t2 vs t2' : 'stepped vs t2'}): …${B.slice(Math.max(0, i - 160), i + 80)} ≠ …${X2.slice(Math.max(0, i - 160), i + 80)}`);
      }
      a.remove(); b.remove(); c.remove();
    }
  }
  box.remove();
  return out;
};
const ONLY = new URLSearchParams(location.search).get('only');
for (const [title, f] of SHEET) if (!ONLY || title === ONLY) { try { f(newPanel(title)); } catch (e) { console.error(title, e.stack); document.title = 'ERR ' + title + ': ' + e.message; } }
